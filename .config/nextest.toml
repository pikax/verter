# Nextest configuration
# https://nexte.st/docs/configuration/

# Each provider kind is its own test. Running the four together makes the
# provider-neutral diagnostics receipt go stale and lets a host compile land
# inside a completion that must not compile. They still run in the normal
# lane; they just do not overlap each other.
[test-groups.progressive-child-contract-completion]
max-threads = 1

# ── Two tiers ────────────────────────────────────────────────────────────────
# The GATE (profiles `default` and `ci`, which inherits the filter) runs every
# test except the nightly scale tier. The NIGHTLY tier (profile `nightly`, run
# by `.github/workflows/nightly.yml`) runs exactly that tier: the full-size,
# scale-parameterised workloads, unchanged. A test belongs to the tier when one
# segment of its module path is `nightly_scale`; membership is that module
# name, never a list of test names. Each tier test has a smaller gate version
# outside the module that keeps every behavioural guarantee at a size the gate
# deadline holds, with deterministic work counters where the big test guarded
# growth. The compiled policy test
# `verter_session::nextest_tier_policy_tests` checks that each gate profile
# selects every discovered test but the tier and that `nightly` selects
# exactly the tier.

[profile.default]
default-filter = 'not test(/(^|::)nightly_scale::/)'
# A speed gate, on the debug build: a test aims at under 2s and must stay
# under 10s even on a loaded machine. Past 10s it is flagged slow, and at 20s
# (`terminate-after` periods) it is TERMINATED and fails. A test that needs
# 20s in a debug build is an architecture or code problem, not a slow runner:
# fix the code (optimising the debug path where it makes sense), never raise
# this limit for one test. The tests below that predate the gate are listed
# with the old 5-minute backstop until their fixes land.
#
# This profile also runs the agents' gate on worker machines that carry
# several builds at once, so until the "Known slow tests" list below is empty
# it terminates at 60s (six periods), not 20s: load alone must not fail an
# unrelated change there. CI (`[profile.ci]`) holds the 20s line now, and
# this one tightens to `terminate-after = 2` when the list empties.
slow-timeout = { period = "10s", terminate-after = 6 }

# Every generated corpus chunk retains the 20-second speed deadline.
[[profile.default.overrides]]
filter = 'package(verter_session) & test(/^cases::corpus_audit_tests::chunk_[0-9]{3}::/)'
slow-timeout = { period = "10s", terminate-after = 2 }

# Session engine regressions retain the 20-second speed deadline.
[[profile.default.overrides]]
filter = 'package(verter_session) & (test(publication_surfaces_publish_and_survive_renames_on_both_claimed_engines) | test(configured_project_opening_classifies_linear_members) | test(det_05_partial_resident_cache) | test(backend_projection_checks_clean_on_both_claimed_engines) | test(query_retention_refusal_preserves_delivery_validation_and_lowering) | test(projected_carrier_corruption_is_caught_on_both_claimed_engines) | test(lib_awaited_tail_runs_answer_past_the_checker_limit_and_stop_at_verters_budget))'
slow-timeout = { period = "10s", terminate-after = 2 }

# Live provider tests drive a real tsgo/tsserver child and carry their own
# in-test deadlines (up to 230s); CI runs them in their own lanes with cargo
# test. Locally they keep the 5-minute hang backstop.
# Use the structural provider CI selectors for these two packages, checked by
# the compiled LSP nextest policy test. A mock's configured engine kind is not
# live provider ownership; mock child-contract completions keep the base watchdog.
[[profile.default.overrides]]
filter = '''
  test(/tsserver|tsgo/) & (
  (package(verter_lsp) & test(/^real_provider_tests::.*_tsserver$/)) |
  (package(verter_lsp) & test(/^tsserver::/)) |
  (package(verter_lsp) & test(/^cases::tsserver_e2e_generated_outputs::/)) |
  (package(verter_lsp) & (test(=cases::quoted_prop_consumer_mistype_live::quoted_prop_consumer_mistype_surfaces_ts2322_tsserver) | test(=server::server_tests::completion::completion_with_real_tsserver_returns_fixture_vfor_member_access_properties) | test(=server::server_tests::completion::completion_with_real_tsserver_recovers_fixture_vfor_member_access_immediately_after_open) | test(=server::server_tests::completion::completion_with_real_tsserver_recovers_fixture_vfor_member_access_on_dot_trigger_immediately_after_open) | test(=server::server_tests::completion::completion_with_real_tsserver_recovers_when_current_file_sync_was_missed) | test(=server::server_tests::synchronization::real_tsserver_slot_member_access_stays_typed_after_opening_child_and_parent) | test(=type_provider::lazy_managed_tests::failed_activation_replays_real_vue_and_svelte_carriers_before_typed_queries))) |
  (package(verter_type_runtime) & test(/^tsserver::/)) |
  (package(verter_type_runtime) & (test(=provider_hub::hub_tests::failed_respawn_retries_within_budget_and_recovers))) |
  (package(verter_lsp) & test(/^real_provider_tests::.*_tsgo$/)) |
  (package(verter_lsp) & test(/^tsgo::/)) |
  (package(verter_lsp) & test(/^cases::tsgo_virtual_membership::/)) |
  (package(verter_lsp) & (test(=cases::quoted_prop_consumer_mistype_live::quoted_prop_consumer_mistype_surfaces_ts2322_tsgo) | test(=type_provider::lazy_managed_tests::lazy_real_tsgo_quick_info_matches_the_eager_file_lifecycle))) |
  (package(verter_type_runtime) & test(/^tsgo::/)) |
  (package(verter_type_runtime) & test(/^cases::owned_provider_live::/)) |
  (package(verter_type_runtime) & test(/^cases::owned_provider_carrier_resolution::/))
  )
'''
slow-timeout = { period = "60s", terminate-after = 5 }

# Known slow tests (CI, 2026-10-12): over 10s each, so over the speed target.
# Each has a fix task; a test leaves this list when its fix lands. Never add to it.
[[profile.default.overrides]]
filter = '''
  (package(verter_session) & test(=project_semantic_dispatch_tests::differential_depth_tests::an_800_guard_narrowing_chain_answers_without_strict_null_checks)) |
  (package(verter_session) & test(=project_semantic_dispatch_tests::differential_depth_tests::an_800_guard_narrowing_chain_answers_strict)) |
  (package(verter_session) & test(=project_semantic_dispatch_tests::template_complexity_tests::two_spans_meet_the_limit_at_one_hundred_thousand))
'''
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(svelte_progressive_component_completion_uses_committed_child_contract_)'
test-group = 'progressive-child-contract-completion'

[profile.ci]
# The speed gate (see [profile.default]): flagged at 10s, failed at 20s.
slow-timeout = { period = "10s", terminate-after = 2 }

# Every generated corpus chunk retains the 20-second speed deadline.
[[profile.ci.overrides]]
filter = 'package(verter_session) & test(/^cases::corpus_audit_tests::chunk_[0-9]{3}::/)'
slow-timeout = { period = "10s", terminate-after = 2 }

# Session engine regressions retain the 20-second speed deadline.
[[profile.ci.overrides]]
filter = 'package(verter_session) & (test(publication_surfaces_publish_and_survive_renames_on_both_claimed_engines) | test(configured_project_opening_classifies_linear_members) | test(det_05_partial_resident_cache) | test(backend_projection_checks_clean_on_both_claimed_engines) | test(query_retention_refusal_preserves_delivery_validation_and_lowering) | test(projected_carrier_corruption_is_caught_on_both_claimed_engines) | test(lib_awaited_tail_runs_answer_past_the_checker_limit_and_stop_at_verters_budget))'
slow-timeout = { period = "10s", terminate-after = 2 }

# Known slow tests (CI, 2026-10-12): over 10s each, so over the speed target.
# Each has a fix task; a test leaves this list when its fix lands. Never add to it.
[[profile.ci.overrides]]
filter = '''
  (package(verter_session) & test(=project_semantic_dispatch_tests::differential_depth_tests::an_800_guard_narrowing_chain_answers_without_strict_null_checks)) |
  (package(verter_session) & test(=project_semantic_dispatch_tests::differential_depth_tests::an_800_guard_narrowing_chain_answers_strict)) |
  (package(verter_session) & test(=project_semantic_dispatch_tests::template_complexity_tests::two_spans_meet_the_limit_at_one_hundred_thousand))
'''
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'test(svelte_progressive_component_completion_uses_committed_child_contract_)'
test-group = 'progressive-child-contract-completion'

# Produce JUnit XML for dorny/test-reporter in CI
[profile.ci.junit]
path = "junit.xml"

# The nightly scale tier: only tests under a `nightly_scale` module, at full
# size, on the debug build. Its deadline is its own: flagged at 60s and
# terminated at 120s. The largest tier workload takes about 14s idle and 20s
# on a loaded CI runner in debug, so 120s leaves six times the loaded time for
# runner noise, while a regression that multiplies the work by an order of
# magnitude (a quadratic term at these sizes) or a hang still fails by name
# instead of running into the job's limit.
[profile.nightly]
default-filter = 'test(/(^|::)nightly_scale::/)'
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.nightly.junit]
path = "junit.xml"

# ── The real-JS request boundary addon ──────────────────────────────────────
# `cases::real_js_host_request_boundary` loads a test-only Node addon to put
# the native host compile request in front of live V8 objects. The addon is a
# `cdylib` package `verter_napi` dev-depends on, so cargo links it while
# building that suite's binary and leaves it in the same `deps` directory.
# Nothing links the addon at runtime, so nextest does not carry it as one of
# the suite's own dynamic dependencies; naming it here does, at the same
# relative path, which is what makes it a sibling of the test binary in an
# extracted archive exactly as it is in `target`.
#
# Without this the suite would have to build the addon itself, and that build
# links the native crate's whole dependency closure: minutes against a cold
# target directory, which a workspace run reports as a hang and terminates,
# cancelling every test it had not yet scheduled.
#
# `debug` is the dev profile's output directory, and the dev profile is what
# the archive is built under. One entry per platform naming, because `include`
# has no platform predicate.
# `on-missing = "ignore"` is what lets the two inapplicable names be absent;
# the applicable one going missing is caught by the suite, which fails by name
# on an addon that is not beside it rather than rebuilding one.
[profile.default.archive]
include = [
  { path = "compile-fixtures", relative-to = "target", on-missing = "ignore" },
  { path = "debug/deps/libverter_napi_request_fixture.dylib", relative-to = "target", on-missing = "ignore" },
  { path = "debug/deps/libverter_napi_request_fixture.so", relative-to = "target", on-missing = "ignore" },
  { path = "debug/deps/verter_napi_request_fixture.dll", relative-to = "target", on-missing = "ignore" },
]
