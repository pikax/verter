# Nextest configuration
# https://nexte.st/docs/configuration/

# Each provider kind is its own test. Running the four together makes the
# provider-neutral diagnostics receipt go stale and lets a host compile land
# inside a completion that must not compile. They still run in the normal
# lane; they just do not overlap each other.
[test-groups.progressive-child-contract-completion]
max-threads = 1

[profile.default]
# A speed gate, on the debug build: a test aims at under 2s and must stay
# under 10s even on a loaded machine. Past 10s it is flagged slow, and at 20s
# (`terminate-after` periods) it is TERMINATED and fails. A test that needs
# 20s in a debug build is an architecture or code problem, not a slow runner:
# fix the code (optimising the debug path where it makes sense), never raise
# this limit for one test. The tests below that predate the gate are listed
# with the old 5-minute backstop until their fixes land.
#
# This profile also runs the agents' gate on worker machines that carry
# several builds at once, so until the "Known slow tests" list below is empty
# it terminates at 60s (six periods), not 20s: load alone must not fail an
# unrelated change there. CI (`[profile.ci]`) holds the 20s line now, and
# this one tightens to `terminate-after = 2` when the list empties.
slow-timeout = { period = "10s", terminate-after = 6 }

# Live provider tests drive a real tsgo/tsserver child and carry their own
# in-test deadlines (up to 230s); CI runs them in their own lanes with cargo
# test. Locally they keep the 5-minute hang backstop.
# Use the structural provider CI selectors for these two packages, pinned by
# provider-ci-lane-selftest.mjs. A mock's configured engine kind is not live
# provider ownership; mock child-contract completions keep the base watchdog.
[[profile.default.overrides]]
filter = '''
  test(/tsserver|tsgo/) and (
  (package(verter_lsp) and test(/^real_provider_tests::.*_tsserver$/)) or
  (package(verter_lsp) and test(/^tsserver::/)) or
  (package(verter_lsp) and test(/^cases::tsserver_e2e_generated_outputs::/)) or
  (package(verter_lsp) and (test(=cases::quoted_prop_consumer_mistype_live::quoted_prop_consumer_mistype_surfaces_ts2322_tsserver) or test(=server::server_tests::completion::completion_with_real_tsserver_returns_fixture_vfor_member_access_properties) or test(=server::server_tests::completion::completion_with_real_tsserver_recovers_fixture_vfor_member_access_immediately_after_open) or test(=server::server_tests::completion::completion_with_real_tsserver_recovers_fixture_vfor_member_access_on_dot_trigger_immediately_after_open) or test(=server::server_tests::completion::completion_with_real_tsserver_recovers_when_current_file_sync_was_missed) or test(=server::server_tests::synchronization::real_tsserver_slot_member_access_stays_typed_after_opening_child_and_parent) or test(=type_provider::lazy_managed_tests::failed_activation_replays_real_vue_and_svelte_carriers_before_typed_queries))) or
  (package(verter_type_runtime) and test(/^tsserver::/)) or
  (package(verter_type_runtime) and (test(=provider_hub::hub_tests::failed_respawn_retries_within_budget_and_recovers))) or
  (package(verter_lsp) and test(/^real_provider_tests::.*_tsgo$/)) or
  (package(verter_lsp) and test(/^tsgo::/)) or
  (package(verter_lsp) and test(/^cases::tsgo_virtual_membership::/)) or
  (package(verter_lsp) and (test(=cases::quoted_prop_consumer_mistype_live::quoted_prop_consumer_mistype_surfaces_ts2322_tsgo) or test(=type_provider::lazy_managed_tests::lazy_real_tsgo_quick_info_matches_the_eager_file_lifecycle))) or
  (package(verter_type_runtime) and test(/^tsgo::/)) or
  (package(verter_type_runtime) and test(/^cases::owned_provider_live::/)) or
  (package(verter_type_runtime) and test(/^cases::owned_provider_carrier_resolution::/))
  )
'''
slow-timeout = { period = "60s", terminate-after = 5 }

# Predates the gate: these rows exercise the full checker comparison allowance
# and take minutes in a debug build. Their fix makes reversed unions linear.
[[profile.default.overrides]]
filter = 'test(reversed_object_unions_reach_the_checker_answer_)'
slow-timeout = { period = "60s", terminate-after = 15 }

