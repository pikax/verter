# Verter Revision 11 program-state template.
# A0 copies this into the repository evidence area, replaces REQUIRED_* values,
# updates state only through the orchestrator, and validates it after every change.

schema = 1
revision = 11
status = "TEMPLATE"
authority_package_digest = "REQUIRED_PACKAGE_DIGEST"
release_report_digest = "REQUIRED_RELEASE_REPORT_DIGEST"
program_dag_digest = "REQUIRED_DAG_DIGEST"
entry_checkout_sha = ""
entry_checkout_tree = ""
implementation_baseline_sha = ""
implementation_baseline_tree = ""
implementation_lock_digest = ""
performance_gates_digest = ""
architecture_premise_ledger_digest = ""
# current_block names the sole block under FINAL CERTIFICATION (status
# ACCEPTANCE_RECOMMENDED — at most one, program-wide, at a time) when one
# exists; with nothing ACCEPTANCE_RECOMMENDED, it names any one concurrently
# ACTIVE (IN_PROGRESS or REVIEW) block instead. See the Status comment below
# and scripts/validate-program-state.mjs's concurrent-implementation-ceiling /
# serialised-final-certification check.
current_block = "A0"

[repository]
remote = "REQUIRED_REMOTE"
# branch/head_sha/head_tree are the IMMUTABLE A0 entry-lock checkout
# identity (contracts/baseline-lock.md §2) — bound ONCE, at entry, and never
# moved again. verifyEntryLockIdentity (scripts/validate-program-state.mjs)
# re-verifies these are well-formed AND byte-equal to the top-level
# entry_checkout_sha/entry_checkout_tree above, on every live-mode run. This
# is NOT the operational trunk oracle — see integration_branch/
# integration_head_sha below for that (AMD-013 round 5: an earlier revision
# of this validator pointed the trunk-pin/rehearsal machinery at THIS pair,
# which is why every post-entry ACCEPTED block's accepted_sha came back
# "unreachable" the first time that oracle was corrected off checkout HEAD —
# the entry-lock branch was never meant to be the moving integration trunk).
branch = "REQUIRED_BRANCH"
head_sha = "REQUIRED_FULL_SHA"
head_tree = "REQUIRED_TREE_OID"
dirty = false
untracked_count = 0
# integration_branch/integration_head_sha are the PINNED, MUTABLE
# operational-trunk identity (AMD-013 v3, re-targeted round 5, ANCESTRY not
# equality since round 6): EVERY live-mode validation run (unconditionally,
# not only when more than one block is concurrently ACTIVE) revalidates
# integration_head_sha against the LIVE TIP OF THE CONFIGURED INTEGRATION REF
# (refs/heads/<integration_branch> above), not checkout HEAD, and not the
# immutable entry-lock branch/head_sha pair above — a worktree may
# legitimately be checked out somewhere other than the integration trunk (a
# feature branch, a review worktree), so checkout position is not the trunk
# pin's oracle, and the entry-lock branch never advances past its one entry
# checkout.
#
# integration_head_sha must be a real ANCESTOR of that live tip (git
# merge-base --is-ancestor), not equal to it (AMD-013 round 6): this file is
# itself committed to the branch it pins, so landing the commit that records
# this value necessarily advances the branch past it — equality would make
# the pin stale the instant it exists, and no amount of resyncing converges.
# A lagging-but-genuinely-ancestral value is valid; a rewritten or foreign
# SHA that is NOT an ancestor at all still fails closed. When more than one
# block is concurrently ACTIVE, the fixed-landing-order rehearsal
# (scripts/validate-program-state.mjs, verifyConcurrentLandingSafety) replays
# onto this pin as its deterministic base. accepted_sha landed/reachability
# (verifyLiveGitIdentities) is checked against the trunk's LIVE tip directly,
# NOT against this pin — a block landed after this value was last recorded
# is still correctly found reachable. Update this field when convenient
# (e.g. alongside other ledger edits); staleness alone is not a violation as
# long as the value remains a genuine ancestor of the live trunk.
integration_branch = "REQUIRED_INTEGRATION_BRANCH"
integration_head_sha = "REQUIRED_INTEGRATION_FULL_SHA"

[orchestration]
maintainer = "REQUIRED_MAINTAINER"
orchestrator = "REQUIRED_ORCHESTRATOR"
requested_model_id = "claude-opus-5"
actual_model_id = "REQUIRED_ACTUAL_MODEL_ID"
orchestrator_runtime = "REQUIRED_RUNTIME"
orchestrator_runtime_version = "REQUIRED_RUNTIME_VERSION"
provider = "REQUIRED_PROVIDER"
fallback_or_substitution = false
model_exception_accepted = false
max_active_workers = 3
max_open_stack_layers = 4
stack_tool = "UNDECIDED_UNTIL_A6"
stack_mode_policy = "UNDECIDED_UNTIL_A6"
evidence_root = "REQUIRED_REPOSITORY_RELATIVE_PATH"

# Status: LOCKED | READY | IN_PROGRESS | REVIEW | ACCEPTANCE_RECOMMENDED | ACCEPTED |
#         BLOCKED | RESCOPE_REQUIRED | ABORTED | SUPERSEDED | PRIVATE_CHECKPOINT
# Reviews: NOT_REQUIRED | PENDING | PASS | BLOCKING | NOT_PROVEN | INVALIDATED
# Concurrency (MAINTAINER-RULING-CONCURRENCY-CEILING-AND-ROSTER.md,
# ARCH-RULING-CONCURRENCY-OPERATING-MODEL.md; AMD-013 v3): three concurrency
# CLASSES for the per-status rules below, but ONE program-wide numeric
# ceiling over the whole active set — not a per-class cap.
#   - IN_PROGRESS (implementation).
#   - REVIEW (review iteration) — contracts/stacked-prs.md's per-stack layer
#     limit and cross-stack ownership disjointness bound REVIEW cardinality
#     WITHIN a stack or across independent windows, but neither is a
#     program-wide numeric cap; REVIEW blocks are NOT exempt from the
#     active-set ceiling below. Several blocks may still legally sit in
#     REVIEW at once (contracts/stacked-prs.md:100 — green upper LANDABLE
#     layers stay REVIEW, not accepted in advance) — that just isn't
#     "uncapped", it shares the same ceiling as everything else active.
#   - ACCEPTANCE_RECOMMENDED (final certification) — capped at exactly ONE
#     block, program-wide, at a time ("freeze once, run ONE full gate, obtain
#     ONE mandate re-attestation"), AND counted within the SAME active-set
#     ceiling as every other concurrently active block (it is one of the
#     ruling's "concurrent blocks/trains", not a permitted 6th slot beyond
#     up to 5 IN_PROGRESS). current_block names this block when one exists;
#     with none ACCEPTANCE_RECOMMENDED, it names any one concurrently ACTIVE
#     (IN_PROGRESS/REVIEW) block instead.
# The active-set ceiling: no more than 5 blocks may be concurrently ACTIVE
# (IN_PROGRESS ∪ REVIEW ∪ ACCEPTANCE_RECOMMENDED) at once, program-wide,
# regardless of which of the three statuses a given block holds
# (MAINTAINER-RULING-CONCURRENCY-CEILING-AND-ROSTER.md: "up to 5 concurrent
# blocks/trains"). This is a block-counting proxy for "concurrent claude-max
# trains" — a single stack window legally holding up to six open REVIEW
# layers (A6, contracts/stacked-prs.md §4) could on its own approach or
# exceed it; a named, unresolved tension (AMD-013 §8), not silently swept.
# Whenever more than one block is concurrently ACTIVE, every such block must
# carry: a positive, mutually distinct landing_order (the sole
# ACCEPTANCE_RECOMMENDED block, if any, must hold the minimum); and a
# well-formed base_sha that is a real ancestor of its rehearsal candidate.
# scripts/validate-program-state.mjs then REPLAYS each block's own
# base_sha..candidate delta onto the cumulative result of every prior block
# in the fixed order — the trunk pin is `repository.integration_head_sha`,
# resolved and revalidated EVERY live-mode run (unconditionally, not only
# when more than one block is active) against the LIVE TIP OF THE CONFIGURED
# INTEGRATION-TRUNK REF (`refs/heads/<repository.integration_branch>`) — never
# checkout `HEAD`, and never the SEPARATE, IMMUTABLE A0 entry-lock pair
# `repository.branch`/`head_sha` above (AMD-013 round 5 — see the
# `[repository]` section comment above for why those two pairs are not
# interchangeable) — via `git merge-tree --write-tree --merge-base=<base_sha>`
# followed by a SINGLE-parent `git commit-tree` (modeling the rebase/squash
# landing this program actually performs, never a merge commit). The
# rehearsal identity is candidate_sha for REVIEW/ACCEPTANCE_RECOMMENDED and
# implementation_candidate_sha (a SEPARATE field — see below) for
# IN_PROGRESS.
# candidate_sha/tree = exact reviewed cumulative candidate.
# implementation_candidate_sha = the IN_PROGRESS block's current WIP tip. Kept
# separate from candidate_sha, which stays "the exact candidate reviewers
# inspected" (contracts/stacked-prs.md:140) — an IN_PROGRESS block has no
# reviewed candidate yet, so it must not overload that field. This pin is
# bound to a resolvable fact, not merely trusted: implementation_ref (below)
# must name a real, live git ref whose current resolved tip EQUALS this SHA
# exactly — a stale pin (the ref has moved on since the ledger was last
# written) is a validator violation, not a silently trusted declaration.
# implementation_candidate_sha/implementation_ref are REQUIRED, unconditionally,
# for EVERY IN_PROGRESS block in live mode (AMD-013 round 4, FIX 2) — not only
# when another block happens to be concurrently ACTIVE; the fixed-landing-order
# rehearsal above additionally consumes this same, already-validated pin
# whenever more than one block is concurrently ACTIVE.
# implementation_ref = a git ref (a branch name or a full `refs/...` ref,
# resolved via `git rev-parse --verify`, REQUIRED to resolve to a
# `refs/heads/...` branch — never a raw object id, the literal `HEAD`, or a
# tag) naming the IN_PROGRESS block's live WIP branch. Required for every
# IN_PROGRESS block, unconditionally, alongside implementation_candidate_sha
# above; the validator resolves it and REQUIRES the resolved tip to equal
# implementation_candidate_sha exactly, closing the previously-unverifiable
# "is this pin the block's actual current tip" trust boundary.
# landing_order = this block's position in the fixed landing order among
# concurrently active blocks (0 when not concurrently active with any other
# block — no ordering obligation). Must additionally respect same-stack
# stack_layer order when two concurrently active blocks share a stack_id.
# accepted_sha/tree = actual landed commit and full repository tree; they may differ
# from the reviewed candidate after a base advance. landing_equivalence_digest binds
# both base/candidate/accepted identities and exact candidate-delta/post-landing proof.
# conformance_reviewed_sha/architecture_reviewed_sha/adversarial_reviewed_sha = the
# exact candidate_sha each mandate's PASS verdict was issued against. A PASS mandate
# MUST carry its paired reviewed SHA equal to the row's current candidate_sha — a
# stale value (a candidate_sha that advanced past a fix round or rebase without a
# fresh review) is a validator violation, not a silent carry-over. A non-PASS
# mandate (PENDING/BLOCKING/NOT_PROVEN/INVALIDATED/NOT_REQUIRED) carries an empty
# reviewed SHA. This binds a verdict to the exact candidate it was issued against
# (governance.md:106,277 — "all three review mandates PASS on one exact candidate
# SHA/tree").
# enabling_amendment = the AMD-ID (e.g. "AMD-005") whose ratification is this block's
# execution authority, or "" when the block needs no amendment. When set, the block
# must not advance beyond LOCKED, and maintainer_decision must not be ACCEPTED, while
# docs/arch/refactor/rev11/amendments/<AMD-ID>-*.md's own Status is not ratified.

