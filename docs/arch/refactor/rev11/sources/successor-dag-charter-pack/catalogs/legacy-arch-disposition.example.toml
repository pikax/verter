# Example seed. The canonical generator must add one entry for every tracked path
# under docs/arch/** except docs/arch/refactor/rev11/** and bind the exact blob SHA.
schema = 1
catalog = "legacy-arch-disposition"
legacy_root = "docs/arch"
authority_root = "docs/arch/refactor/rev11"
exclude = ["docs/arch/refactor/rev11/**"]
allowed_dispositions = [
  "transferred_existing",
  "new_authority",
  "relocate_product_doc",
  "historical_delete",
  "rejected_design",
]

[validation]
require_every_tracked_path = true
require_exact_blob_sha = true
require_existing_targets = true
require_current_charter_digest = true
require_digest_bound_requirement_atoms = true
require_replacement_for_live_content = true
forbid_unclassified_deletion = true
forbid_duplicate_path = true
forbid_live_reference_to_deleted_path = true
forbid_live_legacy_arch_after_cutover = true
forbid_archive_directory = true

[[entry]]
path = "docs/arch/native-checker.md"
blob_sha = "3e96bf48ec481e97b9fd3067041e21099d194944"
