schema = 1
catalog = "external-requirement-additions"

[[requirement]]
id = "maintainer_managed_engine_acquisition"
owner = "maintainer"
kind = "explicit-product-security-authorization"
description = "Approve managed network acquisition of executable engine artifacts, the approved origins/trust roots, dependency/TLS/archive policy, proxy/offline behavior, update policy, and security review."
required_by = ["EPR2"]

[[requirement]]
id = "maintainer_bundled_engine_shipping"
owner = "maintainer"
kind = "explicit-release-product-authorization"
description = "Approve shipping a bundled engine, name the owning package/platform matrix, and accept size, license, SBOM, provenance, update, rollback, and security-response obligations."
required_by = ["EPR3"]
