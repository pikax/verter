# Verter Revision 11 block authorization registry.
#
# docs/arch/refactor/rev11/rulings/ARCH-RULING-ORCHESTRATION-AUTHORITY-MODEL.md
# RULING 1 — replace prose/document `**Status:**` gates with digest-bound,
# ratified block-authorization records in a repository authority registry.
# Driven by docs/arch/refactor/rev11/rulings/MAINTAINER-DIRECTIVE-HARDEN-
# ORCHESTRATION.md ("the main remaining risk is the orchestration machinery
# incorrectly certifying an invalid transition") after BV1 was dispatched and
# landed while its enabling amendment (AMD-005) sat unratified and nothing
# checked it.
#
# One [[document]] row per digest-bound authority artifact — a ratified
# charter, a ratified enabling amendment, or a binding maintainer ruling
# under docs/arch/refactor/rev11/rulings/. Referenced by id from
# [[authorization]] rows below, so one document shared by several blocks
# (e.g. AMD-009 backing BF3/BA0/BS0/BRT0, or a narrow ruling backing both
# BV1 and BS1) is declared once. `sha256` binds the record to the document's
# EXACT current bytes.
#
# One [[authorization]] row per block whose ledger status has left LOCKED,
# naming the document ids its execution authority rests on, who ratified it,
# when, and the scope the authorization covers.
#
# Validated by `node scripts/validate-program-state.mjs ... --authority
# <this file>` (live mode only — see the validator's own comment on this
# section: an undeclared --authority is the documented skip, same shape as
# an undeclared evidence_root, since not every synthetic/template invocation
# models authorization). Enforcement, once declared: every digest here must
# equal the current SHA-256 of the named path; every block whose status is
# READY, IN_PROGRESS, REVIEW, ACCEPTANCE_RECOMMENDED, ACCEPTED, or
# PRIVATE_CHECKPOINT must have exactly one [[authorization]] record naming
# at least one document.
#
# Populated for docs/arch/architecture-lock/ledger/program-state.toml as of
# 2026-08-20 (20 ACCEPTED blocks + BS1 IN_PROGRESS). Every record below cites
# only authority that is GENUINELY ratified in the tree today — none of it
# is retroactively invented.
#
# UNSUBSTANTIATED — recorded as a finding, not papered over. Five blocks
# with ledger status past LOCKED have NO record here because no ratified
# document in the tree grants them execution authority:
#
#   BF1, BF2 — their charters were landed wholesale by AMD-005 (Status:
#     "PROPOSED — NOT RATIFIED. This candidate has no execution authority."),
#     which itself says "authorize BF1 exposure to READY after ratification"
#     (AMD-005 §15) — a ratification that never happened. No later ratified
#     amendment or ruling ever touches either charter.
#   B2, B3 — the one ratified document that touches them (AMD-010, RATIFIED
#     2026-08-16 §9.1) amends four narrow textual deltas and says so in its
#     own text: "Neither B2 nor B3 becomes dispatchable by this landing.
#     Both remain LOCKED" (AMD-010:834), echoed by
#     rulings/MAINTAINER-RULING-BF3-SECTION7.md:94 ("B2 and B3 are NOT
#     unlocked").
#   B4 — charter landed wholesale by AMD-005; never touched by any
#     subsequent ratified amendment or ruling.
#
# Live-mode validation against the current ledger with this registry
# therefore correctly reports 5 violations (BF1, BF2, B2, B3, B4 each
# "past LOCKED" with no authorization record) until a maintainer ruling
# substantiates them or the ledger is corrected — see this migration's
# report. Do not add authorization records for these five blocks without a
# genuine ratification to cite; do not weaken the validator to accept them.

schema = 1
revision = 11

