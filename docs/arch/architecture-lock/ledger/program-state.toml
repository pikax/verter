notes = "Created by the maintainer's beta.4 regression-intake directive to own Findings B and C, both regressions against published beta.3 and both beta.4 blockers. THE DECISIVE RULING IS THAT THESE ARE TWO DISTINCT DEFECTS, NOT ONE: the in-repo investigation reproduced a SILENT degrade to Unknown(MissingOutput) upstream of the raise layer, while the external benchmark observed a HARD UnraisableSource error at exposed[].type. Closing only the reproduced one would have left a release blocker armed and shipping, so the hard-error fixture is an ADDITIONAL acceptance condition and CM1 is not complete until both are closed with their own reproducing tests. Finding B root cause: eval_env.rs component_meta_binding_type_entries gates only on PreparedValueDecl.type_annotation.classification and ignores signatures, so a defineExpose'd function declaration or a const initialized by a call such as ref or computed - typed OR untyped - is never offered to macro-type expansion. Repair: structurally admit demanded visible value bindings, fix the call-binding owner/preparation handoff, and preserve Failed through publication. Finding C root cause: macros.rs constructor_to_ts_type recognizes runtime prop constructors but writes DISPLAY TEXT only, never a semantic source, while the sibling Options-API path maps constructor identity to a real Primitive fact - which is why optionality survives while the primitive type vanishes. Repair: the Options path's closed primitive semantics become the shared analyzer model; the runtime-macro path is the anomaly, and semantics are never derived from display text or at the output seam. Both defects reproduce identically across sequential, warm, concurrent and batch invocation, which rules out view/concurrency causes - the directive's request-view hypothesis was not what the evidence showed. Ruled fixable under the CURRENT architecture (Path A), so no C1 rework is required; C1 gains CM1 as a predecessor while RETAINING A6, B1 and B2 so it must preserve the corrected behaviour and migrate the new tests. Acceptance uses Verter's intended canonical type output from product contracts and beta.3 behaviour, never the benchmark's permissive string|String comparison. The strict output error remains PREFERABLE to an invented type: no unknown substitution, no omitted exposed entries, no swallowed failures, no stale graph state, no bypassed request-view isolation."

