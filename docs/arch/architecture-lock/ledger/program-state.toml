notes = "Charter at docs/arch/refactor/rev11/charters/TCM0.md. AUTHORISATION, CORRECTED 2026-08-23 and RETAINED HERE: an older note in this field ('NOT authorised: requires a digest-bound authority-registry record before dispatch') was stale — authority-registry.toml already carries a ratified [[authorization]] record for TCM0 (ratified_at 2026-08-22, documents TCM0-CHARTER + DISC-2026-08-22-TYPESCRIPT-CONTENT-MAPPERS, extended 2026-08-23 with TCM-STEERING + TCM-PACKAGE-CERTIFICATION-SETTLED). That correction stands unchanged. REWRITTEN 2026-08-24 from RULING-2026-08-24-TCM0-DECISIONS (docs/arch/refactor/rev11/rulings/ARCHITECT-RULING-2026-08-24-TCM0-DECISIONS.md, lane architecture-tcm0-decisions, reviewed 6e1777b4c60cc163c7c24a77e6ef82bad9ac6190, RESULT: PASS, findings none). That ruling is the authority for everything below and supersedes the gap-by-gap position the 2026-08-23 text recorded. CANDIDATE DISPOSITION (Q1, Q8). The round-3 candidate 6e1777b4c (tip of block/tcm0-contract-lock, not an ancestor of the working branch — nothing from it is on trunk as this is written) is returned as WRONGLY SCOPED. Its source-backed inventories, probes and transcript land as a NON-ACCEPTANCE EVIDENCE PACKAGE, excluding the program-state.toml hunk, the ADR-021 changes, and every summary/gap/disposition passage still claiming the superseded Q2-Q7 state; those passages are rewritten from the ruling. The incomplete contract remainder becomes a SUCCESSOR BLOCK with fresh verification, explicitly NOT a round 4. Per Q8 the candidate's program-state.toml hunk is REVERTED and never applied: this field, authored on trunk by the program orchestrator as sole ledger writer, is its replacement. RESOLVED BY THE RULING, no longer gating TCM0's acceptance. evidence/TCM0/OPEN-GAPS.md still reads these rows as open; the ruling, not this field, is what closes them, and the evidence file is corrected under Q1. G-TOPOLOGY: closed by Q2's ratified topology transfer — TCM0 owns candidate screening, survivor sets, metrics, harness, baseline method and selection rule, while TCM2 and TCM3 own evidence-based projection- and semantic-topology selection respectively as their own BLOCKING EXITS, so comparative topology numbers are no longer a TCM0 acceptance precondition. G-PERF-NUMBERS: closed by Q3 — requirements 6-8 ARE the complete TCM0 Scope-10 performance contract and NO dedicated-machine absolute baseline is required; independently owned correctness and lifecycle gates remain applicable. G-TCM0-ACCEPTANCE-ROWS-25-26: closed by Q4 — feature-ownership-ledger rows 25 and 26 are RETAINED under VerterWithTypeSemanticOracle (row 25 preserves local content/position conversion and carrier-to-project routing, row 26 preserves oracle working-set activation); the governance ruling that row was waiting on now exists, and TCM3-EC-G1 is satisfied by citing it rather than re-requesting it. G-TCM4-DELETION-ROWS-25-26: closed in the RETAINED direction, which that row's own text records as a closed outcome — TCM4 may remove the tsserver-specific methods only AFTER TCM3 supplies and tests equivalent semantics. G-DIAGNOSTIC-CONVERGENCE: closed by Q6 — TCM3 ALREADY owns convergence through its TypeSemanticOracle and VerterWithTypeSemanticOracle diagnostic contract and NO new block is authorized, so the owner that row existed to keep open is now named; until TCM3 lands, severity taxonomy, canonical positioning and unpositionable-diagnostic behaviour REMAIN DIVERGENT across the CLI and oracle paths, which is disclosed here, not repaired here. ALSO RULED, outside the OPEN-GAPS rows. Q5: get_diagnostics_background, its forwarding implementations, and feature-ownership-ledger row 31 are DELETED — dead API surface has no capability owner and must not be labelled DisabledByExplicitApprovedContract. Q7: the package-transcript staleness gap is ACCEPTABLE — the transcript is immutable evidence for its exact pinned package, so a future package cannot make it stale, and TCM4 owns future-package verification at the certified-engine gate, where its mapper-conformance and semantic-capability probes must pass before activation. STILL OPEN and still gating TCM0's own acceptance, untouched by these eight rulings: G-LEDGER-SCOPE (steering capabilities beyond the TypeProvider trait's 44 methods are not verified row by row), G-PROJECTION-MASK-TOTALITY (the class-by-relation-by-region-by-owner-by-capability terminal policy is not yet a total function), G-STRING-SURFACE-CITATIONS (the string-encoded map-field count is corrected but explicitly NOT closed after two failed manual passes, and is now known to extend into verter_session and verter_lsp as well), G-DELETION-CLOSURE-ITEMS-17-18 (deletion-closure items 17-18 still cannot be enumerated by name), and G-SEMANTIC-API-CERTIFICATION — Q1 admits the candidate's probes and transcript as evidence, but the ruling does NOT decide the open maintainer question that row surfaces (whether TCM0 must run charter item 2's bulk probes itself before acceptance, or a ratified amendment reallocates them alongside the two already-delegated gaps), so the row stays open. Open with owners OUTSIDE TCM0, and therefore not gating this row: G-CONFORMANCE-FIXTURES-TCM2, G-CONFORMANCE-FIXTURES-TCM3, G-CONFORMANCE-FIXTURES-TCM4, and G-TEMPLATE-SRC-PROJECT-CONTEXT-CONTRACT (TCM2). Status stays LOCKED: conformance_review, architecture_review and adversarial_review below are still PENDING with no reviewed_sha, maintainer_decision is PENDING, and this rewrite advances none of them — it corrects a prose field only. TCM0's own review-and-acceptance remains a separate, not-yet-dispatched act, and it cannot proceed to ACCEPTED while any OPEN-GAPS.md row gating TCM0 itself is open."

