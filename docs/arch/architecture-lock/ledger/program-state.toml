notes = "Created by the maintainer's beta.4 regression-intake directive as a bounded post-BV1 correction block. BV1's accepted record is historical and is NOT rewritten. Owns Finding A: production VDOM codegen panics at template/code_gen/types.rs:712 with overwrite_segmented precondition violated / ReplacedContentSplit, a regression against published beta.3 on a valid SFC. Root cause ESTABLISHED with an instrumented in-repo reproduction, not a hypothesis: two producers write overlapping subranges of the template header - visit_comment's plain overwrite of the comment range lands in the overwrites channel while leave_template's single-root path enqueues a segmented overwrite of a SUPERSET range, and CodeGenOutput::apply_to flushes overwrites first, so the segmented target is no longer one untouched Original chunk. The failing path is find_sole_containing_original returning None; the anchored_present branch is unreachable from template codegen. Architecture ruling: eliminate duplicate ownership LOCALLY - defer disabled-comment removals and let the final VDOM root-prefix owner absorb contained removals - retaining every strict segmented-overwrite precondition and the existing flush order, and touching neither code_transform nor apply_to. BV2 ALSO owns a previously unknown SSR sibling the ruling discovered: comments do not count toward effective_count at ssr/mod.rs:473, disabled comments enqueue their own segmented deletion at :6523, and the zero-effective-root branch enqueues a whole-template segmented replacement at :4289 - the same collision shape in a backend the benchmark never exercised, which a Finding-A-only fix would have left armed. Fixed backend-locally, never by global reordering. DAG: B5 gains BV2 while RETAINING its historical BV1 and BS1 edges per the directive - an implementer first wrote predecessors = [BV2] alone, which is transitively equivalent but silently discards B5's recorded dependency on the two accepted framework blocks, and was corrected. No accepted ADR changes and no program outcome changes; only the DAG edge. Forbidden by directive: restoring the removed whole-block overwrite fallback, swallowing the panic, partial publication, globally disabling comment removal or static-class optimization, benchmark-marker or fixture-name special cases, allowlisting, or lowering source-map correctness. ACCEPTED 2026-08-22 by MAINTAINER-RULING-2026-08-22-BV2-B5-J1.md: predecessors BV1/BS1 were already ACCEPTED, so BV2 was legitimately authorised and its acceptance was simply never recorded. Accepted identity 3f663584e (post-fix) diverges from reviewed candidate b64a440a9 because BV2's own work landed as three real trunk commits (b64a440a9, 979123ef4, 3f663584e) — see evidence/BV2/landing-equivalence.md for the ancestry/file-scope proof. 979123ef4 introduced a regression (a degraded class-method inference escalated to the whole props surface) found by review and fixed in 3f663584e; the accepted behaviour is the post-fix behaviour. Single independent review lane (ratified for BV2/B5/J1/CM1 only) accepted in place of the three separately-named mandates."

