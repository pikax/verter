# candidate_sha/tree = exact reviewed cumulative candidate.
# accepted_sha/tree = actual landed commit and full repository tree; they may differ
# from the reviewed candidate after a base advance. landing_equivalence_digest binds
# both base/candidate/accepted identities and exact candidate-delta/post-landing proof.
# conformance_reviewed_sha/architecture_reviewed_sha/adversarial_reviewed_sha = the
# exact candidate_sha each mandate's PASS verdict was issued against. A PASS mandate
# MUST carry its paired reviewed SHA equal to the row's current candidate_sha — a
# stale value (a candidate_sha that advanced past a fix round or rebase without a
# fresh review) is a validator violation, not a silent carry-over. A non-PASS
# mandate (PENDING/BLOCKING/NOT_PROVEN/INVALIDATED/NOT_REQUIRED) carries an empty
# reviewed SHA. This binds a verdict to the exact candidate it was issued against
# (governance.md:106,277 — "all three review mandates PASS on one exact candidate
# SHA/tree").

