notes = "Created by the maintainer's beta.4 regression-intake directive to own Findings B and C, both regressions against published beta.3 and both beta.4 blockers. THE DECISIVE RULING IS THAT THESE ARE TWO DISTINCT DEFECTS, NOT ONE: the in-repo investigation reproduced a SILENT degrade to Unknown(MissingOutput) upstream of the raise layer, while the external benchmark observed a HARD UnraisableSource error at exposed[].type. Closing only the reproduced one would have left a release blocker armed and shipping, so the hard-error fixture is an ADDITIONAL acceptance condition and CM1 is not complete until both are closed with their own reproducing tests. Finding B root cause: eval_env.rs component_meta_binding_type_entries gated only on PreparedValueDecl.type_annotation.classification and ignored signatures, so a defineExpose'd function declaration or a const initialized by a call such as ref or computed - typed OR untyped - was never offered to macro-type expansion. Repair: structurally admit demanded visible value bindings, fix the call-binding owner/preparation handoff, and preserve Failed through publication. Finding C root cause: the macro runtime-constructor path recognized runtime prop constructors but wrote DISPLAY TEXT only, never a semantic source, while the sibling Options-API path mapped constructor identity to a real Primitive fact - which is why optionality survived while the primitive type vanished. Repair: the Options path's closed primitive semantics became the shared analyzer model; the runtime-macro path was the anomaly, and semantics are never derived from display text or at the output seam. Both defects reproduce identically across sequential, warm, concurrent and batch invocation, which rules out view/concurrency causes - the directive's request-view hypothesis was not what the evidence showed. Ruled fixable under the CURRENT architecture (Path A), so no C1 rework is required; C1 gains CM1 as a predecessor while RETAINING A6, B1 and B2 so it must preserve the corrected behaviour and migrate the new tests. Acceptance uses Verter's intended canonical type output from product contracts and beta.3 behaviour, never the benchmark's permissive string|String comparison. The strict output error remains PREFERABLE to an invented type: no unknown substitution, no omitted exposed entries, no swallowed failures, no stale graph state, no bypassed request-view isolation. LANDED SLICES ON TRUNK (dispatch authorization only - NOT ledger-ACCEPTED): predecessors BV1/BS1 were both already ACCEPTED at dispatch (2026-08-20), so CM1 was legitimately authorised (authority-registry.toml, block=CM1). CM1's work reached trunk as THREE real commits across two days, not one and not two: 0e5177931 (2026-08-22, Finding B - aliased-binding identity resolution, the exhaustive PreparedValueDecl admission gate, Failed-vs-Absent preservation, and the Present->UnraisableSource producer repair), 13eafb2ab (2026-08-22, Finding C - the owner-aware RootBindingIndex replacing the deleted, structurally-unsound shadow scanner, shared by the Options and macro runtime-constructor paths), and 571ad4dd1 (2026-08-23, the corrective follow-on - owner-keyed binding resolution through admission to the join with a fail-closed residual double match, macro-indexed slot identity, and spec-direct eval classification for every Reference-preserving wrapper). Neither corresponds to implementation_candidate_sha (block/cm1's tip 47e8515): 0e5177931 is a divergent squash of block/cm1's own corrected end state (that branch's internal revert a7bf8c696 already dropped the unsound shadow scanner before its own tip), and 13eafb2ab is an entirely separate lineage block/cm1 never contained - see evidence/CM1/landing-equivalence.md for the full ancestry proof. implementation_candidate_sha/implementation_ref are retained as the historical WIP-dispatch record only, per the field's documented meaning once a block leaves IN_PROGRESS; they are NOT CM1's landed identity. FOLLOW-ON DEFERRALS NOW CLOSED: 571ad4dd1 closed the three crates/ gaps the genuine BLOCK review recorded (evidence/CM1/2026-08-22-acceptance-repair.md) - the D3 Local+Absent arm now fails closed with SemanticSourceFailure::UnrepresentableRequiredMemberValue instead of falling through to the caller's unannotated default; D1 nullable-constructor-array adoption was verified against vendored @vue/runtime-core (getType(null) returns the string null; assertType accepts only value === null) rather than guessed; and the eval-classification bug was fixed conservatively, poisoning skipped ONLY for a provably fresh, unmutated, unredeclared non-global function binding, with alias/reassignment/redeclaration/optional-call/comma-expression tests each asserting the direction it must not drift toward. The compat regression that same review recorded (packages/component-meta/test/compat-gaps.test.ts asserting the pre-repair unknown | undefined value for the exact shape Finding C targets) is likewise resolved - that test now asserts string | undefined. evidence/CM1/binding-index-deferrals.md records the closures. CHARTER-COMPLETION CANDIDATE (this row's current base_sha/candidate_sha): the three charter exits that survived 571ad4dd1 are closed by this candidate. (1) Charter item 4 (CM1.md:110) required a producer-owned typed runtime-constructor fact/enum; constructor identity was still a raw Arc<str> spelling on ConstructorBindingEntry, folded by a string match at component_meta.rs's primitive_of and mapped a second time by macros.rs's constructor_to_ts_type. Both string switches are DELETED. verter_type_expr::RuntimeConstructorIdentity is a closed enum minted ONCE at the analyzer's extraction boundary (root_binding_index::resolve_constructor_binding classifies the identifier's own source text; macros::resolve_runtime_constructor_array mints NullLiteral for the literal element and Unclassifiable for a non-identifier position) and matched EXHAUSTIVELY downstream through identity.primitive() / identity.display_ts_type() / identity.spelling(). ConstructorBindingEntry no longer carries a spelling field at all, so a downstream re-classification is a compile error, not a review catch - the structural confinement the charter's Structural confinement section requires (a closed enum matched exhaustively, never a name-keyed source scanner). (2) Charter item 7 / the acceptance matrix (CM1.md:165) required the literal cross of runtime forms, invocation modes and native/compat surfaces at the PUBLIC boundary; coverage was strong at analyzer/fold level but the public half was narrow. crates/verter_session/tests/cases/runtime_constructor_matrix.rs now drives every DEMANDED runtime form (shorthand, expanded, required, optional, with-default, constructor array, nullable) and every demanded constructor kind (String/Number/Boolean positive; module-owned and imported custom classes as negative controls that must not be folded). Three authored-type forms are EXCLUDED from the demanded set by ratified rulings and carried as ignored discriminating captures instead - PropType<T>, a script-setup-local class, and the mixed runtime + type-declared form - so this row no longer claims the matrix drives them or uses PropType<T> as a control through BOTH the macro and Options-API extraction paths, under cold, warm, sequential, concurrent, batch and overlay/base invocation, asserting both per-cell exactness and cross-mode identity. packages/component-meta/test/runtime-constructor-matrix.test.ts mirrors the same fixtures on the compat surface. (3) The Present->UnraisableSource fixture asserted by panic-message style rather than the exact error variant; exposed_binding_regression.rs's fixture now matches the Result explicitly and asserts the exact ComponentMetaOutputLane::Exposed / ComponentMetaOutputFailure::UnraisableSource pair on the failure arm, separating the pre-repair defect from a different typed failure and from the forbidden Ok(None) swallow. LEDGER IDENTITY CORRECTION: base_sha/candidate_sha previously declared eadec2dc0..13eafb2ab as if it were a CM1-only delta. It is not: that range spans eight commits and 3,839 changed paths, with six unrelated Svelte-oracle, LSP, gate, harness and CSS commits sitting between CM1's own two 2026-08-22 commits, and it omitted 571ad4dd1 entirely. That mis-modelled range - not any CM1 content disagreement - is what produced the validator's CM1 landing-order replay conflict: a read-only three-way over the declared range reports conflicting paths whose intersection with the union of paths 0e5177931, 13eafb2ab and 571ad4dd1 actually changed is EMPTY, exactly the failure mode scripts/validate-program-state.mjs's own design comment describes for a declared base that predates unrelated intervening work. The row now declares the real base and candidate of the charter-completion delta above. CLOSED, and not by CM1: the repository.integration_head_sha replay pin had fallen behind the live program/architecture-lock tip, leaving the rehearsal's cumulative tree predating CM1's own already-landed commits. The orchestrator has since advanced it, so that residual no longer stands and this row no longer claims it does. Deliberately stated WITHOUT quoting either sha: the pin is orchestrator-owned and advances by design, so prose naming its value goes stale on the next advance - as this sentence itself did once, within an hour of being written. Replaying this candidate's delta onto the LIVE trunk tip is clean (git merge-tree --write-tree exit 0, no conflicted paths); replaying it onto the stale-pin cumulative is not. Advancing that pin is a program-level edit whose blast radius is every active block - doing so surfaces a separate J1 replay conflict - so it is left to the program orchestrator rather than taken here. REVIEW STATE: the three mandates remain BLOCKING. The single genuine acceptance review ever dispatched (against 13eafb2ab, under the BV2/B5/J1/CM1 single-lane waiver ratified by MAINTAINER-RULING-2026-08-22-BV2-B5-J1.md) returned BLOCK; that is a fact and is never relabelled PASS. The waiver was specific to the original batch and is not re-invoked for this charter-completion candidate, which is reviewed under the normal three-mandate protocol. context_packet_digest stays empty: no qualifying pre-dispatch packet ever existed and none is reconstructed - grandfathered by name in scripts/validate-program-state.mjs's CONTEXT_PACKET_DIGEST_LEGACY_GAP_GRANDFATHER set, citing MAINTAINER-RULING-2026-08-22-CODE-OVER-LEDGER.md section 1, which grandfathers that field alone and explicitly leaves review mandates enforced. accepted_sha/accepted_tree/maintainer_decision stay empty/PENDING: acceptance is maintainer-only (governance.md section 1.1) and has not occurred. CM1 stays REVIEW until all three mandates PASS against the exact candidate_sha above and the maintainer records the decision."

