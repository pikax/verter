[[atom]]
id = "A-control-mutation-locatable"
claim = "CLM-INSTRUMENT"
statement = "A negative control names the artifact it mutated and both halves of the edit, and `unique-new-occurrence` is VERIFIED rather than asserted: the replaced text must occur in the subject exactly once, and the introduced text must be absent. A mutation that could never have applied fails, and so does one still sitting in the tree under review. A command-shaped control instead names the arguments it added, none of which may already be part of the recorded command. A control whose observed outcome parses as a transcript this validator would admit records no refusal and is refused. Every control is RE-APPLIED rather than believed, command-shaped ones included: the mutation goes into a mirror of the tree — or, for a command control, onto the argument vector — the record's own command runs against it, and the refusal must be the runner's own, in its adapter's grammar, carrying the counts the control transcribes — with a clean run of the same mirror beforehand, so a refusal is attributable to the mutation rather than to a tree that was already red. Re-application is not sampled. It is split across two lanes on a TOOLCHAIN boundary — the instrument suite drives the controls whose records run under `node`, and a second lane drives the rest, the records that run under `cargo` and the one whose command is the instrument suite itself, which cannot be driven by the suite it would re-enter. The partition over the register's whole control universe is resolved rather than declared: every control lands in exactly one lane, no control is exempt from re-application for mutating no artifact — a command-shaped control is re-applied by the lane its record's runner decides, so the counters its record transcribes and the refusal its delta produces are re-derived live rather than trusted — and the delegated lane is resolved against the workflow — one job issuing its complete command line, installing the runner and the cargo subcommands its controls need, gated on a filter covering that lane's own sources and every subject it mutates. A delegated lane no job runs is a transcript with extra steps."
