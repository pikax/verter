[[atom]]
id = "A-projection-classes-closed"
claim = "CLM-PLANE"
statement = "The contract partitions BOTH surfaces into the five projection classes — every projected byte into one of the four with a projected side, every carrier byte into one of the four with a carrier side — makes the two one-sided classes fail closed, and defines a region matching none as a lowering defect rather than a sixth class. Stating totality over the projected surface alone would let an implementation drop elided carrier regions and still satisfy the partition. The contract also states the correspondence's MULTIPLICITY, which totality does not decide: one carrier region corresponds to one or more projected regions, the correspondence is complete in the carrier-to-projected direction, and an operation anchored at a carrier region that reaches fewer than all of its projected regions fails closed. Without that, a mapping product typed as a function satisfies the partition while a rename rewrites one of several emissions of the same carrier expression, and no fail-closed class sees it."
contract_section = "2. The five projection classes"
contract_anchor = "Every byte of the projected TypeScript surface belongs to exactly one of Identity, Relocated, Rewritten, or Synthesized; every byte of the carrier source belongs to exactly one of Identity, Relocated, Rewritten, or Elided."
