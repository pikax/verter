# ---------------------------------------------------------------------------
# Canonical negative controls.
#
# Each mutation was applied to a working tree, executed, and reverted. What
# makes "unique" and "new" checkable rather than assertable is that the record
# carries both halves of the edit: the validator requires the replaced text to
# be present in the subject EXACTLY ONCE and the introduced text to be ABSENT.
# A mutation that could never have applied fails, and so does one still sitting
# in the tree under review. A command mutation instead names the arguments it
# added, none of which may already be part of the recorded command.
#
# A control that mutates an ARTIFACT is not left at its transcript. The lane
# that owns it copies the tree into a mirror, runs the record command there
# clean, applies the mutation to the mirror, and requires the refusal below to
# be what that command still produces. The mirror is the point: a mutation in
# the tree under review is an edit somebody can commit.
#
# Re-application is not sampled. The instrument suite drives the controls whose
# records run under `node`; a second lane drives the rest — the records that run
# under `cargo`, and the one whose command IS the instrument suite, which cannot
# be driven by the suite it would re-enter. The suite resolves that partition
# over this whole control universe and resolves the delegated lane against the
# workflow, so a control owned by neither lane fails rather than passing quietly.
# No control is transcribed, command-shaped ones included: a command control's
# mutation is an argument added to the recorded command, and both halves of what
# it records — the counters its record transcribes, and the refusal its delta
# produces against the tree's current test inventory — are re-derived by the
# same clean-run-then-mutated-run re-application on the lane its record's
# runner decides, beside the controls that edit files.
#
# Both halves of a source mutation span a line boundary on purpose. Two of these
# subjects are files this register itself owns, and a single-line fragment of
# such a file would match its own record — the control would then be proving
# something about its own text rather than about the tree.
# ---------------------------------------------------------------------------

