[[atom]]
id = "A-external-refresh-lane-bound"
claim = "CLM-EVIDENCE"
statement = "A record this instrument cannot re-run declares the CI lane that does, and the validator RESOLVES that declaration against the workflow: the named job must exist, must issue the named command as its COMPLETE command line rather than a prefix of it, and must be gated on the named path filter. The lane's selection is then resolved in two stages against the record's own. Narrowing this check can relate to the record decides the result: a lane that names packages must name every package the record selects, and a lane that excludes one of them or narrows to a single build target does not run this record's work. The lane's universe must then reach the record, from that command selecting the whole workspace, from a whole-workspace archive that some job in the same workflow BUILDS with its archive subcommand — not merely mentions — and that this job declares among its needs, or from a non-cargo command with no selection argument and no operand beyond the program it runs whose own declared enumeration this check RUNS, so the record's selection is matched against the list that script prints rather than credited to the phrase \"its default universe\". A record's own re-derived selected count is NOT one of those arms: it is a property of the record, not of the lane. Every artifact the record cites — its fixtures, its control's subject, the crate root of every package it selects, the anchor of every atom it covers, and any script the lane's own selection is read out of or enumerated by — must be covered by that filter's patterns, and for an executed script that means the script AND every first-party module it transitively imports, because a lane selector is routinely a thin entry whose real selection data is declared one import away; such a script must also reach no installed package, since the job that runs this instrument installs none, and a pattern shape this check cannot read is reported there as it is in the instrument's own filter; because a Rust lane's filter is the crate tree rather than a hand-listed subset, the selected packages' transitive dependency closure is covered too. WITHIN-universe narrowing is resolved rather than published as a name: a variable spelling is resolved to the assignment the job makes — with or without an `export` keyword, and across a shell line continuation — that command must be the producer the register declares, and this check executes it and decomposes the expression it prints. A package the predicate excludes outright that this record selects is a limit; the name-scoped exclusions it leaves inside a package the lane still runs are published by package and explicitly NOT evaluated, because whether those names reach this record's own cases is a property of the test binaries rather than of the expression. The generated view also publishes, per record, whether this instrument re-derives its counts or only names the lane that re-runs the work. An unresolved binding, an unresolved lane universe, a variable no step assigns, a producer that is not the declared one, an expression this reader cannot decompose, a lane narrowed away from the record's packages, or an uncovered input is a DERIVED limit on the record, and a limited claim is bounded and inadmissible."
evidence_anchor = ".github/workflows/ci.yml"
shipped_obligation = "authority-only"

