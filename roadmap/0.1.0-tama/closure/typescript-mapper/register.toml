[[row]]
kind = "deletion"
subject = "Name-keyed scanner guard"
disposition = "Deleted: no check walks a directory looking for files that mention a name. Every check reads a declared artifact at a path the register or the program authority names — the register, the schema, the DAG, the charters, the ratified contract, the compile-fail fixture directory a cited record's own runner enumerates, and the CI workflow. Reading the workflow does match literal configuration identifiers — the filter names, the job gating expression, and the command lines the lanes issue — because those identifiers ARE the configuration's declared interface, named by the register and resolved against the file rather than searched for across a tree. Two lane commands are RUN rather than read, for the same reason and under the same discipline: a lane whose selection is a run-time predicate, and a lane whose runner iterates its own declared list, are only resolvable by asking them, so the register declares the exact command, the workflow must agree that this is the command the job computes its selection from or the script that job runs, and only the allowlisted node runner is executable. Nothing there is searched for; the command is handed to the check. One residual coupling is disclosed rather than argued away: a source-mutation control asserts a verbatim spelling of a named production file, so a behaviour-preserving rename or reflow of that region breaks the control without changing anything the register cares about. That is the price of proving a reverted mutation was unique and new against the tree under review, which nothing weaker establishes. It is bounded to a control's own named subject and is not a licence to multiply: a successor adding controls over churning source should prefer the narrowest binding that still proves uniqueness — anchoring to the test the mutation broke, which the observed outcome already quotes — and should not introduce a check that searches for a spelling it was not handed."
receiving_criterion = "TCM0R-AC1"
receiving_criterion_role = "sole-owner outcome"

