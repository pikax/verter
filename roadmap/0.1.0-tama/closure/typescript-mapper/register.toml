# Closure register — INPUT ONLY.
#
# This file carries claims, atoms, proof references, findings, residues, and
# rows. It carries NO lifecycle status and NO disclosed limits:
# `closure-register.schema.json` sets additionalProperties=false on every table
# and declares neither property anywhere, so an author-written status or an
# author-written limit is a schema error rather than a convention. OPEN /
# REFUSED / PROVEN-BOUNDED / PROVEN and every limit are DERIVED by
# `tools/closure-register.mjs`, which also generates the human view at
# `closure.md`. Editing that view by hand fails the freshness check.

schema = 1
instrument = "typescript-mapper-closure"

[ratification]
owner = "rev11.typescript-mapper:ratified dual-plane mapper/snapshot/oracle identity contract"
displaced_owner = "rejected TCM0 closure package and string mapper plane"
contract = "contracts/typescript-mapper-dual-plane.md"
instrument_authority = "charters/rev11-typescript-mapper/TCM0R.md"
decision = "decisions/2026-09-02-typescript-mapper-rescope.md"

# ---------------------------------------------------------------------------
# Allowlisted adapters.
#
# A proof record names an adapter id; the adapter owns `runner` and
# `argv_prefix`, and the record supplies only a tail. `runner` is a closed
# two-value enum of portable toolchain entry points, so a shell, batch, or
# interpreter control is not expressible in this register at all — the
# displaced package's tracked POSIX controls are structurally rejected rather
# than removed by inspection.
#
# `summary_grammar` is the terminal-summary shape the runner emits, and it is
# what makes a transcription checkable: the validator re-derives selected,
# executed, passed, failed, and skipped OUT of the recorded text and refuses the
# record unless its own counters equal them. A plausible sentence with
# self-consistent numbers beside it is no longer evidence of anything.
#
# `reexecution` says who re-derives the record, and the two arms are both
# resolved rather than trusted. An `instrument` record is re-run by the control
# suite against the live register and compared against its transcription; a node
# runner may not declare anything else. An `external` record names the lane that
# re-runs its work — `refresh_job`, `refresh_command`, `refresh_filter` — and
# the validator resolves that the job exists, issues that command, and is gated
# on that filter, then measures the record's cited artifacts against the
# filter's own patterns. That is also how the SELECTED PACKAGES' DEPENDENCY
# CLOSURE gets covered: a Rust lane's filter is the whole crate tree, not a
# hand-listed subset, so a change to a transitive dependency re-runs the work
# rather than slipping past a narrower list.
#
# A named job issuing a named command is not yet a statement that the job runs
# THIS record's work, so the lane's SELECTION is resolved too — and `refresh_command`
# is therefore the job's COMPLETE command line, not a prefix of it. A prefix
# would satisfy a containment check while hiding every flag that decides what
# the lane actually selects, so the validator requires the declaration to equal
# the line the job issues and derives the selection from that. Three shapes
# resolve: the command selects the whole workspace outright; it consumes a
# whole-workspace archive that a job in the same workflow builds in one command
# and that this job declares among its `needs`; or it is not a cargo selector
# and carries no selection argument at all, so it re-runs its own runner's whole
# universe. A record's `count_source` is NOT one of them: re-deriving a selected
# count from a fixture directory is a property of the record, and answering a
# question about the lane with it would be an answer about the register.
#
# What the external arm does NOT establish is derived and published rather than
# left to the reader, in two parts. This instrument cannot invoke `cargo`, so it
# re-runs that work through nobody and compares no counts against the
# transcription. And where the lane narrows its own universe at run time — a
# filter expression, a shard partition — that narrowing is derived from the same
# command line and published verbatim, because the lane executing work drawn
# from a record's packages is not the lane executing that record's selection.
# The generated view states both per record, beside the job and filter, so the
# weaker guarantee is never printed as the stronger one. The evidence model this
# register implements binds a record to no repository SHA, tree, or digest, so
# the residual is a scope statement rather than a defect — but an unstated scope
# reads as full strength, which is the reading this removes.
#
# `count_source` adds a second, independent derivation of the selected count for
# a runner that computes its own selection from a directory. The compile-fail
# runner enumerates its fixture directory, so the count is re-derived from that
# directory rather than trusted: adding or removing a case there invalidates the
# transcription instead of passing.
# ---------------------------------------------------------------------------

[[adapter]]
id = "node-tool"
runner = "node"
argv_prefix = []
summary_shape = "one terminal line beginning with the tool name and PASS, carrying its own counts"
summary_grammar = "tool-line"
reexecution = "instrument"

[[adapter]]
id = "node-test"
runner = "node"
argv_prefix = ["--test"]
summary_shape = "node:test terminal block with tests/pass/fail/skipped counts"
summary_grammar = "node-test"
reexecution = "instrument"

[[adapter]]
id = "cargo-contract"
runner = "cargo"
argv_prefix = ["run", "--locked", "-p", "verter_compile_contracts", "--no-default-features", "--features"]
summary_shape = "a fixture-count banner printed BEFORE the run, then one `... ok` line per compile-fail case that cleared; nonzero exit on any mismatch"
summary_grammar = "compile-contracts"
reexecution = "external"
refresh_job = "compiler-contracts"
refresh_filter = "rust"
refresh_command = "node scripts/compile-contracts.mjs"
refresh_selection_enumerator = "node scripts/compile-contracts.mjs --list-owners"
refresh_selection_flag = "--features"
count_source = "fixture-directory"

[[adapter]]
id = "cargo-test"
runner = "cargo"
argv_prefix = ["test", "--locked"]
summary_shape = "one libtest `test result:` line per test binary"
summary_grammar = "libtest"
reexecution = "external"
refresh_job = "rust-test"
refresh_filter = "rust"
refresh_command = "cargo nextest run --archive-file artifacts/rust-nextest-archive.tar.zst --extract-to target/rust-nextest-archive --no-fail-fast --partition \"hash:${{ matrix.shard }}/4\" -E \"$VERTER_NEXTEST_FILTER\""
refresh_selection_producer = "node scripts/provider-ci.mjs filter core"

[[adapter]]
id = "cargo-nextest"
runner = "cargo"
argv_prefix = ["nextest", "run", "--locked"]
summary_shape = "nextest `Summary [t] R/S tests run: P passed, F failed, K skipped`"
summary_grammar = "nextest"
reexecution = "external"
refresh_job = "rust-test"
refresh_filter = "rust"
refresh_command = "cargo nextest run --archive-file artifacts/rust-nextest-archive.tar.zst --extract-to target/rust-nextest-archive --no-fail-fast --partition \"hash:${{ matrix.shard }}/4\" -E \"$VERTER_NEXTEST_FILTER\""
refresh_selection_producer = "node scripts/provider-ci.mjs filter core"

# ---------------------------------------------------------------------------
# Claims — the atomized charter obligations.
#
# `subject` names the artifacts the claim is ABOUT. It is not decoration: the
# acyclicity rule is derived from it. A proof record whose own recorded command
# RUNS one of a claim's subjects is that subject's verdict, so it may not also
# be the evidence that the subject behaves correctly, and the validator refuses
# the claim rather than logging beside it. Nothing about that binding is
# volunteered by a proof, so a record cannot exempt itself by omission.
#
# The instrument's own claim is the case that matters. `CLM-INSTRUMENT`'s
# subjects are the validator and its schema — the artifacts that derive status —
# so `P-instrument-check`, which IS a run of the validator, is structurally
# barred from covering any of its atoms. `P-instrument-controls` is admissible
# for them because it is not the validator: it is the adversarial control suite,
# and each of its cases passes only when the validator REFUSES a mutation. A
# broken, permissive validator fails that suite rather than passing it, which is
# the opposite of the self-certification this rescope displaced.
# ---------------------------------------------------------------------------

[[claim]]
id = "CLM-PLANE"
statement = "The mapping plane and the semantic plane are separate, the dependency direction is one-way, the correspondence is total over a closed projection partition of both surfaces, and the string mapper plane is displaced."
subject = ["roadmap/0.1.0-tama/contracts/typescript-mapper-dual-plane.md"]

[[claim]]
id = "CLM-IDENTITY"
statement = "Observation identity is correctly scoped, stated component by component rather than summarised: the in-flight basis never keys a cache, the query identity is snapshot-independent and profile-bearing, the flight key is strictly larger, and unit lineage survives edits. The observed-profile component is a set in the shipped composition as well as in the contract — a profile observed twice composes the same identity as one observed once, because the shared canonical encoder deduplicates a set-shaped field rather than only sorting it. That is asserted separately from order independence, which a sorted bag would satisfy too."
subject = ["roadmap/0.1.0-tama/contracts/typescript-mapper-dual-plane.md"]

[[claim]]
id = "CLM-BINDING"
statement = "A certified engine binding is the sole route by which an engine answer enters the semantic plane, and it is a witness rather than a handle."
subject = ["roadmap/0.1.0-tama/contracts/typescript-mapper-dual-plane.md"]

[[claim]]
id = "CLM-LIFECYCLE"
statement = "Publication requires a live basis, degraded outcomes never warm, cache slots key on query identity alone, and incremental equals fresh."
subject = ["roadmap/0.1.0-tama/contracts/typescript-mapper-dual-plane.md"]

[[claim]]
id = "CLM-OWNERSHIP"
statement = "One capability has one owner, the ratified owner has reached the downstream charters, deletion and survivor rows are concrete and received, residue owners are authorized and non-circular, and no dual-running window exists."
subject = ["roadmap/0.1.0-tama/contracts/typescript-mapper-dual-plane.md", "roadmap/0.1.0-tama/closure/typescript-mapper/register.toml"]

[[claim]]
id = "CLM-EVIDENCE"
statement = "Every retained evidence row names fixture inputs that resolve and an exactly reconstructible command, and proves a terminal summary, nonzero selected work, no undeclared skips, and internally consistent counters; a row the control suite can re-execute is re-executed against its own transcription, and a row it cannot is bound to the resolved CI lane that re-runs the work instead."
subject = ["roadmap/0.1.0-tama/closure/typescript-mapper/register.toml"]

[[claim]]
id = "CLM-INSTRUMENT"
statement = "The instrument derives status rather than accepting it, admits only allowlisted portable adapters, generates its human view, refuses to certify a state that is not reviewable, keeps its claim universe complete, binds each proof to the artifact its atoms require, refuses bounded-to-proven laundering, stays acyclic, and controls every mandatory failure class."
subject = ["roadmap/0.1.0-tama/tools/closure-register.mjs", "roadmap/0.1.0-tama/schemas/closure-register.schema.json"]

# ---------------------------------------------------------------------------
# Atoms.
#
# `contract_section` binds an atom to the ratified contract section that states
# it, and `contract_anchor` quotes the sentence it relies on. The section must
# exist AND still state the quotation: a heading that survives while its body is
# replaced by a placeholder would otherwise keep the atom proven, which makes
# the derived status a report about titles.
#
# `evidence_anchor` is the artifact a proof of this atom must actually exercise.
# `covers` is a list an author writes, so on its own it would let any green
# record be credited with any obligation; the validator derives each record's
# surface from its OWN fixtures, path arguments, and selected package roots, and
# requires that surface to reach this anchor.
#
# `received_by` names the acceptance criterion that ENFORCES the obligation and
# `received_by_role` names the role that criterion bears. The identifier alone
# is not evidence: every charter in this program declares the same four
# boilerplate ordinals, so `<any descendant>-AC<1..4>` would resolve. The
# validator therefore reads the role out of the owner charter's own criterion
# line, requires an exact match, and requires the owner to sit inside this
# node's train. A transferred atom carries no `received_by` — its ordered
# receiving rows do that job.
# ---------------------------------------------------------------------------

