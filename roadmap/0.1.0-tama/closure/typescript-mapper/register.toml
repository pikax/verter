[[atom]]
id = "A-acyclic-proof-dependency"
claim = "CLM-INSTRUMENT"
statement = "A proof may not cover atoms of a claim when the artifacts its own recorded command runs are that claim's declared subject. The binding is derived from the claim's subject and the proof's adapter plus command tail, never volunteered by the proof, so an omission cannot exempt a record; a cycle refuses the claim rather than being logged beside it. The derivation is per RUNNER, not per argument shape: a command selects work either by path or by package, so a selected crate root is a verdict-producing artifact exactly as a path argument is, and containment decides — a run of a tree is the verdict for a subject inside it. A module a node record's entry file IMPORTS is not a verdict-producing artifact, because the transcript reports the harness's verdict on that file's assertions rather than on the module. It is still executed by them, so that edge is derived too, over the TRANSITIVE first-party import graph rather than one level of it — a chain through a re-export is the same execution as a direct import, and reading one level would let a forwarding module hide the cycle — and it is refused by default: a record whose entry file reaches its claim's subject through that graph is admissible only through an exemption pinned beside the validator, published in the generated view beside that record, and stale-failing when the record stops exercising the subject. Exactly one is pinned — the adversarial control suite, whose controls pass only when the validator REFUSES a planted mutation, so a permissive validator fails them rather than passing. That is a property of those cases and not of every case in the suite, which also holds a baseline and registration/pin checks asserting over its own declarations, so the suite enforces it PER CASE instead of claiming it of the file: planting passes through one helper, a case registered as a control that plants nothing fails there, and the non-planting cases are registered through a separate wrapper whose names the suite pins — a case that stops planting cannot migrate into the exempted set unnoticed. A run of this validator certifying itself stays barred, because its transcript would then be the subject's own output."
evidence_anchor = "roadmap/0.1.0-tama/tools/closure-register.mjs"
shipped_obligation = "authority-only"

