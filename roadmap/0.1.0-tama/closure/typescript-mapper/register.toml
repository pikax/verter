evidence_anchor = "roadmap/0.1.0-tama/tools/closure-register.mjs"
shipped_obligation = "authority-only"

[[atom]]
id = "A-stated-obligation-is-enforced"
claim = "CLM-INSTRUMENT"
statement = "An atom whose subject is contract text must quote the sentence the contract states and name both the acceptance criterion that enforces it and the role that criterion bears. The validator requires the quotation to still be in the bound section, resolves the criterion against the owner charter's own declared criterion line, requires the declared role to match, and requires the owner to be this node or a strict descendant inside this node's train — so a citation is not satisfied by an interchangeable ordinal on an unrelated block. The binding is pinned as well as resolved: the section and the quotation are digested beside the atom's statement, so an atom cannot be moved onto a different sentence of a still-valid contract while the words it asserts stay where they are. An obligation the shipped code does not yet meet is not enforced by that citation alone: it names the production surface it is unmet at, that path must sit inside the production surfaces the receiving criterion's owner charter declares, and the claim summary counts it as owed rather than letting it read as settled."
evidence_anchor = "roadmap/0.1.0-tama/tools/closure-register.mjs"
