# Public product-surface capability and performance catalog.
#
# This file is a CONTRACT, not an implementation. It ratifies the surfaces
# this release advertises, each surface's sole stability class, and the
# controlling wall / allocation / process-tree RSS rows that govern it.
# Nothing here compiles a file or measures a candidate.
#
# Registering these rows is an EXTENSION under performance-gates.toml: a
# new lock-record digest and the architecture-3 review class. It never
# licenses weakening, reweighting, subsetting or reinterpreting a locked
# cell. Limits that cite a locked cell are re-resolved against that cell
# on every validation run. Limits that cannot cite a locked cell (the
# direct-compiler CSS, managed CSS, tsc, lint and language-service
# families the lock file explicitly does not claim) are catalog-owned
# extensions restating the locked product-budget / methodology floor.
#
# Truthfulness: owning product terminals have not delivered these
# surfaces as stable, so no row holds stability_class = "stable".
# component-meta batch is experimental-unranked per docs/api-stability.md.

schema = 1
product = "rev11"
owner = "L0"
status = "RATIFIED"

[lock_record]
digest = "61e890e76e912b95622c041715d4307000393463447d822eb2138bd00e420961"
review_class = "architecture-3"
extension_of = "performance-gates.toml"
never_weakens_locked_cells = true
correction_rule = "A ratified limit may be corrected only by minting a new lock_record.digest under review class architecture-3. Editing a limit while keeping this digest is refused. Observing a candidate and then weakening a row is prohibited."

[baseline]
source_file = "performance-gates.toml"
lock_status = "LOCKED"
baseline_sha = "fb863297a04c7eb114d53ff65736c00240354504"
baseline_tree = "a2e01e16d705faecf259152f40d0a3b228b16dbf"
runner_class = "apple-silicon-laptop-8core-24gib"
runner_memory_bytes = 25769803776
runner_logical_cpus = 8
rust_toolchain = "1.97.1 (8bab26f4f 2026-07-14)"
node_runtime = "v20.20.2"
published_release = "0.0.1-beta.5"
paired_frozen_dependency_rule = "A cross-release comparison is ranked only when Cargo.lock, pnpm-lock.yaml, rust-toolchain.toml and the Node runtime pin are identical on both sides. A moved dependency set is a recalibration, never a Verter regression or win."
invalid_historical_result_rule = "A recorded result whose runner class, toolchain, corpus or instrumentation arm differs from the row it is compared against is INVALID for comparison and is not ranked as equivalent work."

[measurement]
rss_statistic = "max"
rss_scope = "resident set size of the runner process tree, including child engines the wrapper PID does not own"
rss_includes_allocator_overhead = true
allocator_slack_bytes = 268435456
owned_bytes_scope = "exact summed charge or payload bytes for the work the surface command performs"
owned_bytes_excludes_allocator_overhead = true
no_regression_floor_milli_percent = 3000
statistical_zero_bound_rule = "A statistical metric carries no implied 0.0 percent comparison bound. The floor is the locked no-regression floor of 3000 milli-percent; a row that restates 0 is refused."
cross_release_comparison = "Paired frozen-dependency comparison under baseline.paired_frozen_dependency_rule, on the locked runner class, with MEM0 allocator slack applied to process-tree RSS and never to owned-byte totals."

