[[issue]]
node_id = "GH0"
title = "Keep GitHub issue synchronization explicit and one-way"
problem = "GitHub coordination can become unreliable when issue text, labels, and lifecycle fields are treated as a second source of implementation truth. This creates competing representations, leaves maintainers unsure which state is authoritative, and risks overwriting useful issue discussion with machine-oriented planning data. The repository needs a small, explicit synchronization boundary that keeps local mappings authoritative while preserving GitHub as a readable collaboration surface."
expected_outcome = "Issue synchronization runs only when requested, creates or updates project-owned coordination fields deterministically, and never imports GitHub state into implementation authority. Existing issue prose remains stable during normal synchronization, protected issues remain untouched, and partial external writes are reported with enough identity for safe repair."
acceptance = ["A local mapping is the only node-to-issue identity and does not mark implementation complete.", "Normal synchronization preserves existing issue title, body, comments, and unrelated labels.", "Protected mappings receive no issue or Project mutation from synchronization.", "Every successful external mutation remains visible when a later operation fails."]
[[issue]]
node_id = "B4R0"
title = "Keep source-unit identity stable across revisions and mappings"
problem = "Source units can still be identified through constructors and mapping keys that vary with a revision or collapse to a path-only alias. This can make caches, source maps, compiler output, and session state treat one logical source as several unrelated units—or treat distinct revisions as the same unit—causing stale results and misattributed diagnostics. The identity boundary needs to distinguish stable lineage from the content and mapping changes that occur within that lineage."
expected_outcome = "A source unit keeps one stable logical identity while revision, content, and source-map revisions change independently. The identity, compiler, and session layers use those separate values consistently, so cached and published results retain deterministic provenance without path-only or revision-derived aliases."
acceptance = ["Changing source content or map data does not replace the logical source-unit identity.", "Revision-derived source-unit constructors and path-only lineage aliases are unavailable to production callers.", "Compiler and session mapping keys preserve separate source, revision, content, and map identities.", "Identity and session coverage demonstrates deterministic lookup and provenance across repeated revisions."]
[[issue]]
node_id = "J2"
title = "Qualify style results with stable identity and ownership"
problem = "Style consumers and external preprocessing glue can pass CSS results without a complete stage, source identity, revision basis, provenance, or qualified source map. That makes stale or mismatched preprocessing results difficult to reject and allows multiple components to behave as competing style authorities."
expected_outcome = "The CSS owner publishes one qualified style-result contract with stable source and style identities, explicit processing stage, deterministic diagnostics and dependencies, and owner-specific adapters for compiler and editor consumers."
acceptance = ["Qualified style results bind stage, source and style identity, revision basis, provenance, diagnostics, dependencies, and source maps.", "Consumers cannot admit unqualified or stale preprocessor output.", "CSS parsing and preprocessing have one production authority with no competing fallback route.", "Compiler and editor consumers preserve deterministic output and provenance through owner-specific adapters."]
[[issue]]
node_id = "J3"
title = "Converge shared CSS plans and terminal materialization"
problem = "CSS consumers can independently rediscover structure or materialize output through owner-specific paths, causing duplicate parsing, inconsistent diagnostics, and source-map divergence. Shared plans need one bounded path from qualified style facts to terminal output."
expected_outcome = "Qualified style facts feed reusable shared CSS plans and one deterministic terminal materialization boundary without introducing a second parser or unqualified result path."
acceptance = ["Shared CSS plans preserve qualified identity, stage, dependencies, diagnostics, and map provenance.", "Terminal materialization is deterministic and rejects incomplete or mismatched inputs.", "No consumer performs a competing CSS parse or retains an unqualified preprocessing fallback.", "Applicable reuse avoids duplicate parsing or materialization while absent work remains zero-work."]
[[issue]]
node_id = "J4"
title = "Converge dialect preprocessing and formatter recovery"
problem = "Dialect preprocessors, formatters, and framework style consumers need one recovery boundary for completed CSS results. Without it, callers can accept partially processed content, lose source-map lineage, or preserve obsolete unqualified preprocessing routes, risking incorrect generated styles and diagnostics."
expected_outcome = "The style owner exposes one completed, stage-qualified preprocessing result for compiler and editor consumers, with deterministic formatter recovery and no residual unqualified output path."
acceptance = ["Completed preprocessing results use `QualifiedStyleResult` and an exact `StyleStage`.", "Dialect, source identity, revision basis, diagnostics, and composed maps survive recovery deterministically.", "Partial, stale, cancelled, or mismatched results cannot enter downstream compilation.", "Style-owner-local unqualified preprocessing output and competing fallback routes are removed."]
[[issue]]
node_id = "CCA2D0"
title = "Add a stage-qualified external-style boundary"
problem = "Compiler style inputs can carry supplied or prepared CSS without proving the completed processing stage, source identity, revision basis, diagnostics, provenance, or map lineage. The compiler therefore cannot reliably reject stale, partial, or mismatched external-style results."
expected_outcome = "The compiler accepts one completed `QualifiedStyleResult` from the style owner and converts it into a staged compile artifact through immutable validation, without parsing or preprocessing CSS again."
acceptance = ["The continuation validates exact style stage, source and style identity, revision basis, provenance, diagnostics, and qualified maps.", "Wrong-stage, stale, partial, cancelled, duplicated, or mismatched results are rejected.", "Artifact conversion preserves bytes, diagnostics, provenance, source-unit relations, and source-map spaces deterministically.", "The boundary introduces no second CSS parser, framework-specific behavior, or production route migration."]
[[issue]]
node_id = "CCA2F"
title = "Expose staged artifacts through the compiler facade"
problem = "The compiler and session facades still expose SFC-shaped results and compatibility views that obscure the staged artifact, qualified style, custom-block, and work-attribution contracts. This leaves downstream consumers dependent on ambiguous compatibility routes unless one stable facade and explicit adapter-deletion owners are established."
expected_outcome = "The existing facade exposes the staged compile artifact and its qualified handoffs while retaining only three behavior-preserving adapters, each assigned to a production-capable downstream deletion owner."
acceptance = ["Compiler bytes, maps, diagnostics, and text-only behavior remain equivalent through the facade conversion.", "Generic session code contains no framework module topology or unqualified style continuation.", "Exactly three retained adapters remain and each has one downstream API authority and one production deletion owner.", "Facade execution performs no duplicate parse, plan, emit, assembly, copy, or work attribution."]
[[issue]]
node_id = "OPT0"
title = "Define a measured CSS compiler optimization plan"
problem = "CSS compilation lacks a maintainer-approved optimization strategy grounded in measured user benefit. Starting speculative optimization work without explicit goals, cost models, provenance, invalidation rules, and deterministic fallback risks slower builds, incorrect output, and benchmark-only behavior that cannot be trusted in production."
expected_outcome = "A maintainer-ratified CSS optimization proposal defines measurable goals, admissible analysis inputs, artifact identity, invalidation and cancellation behavior, deterministic fallback, resource limits, framework coverage, and evidence that compile cost is justified by runtime or code-size gains."
acceptance = ["The proposal names precise CSS optimization goals and measurable user-facing benefit.", "The design defines trusted analysis inputs, read-set validation, invalidation, cancellation, resource limits, and deterministic fallback.", "Artifact identity, provenance, reproducibility, security boundaries, and framework admission are explicit.", "Independent benchmarks compare compile cost with runtime or code-size benefit before implementation is authorized."]
[[issue]]
node_id = "BR0"
title = "Authorize successor product work after the architecture lock"
problem = "Follow-on product work has no explicit promotion boundary after the architecture is locked. Without maintainer-confirmed freeze removal and successor genesis, new work risks relying on contracts that are not yet stable or approved for extension."
expected_outcome = "Once the architecture lock is recorded, maintainers explicitly lift the repair freeze and authorize independent successor product work against the locked contracts."
acceptance = ["The final architecture lock is recorded before any successor work is authorized.", "The maintainer decision records both repair-freeze removal and authorization to begin successor development.", "Each successor product can be promoted independently after its own technical requirements are satisfied.", "Follow-on product work remains unavailable before the decision and becomes eligible after it.", "The promotion changes coordination records only and does not modify production code."]
[[issue]]
node_id = "G4"
title = "Converge semantic caching on bounded fact-validated storage"
problem = "Semantic results can be retained by split cache authorities, generation-only validity checks, and unbounded family slots. These paths risk stale reuse, conflicting ownership, and memory growth during long-lived project sessions."
expected_outcome = "`ProjectTypeStore` is the sole semantic cache authority, validates complete read facts, and retains a bounded number of candidates per family."
acceptance = ["`ProjectTypeStore` is the only production authority for the affected semantic results.", "Cache admission validates the complete `ReadSetSignature` through a `StoreViewValidationToken`.", "Each result family enforces a deterministic `candidate_cap` with bounded retention.", "Incremental reuse matches a fresh computation and rejected candidates cannot warm later queries.", "Duplicate cache ownership and generation-only validity routes are removed."]
[[issue]]
node_id = "G1"
title = "Make semantic query results depend only on declared facts"
problem = "Semantic queries can still depend on mixed ownership and ambient state that is absent from their keys and result contracts. This causes unreliable reuse, stale answers, and results that appear complete despite missing inputs."
expected_outcome = "Each semantic query declares all required facts, uses one authoritative execution path, and returns an explicit result contract that cannot misrepresent incomplete work."
acceptance = ["Query identity includes every fact that can change the result.", "Equivalent fact sets produce deterministic results independent of ambient session state.", "Incomplete, cancelled, or degraded computation cannot be admitted as a complete result.", "The affected compiler, session, and semantic paths use one query authority with no compatibility fallback.", "Incremental execution is equivalent to a fresh computation for the same facts."]
[[issue]]
node_id = "L1"
title = "Prove bounded memory under long-lived churn"
problem = "Short benchmarks can hide retained semantic candidates, snapshots, and publication state that accumulate during long-lived editor activity. This risks invisible memory growth that makes real workspaces progressively slow or unstable."
expected_outcome = "A representative long-lived workload reaches a measurable memory plateau while preserving valid output, equivalent work, and latency observations."
acceptance = ["The workload repeatedly changes, queries, and settles representative projects over an extended run.", "RSS and retained-state measurements reach a defined plateau rather than growing with request count.", "Every measured sample preserves valid output and diagnostic equivalence.", "The evidence reports work counts, latency distribution, allocation behavior, and memory retention together.", "The soak identifies retained owners when memory does not plateau."]
[[issue]]
node_id = "L2"
title = "Make the final performance decision from equivalent work"
problem = "Wall-clock comparisons alone can reward skipped work, invalid output, or different request populations. That makes the final performance decision unreliable and can conceal regressions in allocation, latency tails, or memory retention."
expected_outcome = "The performance decision compares valid equivalent workloads and records an explicit conclusion from work counts, latency, allocations, and RSS evidence."
acceptance = ["Compared candidates execute the same request population and produce equivalent valid outputs.", "The decision includes exact-work counters alongside latency distributions, allocations, and RSS.", "Warm and incremental measurements disclose cache state and remain comparable to fresh execution.", "Any regression or divergence is explained before a final conclusion is recorded.", "Wall-clock-only or invalid-output wins are rejected."]
[[issue]]
node_id = "L3"
title = "Apply only evidence-backed micro-optimizations"
problem = "Residual hot paths may remain after the architecture is stable, but speculative tuning risks obscuring ownership or trading correctness for benchmark noise. Optional optimization must therefore target measured work without changing public behavior."
expected_outcome = "A measured residual hotspot is reduced with unchanged outputs, ownership, and memory behavior, or the work closes with evidence that no safe optimization is warranted."
acceptance = ["A specific hotspot is identified from exact-work, latency, allocation, or RSS evidence.", "The change reduces the measured cost on an equivalent valid workload.", "Outputs, diagnostics, source maps, cancellation, and incremental behavior remain unchanged.", "No new cache authority, fallback path, or cross-system ownership is introduced.", "If no safe improvement is demonstrated, no production optimization is retained."]
[[issue]]
node_id = "L4"
title = "Lock the validated runtime architecture"
problem = "The runtime architecture cannot be treated as stable while competing authorities, invalid-output performance claims, or unexplained memory and latency regressions remain. Leaving those questions open risks future work building on ambiguous ownership and unbounded behavior."
expected_outcome = "The validated architecture is declared stable with sole ownership, equivalent-work correctness, and bounded performance characteristics documented across the affected runtime surfaces."
acceptance = ["All affected runtime responsibilities have one production owner with no compatibility fallback.", "Equivalent fresh and incremental workloads produce matching valid outputs and diagnostics.", "Latency, allocation, exact-work, and RSS evidence contains no unexplained regression.", "Memory retention remains bounded under long-lived churn.", "The architecture record reflects the final public and internal ownership boundaries."]
