[[issue]]
node_id = "CCA1O1A"
title = "Decide Svelte custom-element property types in one place"
problem = "Three separate places decide which custom-element property types a Svelte compile may request: the transport schema, the conversion layer that renames them, and the compiler's own emission path. The compile request itself accepts any string, so an invalid type travels inside an accepted request until emission rejects it. Adding a sixth type leaves the external bindings tighter than the compiler until their own list changes, and callers see the same bad input rejected by a different layer depending on how they entered."
expected_outcome = "One admission check, performed where the compile request is built, converts a requested property type into a closed value. It accepts each type in both the lowercase spelling the transport takes today and the capitalised spelling the compiler API takes today. An accepted request cannot carry an invalid type, transports forward the caller's spelling without owning the vocabulary, and every entry point reports the same rejection for the same input."
acceptance = ["Exactly one membership check over the property-type vocabulary exists; neither the transport layer nor the emission path can reject a property type.", "A built compile request cannot hold an unrecognised property type, so nothing downstream can observe one.", "An unrecognised property type is rejected with the same option identity and the same offending value from the direct compiler API and from the native and browser bindings.", "The accepted vocabulary is exactly ten spellings — `string`, `boolean`, `number`, `array`, `object` and `String`, `Boolean`, `Number`, `Array`, `Object` — so every spelling accepted today is still accepted and any other casing, such as `STRING`, is rejected.", "Generated custom-element output is byte-identical, because both spellings of a type render identically.", "Adding a sixth property type, in both of its spellings, requires editing one place."]
[[issue]]
node_id = "CCA1O2H"
title = "Reject unknown request properties set to undefined in the native binding"
problem = "The native binding reads a JavaScript compile request by materialising it into a generic value, and that step drops any own property whose value is `undefined` before the closed schema can see it. A caller who writes another framework's option with an `undefined` value is therefore accepted instead of rejected, while the browser binding rejects the same payload. The published native declaration states that every request object is closed, so the documented rule is incorrect for that whole class of input."
expected_outcome = "Reading a request enumerates every own enumerable property and preserves an `undefined`-valued one, so the closed schema decides. An unknown or cross-framework property is rejected regardless of its value, a known optional property set to `undefined` still reads as absent, and both bindings agree on what they accept."
