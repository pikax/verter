[[issue]]
node_id = "GH0"
title = "Keep GitHub issue synchronization explicit and one-way"
problem = "GitHub coordination can become unreliable when issue text, labels, and lifecycle fields are treated as a second source of implementation truth. This creates competing representations, leaves maintainers unsure which state is authoritative, and risks overwriting useful issue discussion with machine-oriented planning data. The repository needs a small, explicit synchronization boundary that keeps local mappings authoritative while preserving GitHub as a readable collaboration surface."
expected_outcome = "Issue synchronization runs only when requested, creates or updates project-owned coordination fields deterministically, and never imports GitHub state into implementation authority. Existing issue prose remains stable during normal synchronization, protected issues remain untouched, and partial external writes are reported with enough identity for safe repair."
acceptance = ["A local mapping is the only node-to-issue identity and does not mark implementation complete.", "Normal synchronization preserves existing issue title, body, comments, and unrelated labels.", "Protected mappings receive no issue or Project mutation from synchronization.", "Every successful external mutation remains visible when a later operation fails."]

[[issue]]
node_id = "B4R0"
title = "Keep source-unit identity stable across revisions and mappings"
problem = "Source units can still be identified through constructors and mapping keys that vary with a revision or collapse to a path-only alias. This can make caches, source maps, compiler output, and session state treat one logical source as several unrelated units—or treat distinct revisions as the same unit—causing stale results and misattributed diagnostics. The identity boundary needs to distinguish stable lineage from the content and mapping changes that occur within that lineage."
expected_outcome = "A source unit keeps one stable logical identity while revision, content, and source-map revisions change independently. The identity, compiler, and session layers use those separate values consistently, so cached and published results retain deterministic provenance without path-only or revision-derived aliases."
acceptance = ["Changing source content or map data does not replace the logical source-unit identity.", "Revision-derived source-unit constructors and path-only lineage aliases are unavailable to production callers.", "Compiler and session mapping keys preserve separate source, revision, content, and map identities.", "Identity and session coverage demonstrates deterministic lookup and provenance across repeated revisions."]

[[issue]]
node_id = "J2"
title = "Qualify style results with stable identity and ownership"
problem = "Style consumers and external preprocessing glue can pass CSS results without a complete stage, source identity, revision basis, provenance, or qualified source map. That makes stale or mismatched preprocessing results difficult to reject and allows multiple components to behave as competing style authorities."
expected_outcome = "The CSS owner publishes one qualified style-result contract with stable source and style identities, explicit processing stage, deterministic diagnostics and dependencies, and owner-specific adapters for compiler and editor consumers."
acceptance = ["Qualified style results bind stage, source and style identity, revision basis, provenance, diagnostics, dependencies, and source maps.", "Consumers cannot admit unqualified or stale preprocessor output.", "CSS parsing and preprocessing have one production authority with no competing fallback route.", "Compiler and editor consumers preserve deterministic output and provenance through owner-specific adapters."]

[[issue]]
node_id = "J3"
title = "Converge shared CSS plans and terminal materialization"
problem = "CSS consumers can independently rediscover structure or materialize output through owner-specific paths, causing duplicate parsing, inconsistent diagnostics, and source-map divergence. Shared plans need one bounded path from qualified style facts to terminal output."
expected_outcome = "Qualified style facts feed reusable shared CSS plans and one deterministic terminal materialization boundary without introducing a second parser or unqualified result path."
acceptance = ["Shared CSS plans preserve qualified identity, stage, dependencies, diagnostics, and map provenance.", "Terminal materialization is deterministic and rejects incomplete or mismatched inputs.", "No consumer performs a competing CSS parse or retains an unqualified preprocessing fallback.", "Applicable reuse avoids duplicate parsing or materialization while absent work remains zero-work."]

[[issue]]
node_id = "J4"
title = "Converge dialect preprocessing and formatter recovery"
problem = "Dialect preprocessors, formatters, and framework style consumers need one recovery boundary for completed CSS results. Without it, callers can accept partially processed content, lose source-map lineage, or preserve obsolete unqualified preprocessing routes, risking incorrect generated styles and diagnostics."
expected_outcome = "The style owner exposes one completed, stage-qualified preprocessing result for compiler and editor consumers, with deterministic formatter recovery and no residual unqualified output path."
acceptance = ["Completed preprocessing results use `QualifiedStyleResult` and an exact `StyleStage`.", "Dialect, source identity, revision basis, diagnostics, and composed maps survive recovery deterministically.", "Partial, stale, cancelled, or mismatched results cannot enter downstream compilation.", "Style-owner-local unqualified preprocessing output and competing fallback routes are removed."]

[[issue]]
node_id = "CCA2D0"
title = "Add a stage-qualified external-style boundary"
problem = "Compiler style inputs can carry supplied or prepared CSS without proving the completed processing stage, source identity, revision basis, diagnostics, provenance, or map lineage. The compiler therefore cannot reliably reject stale, partial, or mismatched external-style results."
expected_outcome = "The compiler accepts one completed `QualifiedStyleResult` from the style owner and converts it into a staged compile artifact through immutable validation, without parsing or preprocessing CSS again."
acceptance = ["The continuation validates exact style stage, source and style identity, revision basis, provenance, diagnostics, and qualified maps.", "Wrong-stage, stale, partial, cancelled, duplicated, or mismatched results are rejected.", "Artifact conversion preserves bytes, diagnostics, provenance, source-unit relations, and source-map spaces deterministically.", "The boundary introduces no second CSS parser, framework-specific behavior, or production route migration."]

[[issue]]
node_id = "CCA2F"
title = "Expose staged artifacts through the compiler facade"
problem = "The compiler and session facades still expose SFC-shaped results and compatibility views that obscure the staged artifact, qualified style, custom-block, and work-attribution contracts. This leaves downstream consumers dependent on ambiguous compatibility routes unless one stable facade and explicit adapter-deletion owners are established."
expected_outcome = "The existing facade exposes the staged compile artifact and its qualified handoffs while retaining only three behavior-preserving adapters, each assigned to a production-capable downstream deletion owner."
acceptance = ["Compiler bytes, maps, diagnostics, and text-only behavior remain equivalent through the facade conversion.", "Generic session code contains no framework module topology or unqualified style continuation.", "Exactly three retained adapters remain and each has one downstream API authority and one production deletion owner.", "Facade execution performs no duplicate parse, plan, emit, assembly, copy, or work attribution."]

[[issue]]
node_id = "CCA1M2"
title = "Delegate compatibility bundle runtime construction to typed runtime backends"
problem = "The Vue and Svelte compatibility bundle compilers still construct runtime output through their own internal code paths even though typed per-framework runtime backends now exist. Two parallel runtime constructions for the same framework risk drifting apart in output, refusal classification, and diagnostics, and every runtime fix must be applied twice. Maintainers cannot yet trust the typed backends as the single runtime implementation."
expected_outcome = "Both compatibility bundle compilers delegate runtime construction to their framework's typed runtime backend, making it the only runtime implementation behind the existing host routes, while the two host entry calls themselves remain unchanged."
acceptance = ["The Vue compatibility bundle implementation produces runtime output through the typed Vue runtime backend.", "The Svelte compatibility bundle implementation produces runtime output through the typed Svelte runtime backend, including its runtime refusal outcomes.", "Runtime bytes, source maps, diagnostics, and refusal classification remain equivalent for both frameworks.", "Both existing host bundle entry calls remain present and unchanged.", "No legacy internal runtime construction remains in either compatibility implementation."]

[[issue]]
node_id = "CCA1M3"
title = "Characterize the fixed-Vue runtime-render route on delegated backends"
problem = "The runtime-render host route builds a Vue-shaped compile request unconditionally, so a Svelte component on that route silently loses its Svelte-specific options while still compiling through the Svelte carrier. This degraded behavior is currently unpinned by tests, so a later routing change risks altering it invisibly, and render parity after the backend delegation change is unproven."
expected_outcome = "The runtime-render route is proven equivalent on top of the delegated compatibility backends, keeps its single host entry call, and the current Svelte degradation is pinned by characterization tests as explicitly transitional behavior."
acceptance = ["Render output, source maps, diagnostics, and refusal classification remain equivalent through the delegated Vue compatibility implementation.", "Characterization tests pin the current Svelte behavior on the render route, including the collapsed Svelte options.", "Exactly one runtime-render host bundle entry call remains and the host-backed entry call is untouched.", "No new framework selector or compatibility-backend change is introduced."]

[[issue]]
node_id = "CCA1M"
title = "Confirm runtime compilation routes converge on typed backends"
problem = "Three separate migrations move runtime construction onto typed runtime backends: the direct/batch compiler entrypoints, the compatibility bundle internals, and the runtime-render route. Without one convergence check, a missed route or a duplicated deletion could leave two runtime implementations alive or delete a branch twice, and the overlap would only surface much later as output drift."
expected_outcome = "One verification pass confirms every runtime route uses typed runtime backends, compatibility-internal runtime construction had exactly one deletion owner, and exactly the two known host bundle entry calls remain."
acceptance = ["Direct, prepared, and batch compiler routes use typed runtime backends only.", "No legacy internal runtime construction remains in either compatibility bundle implementation.", "Exactly two host bundle entry calls remain: the host-backed route and the runtime-render route.", "No route performs duplicate parse, semantic, runtime, or assembly work."]

[[issue]]
node_id = "CCA1N1"
title = "Add the Vue host-integration backend with demand-specific admission"
problem = "Vue host compilation is coordinated by generic session code that assembles Vue-specific prerequisites, macro input, diagnostics, and publication inline. There is no Vue-owned integration point that can admit a request for a specific demand, so per-demand capability checks and atomic refusal rules stay spread across the session, causing duplicated coordination that new routes cannot reuse."
expected_outcome = "A Vue host-integration backend owns Vue request topology and issues demand-specific compile admission for both the multi-product and render-only demands, behind the existing routes, without becoming the production selector yet."
acceptance = ["The Vue backend issues distinct admissions for the multi-product and render-only demands, and product backends only consume them.", "A render-only demand does not require projection capability, and a missing runtime capability yields a typed unavailability rather than any fallback.", "One admitted request shares one prerequisite population with no duplicate parse, semantic, projection, or emit pass.", "Refusal remains atomic: no sibling product publishes after a runtime refusal.", "Both existing production routes still use their current adapters in this change."]

[[issue]]
node_id = "CCA1N2"
title = "Add the Svelte host-integration backend with demand-specific admission"
problem = "Svelte host compilation has no framework-owned integration point: generic session code coordinates its prerequisites, self-contained module handoff, style side-products, and refusal classification. Demand-specific admission and typed capability checks cannot be expressed for Svelte, which prevents giving Svelte a first-class render route."
expected_outcome = "A Svelte host-integration backend owns Svelte request topology symmetrically with Vue — multi-product and render-only demands, self-contained Main, and requested style side-products from one admitted population — while remaining unused by the production render route until its cutover."
acceptance = ["The Svelte backend issues distinct admissions for the multi-product and render-only demands, and product backends only consume them.", "Main plus requested style side-products come from one admitted population without a second compile.", "A missing runtime capability yields a typed unavailability rather than a fallback to another lane or framework.", "Refusal remains atomic and diagnostics keep deterministic classification and order.", "The production Svelte render behavior is unchanged in this change."]

[[issue]]
node_id = "CCA1N2A"
title = "Add a sealed request-scoped native host binding"
problem = "Host compile routes classify a file's framework independently at several points — request construction and macro preparation each re-derive it. Repeated classification risks disagreeing across one request's lifetime, and nothing ties a request's framework identity to the exact source snapshot and catalog row it was derived from."
expected_outcome = "A sealed request-scoped binding type maps registered catalog identity to exactly one framework-specific host binding for one immutable source snapshot, with guarded construction and typed unavailability, ready for later production adoption but unused by any route yet."
acceptance = ["One guarded constructor derives the binding solely from registered catalog identity and an immutable snapshot witness.", "The binding cannot be cloned, serialized, or stored, and carries no general capability or service access.", "Cross-framework, stale-snapshot, and epoch-mismatched construction fail closed with typed outcomes.", "No production route consumes the binding in this change."]

[[issue]]
node_id = "CCA1N2B"
title = "Bind framework identity once per host compile request"
problem = "Each host compile request still selects its framework more than once: an is-Vue classification in the pipeline and a framework fork in request construction. These independent selections risk disagreeing, are impossible to audit as one decision, and prevent any route from trusting a single framework identity."
expected_outcome = "Every host compile request creates exactly one sealed framework binding from its immutable snapshot at one production site, both existing routes consume that binding, and the displaced downstream classifier branches are deleted while both host bundle entry calls remain."
acceptance = ["Exactly one production site binds framework identity per host compile request.", "The displaced is-Vue classification and request-construction fork are gone.", "Both existing host bundle entry calls remain and route behavior stays equivalent for both frameworks.", "Stale-generation, identity-mismatch, epoch-mismatch, and duplicate-consumption cases fail closed without publishing.", "Binding adds no parse, semantic, runtime, assembly, or copy work."]

[[issue]]
node_id = "CCA1N3"
title = "Cut host-backed compilation over to bound framework backends"
problem = "The generic host-backed compile transaction still executes through the combined compatibility bundle call instead of the framework's host-integration backend. Demand-specific admission and framework-owned request topology therefore cannot govern the main multi-product route, leaving its committed route records describing the legacy call rather than the executed path."
expected_outcome = "The host-backed transaction consumes the request-scoped framework binding, executes through the selected host-integration backend under demand-specific admission, deletes its outer compatibility bundle call, and its route records describe the executed bound topology, with runtime-render untouched."
acceptance = ["The host-backed compatibility bundle call is gone and the lane executes through the bound framework host backend.", "Cache, fact, publication, refusal atomicity, and fresh/warm/incremental behavior remain equivalent.", "No framework selector remains on the host-backed lane.", "Route and audit records match the executed route, including the host-backed batch route.", "Runtime-render behavior is not modified."]

[[issue]]
node_id = "CCA1N4"
title = "Cut runtime-render over to bound framework backends"
problem = "The runtime-render route is hardcoded to build Vue-shaped requests, so a Svelte component on that route silently loses its Svelte options, and the route executes through the compatibility bundle call rather than a framework-owned backend. Render consumers receive incorrect Svelte output instead of typed unavailability, and the lane's route records stay untruthful."
expected_outcome = "The runtime-render lane consumes the request-scoped framework binding and executes both Vue and Svelte through their host-integration backends under demand-specific admission, deleting its outer compatibility bundle call and the fixed-Vue construction, with truthful render route and audit records."
acceptance = ["Vue render output, maps, and diagnostics remain equivalent; Svelte render output honors the exact requested style policy.", "The runtime-render compatibility bundle call and every fixed-framework selection on the lane are gone.", "A missing runtime or host capability yields typed unavailability with no fallback to the host-backed lane.", "One render request performs one admitted population; Main plus requested style side-products need no second compile.", "The host-backed entry call is untouched and render route/audit records match the executed route."]

[[issue]]
node_id = "CCA1N4A"
title = "Stop a committed route record from claiming verification it does not have"
problem = "The session crate commits a product-surface inventory describing how each host compile route executes and how that description is kept honest. The runtime-render entry closes by asserting that its route string is equality-checked against structured observations by two named behavioral test suites. Neither suite opens the file: the inventory has one consumer, which embeds it as a string and asserts only that each route description is non-empty. A maintainer who changes that route therefore believes a stale description would fail a test, skips checking it, and the record silently drifts away from the code it claims to document."
expected_outcome = "The record states only the coverage that exists. Its route prose is presented as derived from structured observations that behavioral suites do assert, with no claim that any test compares the prose itself, so a reader can tell at a glance which parts of the description are machine-checked and which need manual review after a route change."
acceptance = ["No sentence in the record claims a comparison or equality check that no test performs.", "A test suite is credited only with behavior it actually covers, never with reading a file it never opens.", "The runtime-render and host-backed entries describe their verification in the same, consistent terms.", "The structured observations, executed route, products, axes, and aliases are unchanged and the inventory still parses for its consumer.", "No test, executed route, or user-visible behavior changes."]

[[issue]]
node_id = "CCA1N3A"
title = "Prepare a component's compile inputs inside the framework branch that uses them"
problem = "The session's multi-product compile route is meant to be framework-neutral: it checks that a file has a usable parse, then hands the request to whichever framework backend owns that file. Today it does Vue-specific work first. It runs the Vue cross-file type producer, rewrites the file's cross-file dependency record from that producer's result, and aborts the whole compile on Vue dependency errors — all before any backend is called — then builds a Vue-only input bundle for every component regardless of its framework. A Svelte component can never reach that abort, so a shared code path silently means two different things depending on the file. That leaves the neutral route carrying one framework's semantics and causes every change to Vue's cross-file input handling to be made in code every other framework also executes."
expected_outcome = "The route decides its framework branch first and each branch prepares only its own compile inputs: it resolves the cross-file types its own backend reads, restates that file's dependency record, and refuses on its own dependency errors. The shared route carries no framework-specific input value at all, so one framework's preparation and refusal are unreachable from another framework's request."
acceptance = ["The framework branch is selected before any framework-specific input preparation, producer call, or refusal runs.", "Each framework branch alone prepares its own compile inputs and raises its own dependency errors; the shared route can no longer construct or pass any of them.", "Each branch restates the compiled file's dependency record exactly once, and does so before its own refusal, so a compile that fails on a missing cross-file type is still re-run once that type is fixed.", "A request rejected on a shared precondition performs no framework work and leaves the dependency record untouched.", "One framework binding and one backend execution still occur per request, with unchanged diagnostics, source maps, published output, and compiled bytes for both Vue and Svelte."]

[[issue]]
node_id = "CCA1N"
title = "Confirm native host routes converge on single-binding backends"
problem = "Two separate cutovers move the host-backed and runtime-render lanes onto bound framework host backends. Without one convergence check, a leftover compatibility call, a residual framework selector, or an absorbed third route risks surviving both landings and silently keeping a second execution path alive."
expected_outcome = "One verification pass confirms both former compatibility bundle calls are gone, framework identity binds exactly once per request, host backends alone own framework topology and admission, and no fallback or third route was absorbed."
acceptance = ["Zero session compatibility bundle calls remain in the two migrated populations.", "Exactly one framework binding occurs per host compile request and neither lane contains a framework selector.", "Vue and Svelte host backends are the only admission issuers and product backends only consume admission.", "No compatibility fallback remains and route records describe the executed topology."]

[[issue]]
node_id = "CCA1N2G"
title = "Select carrier grammar from registered identity"
problem = "Shared source ingestion picks a carrier's template grammar with a hardcoded Vue-else-Svelte fallthrough. Any carrier that is not Vue silently receives Svelte grammar, so a future registered adapter would be parsed incorrectly by default, and the branch duplicates framework knowledge that the registered catalog already owns."
expected_outcome = "Source ingestion derives each carrier's grammar from its registered catalog/descriptor row, so every parse uses the grammar its adapter registered and an unregistered or grammar-less carrier fails closed instead of inheriting another framework's grammar."
acceptance = ["No framework fallthrough remains in source-ingestion grammar selection.", "Vue and Svelte parses keep byte-identical grammar behavior, output, and diagnostics.", "An unregistered carrier or a row without grammar facts fails closed with a typed outcome.", "The lookup is a registered-fact read that adds no parse or resolve work."]
