[[issue]]
node_id = "CCA1O2I"
title = "Generate the native compile-request TypeScript declarations from Rust"
problem = "The TypeScript declarations describing the native compile request are written by hand beside the Rust schema that actually decodes it. Nothing binds a nested Rust variant, field, optional slot or string union to the published declaration, so a change on either side can leave the two out of step with nothing failing. Callers then type-check against a shape the decoder rejects, or trust a slot the schema no longer accepts."
expected_outcome = "The compile-request portion of the published declarations is produced from the Rust declarations themselves and committed, with a check that re-renders it and compares exact bytes. Drift between the two sides fails automatically, and the surrounding hand-written host declarations stay hand-written and uncompared."
technical_context = ["Generation reads structural metadata attached to the Rust declarations; it never recovers shapes by searching source text for names.", "Only the compile-request section is generated; the rest of the published host declarations are unrelated host and session APIs."]
acceptance = ["Every published compile-request type comes from the generated file and no hand-written duplicate remains.", "Changing a Rust field, variant, optional slot or string union without regenerating fails the check.", "The check is shown to discriminate: a deliberate structural change to a Rust declaration turns it red.", "Unrelated host declarations in the same published file are neither generated nor byte-compared.", "The published package ships both the generated source and its emitted declaration."]
[[issue]]
node_id = "CCA1O3C"
title = "Actually run the browser-boundary tests for the WebAssembly binding"
problem = "The WebAssembly binding has tests that drive its JavaScript entry point with a real object graph, proving an unknown or cross-framework property is rejected where a browser caller meets it. Those tests compile but never execute: the canonical test run covers no WebAssembly target, and continuous integration only builds and lints it. A regression at that boundary cannot fail anything and ships green, and the test file says so in its own source."
expected_outcome = "One required lane inside the canonical test run executes the WebAssembly boundary tests on every real invocation. It discovers cases from the source tree, and a missing toolchain, a missing runner, zero discovered cases, a skipped lane, or a missing final result is a failure rather than a quiet pass."
acceptance = ["Both the ordinary and the exhaustive canonical run execute the lane and report a final per-lane result.", "The lane reports a non-zero discovered case count derived from the source tree, and zero discovered cases is a failure.", "A newly added boundary test in a file the lane has never seen is executed without editing any list of filenames.", "A deliberate weakening of a rejection at the JavaScript boundary turns the run red.", "A missing toolchain or runner reports the exact missing prerequisite instead of skipping.", "Continuous integration provisions that toolchain and pinned runner for the job that already runs the canonical suite."]
[[issue]]
node_id = "CPER0M"
title = "Make the native memory-audit peak consistent with its live counter"
problem = "The native memory audit reports live heap bytes and a high-water mark, documented so the peak can never trail the live value. The allocator publishes the two counters in separate steps: it adds to live bytes first and advances the peak afterwards. A snapshot taken between those steps returns a peak below the live value it just read, so the documented guarantee is incorrect under concurrency. Re-arming the high-water mark has the same shape and can lose a concurrent allocation from the new window."
expected_outcome = "Every snapshot the native surface returns satisfies the documented relationship between the peak and the live value, under concurrent allocation and across a high-water re-arm. The disabled default path keeps its single cached atomic load and branch, and the reported field names, units and epoch semantics are unchanged."
acceptance = ["A test driving concurrent allocation and snapshotting observes no snapshot whose peak trails its live value, and fails against the current publication order.", "Re-arming the high-water mark cannot lose a concurrent allocation from the new window, and snapshots taken during a re-arm still hold the relationship.", "Enabling the audit still starts a fresh counter epoch, and the first snapshot after it holds the relationship.", "The disabled path performs the same per-allocation work as before, with no lock or extra bookkeeping.", "Live bytes stay exact across allocation, deallocation and reallocation, including the negative pre-epoch case."]
[[issue]]
node_id = "CCA1O1B"
title = "Let callers run a typed compile request against the session host"
problem = "The typed compile request exists only as a schema and a converter: nothing in the compiler session can execute one. Every session compile route still derives the work it does from the older untyped compile profile, so there is no entry a caller can hand a typed request to. A binding that decoded a typed request would have to convert it back into a profile in order to run it, which reinstates the untyped vocabulary one layer down, drops any demand the profile cannot express, and prevents every consumer from moving onto the typed request at all."
expected_outcome = "The session host exposes one call that takes a file's canonical id and a typed compile request for an already registered source, runs it through the existing framework host integration, and returns a typed response carrying that id, diagnostics, and one row per requested product in request order. The typed request stays the demand document end to end: nothing on that route rebuilds a compile profile from it. A batch form returns one entry per input in the original input order."
acceptance = ["A caller registers a source once and then executes one typed request against it in a single call, and no compile profile is constructed anywhere on that route.", "Every requested product the host can produce comes back in request order and is byte-equivalent to what the existing route produces for the same demand.", "A request whose framework contradicts the registered carrier is refused instead of being compiled under the registered one.", "A refusal fails the whole request and publishes no sibling product; no partial result, null, or boolean success flag is observable.", "The batch form registers each source exactly once, returns one entry per input in the original order, and isolates a per-input failure to that entry.", "The existing compile calls keep their current behavior and their tests."]
[[issue]]
node_id = "CCA1O2J"
title = "Expose the typed compile request to native addon callers"
problem = "The native addon's typed compile request and its decoder exist as Rust types that the addon only re-exports; no callable host method accepts one. Every callable native compile method still takes the older compile profile, and the published declarations say so. A JavaScript caller therefore cannot reach the typed request at all, so the tightened property checking and the generated declarations that describe it guard a route nothing can execute, and that prevents every native consumer from moving onto it."
expected_outcome = "The native host object gains one callable typed compile method and one typed batch method. A caller registers a source once and then executes one typed request against it in a single call; the batch form takes one entry per input carrying its source beside its typed request and returns one entry per input in the original order. The older profile-bearing methods stay exactly as they are."
acceptance = ["Both routes appear in the generated addon declarations and are callable from JavaScript, and tests invoke them over real JavaScript objects rather than Rust fixtures.", "One source registration followed by one typed call returns the requested products for both supported carriers, with no additional native call and no source copied into the request.", "The batch route registers each entry's source exactly once, preserves input order, and isolates a per-entry failure to that entry.", "Output bytes, source maps, diagnostics, file ids and published offsets match the existing route for the same work.", "An unknown or foreign-framework property is rejected on these routes whatever its value.", "A rejection throws or fails only that entry, never returning a partial result, a null, or a boolean."]
[[issue]]
node_id = "CCA1O3D"
title = "Expose the typed compile request to browser callers"
problem = "The browser binding's typed compile-request decoders are ordinary Rust functions with no binding annotation, so they are reachable from Rust tests and from nothing else. The generated JavaScript surface exports no typed compile entry and the package wrapper declares only the older profile-bearing pair, so no browser caller can reach the typed request. One decoder could not be exported as written at all, because its second parameter is a Rust reference with no representation across the boundary. This prevents every browser consumer from moving onto the typed request, and the existing tests prove decoding inside Rust rather than callability from JavaScript."
expected_outcome = "The browser host object gains one callable typed compile method on its generated JavaScript surface, and the package wrapper declares and forwards it. A caller registers a source once, then executes one typed request against it in a single call and receives the typed response. The older profile-bearing methods stay exactly as they are."
acceptance = ["The typed compile method is present in the generated browser declarations and callable on the generated object, and a test invokes it from JavaScript rather than from Rust.", "One source registration followed by one typed call returns the requested products for both supported carriers, with no additional call and no source copied into the request.", "Output bytes, source maps, diagnostics, file ids and JavaScript string offsets match the existing route for the same work.", "An unknown or foreign-framework property is rejected on this route exactly as on the existing decode boundary.", "A rejection throws instead of returning a partial result, a null, or a boolean.", "The existing profile-bearing methods keep their declarations, behavior and tests."]
[[issue]]
node_id = "CCA1O3E"
title = "Check the committed browser carrier snapshot against the built artifact"
problem = "A committed JSON snapshot of real browser-host output backs several editor guards, but nothing compares it against the host any more. The capture script only writes and has no comparison mode, so its bytes refresh only when someone remembers to run it, and they are now hundreds of commits behind. The guards deliberately load the committed file, and the one assertion that calls itself a freshness check merely inspects generated file names. A compiler-output change therefore leaves the snapshot stale while every consuming guard stays green, so those guards assert yesterday's output. The capture also passes a compile option to source registration that registration never declared, so it is silently discarded."
expected_outcome = "The snapshot is regenerated from the currently built browser artifact, and the capture script gains a deterministic renderer plus a comparison mode that re-renders and compares without writing. A package command runs the comparison, and continuous integration runs it immediately after the browser artifact is built, so a compiler-output change that arrives without a regenerated snapshot fails instead of passing quietly."
acceptance = ["The committed snapshot is byte-identical to what the comparison renders from the currently built artifact, and every committed byte comes from a capture run rather than an edit.", "The comparison is shown to discriminate: it fails against the snapshot as committed today and passes after regeneration.", "Rendering twice from the same artifact produces identical bytes, so the comparison cannot fail on ordering or formatting alone.", "Running the comparison writes nothing, whether it passes or fails.", "Continuous integration runs the comparison after the browser artifact is built, and a difference fails that job.", "The capture's source registration no longer passes the discarded compile option, and the consuming guards keep their existing assertions."]
[[issue]]
node_id = "CVO0"
title = "Classify probe failures with one typed outcome contract"
problem = "Validation and workload tooling can collapse every failure into generic states such as empty output or failed, which hides whether the compiler, the harness, a malformed product, a comparator, or a runtime or source-map comparison actually failed. Known future gaps then either turn required CI red or silently disappear inside a generic pass/fail signal."
expected_outcome = "One shared contract gives every probe and comparison tool a closed set of actionable outcome classes with deterministic causal ordering, plus a machine-readable probe-state manifest whose entries declare gate, canary, known-fail, or skip expectations, named implementation owners for deferred behavior, and pinned external revisions."
acceptance = ["No generic failure state can hide a more specific compiler, harness, product, comparator, runtime, or source-map outcome.", "Ordering rules are total: harness failure precedes diagnostics, diagnostics precede product validity, a timeout never satisfies an expected refusal.", "Every manifest entry carries a stable probe id, expected state, expected outcome class where applicable, named implementation owner for deferred or skipped behavior, terse reason, and pinned external revision where applicable.", "An unexpected pass of a known failure surfaces as XPASS promotion candidate, and an unrelated new failure class surfaces as a new regression.", "The contract requires no compiler semantic change and derives no semantics from external fixture output."]
[[issue]]
node_id = "CVO1"
title = "Probe pinned real Vue workloads in CI with classified outcomes"
problem = "Nothing continuously exercises Verter against representative real Vue projects, so real-workload regressions surface late, failures stay unclassified, and deferred gaps cannot be distinguished from fresh regressions. Per-fixture test jobs would multiply CI cost without adding classification discipline."
expected_outcome = "A bounded, table-driven CI lane runs one pinned pikax/vue-benchmarks revision through normal public compiler request routes, classifies every case with the shared outcome taxonomy, and emits one compact machine-readable summary plus a small deterministic PR smoke slice."
acceptance = ["One pinned corpus revision and one deterministic representative slice run with stable case ids and no per-fixture CI jobs.", "The summary artifact reports attempted, passed, gated regressions, canary and known failures by outcome class, skips, XPASS candidates, crashes, timeouts, and harness failures.", "Pull requests run a smoke slice of at most 24 cases as one job with one request per case, enough to detect broken compiler or host integration; elapsed time is reported only as an observation.", "A failing case owned by a named future owner is recorded with its owner and kept canary, known-fail, or skip; no compiler behavior is repaired from this lane.", "The corpus is treated as evidence about Verter behavior, never as an oracle, golden source, or expected-output authority."]
[[issue]]
node_id = "CVO1S"
title = "Probe pinned real Svelte workloads through the same CI lane"
problem = "Svelte is a first-class Verter target, but a Vue-only workload lane would leave Svelte regressions to surface late and would bias every observation and promotion decision toward one framework. A second Svelte-specific runner or summary would double the machinery the lane must prove cannot false-green."
expected_outcome = "The existing Vue workload lane runs one pinned pikax/svelte-benchmarks revision through normal public compiler request routes with framework as a case attribute, classifies every Svelte case with the shared taxonomy, and reports it in the same summary artifact with per-framework counters."
acceptance = ["One pinned svelte-benchmarks revision and one deterministic representative slice run with stable svelte case ids through the existing runner; no Svelte-specific runner, manifest schema, summary format, or per-fixture CI job exists.", "Per-framework counters in the summary artifact sum to the totals; the combined Vue plus Svelte smoke inventory is non-empty per framework, has at most 48 cases, runs as exactly one probe job with one request per case, and reports elapsed time only as an observation.", "A Svelte failure owned by a named future owner is recorded with that owner as canary, known-fail, or skip; a runner defect exposed by Svelte inputs is repaired in this lane without compiler changes."]
technical_context = ["Reuses the Vue lane's framework-neutral runner, manifest, and summary.", "Deferred Svelte behavior belongs to the Svelte compiler and style owners, never to this lane."]
[[issue]]
node_id = "CVO2"
title = "Record non-gating benchmark observations for probed workloads"
problem = "Benchmark numbers from probed workloads are not recorded anywhere, which leaves later performance work with no historical evidence and no reproducibility context, and risks treating a timing as evidence of equivalent work when the case it measured was only partially correct."
expected_outcome = "The probe lane additionally produces correctness-labeled benchmark observation artifacts with full reproducibility metadata, recorded as observations only, with no thresholds, rebaselines, or performance gates."
acceptance = ["Cold, warm, throughput, benchmark-suite native statistics, and workload size are captured where existing infrastructure supports them, and memory data only through the trustworthy existing measurement path.", "Every artifact identifies Verter commit, external workload revision, toolchain versions, runner OS and architecture, execution mode, warm or cold state, sample count, and relevant compiler options.", "Every result retains its correctness status, and non-correctness-equivalent workloads are marked ineligible for equivalent-work ranking.", "No threshold, rebaseline rule, or optimization obligation is introduced; numeric adoption stays with the performance authority."]
[[issue]]
node_id = "CVO3"
title = "Prove the validation machinery cannot silently false-green"
problem = "Classification, timeout handling, comparators, and canary logic can each fail in ways that make CI report success while the underlying contract is broken, and positive coverage cannot detect its own blind spots."
expected_outcome = "A small required set of negative and mutation controls demonstrates that the validation infrastructure detects the failure classes it claims to detect: misclassified diagnostics, timeouts satisfying refusals, insensitive comparators, and canary state corruption."
acceptance = ["A case that fails compilation after ingestion classifies as a compiler diagnostic, never as product-not-produced or generic empty output.", "A timed-out or signaled process cannot satisfy an expected-refusal assertion.", "A deliberately perturbed known-valid comparison product is reported as the appropriate mismatch by the comparator.", "An expected known failure stays non-blocking, an unexpected pass surfaces as XPASS, and an unrelated crash, timeout, or harness failure is surfaced as a new regression.", "Every control states the invariant protected, the plausible false-green regression, and why existing positive coverage would not detect it; one control per invariant family, no mutation farms."]
[[issue]]
node_id = "CVO4"
title = "Promote probe states only through owner review"
problem = "Accumulated canaries, known failures, skips, and benchmark observations never reach a decision point, so unexpected passes stay invisible, skips outlive their missing prerequisites, and recorded numbers never become actionable evidence."
expected_outcome = "After the relevant semantic and performance authorities converge, an explicit join reviews every accumulated probe state and records selective promotions with named deciding owners, leaving still-deferred behavior explicitly deferred."
acceptance = ["Allowed transitions only: skip to canary, canary to known-fail, known-fail to gate, canary to gate, each with a named deciding owner and evidence.", "No automatic promotion from a pass streak; the owning semantic contract decides behavior acceptance and the owning performance contract decides numeric baselines.", "Every still-deferred case keeps its owning named future owner, and no gate is weakened without an owner decision.", "The join itself implements no compiler behavior and invents no thresholds."]
