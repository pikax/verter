# ─────────────────────────────────────────────────────────────────────────
# Configuration deltas.
#
# Provider-independent, and EXACT: each names the setting it changes, the
# value that setting holds in the materialized baseline configuration, and
# the value it is set to. The validator resolves `setting` against
# [workload_materialization].project_config_baseline and requires
# `baseline_value` to be that configuration's actual value, so a delta
# cannot describe a setting the projects do not have.
# ─────────────────────────────────────────────────────────────────────────

[[workload_configuration_delta]]
id = "strict_null_checks"
description = "Toggle strictNullChecks in the project configuration"
setting = "compilerOptions.strictNullChecks"
baseline_value = "false"
applied_value = "true"
provider_independent = true

[[workload_configuration_delta]]
id = "path_alias"
description = "Add and remove a path alias covering the shared module directory"
setting = "compilerOptions.paths"
baseline_value = "{}"
applied_value = "{\"@shared/*\":[\"./shared/*\"]}"
provider_independent = true

[[workload_configuration_delta]]
