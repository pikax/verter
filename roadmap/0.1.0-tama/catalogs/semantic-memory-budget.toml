# ─────────────────────────────────────────────────────────────────────────
# Pinned-result policy.
#
# The budget bounds cache retention and admission. It does NOT claim a
# hard bound over arbitrarily many results a caller chooses to hold: a
# public handle is the caller's, and no pressure state revokes it.
# ─────────────────────────────────────────────────────────────────────────
[pinned_result_policy]
hard_bound_over_caller_retained_results = false
revocation_of_live_public_handles = "forbidden"
visibility = "Pinned bytes stay visible in the accounting until the caller releases the handle. A pinned byte is reported under externally_pinned ownership and is never counted a second time under cache_owned or request_active."
backpressure = "Crossing external_pinned_backpressure_threshold_bytes limits admission of NEW work through the existing typed resource-limited outcome. It never evicts, invalidates, or degrades a result a caller already holds."
degradation_rule = "A pressure decision may change warm versus cold work. It may never change semantic output, completeness, or provenance for a completed request, and it may never make a partial result cacheable."
oversized_complete_result = "A complete result too large for per_entry_admission_max_bytes returns UNCACHED when it fits the active request budget. Exhausting the active budget returns the existing typed resource-limited outcome, never a fabricated complete result and never a stale candidate."
copy_versus_share_rule = "A result handed to a caller is charged by HOW it is handed over, and the two forms are never conflated. A SHARED handle (the cache's Arc, cloned by reference) is one payload with two holders: the cache class carries the payload charge, the caller carries an externally_pinned reference charge of the handle only, and neither total includes the other's payload bytes. A COPY (a by-value clone of an owned payload, which is what the live component-meta warm path performs) is a SECOND payload: it is charged in full under externally_pinned at the caller, independently of the cache's charge, and it is not a shared reference in the accounting."
coexistence_rule = "While a cache entry and a caller-held result coexist, both charges stand simultaneously. For a shared handle the payload is charged once (at the cache) plus one reference charge per holder; for a copy each copy is a full charge. Two callers holding two copies of the same logical result are two charges, not one."
release_order_rule = "Release order does not change the totals and never leaves an unowned byte. Cache eviction first: the cache charge drops immediately; a shared payload survives on the caller's reference and its payload charge TRANSFERS to the last remaining holder, and a copy is unaffected because it was never the cache's. Caller release first: the caller's charge drops immediately and the cache charge is unaffected. When the last holder of a shared payload releases, the payload charge drops exactly once."
provisional_adoption_rule = "MEM1 may not adopt a limit whose [[limit_derivation]] records derivation = provisional as an ENFORCED admission threshold without first re-ratifying it against the measurement its blocking_metric_row names. Until then a provisional limit is a declared intent that the runner may observe against, not a policy that refuses work."

# ─────────────────────────────────────────────────────────────────────────
# Measurement methodology.
#
# Two quantities, measured two ways, never conflated:
#
#   owned bytes  Exact summed charge over the allocation_class rows below.
#                One charge owner per class; a shared reference is charged
#                once at its owner and zero times at every borrower, while
#                a by-value copy is charged in full at the copier.
#   RSS          Whole-process resident set, which INCLUDES allocator and
#                runtime overhead that no allocation class owns. RSS is
#                compared against process_rss_max_bytes only, never
#                against the summed owned bytes.
# ─────────────────────────────────────────────────────────────────────────
[measurement]
sampling_interval_actions = 100
steady_state_prefix_actions = 2000
rss_statistic = "max"
rss_scope = "resident set size of the runner process tree, sampled at every tranche boundary"
rss_includes_allocator_overhead = true
owned_bytes_scope = "exact summed charge over the allocation_class rows, partitioned by ownership"
owned_bytes_excludes_allocator_overhead = true
control_live_set_tolerance_permille = 20
control_live_set_absolute_slack_bytes = 4194304
control_live_set_slack_rationale = "4 MiB is the whole ratified budget of the single largest byte-bounded allocation class in the system today (the identity intern pool). A control-state difference smaller than one entire byte-bounded pool is not attributable, so it is the floor below which relative tolerance is not applied."
envelope_rule = "The first 2,000 actions establish the steady-state retained-byte envelope. Every later control sample must satisfy that envelope AND the absolute budget. The envelope is fixed once observed at the start of a run and is never raised after seeing the candidate's later samples."
growth_rule = "Unexplained positive growth at equivalent control states fails the run even when the final sample happens to be small. A single small end sample is not evidence of a bounded run."
pressure_boundary_obligation = "A pressure run MUST observe, and record, at least one admission refusal, at least one eviction, and at least one complete-but-uncached return. A pressure run that observes none of these has not reached the boundary the pressure budget was configured to reach and FAILS; it is never recorded as a clean pass. This obligation exists because the pressure ceilings are provisional: it is the runner, not this document, that establishes the crossing."
pressure_boundary_signals = ["session.family_candidate_evict", "session.cache_admit_return_only", "memory.host_cache_bytes", "memory.process_rss_peak"]
pressure_boundary_signal_rule = "The obligation above is discharged against these declared signals and no others, so it is a check a runner can actually perform on this tree rather than a promise deferred to instrumentation that does not exist. At least one must be a complete emitter, or the obligation would rest entirely on partial evidence: session.family_candidate_evict is that one, and eviction is therefore the boundary condition a pressure run can always establish. The remaining three are read for corroboration and each is read within its own stated limits — the return-only counter over-counts its role, the host-cache figure sees one store's source text, and the peak-RSS sampler reports zero unless timing capture is on, so a run that reads a zero from it must assert the flag rather than record the zero as a low peak."
oversize_boundary_obligation = "The runner MUST measure the entry produced from the oversize input and FAIL when it does not exceed budget.pressure.per_entry_admission_max_bytes. The declared repetition factor is a starting point, not an asserted size; a factor that does not reach the cap is repaired by re-ratifying the factor, never by lowering the cap or dropping the boundary."
statistics_source = "performance-gates.toml [statistics]"
confidence_percent = 95
bootstrap_resamples = 10000
no_regression_floor_milli_percent = 3000
noise_multiplier_permille = 2000

# ─────────────────────────────────────────────────────────────────────────
# Allocation ownership inventory.
#
# Every retained allocation class has EXACTLY ONE charge owner and exactly
# one lifetime owner (E4) and one admission owner (MEM1). The symbol
# anchors are re-resolved against the working tree on every validation
# run, so a rename or a deletion breaks validation instead of quietly
# leaving the contract describing code that no longer exists.
#
# COMPLETENESS IS CHECKED AGAINST THE CODE, NOT AGAINST THIS LIST. The
# validator reads the production fields of `VerterHost` from the source
# and follows every field marked `delegated` into the struct it holds —
# `ProjectTypeStore`, the resolver runtime and its fallthrough state, the
# framework registry and its registrations, the framework script caches,
# the audit runtime. EVERY field the walk reaches must be either charged
# by an allocation class (`covers_fields`, as `Struct.field`) or carry
# exactly one `[[struct_field]]` disposition with a reason. Deleting a
# class therefore fails validation rather than silently shrinking the
# inventory, adding a host-lifetime field turns this contract red until it
# is accounted for, and relabelling a subsystem so the walk stops reaching
# it is refused. Fields compiled only for tests are not in the population:
# they do not exist in a shipped build.
#
# current_bound_kind records what bounds the class TODAY, truthfully:
#
#   retained_bytes       a byte budget exists
#   entry_count          a count cap exists, but no byte bound
#   lease_refcount       lifetime is pinned by live readers; no bound
#   logical_retirement   surplus versions retire logically; physical
#                        reclamation waits for the last reader
#   weak_reference       retention follows strong references elsewhere
#   caller_lifetime      the caller owns the lifetime
#   none                 no bound of any kind exists today
#
# charge_observability records whether the class's RETAINED BYTE CHARGE is
# observable today:
#
#   charge_instrumented  a cited Bytes/Gauge metric row with a complete
#                        emitter reports this class's retained bytes
#   proxy_instrumented   cited rows report ACTIVITY at this class but not
#                        its retained byte charge
#   uninstrumented       no declared metric row observes this class
#
# Two classes are byte-bounded today and NONE is charge-instrumented.
# That is the gap E4 and MEM1 exist to close, and stating it plainly is
# the point of this inventory.
# ─────────────────────────────────────────────────────────────────────────

[[allocation_class]]
id = "retained_parse_snapshot"
name = "Lease-pinned retained parse snapshots"
ownership = "cache_owned"
charge_owner = "crates/verter_session/src/decl_lowering.rs#SnapshotShard"
producers = ["crates/verter_session/src/decl_lowering.rs#DeclLoweringService"]
consumers = ["crates/verter_session/src/decl_lowering.rs#SnapshotLease", "crates/verter_session/src/decl_body_memo.rs#DeclBodyMemo"]
covers_fields = ["VerterHost.decl_lowering"]
current_bound_kind = "lease_refcount"
current_bound_value = 0
lifetime_owner = "E4"
admission_owner = "MEM1"
shared_reference_rule = "The shard owns the single Rc per SnapshotKey and is charged once. A SnapshotLease is a refcount pin, never a second charge; releasing the last lease transfers nothing and drops the charge."
charge_observability = "proxy_instrumented"
metric_rows = ["session.oxc_eval_program_parse", "session.retained_snapshot_reuse", "session.artifact_pin_acquire", "session.artifact_pin_release"]
gap = "The cited rows report parse volume, reuse counts and lease acquisition, not the retained bytes the shard holds. Retained snapshot bytes are not observable."
completion_owner = "E4"

