# ─────────────────────────────────────────────────────────────────────────
# Retained-state walk dispositions.
#
# Every production field the walk reaches that no allocation class above
# charges carries exactly one row here:
#
#   non_retaining      holds no request- or content-derived payload; what
#                      it holds is fixed-size or keyed by configuration
#   delegated          holds a struct whose own fields are walked in turn;
#                      `delegate` names it as path#Struct
#   shared_reference   a second Arc to a payload charged at `charged_at`,
#                      which must be a field an allocation class charges,
#                      so the payload is counted exactly once
#   outside_inventory  the file authority, whose bytes a live workspace
#                      observation (`attributed_by`) reports separately
#
# A row naming a field the struct no longer has, or a struct the walk no
# longer reaches, is stale and fails validation.
# ─────────────────────────────────────────────────────────────────────────

