# ─────────────────────────────────────────────────────────────────────────
# Fixed churn workload.
#
# 100 tranches of 100 actions is 10,000 ordered actions. Every tranche
# ends with one sample and one control checkpoint, so the sampling cadence
# is exactly the declared interval and every tranche returns to the same
# control live set: within a tranche every edit is reverted on the file it
# was applied to, every applied configuration delta is reverted on the
# PROJECT it was applied to, every pinned result is released, and every
# opened project is closed.
#
# EVERY ACTION IS EXECUTABLE THROUGH A CURRENT API. A request names a
# materialized carrier file, because that is what the component-meta
# request accepts; an edit names an exact find/replace pair that occurs in
# the template it was authored against; a configuration change names an
# exact setting with its exact baseline and applied values. Nothing here
# requires the runner to invent behaviour.
#
# The manifest is FROZEN by digest rather than by committed rows. The
# expander named below is a pure function of this spec, its own bytes are
# pinned, and the bytes it produces are pinned; a manifest that differs in
# one field cannot satisfy either digest. This is the same freezing form
# performance-gates.toml already uses for its own synthesised corpus.
# ─────────────────────────────────────────────────────────────────────────
[workload]
tranches = 100
tranche_actions = 100
total_actions = 10000
projects_per_tranche = 2
expander = "tools/semantic-memory-workload.mjs"
expander_sha256 = "655fd2f9862f98a2a8a1ee82f947ce4f9b5602c3c7da9d446f48b8bda0a07d3c"
manifest_sha256 = "99031f239b8b9e43507f36277ad817aa73faabf10005e5b5368e2e467c1edc59"
manifest_columns = ["seq", "tranche", "cycle", "kind", "class", "project", "template", "instance", "query", "delta", "cancel_at", "overlap_group", "result_class", "cache_disposition"]
min_distinct_query_identities = 3000
fixture_root = "catalogs/semantic-memory-workload/sources"
overlap_group_size = 3
config_pair_size = 2
same_key_repetition_rule = "Same-key repetition alone cannot satisfy this workload. Each tranche materializes its own carrier instances, so the manifest carries at least min_distinct_query_identities distinct canonical files; warm requests deliberately re-enter their own tranche's cold pool so that a warm action is genuinely warm, and cold, overlapping and cancelled requests take DISJOINT slices of that pool so no family borrows another's subject."
pressure_relaxation_rule = "Pressure changes CACHE DISPOSITION, never semantics. Under the pressure budget a must_construct result may complete without being admitted, a reuse_if_valid request may find no valid retained entry and recompute, and an admit_if_within_entry_cap result may return complete and uncached. In every one of those cases result_class is unchanged: the recomputed result must equal the reused one. Pressure may never degrade a result to a partial, serve a stale candidate, or make a partial cacheable. must_recompute and no_admission are correctness requirements rather than cache preferences and are unchanged by pressure: serving a pre-mutation entry to a must_recompute request is a defect under every budget."
disposition_rule = "result_class is the SEMANTIC outcome and is invariant under pressure, retention state and eviction. cache_disposition describes what the cache is permitted or required to do and is conditional on retained state. The two are separate columns precisely so a valid pressure miss cannot read as a semantic failure, and a stale hit cannot hide behind a warm expectation."

# ─────────────────────────────────────────────────────────────────────────
# Materialization.
#
# High key cardinality comes from materializing many distinct carrier
# FILES out of a few frozen templates -- the technique the measurement
# corpus already uses -- because the request API accepts a canonical file
# and nothing else. Each tranche gets its own instance tree, and the
# relative layout of the templates is reproduced verbatim so that a
# template's `../shared/props-base` import resolves inside every instance
# and each request is a genuine cross-file resolution.
#
# Only `carrier` and `oversize_carrier` instances are ever requested.
# `module` instances exist to be EDITED: an edit to a shared module
# invalidates every carrier in that project that imports it, which is the
# reverse-dependency invalidation the workload has to cover and which a
# self-edit cannot reach.
# ─────────────────────────────────────────────────────────────────────────
[workload_materialization]
instance_root = "verter-mem0-churn"
instance_path_rule = "{instance_root}/t{tranche:03}/{project}/{template_dir}/{template_stem}[-{ordinal:02}]{template_ext}. Carrier instances carry the pool ordinal; one-per-project instances (modules, malformed carriers, the oversize carrier) do not."
carrier_instances_per_tranche = 36
carrier_instance_assignment = "Instance i is materialized into project i % projects_per_tranche from template carriers[floor(i / projects_per_tranche) % carriers], so every project holds every healthy carrier shape and an instance's project is a property of the instance rather than an independent choice."
project_config_file = "tsconfig.json"
project_config_baseline = "{\"compilerOptions\":{\"strict\":true,\"strictNullChecks\":false,\"target\":\"ES2022\",\"lib\":[\"ES2022\",\"DOM\"],\"moduleResolution\":\"bundler\",\"paths\":{}},\"include\":[\"vue/*.vue\",\"svelte/*.svelte\",\"shared/*.ts\"]}"
project_config_include_rule = "TypeScript include has no brace expansion, so multi-extension coverage is separate entries and never a single {vue,svelte} pattern. The baseline above owns each carrier extension explicitly, which is what makes the configured project the carriers' owner."
oversize_template = "vue/oversize.vue"
oversize_repeat = 20000
oversize_marker_begin = "// REPEAT-BEGIN"
oversize_marker_end = "// REPEAT-END"
oversize_ordinal_placeholder = "__N__"
oversize_expansion_rule = "The region strictly between the two markers is emitted oversize_repeat times, with every occurrence of the ordinal placeholder replaced by the zero-based repetition ordinal. The committed template holds exactly one un-expanded copy and is never itself requested."
oversize_size_claim = "unmeasured"
oversize_size_note = "The repetition factor is a starting point chosen to overshoot, NOT an asserted entry size. The contract does not claim the produced entry exceeds any cap; [measurement].oversize_boundary_obligation makes the runner measure it and fail when it does not."

