# ─────────────────────────────────────────────────────────────────────────
# Fixed churn workload.
#
# 100 tranches of 100 actions is 10,000 ordered actions. Every tranche
# ends with one sample and one control checkpoint, so the sampling cadence
# is exactly the declared interval and every tranche returns to the same
# control live set: within a tranche every edit is reverted, every applied
# configuration delta is reverted, every pinned result is released, and
# every opened project is closed.
#
# The manifest is FROZEN by digest rather than by committed rows. The
# expander named below is a pure function of this spec, its own bytes are
# pinned, and the bytes it produces are pinned; a manifest that differs in
# one field cannot satisfy either digest. This is the same freezing form
# performance-gates.toml already uses for its own synthesised corpus.
# ─────────────────────────────────────────────────────────────────────────
[workload]
tranches = 100
tranche_actions = 100
total_actions = 10000
projects_per_tranche = 2
expander = "tools/semantic-memory-workload.mjs"
expander_sha256 = "f420d0a662010899096128608b59aad63d08d372a349d874c6ed12273d401b11"
manifest_sha256 = "126b0dfaf5c4d0fc9675de5839088f897a3698804b3d7c1b32e2d290134b36f1"
manifest_columns = ["seq", "tranche", "cycle", "kind", "class", "project", "fixture", "query", "delta", "cancel_at", "result_class", "admission_class"]
min_distinct_query_identities = 3000
fixture_root = "catalogs/semantic-memory-workload/sources"
same_key_repetition_rule = "Same-key repetition alone cannot satisfy this workload. Cold identities are minted per tranche, so the manifest carries at least min_distinct_query_identities distinct identities; warm and overlapping requests deliberately re-enter their own tranche's cold pool so that a warm action is genuinely warm."
pressure_relaxation_rule = "Under the pressure budget an action whose declared admission class is cacheable may instead complete UNCACHED. It may never degrade to a partial result, a stale candidate, or a different semantic output. Every other declared class is unchanged by pressure."

