# Aggregate semantic memory budget, allocation ownership inventory and
# fixed churn workload.
#
# This file is a CONTRACT, not an implementation. It ratifies the finite
# byte limits, the sole-charge-owner inventory and the frozen workload that
# physical storage and admission policy consume. Nothing here retains a
# byte or refuses an admission; the owners named in every row do that.
#
# Every limit below is a finite integer. No symbolic "unlimited" or
# "default" placeholder is accepted, and validation fails on a missing one.
# Percentages are carried as integer permille or milli-percent because the
# roadmap TOML reader has no float form; the derivation of each value is
# stated beside it rather than left implied.

schema = 1
product = "rev11"
owner = "MEM0"
status = "RATIFIED"

# ─────────────────────────────────────────────────────────────────────────
# Baseline provenance.
#
# The accepted baseline is the A6 lock's own measured cell. It is cited by
# identity, and the citation is re-verified on every validation run: the
# harness whose bytes DEFINE the measured corpus is re-hashed against the
# digests the lock recorded. That is what distinguishes equivalent work
# from an invalid historical result here — not a claim in prose, but a
# recomputed digest over the current tree.
# ─────────────────────────────────────────────────────────────────────────
[baseline]
source_file = "performance-gates.toml"
cell_id = "A6_META_COMPILE_40_COLD_RUST"
lock_status = "LOCKED"
baseline_sha = "fb863297a04c7eb114d53ff65736c00240354504"
baseline_tree = "a2e01e16d705faecf259152f40d0a3b228b16dbf"
runner_class = "apple-silicon-laptop-8core-24gib"
runner_memory_bytes = 25769803776
runner_logical_cpus = 8

# The corpus is synthesised in-process by this harness, so the harness
# source IS the corpus definition. Both digests are recomputed from the
# working tree by the validator; a mismatch means the recorded measurement
# no longer describes the code under test and may not be ranked as
# equivalent work.
corpus_source_file = "crates/verter_bench/examples/attribution_baseline.rs"
corpus_git_blob = "efa9ea54a14772ecd87511d6bb07017aa33940ba"
corpus_sha256 = "5e06d35dda284a8ef049bf0dd3dc39974b904729f740da58c650ec59e806f632"
corpus_files = 41
corpus_components = 40

# Recorded measurements from the locked cell.
measured_peak_rss_bytes = 74850304
measured_wall_ns = 70525000
locked_peak_rss_absolute_max_bytes = 268435456
locked_peak_rss_no_regression_milli_percent = 4952
locked_wall_no_regression_milli_percent = 3000

# Disclosed, not hidden: the locked cell cites its raw measurement record
# at this path, and the working tree does not retain that document. The
# numbers above are therefore taken from the locked gate file itself,
# which IS retained and IS the ratified authority ("Every value is
# retained as part of this locked gate definition"). No claim below rests
# on the unretained document.
recorded_measurement_document = "evidence/A6/baseline-measurement.md"
recorded_measurement_document_retained = false

equivalent_work_rule = "A later measurement ranks as equivalent work only when it executes the same cell identity on the runner class above with the corpus digests above recomputed and matching. A run on another runner class is a recalibration under the lock file's own rules, never a comparison."
invalid_historical_result_rule = "A recorded result whose corpus digest no longer recomputes, whose runner class differs, or whose instrumentation arm differs from the arm the metric was measured on is INVALID for comparison and is not ranked as equivalent work. Timing and counter metrics are measured on different arms and are never compared to each other."

# ─────────────────────────────────────────────────────────────────────────
# Scale derivation.
#
# The absolute ceilings below are not free parameters. They are derived by
# scaling the ONE recorded whole-process measurement to the supported
# workload, and then checked against the product budget the locked gate
# file already states in its own words ("an editor host must hold a
# 1,000-file project under 2 GiB").
#
#   measured_peak_rss_bytes / corpus_files
#     = 74850304 / 41 = 1825617 (floor)
#   projected at the supported scale
#     = 1825617 * 1000 = 1825617000
#   process ceiling - projection
#     = 2147483648 - 1825617000 = 321866648 bytes of headroom
#
# Note which coefficient is used and which is not. The locked cell's
# 268435456-byte cap is a CATASTROPHE STOP for a 41-file batch, not a
# scaling coefficient: 268435456 / 41 * 1000 is 6547206000, three times
# the whole process ceiling. Scaling the catastrophe stop would produce a
# budget no machine can honour. The MEASURED coefficient is the one that
# scales, and it fits with 14.9% headroom.
# ─────────────────────────────────────────────────────────────────────────
[scale]
supported_workload_files = 1000
measured_peak_rss_bytes_per_file = 1825617
projected_peak_rss_bytes_at_supported_scale = 1825617000
headroom_bytes_at_supported_scale = 321866648
product_budget_statement = "An editor host must hold a 1,000-file project under 2 GiB. Stated by the locked gate file at the peak_rss_bytes absolute_max metric of the baseline cell; adopted here as the whole-process normal ceiling."

# ─────────────────────────────────────────────────────────────────────────
# Normal budget.
#
# The four owned components partition the process ceiling EXACTLY. That is
# an identity the validator asserts, not a coincidence:
#   1073741824 + 268435456 + 536870912 + 268435456 = 2147483648
#
# cache_owned_retained_max_bytes  1 GiB   50% of the ceiling. The retained
#                                         set is the only component a
#                                         retention policy can shrink.
# request_active_max_bytes      256 MiB   Equal to the locked cell's own
#                                         absolute peak-RSS cap: that cap
#                                         bounds one cold batch's entire
#                                         live set at peak, which is
#                                         exactly what "active" means here.
# external_pinned_backpressure_
#   threshold_bytes             512 MiB   NOT a hard bound. See
#                                         [pinned_result_policy].
# allocator_slack_bytes         256 MiB   Allocator and runtime overhead,
#                                         measured separately from owned
#                                         bytes and never charged to an
#                                         allocation class.
# ─────────────────────────────────────────────────────────────────────────
[budget.normal]
process_rss_max_bytes = 2147483648
cache_owned_retained_max_bytes = 1073741824
request_active_max_bytes = 268435456
external_pinned_backpressure_threshold_bytes = 536870912
allocator_slack_bytes = 268435456
per_entry_admission_max_bytes = 33554432
max_simultaneously_admitted_requests = 64
per_request_active_max_bytes = 4194304

# ─────────────────────────────────────────────────────────────────────────
# Pressure budget.
#
# The pressure ceiling is deliberately BELOW the workload's steady-state
# retained set, not above it. A pressure run that never refuses an
# admission proves nothing; this configuration forces refusal, eviction
# and complete-but-uncached return continuously over the same 10,000
# actions. It partitions exactly as the normal budget does:
#   67108864 + 67108864 + 536870912 + 268435456 = 939524096
#
# The external-pin threshold and the allocator slack do NOT shrink under
# pressure. Pressure limits what the process CHOOSES to retain; it cannot
# shrink what a caller already holds, and it cannot shrink the allocator.
# ─────────────────────────────────────────────────────────────────────────
[budget.pressure]
process_rss_max_bytes = 939524096
cache_owned_retained_max_bytes = 67108864
request_active_max_bytes = 67108864
external_pinned_backpressure_threshold_bytes = 536870912
allocator_slack_bytes = 268435456
per_entry_admission_max_bytes = 4194304
max_simultaneously_admitted_requests = 16
per_request_active_max_bytes = 4194304

# ─────────────────────────────────────────────────────────────────────────
# Pinned-result policy.
#
# The budget bounds cache retention and admission. It does NOT claim a
# hard bound over arbitrarily many results a caller chooses to hold: a
# public handle is the caller's, and no pressure state revokes it.
# ─────────────────────────────────────────────────────────────────────────
[pinned_result_policy]
hard_bound_over_caller_retained_results = false
revocation_of_live_public_handles = "forbidden"
visibility = "Pinned bytes stay visible in the accounting until the caller releases the handle. A pinned byte is reported under externally_pinned ownership and is never counted a second time under cache_owned or request_active."
backpressure = "Crossing external_pinned_backpressure_threshold_bytes limits admission of NEW work through the existing typed resource-limited outcome. It never evicts, invalidates, or degrades a result a caller already holds."
degradation_rule = "A pressure decision may change warm versus cold work. It may never change semantic output, completeness, or provenance for a completed request, and it may never make a partial result cacheable."
oversized_complete_result = "A complete result too large for per_entry_admission_max_bytes returns UNCACHED when it fits the active request budget. Exhausting the active budget returns the existing typed resource-limited outcome, never a fabricated complete result and never a stale candidate."

# ─────────────────────────────────────────────────────────────────────────
# Measurement methodology.
#
# Two quantities, measured two ways, never conflated:
#
#   owned bytes  Exact summed charge over the allocation_class rows below.
#                One charge owner per class; a shared reference is charged
#                once at its owner and zero times at every borrower.
#   RSS          Whole-process resident set, which INCLUDES allocator and
#                runtime overhead that no allocation class owns. RSS is
#                compared against process_rss_max_bytes only, never
#                against the summed owned bytes.
# ─────────────────────────────────────────────────────────────────────────
[measurement]
sampling_interval_actions = 100
steady_state_prefix_actions = 2000
rss_statistic = "max"
rss_scope = "resident set size of the runner process tree, sampled at every tranche boundary"
rss_includes_allocator_overhead = true
owned_bytes_scope = "exact summed charge over the allocation_class rows, partitioned by ownership"
owned_bytes_excludes_allocator_overhead = true
control_live_set_tolerance_permille = 20
control_live_set_absolute_slack_bytes = 4194304
control_live_set_slack_rationale = "4 MiB is the whole ratified budget of the single largest byte-bounded allocation class in the system today (the identity intern pool). A control-state difference smaller than one entire byte-bounded pool is not attributable, so it is the floor below which relative tolerance is not applied."
envelope_rule = "The first 2,000 actions establish the steady-state retained-byte envelope. Every later control sample must satisfy that envelope AND the absolute budget. The envelope is fixed once observed at the start of a run and is never raised after seeing the candidate's later samples."
growth_rule = "Unexplained positive growth at equivalent control states fails the run even when the final sample happens to be small. A single small end sample is not evidence of a bounded run."
statistics_source = "performance-gates.toml [statistics]"
confidence_percent = 95
bootstrap_resamples = 10000
no_regression_floor_milli_percent = 3000
noise_multiplier_permille = 2000

# ─────────────────────────────────────────────────────────────────────────
# Allocation ownership inventory.
#
# Every retained allocation class has EXACTLY ONE charge owner and exactly
# one lifetime owner (E4) and one admission owner (MEM1). The symbol
# anchors are re-resolved against the working tree on every validation
# run, so a rename or a deletion breaks validation instead of quietly
# leaving the contract describing code that no longer exists.
#
# current_bound_kind records what bounds the class TODAY, truthfully:
#
#   retained_bytes       a byte budget exists
#   entry_count          a count cap exists, but no byte bound
#   lease_refcount       lifetime is pinned by live readers; no bound
#   logical_retirement   surplus versions retire logically; physical
#                        reclamation waits for the last reader
#   weak_reference       retention follows strong references elsewhere
#   caller_lifetime      the caller owns the lifetime
#   none                 no bound of any kind exists today
#
# Exactly one class is byte-bounded today. That is the gap E4 and MEM1
# exist to close, and stating it plainly is the point of this inventory.
# ─────────────────────────────────────────────────────────────────────────

[[allocation_class]]
id = "retained_parse_snapshot"
name = "Lease-pinned retained parse snapshots"
ownership = "cache_owned"
charge_owner = "crates/verter_session/src/decl_lowering.rs#SnapshotShard"
producers = ["crates/verter_session/src/decl_lowering.rs#DeclLoweringService"]
consumers = ["crates/verter_session/src/decl_lowering.rs#SnapshotLease", "crates/verter_session/src/decl_body_memo.rs#DeclBodyMemo"]
current_bound_kind = "lease_refcount"
current_bound_value = 0
lifetime_owner = "E4"
admission_owner = "MEM1"
shared_reference_rule = "The shard owns the single Rc per SnapshotKey and is charged once. A SnapshotLease is a refcount pin, never a second charge; releasing the last lease transfers nothing and drops the charge."
metric_rows = ["session.oxc_eval_program_parse", "session.retained_snapshot_reuse", "session.artifact_pin_acquire", "session.artifact_pin_release"]

[[allocation_class]]
id = "declaration_body_memo"
