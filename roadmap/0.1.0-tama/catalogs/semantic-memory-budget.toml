# ─────────────────────────────────────────────────────────────────────────
# Edit deltas.
#
# Each delta is an EXACT byte substitution against the template it is
# authored for. The validator requires `find` to occur EXACTLY ONCE in
# that template's frozen bytes and `replace` to differ from it, so an edit
# is unambiguous, its inverse is well defined, and a delta cannot silently
# stop applying when a template changes.
#
# Every delta changes the component's published type surface, so the edit
# genuinely invalidates the results that depend on it rather than
# producing a cosmetic version bump.
# ─────────────────────────────────────────────────────────────────────────

[[workload_edit_delta]]
id = "props_base_density_widen"
template = "shared/props-base.ts"
find = "export type Density = \"compact\" | \"cozy\" | \"comfortable\";"
replace = "export type Density = \"compact\" | \"cozy\" | \"comfortable\" | \"spacious\";"
effect = "Widens a union every carrier's props surface reaches through, so every importing carrier's published density type changes."

[[workload_edit_delta]]
id = "props_base_hint_required"
template = "shared/props-base.ts"
find = "  hint?: string;"
replace = "  hint: string;"
effect = "Turns an optional member required, changing the published optionality of the Labelled surface."

[[workload_edit_delta]]
id = "theme_accent_nullable"
template = "shared/theme.ts"
find = "  accent: string;"
replace = "  accent: string | null;"
effect = "Widens a member type reached through ThemeSlice, changing the published accent type of the carriers that slice it."

[[workload_edit_delta]]
id = "theme_spacing_optional"
template = "shared/theme.ts"
find = "  spacing: Record<Density, number>;"
replace = "  spacing?: Record<Density, number>;"
effect = "Turns a required member optional, changing published optionality through ThemeSlice."

