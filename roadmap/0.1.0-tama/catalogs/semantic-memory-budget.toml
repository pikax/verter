# Aggregate semantic memory budget, allocation ownership inventory and
# fixed churn workload.
#
# This file is a CONTRACT, not an implementation. It ratifies the finite
# byte limits, the sole-charge-owner inventory and the frozen workload that
# physical storage and admission policy consume. Nothing here retains a
# byte or refuses an admission; the owners named in every row do that.
#
# Every limit below is a finite integer. No symbolic "unlimited" or
# "default" placeholder is accepted, and validation fails on a missing one.
# Percentages are carried as integer permille or milli-percent because the
# roadmap TOML reader has no float form; the derivation of each value is
# stated beside it rather than left implied.
#
# TRUTHFULNESS IS THE ORGANISING RULE. Three things are recorded as they
# actually are on this tree rather than as the contract would prefer:
#
#   1. Byte-valued memory IS observed today, and less of it than this
#      budget needs. `[[memory_observation]]` records the live surface
#      exactly: whole-process RSS before, after and peak, a workspace
#      footprint, and a host-cache figure that sums ONLY the
#      `FileArtifactStore` rows' canonical id plus their raw and eval
#      source text. That last one is a source-text proxy for ONE of the
#      many cache-owned classes — not the aggregate retained set
#      this budget bounds — and no observation reports any other class's
#      retained bytes. So no allocation class records
#      `charge_instrumented` and the aggregate figure stays
#      unmeasurable, but the reason is a NARROW live surface rather than
#      an absent one, and the contract names which surface it is.
#   2. Consequently only the WHOLE-PROCESS ceiling is measured-derived.
#      Its subdivision into cache-owned / active / pinned / slack, and
#      every per-entry and concurrency limit, is PROVISIONAL — each one
#      names the metric gap blocking its measurement and the owner who
#      must re-ratify it. `[[limit_derivation]]` records this per limit and
#      validation refuses a limit that claims measured provenance it does
#      not have.
#   3. The oversized-entry boundary names a concrete expandable input and
#      a runner obligation to MEASURE that the produced entry exceeds the
#      cap. The contract does not assert a byte size it has not observed.
#
# Recorded deviation, for maintainer ratification. MEM0-AC2 asks for
# budgets "ratified from recorded baseline measurements". The recorded
# baseline measures ONE whole-process figure, and the live memory surface
# recorded below cannot supply the rest: it reports whole-process RSS and
# a single store's source text, never a per-class retained charge. The
# instrumentation that would measure the internal partition therefore
# does not exist, and MEM0 changes no production code, so it cannot
# create it.
#
# A local run cannot close that gap either, and the reason is recorded
# rather than left implicit: this contract's baseline is bound to ONE
# runner class, so a measurement taken anywhere else is a recalibration
# under the lock file's own rules and may not promote a derivation row.
# See `[baseline].local_run_promotion_rule`.
#
# Rather than present an unmeasured split as measured, this contract
# ratifies the measured whole, marks the split provisional against a
# named live blocker, states for each blocker what it observes today and
# what it must observe to promote the limit, and forbids MEM1 from
# adopting a provisional limit as enforced policy without re-ratification.
# See `[pinned_result_policy].provisional_adoption_rule`.

schema = 2
product = "rev11"
owner = "MEM0"
status = "RATIFIED"

# ─────────────────────────────────────────────────────────────────────────
# Baseline provenance.
#
# The accepted baseline is the A6 lock's own measured cell. It is cited by
# identity, and every citation is RE-RESOLVED on each validation run: the
# harness whose bytes DEFINE the measured corpus is re-hashed, the lock's
# own metric rows are re-parsed and compared against the limits restated
# here, and the two recorded measurements are re-read from the lock text
# that records them. That is what distinguishes equivalent work from an
# invalid historical result — not a claim in prose, but resolution against
# the authority on the current tree.
# ─────────────────────────────────────────────────────────────────────────
[baseline]
source_file = "performance-gates.toml"
cell_id = "A6_META_COMPILE_40_COLD_RUST"
lock_status = "LOCKED"
baseline_sha = "fb863297a04c7eb114d53ff65736c00240354504"
baseline_tree = "a2e01e16d705faecf259152f40d0a3b228b16dbf"
runner_class = "apple-silicon-laptop-8core-24gib"
runner_memory_bytes = 25769803776
runner_logical_cpus = 8

# The corpus is synthesised in-process by this harness, so the harness
# source IS the corpus definition. Both digests are recomputed from the
# working tree by the validator; a mismatch means the recorded measurement
# no longer describes the code under test and may not be ranked as
# equivalent work.
corpus_source_file = "crates/verter_bench/examples/attribution_baseline.rs"
corpus_git_blob = "efa9ea54a14772ecd87511d6bb07017aa33940ba"
corpus_sha256 = "5e06d35dda284a8ef049bf0dd3dc39974b904729f740da58c650ec59e806f632"
corpus_files = 41
corpus_components = 40

# Recorded measurements. These are NOT restated on trust: the lock records
# each one in the prose that justifies its gate, and the validator requires
# that exact sentence fragment to be present, rendered with the lock's own
# thousands separators. `measured_*_citation` is the fragment it looks for.
measured_peak_rss_bytes = 74850304
measured_peak_rss_citation = "baseline is 74,850,304 bytes"
measured_wall_ns = 70525000
measured_wall_citation = "baseline is 70,525,000 ns"

# Locked limits. Each is re-parsed from the cell's own `[[cell.metric]]`
# rows by (name, statistic, comparison) and compared numerically, so a
# limit that moved in the lock cannot keep being restated here. The
# relative limits are the lock's floats carried as milli-percent, because
# this TOML reader has no float form: 3.0% is 3000 and 4.952% is 4952.
locked_peak_rss_absolute_max_bytes = 268435456
locked_peak_rss_no_regression_milli_percent = 4952
locked_wall_no_regression_milli_percent = 3000
locked_wall_absolute_max_ns = 100000000

# Disclosed, not hidden: the locked cell cites its raw measurement record
# at this path, and the working tree does not retain that document. The
# numbers above are therefore taken from the locked gate file itself,
# which IS retained and IS the ratified authority ("Every value is
# retained as part of this locked gate definition"). No claim below rests
# on the unretained document.
recorded_measurement_document = "evidence/A6/baseline-measurement.md"
recorded_measurement_document_retained = false

equivalent_work_rule = "A later measurement ranks as equivalent work only when it executes the same cell identity on the runner class above with the corpus digests above recomputed and matching. A run on another runner class is a recalibration under the lock file's own rules, never a comparison."
invalid_historical_result_rule = "A recorded result whose corpus digest no longer recomputes, whose runner class differs, or whose instrumentation arm differs from the arm the metric was measured on is INVALID for comparison and is not ranked as equivalent work. Timing and counter metrics are measured on different arms and are never compared to each other."
local_run_promotion_rule = "A [[limit_derivation]] row is promoted from provisional to measured ONLY by a run on the runner class recorded above. A run on any other machine is a recalibration, not a comparison, so it may not promote a derivation row however carefully it was taken. This is why no amount of local measurement closes the provisional split: the two obstacles are independent, and clearing only the instrumentation one leaves this one standing."

# ─────────────────────────────────────────────────────────────────────────
# Scale derivation.
#
# The whole-process ceiling is not a free parameter. It is derived by
# scaling the ONE recorded whole-process measurement to the supported
# workload, and then checked against the product budget the locked gate
# file already states in its own words. The validator requires that
# statement to still be present in the lock.
#
#   measured_peak_rss_bytes / corpus_files
#     = 74850304 / 41 = 1825617 (floor)
#   projected at the supported scale
#     = 1825617 * 1000 = 1825617000
#   process ceiling - projection
#     = 2147483648 - 1825617000 = 321866648 bytes of headroom
#
# Note which coefficient is used and which is not. The locked cell's
# 268435456-byte cap is a CATASTROPHE STOP for a 41-file batch, not a
# scaling coefficient: 268435456 / 41 * 1000 is 6547206000, three times
# the whole process ceiling. Scaling the catastrophe stop would produce a
# budget no machine can honour. The MEASURED coefficient is the one that
# scales, and it fits with 14.9% headroom.
#
# This derivation supports the CEILING and nothing else. It says nothing
# about how the ceiling divides, which is why every component limit below
# is recorded provisional.
# ─────────────────────────────────────────────────────────────────────────
[scale]
supported_workload_files = 1000
measured_peak_rss_bytes_per_file = 1825617
projected_peak_rss_bytes_at_supported_scale = 1825617000
headroom_bytes_at_supported_scale = 321866648
product_budget_citation = "an editor host must hold a 1,000-file project under"
product_budget_statement = "An editor host must hold a 1,000-file project under 2 GiB. Stated by the locked gate file at the peak_rss_bytes absolute_max metric of the baseline cell; adopted here as the whole-process normal ceiling."

# ─────────────────────────────────────────────────────────────────────────
# Normal budget.
#
# The four owned components partition the process ceiling EXACTLY. That is
# an identity the validator asserts, not a coincidence:
#   1073741824 + 268435456 + 536870912 + 268435456 = 2147483648
#
# The ceiling is measured-derived; the split is an allocation of a measured
# whole, recorded provisional in [[limit_derivation]] until the aggregate
# retained-byte emitter exists.
# ─────────────────────────────────────────────────────────────────────────
[budget.normal]
process_rss_max_bytes = 2147483648
cache_owned_retained_max_bytes = 1073741824
request_active_max_bytes = 268435456
external_pinned_backpressure_threshold_bytes = 536870912
allocator_slack_bytes = 268435456
per_entry_admission_max_bytes = 33554432
max_simultaneously_admitted_requests = 64
per_request_active_max_bytes = 4194304

# ─────────────────────────────────────────────────────────────────────────
# Pressure budget.
#
# The pressure ceiling is deliberately BELOW the workload's steady-state
# retained set, not above it. A pressure run that never refuses an
# admission proves nothing; this configuration is intended to force
# refusal, eviction and complete-but-uncached return continuously over the
# same 10,000 actions. It partitions exactly as the normal budget does:
#   67108864 + 67108864 + 536870912 + 268435456 = 939524096
#
# "Intended", not "measured": with no retained-byte emitter the crossing
# cannot be observed yet, so the runner carries an explicit obligation to
# assert that this configuration actually refuses (see
# [measurement].pressure_boundary_obligation) and to fail the run when it
# does not. A pressure run that refuses nothing is a failed run, not a
# clean one.
#
# The external-pin threshold and the allocator slack do NOT shrink under
# pressure. Pressure limits what the process CHOOSES to retain; it cannot
# shrink what a caller already holds, and it cannot shrink the allocator.
# ─────────────────────────────────────────────────────────────────────────
[budget.pressure]
process_rss_max_bytes = 939524096
cache_owned_retained_max_bytes = 67108864
request_active_max_bytes = 67108864
external_pinned_backpressure_threshold_bytes = 536870912
allocator_slack_bytes = 268435456
per_entry_admission_max_bytes = 4194304
max_simultaneously_admitted_requests = 16
per_request_active_max_bytes = 4194304

# ─────────────────────────────────────────────────────────────────────────
# Live memory observations.
#
# The byte-valued memory the process ACTUALLY reports today, as opposed
# to the work-site counters below. These are not audit sites: they are
# fields of the `RequestMemoryAudit` envelope carried on every audited
# component-meta request, so they are populated by the live request path
# rather than by an `attribute!` macro, and the metric-row vocabulary
# further down — which is drawn from the closed audit work-site schema —
# structurally cannot name them. Recording them only there would have
# left the contract asserting that nothing observes memory, which is not
# true of this tree.
#
# Each row states what it observes, the producer that computes it, an
# in-tree anchor showing the value is populated on the live path, and the
# exact gap between what it reports and what this budget bounds. Both
# anchors are re-resolved on every validation run.
#
# `proof_kind` keeps the second anchor honest, because "the field is
# mentioned somewhere" is not evidence that anything writes it:
#
#   discriminating_test  a landed test that FAILS when the value is not
#                        produced. Must live under a tests tree.
#   live_assignment      the production site that assigns the value.
#                        Must live under a source tree.
#
# At least one row must carry a discriminating test, or the whole table
# would rest on assignment sites that a defaulted zero would satisfy.
#
#   coverage  whole_process         a process-wide figure that no
#                                   allocation class owns
#             partial_cache_owned   a real but NARROW view of cache-owned
#                                   bytes, naming the classes it covers
#             workspace             VFS bytes, outside this inventory
#
# `aggregates_cache_owned` is the load-bearing flag. It is false on every
# row today, and that is precisely why the retained-byte limits below are
# provisional. It is not decoration: a provisional limit may only be
# blocked on an observation whose flag is false, so the day an owner
# widens one of these to a true aggregate, this contract goes RED until
# the limits it blocked are re-ratified against it. Flipping the flag
# without re-ratifying is the failure mode the flag exists to catch.
# ─────────────────────────────────────────────────────────────────────────

[[memory_observation]]
id = "memory.process_rss"
observes = "Whole-process resident set size sampled immediately before and after each audited request, plus the signed delta between them."
unit = "Bytes"
producer = "crates/verter_audit/src/memory.rs#current_process_rss"
proof = "crates/verter_session/src/component_meta_audit/mod.rs#process_rss_before_bytes: rss"
proof_kind = "live_assignment"
coverage = "whole_process"
covers_allocation_classes = []
aggregates_cache_owned = false
enabled_by = "audit_enabled"
gap = "A whole-process figure that includes allocator and runtime overhead no allocation class owns. It is the right quantity to compare against process_rss_max_bytes and the wrong one to compare against any owned-byte total, and it says nothing about how the process's bytes divide."

[[memory_observation]]
id = "memory.process_rss_peak"
observes = "Peak whole-process RSS across the in-flight window of one request, from a host-owned sampler thread taking fetch_max every 50 ms."
unit = "Bytes"
producer = "crates/verter_session/src/host_audit_runtime.rs"
proof = "crates/verter_session/tests/cases/g_misc1/memory_peak_rss_per_host.rs"
proof_kind = "discriminating_test"
coverage = "whole_process"
covers_allocation_classes = []
aggregates_cache_owned = false
enabled_by = "audit_timing_capture"
gap = "Window-scoped and process-wide: it reports the highest point one request's window reached, not which class held those bytes. It is zero on wasm and zero when the capture flag is off, so a run that reads it must assert the flag rather than read a defaulted zero as a low peak."

[[memory_observation]]
id = "memory.host_cache_bytes"
observes = "Host cache footprint before and after each audited request."
unit = "Bytes"
producer = "crates/verter_session/src/resolver_store.rs#component_meta_audit_memory_bytes"
proof = "crates/verter_session/src/host_manage/component_meta_methods.rs#record_memory_snapshots"
proof_kind = "live_assignment"
coverage = "partial_cache_owned"
covers_allocation_classes = ["file_artifact_store"]
aggregates_cache_owned = false
enabled_by = "audit_enabled"
gap = "Named for the whole host cache but computed from ONE store: it sums each FileArtifactStore row's canonical id plus its raw and eval SOURCE TEXT. Even for that store it measures retained source text rather than the IndexedReady index payload, it counts no retired version, and it reaches none of the other cache-owned classes — no graph arena, no memo table, no decl-body memo, no retained parse snapshot, no result candidate. Treating it as the aggregate cache-owned figure would understate that figure by every class it does not visit."

[[memory_observation]]
id = "memory.workspace_bytes"
observes = "Workspace footprint before and after each audited request, as overlay bytes plus snapshot bytes."
unit = "Bytes"
producer = "crates/verter_workspace/src/engine.rs#resource_snapshot"
proof = "crates/verter_session/src/host_manage/component_meta_methods.rs#workspace_before_bytes"
proof_kind = "live_assignment"
coverage = "workspace"
covers_allocation_classes = []
aggregates_cache_owned = false
enabled_by = "audit_enabled"
gap = "VFS overlay and snapshot bytes. The workspace is the file authority, not a semantic cache, so no allocation class in this inventory owns these bytes and they are never folded into the cache-owned total. A run reads this row to attribute process growth that is NOT semantic retention."

# ─────────────────────────────────────────────────────────────────────────
# Limit derivation.
#
# One row per (mode, limit). The validator requires the mapping to be
# TOTAL and INJECTIVE in both directions: every budget limit has exactly
# one derivation row and every derivation row names a live budget limit, so
# a limit cannot be added without stating where its value came from and a
# derivation cannot outlive the limit it explains.
#
#   measured     The value follows from a recorded observation the
#                validator re-resolves. `blocking_metric_row` and
#                `completion_owner` must be "none".
#   provisional  The value is a reasoned allocation, NOT an observation.
#                It must name the observation whose incompleteness blocks
#                measuring it, and the owner who must re-ratify.
#
# `blocking_metric_row` resolves against BOTH declared vocabularies: a
# work-site metric row, or a live `[[memory_observation]]`. Naming the
# live observation is the more truthful answer wherever one exists, and
# the aggregate-retained limits name `memory.host_cache_bytes` for that
# reason — the obstacle is not that nothing observes cache bytes, it is
# that the thing which does sees one store's source text.
#
# A blocker must actually block. A metric row whose emitter is complete,
# or an observation that already aggregates cache-owned bytes, blocks
# nothing and is refused as a blocker: a limit that could be measured
# against it may not go on being recorded provisional.
#
# Today exactly one limit is measured. That is the honest state of the
# tree, and stating it here is what stops the rest from being read as
# evidence they are not.
# ─────────────────────────────────────────────────────────────────────────

