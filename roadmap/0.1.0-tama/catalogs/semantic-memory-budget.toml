[[workload_step]]
cycle = "b"
kind = "control_checkpoint"
count = 1

# ─────────────────────────────────────────────────────────────────────────
# Executable commands.
#
# lane records where the command is REQUIRED to run. The validator and its
# negative controls are bound in TWO places, deliberately: the docs-domain
# gate profile this node's charter binds, and the required roadmap CI job.
# They are separate commands rather than a hook inside the program-DAG
# validator, because that validator is mirrored and re-executed against a
# partial copy of the tree by the closure instrument, and this contract
# reads repo-level files that no such mirror contains. Folding it in would
# have made the mirror red before its own mutation, destroying that
# instrument's proof that its plant applied.
#
# L1 owns binding its own runner command when that node lands, and is
# recorded here as not yet bound rather than as bound.
# ─────────────────────────────────────────────────────────────────────────

[[command]]
id = "budget_validate"
kind = "validate"
command = "node roadmap/0.1.0-tama/tools/validate-semantic-memory-budget.mjs"
lane = "docs-domain gate profile and the required Tama Roadmap CI job"
bound = true

[[command]]
id = "budget_negative_controls"
kind = "negative_control"
command = "node --test roadmap/0.1.0-tama/tools/semantic-memory-budget.test.mjs"
lane = "docs-domain gate profile and the required Tama Roadmap CI job"
bound = true

[[command]]
id = "manifest_emit"
kind = "build"
command = "node roadmap/0.1.0-tama/tools/validate-semantic-memory-budget.mjs --emit-manifest <path>"
lane = "local"
bound = true

[[command]]
id = "baseline_corpus_build"
kind = "build"
command = "cargo build --release -p verter_bench --example attribution_baseline"
lane = "local"
bound = true

[[command]]
id = "baseline_corpus_run"
kind = "run"
command = "target/release/examples/attribution_baseline --files 40 --runs 30"
lane = "local"
bound = true

[[command]]
id = "long_churn_runner"
kind = "run"
command = "owned by L1"
lane = "unbound"
bound = false
