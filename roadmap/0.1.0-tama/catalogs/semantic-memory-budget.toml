# ─────────────────────────────────────────────────────────────────────────
# Controlling metric rows.
#
# The exact instrumentation this contract is read through. emitter_status
# is recorded truthfully against the working tree:
#
#   complete  a production emitter exists and covers the row's stated role
#   partial   a production emitter exists but does not cover the role
#   absent    no production emitter exists
#
# Where a site could not honestly claim a broad role, the ROLE is narrowed
# to what the site actually counts rather than the status being inflated.
# Where narrowing would hide a gap the budget depends on, the row stays
# partial and names the gap and its owner.
# ─────────────────────────────────────────────────────────────────────────

[[metric_row]]
id = "session.store_retained_bytes"
unit = "Gauge"
role = "aggregate cache-owned retained bytes"
emitter_status = "partial"
emitter_anchor = "crates/verter_session/src/block_content.rs"
gap = "The only production emitter is a high-water mark of one store, the host-retained supplied block content, raised when an artifact is admitted. No emitter aggregates retained bytes across the allocation classes above. Byte-valued memory is not wholly unobserved — see [[memory_observation]] — but the live surface reports whole-process RSS and one store's source text, never a per-class retained charge, so the aggregate cache-owned figure this budget bounds is still not measurable. The per-entry limits are provisional against this row; the aggregate ones are provisional against memory.host_cache_bytes, which is the observation that must widen."
