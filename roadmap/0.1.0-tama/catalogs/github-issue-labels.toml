schema = 1
managed_prefixes = ["area:", "problem:", "framework:"]
managed_exact = ["origin:ai"]

[[label]]
name = "area:compiler"
color = "1d76db"
description = "Compiler, code generation, style, or type-mapping work"

[[label]]
name = "area:identity"
color = "0e8a16"
description = "Source identity, inputs, flow, or public type information"

[[label]]
name = "area:session"
color = "5319e7"
description = "Host sessions, providers, caches, queries, or scheduling"

[[label]]
name = "area:formatter"
color = "c5def5"
description = "Formatting behavior and formatter integrations"

[[label]]
name = "area:language-server"
color = "0052cc"
description = "Language service, linting, or native checking"

[[label]]
name = "area:component-meta"
color = "7057ff"
description = "Component metadata, custom elements, or web components"

[[label]]
name = "area:tooling"
color = "0366d6"
description = "Developer tooling, governance, automation, or infrastructure"

[[label]]
name = "area:release"
color = "b60205"
description = "Publication, finalization, or release control"

[[label]]
name = "problem:capability"
color = "a2eeef"
description = "A required capability is missing or incomplete"

[[label]]
name = "problem:correctness"
color = "d73a4a"
description = "Behavior is incorrect or needs stronger verification"

[[label]]
name = "problem:performance"
color = "fbca04"
description = "Runtime speed, latency, memory, or throughput needs improvement"

[[label]]
name = "problem:compatibility"
color = "f9d0c4"
description = "Framework or platform compatibility needs improvement"

[[label]]
name = "problem:architecture"
color = "d4c5f9"
description = "Architecture, ownership, or contract design needs resolution"

[[label]]
name = "problem:developer-experience"
color = "c2e0c6"
description = "Developer workflow or usability needs improvement"

[[label]]
name = "problem:automation"
color = "006b75"
description = "Automation or control-plane behavior needs improvement"

[[label]]
name = "problem:documentation"
color = "0075ca"
description = "Documentation or durable guidance needs improvement"

[[label]]
name = "framework:vue"
color = "42b883"
description = "Specific to Vue behavior or integration"

[[label]]
name = "framework:svelte"
color = "ff3e00"
description = "Specific to Svelte behavior or integration"

[[label]]
name = "framework:shared"
color = "6f42c1"
description = "Shared across framework implementations"

[[label]]
name = "origin:ai"
color = "0b7285"
description = "Initial issue title and description were generated by AI"

[[area_rule]]
label = "area:compiler"
trains = ["compiler.compiler-bridge", "compiler.compiler-core", "compiler.compiler-optimization", "compiler.compiler-perf", "compiler.svelte-compiler", "compiler.svelte-style", "compiler.vue-compiler", "compiler.vue-style", "compiler.vue-style-query", "rev11.compiler-foundation", "rev11.semantic-compile", "rev11.style", "rev11.typescript-mapper"]

[[area_rule]]
label = "area:identity"
trains = ["rev11.core", "rev11.flow", "rev11.inputs", "rev11.public-typeinfo", "rev11.source-identity"]

[[area_rule]]
label = "area:session"
trains = ["rev11.cache-runtime", "rev11.host-runtime", "rev11.host-session", "rev11.provider-runtime", "rev11.query-runtime", "rev11.scheduler-runtime"]

[[area_rule]]
label = "area:formatter"
trains = ["expansion.formatter"]

[[area_rule]]
label = "area:language-server"
trains = ["expansion.language-service", "expansion.lint", "expansion.native-checker"]

[[area_rule]]
label = "area:component-meta"
trains = ["expansion.custom-elements", "expansion.html-wc", "expansion.svelte-ce", "expansion.vue-ce"]

[[area_rule]]
label = "area:tooling"
trains = ["expansion.architecture-proof", "expansion.cli", "expansion.engine-provisioning", "expansion.kernel", "expansion.skills", "governance.feedback-intake", "governance.github-control-plane", "governance.governance", "rev11.lock"]

[[area_rule]]
label = "area:release"
trains = ["governance.release-control", "rev11.finalization", "rev11.publication"]

[[problem_train_rule]]
label = "problem:performance"
trains = ["compiler.compiler-optimization", "compiler.compiler-perf"]

[[problem_train_rule]]
label = "problem:compatibility"
trains = ["expansion.custom-elements", "expansion.html-wc", "expansion.svelte-ce", "expansion.vue-ce"]

[[problem_train_rule]]
label = "problem:developer-experience"
trains = ["expansion.cli", "expansion.formatter", "expansion.language-service", "expansion.lint", "expansion.skills"]

[[problem_train_rule]]
label = "problem:automation"
trains = ["expansion.engine-provisioning", "governance.feedback-intake", "governance.github-control-plane", "governance.release-control"]

[[problem_train_rule]]
label = "problem:documentation"
trains = ["governance.governance"]

[[problem_kind_rule]]
label = "problem:architecture"
kinds = ["constitution", "contract", "genesis", "lock", "rescope"]

[[problem_kind_rule]]
label = "problem:capability"
kinds = ["activation", "adapter", "cutover", "implementation", "migration", "translator"]

[[problem_kind_rule]]
label = "problem:correctness"
kinds = ["audit", "canary", "convergence", "proof", "repair", "soak", "terminal", "verification", "verifier"]

[[framework_rule]]
label = "framework:vue"
trains = ["compiler.compiler-bridge", "compiler.vue-compiler", "compiler.vue-style", "compiler.vue-style-query", "expansion.vue-ce"]

[[framework_rule]]
label = "framework:svelte"
trains = ["compiler.compiler-bridge", "compiler.svelte-compiler", "compiler.svelte-style", "expansion.svelte-ce"]

[[framework_rule]]
label = "framework:shared"
trains = ["compiler.compiler-bridge", "compiler.compiler-core", "compiler.compiler-optimization", "compiler.compiler-perf", "expansion.custom-elements", "expansion.formatter", "expansion.html-wc", "expansion.kernel", "expansion.language-service", "expansion.lint", "expansion.native-checker", "rev11.cache-runtime", "rev11.compiler-foundation", "rev11.core", "rev11.finalization", "rev11.flow", "rev11.host-runtime", "rev11.host-session", "rev11.inputs", "rev11.lock", "rev11.provider-runtime", "rev11.public-typeinfo", "rev11.publication", "rev11.query-runtime", "rev11.scheduler-runtime", "rev11.semantic-compile", "rev11.source-identity", "rev11.style", "rev11.typescript-mapper"]
