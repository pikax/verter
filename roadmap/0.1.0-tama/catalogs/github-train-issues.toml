problem = "Verter does not yet own a complete semantic diagnostic authority, which leaves important JavaScript, TypeScript, Vue, and Svelte findings dependent on external or inconsistent behavior."
expected_outcome = "A native checker produces certified diagnostic families through shared semantic rules, incremental queries, and truthful publication."
acceptance = ["Required diagnostic families have discriminating certification evidence.", "Framework contributions remain isolated from shared semantic rules.", "Checker diagnostics publish consistently across supported consumer surfaces."]
problem_label = "problem:architecture"
