[[train_issue]]
train = "expansion.engine-provisioning"
title = "Provision external engines safely"
problem = "External engines can be discovered or installed without one integrity and trust policy, which risks incompatible binaries, silent network behavior, and misleading capability publication."
expected_outcome = "Engine selection, acquisition, verification, activation, and health follow explicit offline-capable and enterprise-safe contracts."
