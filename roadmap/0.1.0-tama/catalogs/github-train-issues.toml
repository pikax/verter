[[train_issue]]
train = "expansion.lint"
title = "Deliver unified native linting"
problem = "Lint behavior is fragmented by language and entry point, which causes inconsistent diagnostics and prevents safe fixes from sharing one semantic rule and transaction model."
expected_outcome = "Native lint packs for supported languages and frameworks publish coherent diagnostics and transactional fixes through one product surface."
acceptance = ["Shared rules produce consistent findings across supported syntaxes.", "Framework-specific lint behavior remains explicitly owned.", "Fixes are conflict-checked and applied transactionally."]
