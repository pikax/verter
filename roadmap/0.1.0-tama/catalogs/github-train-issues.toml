[[train_issue]]
train = "expansion.formatter"
title = "Deliver deterministic formatting"
problem = "Formatting lacks one complete syntax-preserving product across supported files, which risks semantic changes and makes configuration, range formatting, and embedded-language output inconsistent."
expected_outcome = "A deterministic formatter preserves meaning, comments, and source boundaries across supported JavaScript, TypeScript, Vue, Svelte, HTML, and style content."
acceptance = ["Repeated formatting is idempotent for every supported syntax.", "Comments, embedded content, and authored meaning are preserved.", "Configuration and range behavior are consistent across entry points."]
