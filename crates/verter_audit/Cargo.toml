[package]
name = "verter_audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Leaf observability substrate for Verter — audit record DTOs, observer trait, no-op observer, RequestKind/RequestKindPayload"
publish = false

[features]
default = []

[dependencies]
verter_span = { path = "../verter_span" }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = "0.12"
ts-rs = "10"

# Windows process-RSS reporting in `current_process_rss`. Requires
# `K32GetProcessMemoryInfo` (kernel32.dll, exposed by
# `Win32_System_ProcessStatus`) and `GetCurrentProcess` (kernel32.dll,
# exposed by `Win32_System_Threading`).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
