[package]
name = "verter_napi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Native Node.js bindings for Verter Vue compiler (NAPI-RS)"
# The test-only fixture addon is its own package; it is not part of this one.
exclude = ["tests/fixture_addon"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Gates the generator command below out of every default build. @napi-rs/cli
# passes no `--bin` filter to a crate that exposes a cdylib, so the release
# publish lane's `cargo build --release --target <T>` builds EVERY target of
# this package on all seven `napi.targets` — five of which no CI lane
# exercises. A generator has no business being linked for a Windows or musl
# publish, and a first link there would happen at publish time.
generate-host-request-ts = []
# The coordinated, default-off observation opt-in
# (docs/arch/semantic-observe.md). Builds the instrumentation binding: the
# audit records, footprints and provenance counters the audit methods
# return, and the counting global allocator behind the memory audit. A
# default build reports unavailable capture from those methods.
semantic-observe = ["verter_session/semantic-observe", "dep:backtrace"]
# Build the addon on the platform heap instead of mimalloc, for hardened
# builds (crates/verter_alloc documents the trade-off).
system-allocator = ["verter_alloc/system-allocator"]

# The generator that writes `packages/native/host-compile-request.generated.ts`.
# Declared explicitly so `required-features` can keep it out of the default
# target set: without a `[[bin]]` row it is auto-discovered and built by every
# `cargo build` of this package, the cross-compiled publish builds included.
# The cost of the gate is that a default `cargo check --all-targets` does not
# compile it; the freshness guard still compiles the renderer it calls, and the
# command below builds the bin itself.
#
#   cargo run -p verter_napi --features generate-host-request-ts \
#       --bin generate_host_compile_request_ts
[[bin]]
name = "generate_host_compile_request_ts"
path = "src/bin/generate_host_compile_request_ts.rs"
required-features = ["generate-host-request-ts"]

[dependencies]
verter_alloc = { path = "../verter_alloc" }
verter_resolution = { workspace = true }
verter_session_query = { workspace = true }
verter_audit = { path = "../verter_audit" }
verter_compiler = { path = "../verter_compiler", version = "0.0.1-beta.1" }
verter_css_syntax = { workspace = true }
verter_session = { path = "../verter_session", version = "0.0.1-beta.1" }
verter_type_engine = { path = "../verter_type_engine", version = "0.0.1-beta.1" }
verter_workspace = { path = "../verter_workspace", version = "0.0.1-beta.1" }
verter_ffi = { path = "../verter_ffi", version = "0.0.1-beta.1" }
verter_actions = { path = "../verter_actions", version = "0.0.1-beta.1" }
verter_diagnostics = { path = "../verter_diagnostics", version = "0.0.1-beta.1" }
verter_semantic = { path = "../verter_semantic" }
verter_type_expr = { workspace = true }
verter_protocol = { path = "../verter_protocol", version = "0.0.1-beta.1" }
prost = "0.14.4"
verter_span = { path = "../verter_span" }
verter_scheduler = { path = "../verter_scheduler" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "async", "dyn-symbols"] }
napi-derive = "3"
# Memory audit of the instrumented binding (src/memory_audit.rs):
# unresolved stack capture at sampled allocation sites, resolved lazily at
# memoryAuditSites() read time. Compiled only with `semantic-observe`.
backtrace = { version = "0.3.76", optional = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# The published TypeScript declaration of the host compile request is
# RENDERED from the Rust declarations that decode it
# (`src/host_compile_request_ts.rs`), never hand-written beside them.
ts-rs = "12"
serde_json = { workspace = true }
oxc_allocator = { workspace = true }
tokio = { version = "1.54", features = ["io-util", "process", "sync", "time", "rt", "macros"] }

# Node `dlopen`s the addon, so on Linux its mimalloc uses the local-dynamic
# TLS model: initial-exec TLS in a late-loaded image can fail with "cannot
# allocate memory in static TLS block" once the static TLS surplus is gone.
[target.'cfg(target_os = "linux")'.dependencies]
verter_alloc = { path = "../verter_alloc", features = ["local-dynamic-tls"] }

[dev-dependencies]
# The test-only Node addon `cases::real_js_host_request_boundary` loads. The
# edge is here so cargo builds the addon whenever it builds this crate's
# tests, which puts it beside the test binary instead of leaving that suite
# to spawn a `cargo build` of the whole native closure at run time. The
# addon is never used from Rust; `exclude` above keeps it out of this
# package, and a dev-dependency is dropped from a published manifest.
verter_napi_request_fixture = { path = "tests/fixture_addon" }
verter_css_syntax = { path = "../verter_css_syntax", features = ["test-support"] }
verter_semantic = { path = "../verter_semantic", features = ["test-support"] }
verter_session = { path = "../verter_session", features = ["test-support"] }

[build-dependencies]
napi-build = "2.6"
