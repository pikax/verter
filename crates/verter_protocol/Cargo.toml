[package]
name = "verter_protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Protocol Buffer transport schemas and encoders for Verter"
publish = false

[dependencies]
prost = "0.14.3"
serde = { workspace = true }
serde_json = { workspace = true }
verter_span = { path = "../verter_span" }
verter_language = { path = "../verter_language" }
verter_semantic = { path = "../verter_semantic" }
verter_type_expr = { workspace = true }
verter_no_typeexpr = { workspace = true }
rustc-hash = { workspace = true }
hashbrown = "0.15"
# The host compile-request DTOs below carry `ts_rs::TS` derives so the
# published TypeScript mirror of that request is RENDERED from these
# declarations rather than hand-written beside them. Following the other
# crates in this workspace that already derive it, ts-rs is a REGULAR
# dependency so the derives compile into every build that owns the schema
# — there is no build-time feature under which the schema exists but its
# TS projection does not. The typeinfo wire surface in this crate is
# protobuf-authoritative and carries no ts-rs derive; that separation is
# what `ts_rs_not_applied_to_wire_dtos` pins.
ts-rs = "12"

[build-dependencies]
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
static_assertions = "1.1.0"
# Tier 1A — `component_meta_flags_audit.rs` parses the syn-AST of the
# semantic crate to verify D123's `has_macro_failure` field shape.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "1.0.45"
