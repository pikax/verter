[package]
name = "verter_protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Protocol Buffer transport schemas and encoders for Verter"
publish = false

[dependencies]
prost = "0.14.3"
serde = { workspace = true }
serde_json = { workspace = true }
verter_span = { path = "../verter_span" }
verter_semantic = { path = "../verter_semantic" }
verter_type_expr = { workspace = true }

[build-dependencies]
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
# Tier 1A — `component_meta_flags_audit.rs` parses the syn-AST of the
# semantic crate to verify D123's `has_macro_failure` field shape.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "1.0.45"
# Used by `typeinfo_proto_ts_freshness.rs` to regenerate the TS
# bindings into a tempdir for byte-equality comparison.
tempfile = "3.27"
