  // resolved-macro entry exists for declaration identity + native_props (the
  // class-member visibility surface) + authority/provenance gating.
  reserved 7, 8, 9;
  reserved "props", "emits", "slots";
  uint32 macro_index = 1;
  uint32 macro_kind_id = 2;
  uint32 type_name_id = 3;
  uint32 import_source_id = 4;
