syntax = "proto3";

package verter.v1;

message ComponentMetaPayload {
  uint32 schema_version = 1;
  TypeGraph type_graph = 2;
  repeated TypeRegistryEntry type_registry = 3;
  ComponentMetaBody body = 4;
  OriginGraph origin_graph = 5;
}

message OriginGraph {
  repeated OriginNode nodes = 1;
  repeated OriginEdge edges = 2;
  repeated string meta_strings = 3;
}

message OriginNode {
  uint32 id = 1;
  uint32 kind_id = 2;
  uint32 label_id = 3;
}

message OriginEdge {
  uint32 source = 1;
  uint32 target = 2;
  uint32 kind_id = 3;
  uint32 meta_index = 4;
  bool has_meta = 5;
}

message TypeGraph {
  repeated string strings = 1;
  repeated TypeNode nodes = 2;
}

message TypeNode {
  oneof kind {
    PrimitiveNode primitive = 1;
    LiteralNode literal = 2;
    UnionNode union = 3;
    IntersectionNode intersection = 4;
    ArrayNode array = 5;
    TupleNode tuple = 6;
    ObjectNode object = 7;
    FunctionNode function = 8;
    RefNode ref = 9;
    TypeParameterNode type_parameter = 10;
    KeyOfNode key_of = 11;
    TypeOfNode type_of = 12;
    IndexedAccessNode indexed_access = 13;
    ConditionalNode conditional = 14;
    MappedNode mapped = 15;
    TemplateLiteralNode template_literal = 16;
    ParenthesizedNode parenthesized = 17;
    UnknownNode unknown = 18;
    InferNode infer = 19;
    RestNode rest = 20;
    RecursiveRefNode recursive_ref = 21;
  }
}

message PrimitiveNode {
  PrimitiveTag primitive = 1;
}

message LiteralNode {
  LiteralKind literal_kind = 1;
  uint32 string_id = 2;
  double number_value = 3;
  bool boolean_value = 4;
}

message UnionNode {
  repeated uint32 type_node_ids = 1;
}

message IntersectionNode {
  repeated uint32 type_node_ids = 1;
}

message ArrayNode {
  uint32 element_node_id = 1;
  bool readonly = 2;
}

message TupleNode {
  bool readonly = 1;
  repeated TupleElement elements = 2;
}

message TupleElement {
  uint32 label_id = 1;
  uint32 type_node_id = 2;
  bool optional = 3;
  bool rest = 4;
}

message ObjectNode {
  repeated ObjectMember members = 1;
}

message ObjectMember {
  ObjectMemberKind kind = 1;
  uint32 name_id = 2;
  uint32 type_node_id = 3;
  bool optional = 4;
  bool readonly = 5;
  uint32 key_name_id = 6;
  uint32 key_type_node_id = 7;
  uint32 value_type_node_id = 8;
  uint32 function_node_id = 9;
}

message FunctionNode {
  repeated FunctionParameter parameters = 1;
  uint32 return_type_node_id = 2;
  repeated uint32 type_parameter_node_ids = 3;
}

message FunctionParameter {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  bool optional = 3;
  bool rest = 4;
}

message RefNode {
  uint32 name_id = 1;
  repeated uint32 type_argument_node_ids = 2;
}

message TypeParameterNode {
  uint32 name_id = 1;
  uint32 constraint_node_id = 2;
  uint32 default_node_id = 3;
}

message KeyOfNode {
  uint32 operand_node_id = 1;
}

message TypeOfNode {
  repeated uint32 path_ids = 1;
}

message IndexedAccessNode {
  uint32 object_node_id = 1;
  uint32 index_node_id = 2;
}

message ConditionalNode {
  uint32 check_node_id = 1;
  uint32 extends_node_id = 2;
  uint32 true_type_node_id = 3;
  uint32 false_type_node_id = 4;
}

message MappedNode {
  uint32 parameter_id = 1;
  uint32 source_node_id = 2;
  uint32 value_node_id = 3;
  MappedModifier optional_modifier = 4;
  MappedModifier readonly_modifier = 5;
  uint32 name_type_node_id = 6;
}

message TemplateLiteralNode {
  repeated uint32 quasi_ids = 1;
  repeated uint32 expression_node_ids = 2;
}

message ParenthesizedNode {
  uint32 inner_node_id = 1;
}

message UnknownNode {
  uint32 raw_id = 1;
}

message InferNode {
  uint32 name_id = 1;
}

message RestNode {
  uint32 inner_node_id = 1;
}

message RecursiveRefNode {
  uint32 name_id = 1;
  repeated uint32 type_argument_node_ids = 2;
  repeated ConditionalFrameNode conditional_context = 3;
}

message ConditionalFrameNode {
  uint32 branch = 1;
  bool decided = 2;
  uint32 check_node_id = 3;
  uint32 extends_node_id = 4;
}

message TypeRegistryEntry {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  uint32 raw_type_id = 4;
  ResolvedTypeDeclaration declaration = 5;
}

message ComponentMetaBody {
  uint32 file_path_id = 1;
  bool options_api = 2;
  repeated PropMeta props = 3;
  repeated EventMeta events = 4;
  repeated SlotMeta slots = 5;
  repeated ModelMeta models = 6;
  repeated ExposedMeta exposed = 7;
  repeated ComponentUsage components = 8;
  repeated TemplateRefMeta template_refs = 9;
  repeated ImportMeta imports = 10;
  repeated BindingMeta bindings = 11;
  repeated VueApiCallMeta vue_api_calls = 12;
  repeated StyleMeta styles = 13;
  ComponentFlags flags = 14;
  repeated AcceptedPropMeta accepted_props = 15;
  repeated AcceptedEventMeta accepted_events = 16;
  AcceptedSurfaceCompleteness accepted_surface_completeness = 17;
  RootReachability root_reachability = 18;
  FallthroughSurface fallthrough_surface = 19;
  ComponentMetaResolution resolution = 20;
  RootInfo root_info = 21;
  PublicInstanceMeta public_instance = 22;
  SfcBlocksMeta sfc_blocks = 23;
  repeated MacroExpansionDiagnosticEntry macro_expansion_diagnostics = 24;
}

message MacroExpansionDiagnosticEntry {
  uint32 macro_kind_id = 1;
  uint32 macro_index = 2;
  ExpansionExactness exactness = 3;
  ExpansionExecutionStatus execution_status = 4;
  repeated ExpansionDiagnostic diagnostics = 5;
}

message JsdocTag {
  uint32 name_id = 1;
  uint32 text_id = 2;
}

message ExpansionMetadata {
  ExpansionExactness exactness = 1;
  ExpansionExecutionStatus execution_status = 2;
  repeated ExpansionDiagnostic diagnostics = 3;
}

message ExpansionDiagnostic {
  ExpansionStopReason reason = 1;
  uint32 context_id = 2;
  uint32 property_name_id = 3;
}

message PropMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  uint32 raw_type_id = 4;
  bool required = 5;
  bool has_default = 6;
  uint32 default_value_id = 7;
  uint32 description_id = 8;
  repeated JsdocTag tags = 9;
}

message EventMeta {
  uint32 name_id = 1;
  uint32 payload_node_id = 2;
  ExpansionMetadata payload_expansion = 3;
  uint32 raw_signature_id = 4;
  uint32 description_id = 5;
  repeated JsdocTag tags = 6;
}

message SlotMeta {
  uint32 name_id = 1;
  bool is_scoped = 2;
  repeated SlotBindingMeta bindings = 3;
  bool is_required = 4;
  uint32 return_type_id = 5;
  uint32 description_id = 6;
  repeated JsdocTag tags = 7;
}

message SlotBindingMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  uint32 raw_type_id = 4;
}

message ModelMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
}

message ExposedMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  uint32 description_id = 4;
}

message PublicInstanceMeta {
  PublicInstanceCompleteness completeness = 1;
  repeated PublicInstanceMemberMeta members = 2;
}

message PublicInstanceMemberMeta {
  uint32 name_id = 1;
  PublicInstanceMemberKind kind = 2;
  uint32 type_node_id = 3;
  ExpansionMetadata type_expansion = 4;
  uint32 raw_type_id = 5;
  uint32 description_id = 6;
}

message SfcBlocksMeta {
  TemplateBlockMeta template = 1;
  ScriptBlockMeta script = 2;
  ScriptBlockMeta script_setup = 3;
  repeated StyleBlockMeta styles = 4;
  repeated CustomBlockMeta custom = 5;
}

message SfcAttributeMeta {
  uint32 name_id = 1;
  uint32 value_id = 2;
}

message TemplateBlockMeta {
  uint32 lang_id = 1;
  uint32 src_id = 2;
  repeated SfcAttributeMeta attributes = 3;
}

message ScriptBlockMeta {
  uint32 lang_id = 1;
  uint32 src_id = 2;
  uint32 generic_id = 3;
  uint32 attrs_type_id = 4;
  repeated SfcAttributeMeta attributes = 5;
}

message StyleBlockMeta {
  uint32 index = 1;
  uint32 lang_id = 2;
  uint32 src_id = 3;
  bool scoped = 4;
  bool is_module = 5;
  uint32 module_name_id = 6;
  repeated SfcAttributeMeta attributes = 7;
}

message CustomBlockMeta {
  uint32 index = 1;
  uint32 block_type_id = 2;
  uint32 lang_id = 3;
  uint32 src_id = 4;
  repeated SfcAttributeMeta attributes = 5;
}

message ResolvedTypeDeclaration {
  uint32 requested_name_id = 1;
  uint32 resolved_name_id = 2;
  uint32 canonical_source_id = 3;
  uint32 span_start = 4;
  uint32 span_end = 5;
  uint32 kind_id = 6;
  uint32 text_id = 7;
}

message ComponentUsage {
  uint32 name_id = 1;
  uint32 import_source_id = 2;
  bool is_dynamic = 3;
  repeated ComponentPropUsage props = 4;
  repeated uint32 slots_used_ids = 5;
  repeated uint32 static_class_ids = 6;
  bool has_dynamic_class = 7;
  repeated uint32 v_model_ids = 8;
}

message ComponentPropUsage {
  uint32 name_id = 1;
  bool is_bound = 2;
  uint32 constness_id = 3;
}

message TemplateRefMeta {
  uint32 name_id = 1;
  bool is_dynamic = 2;
  uint32 target_tag_id = 3;
}

message ImportMeta {
  uint32 source_id = 1;
  bool is_type_only = 2;
  repeated ImportBindingMeta bindings = 3;
}

message ImportBindingMeta {
  uint32 name_id = 1;
  uint32 kind_id = 2;
  uint32 imported_name_id = 3;
  bool is_type_only = 4;
}

message BindingMeta {
  uint32 name_id = 1;
  uint32 kind_id = 2;
  uint32 reactivity_kind_id = 3;
  uint32 type_annotation_id = 4;
  bool used_in_template = 5;
  bool used_in_style = 6;
}

message VueApiCallMeta {
  uint32 api_id = 1;
  uint32 arg_value_id = 2;
}

message StyleMeta {
  uint32 lang_id = 1;
  bool scoped = 2;
  bool is_module = 3;
  uint32 module_name_id = 4;
  repeated uint32 class_ids = 5;
  repeated uint32 id_ids = 6;
  repeated uint32 custom_property_ids = 7;
  repeated uint32 v_bind_ids = 8;
  repeated SelectorMeta selectors = 9;
}

message SelectorMeta {
  uint32 text_id = 1;
  uint32 specificity_a = 2;
  uint32 specificity_b = 3;
  uint32 specificity_c = 4;
}

message ComponentFlags {
  bool async_setup = 1;
  bool has_reactive_state = 2;
  bool has_computed = 3;
  bool has_watchers = 4;
  bool has_lifecycle_hooks = 5;
  bool has_provide = 6;
  bool has_inject = 7;
  bool has_inherit_attrs_false = 8;
  bool has_store_usage = 9;
}

message AcceptedPropMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  uint32 raw_type_id = 3;
  bool required = 4;
  MemberProvenance provenance = 5;
  MemberAvailability availability = 6;
  AcceptedPropKind kind = 7;
}

message AcceptedEventMeta {
  uint32 name_id = 1;
  uint32 payload_node_id = 2;
  uint32 raw_signature_id = 3;
  MemberProvenance provenance = 4;
  MemberAvailability availability = 5;
  AcceptedEventKind kind = 6;
}

message MemberProvenance {
  MemberProvenanceKind kind = 1;
  repeated InheritedSource sources = 2;
}

message InheritedSource {
  InheritedSourceKind kind = 1;
  uint32 tag_id = 2;
  uint32 canonical_id_id = 3;
}

message MemberAvailability {
  MemberAvailabilityKind kind = 1;
  repeated uint32 branch_key_ids = 2;
}

message RootReachability {
  RootReachabilityKind kind = 1;
  NoFallthroughReason reason = 2;
  repeated RootBranch branches = 3;
}

message RootInfo {
  RootInfoKind kind = 1;
  NoFallthroughReason reason = 2;
  repeated RootTargetRef targets = 3;
}

message RootBranch {
  uint32 branch_index = 1;
  uint32 condition_text_id = 2;
  RootTargetRef target = 3;
  ConsumedRootBindings consumed = 4;
  bool has_unknown_spread = 5;
}

message RootTargetRef {
  RootTargetKind kind = 1;
  uint32 element_index = 2;
  uint32 usage_index = 3;
  uint32 tag_id = 4;
  uint32 name_id = 5;
  uint32 import_source_id = 6;
  UnresolvedRootTargetReason unresolved_reason = 7;
}

message UnresolvedRootTargetReason {
  UnresolvedRootTargetReasonKind kind = 1;
  uint32 tag_id = 2;
}

message ConsumedRootBindings {
  repeated uint32 attr_ids = 1;
  repeated uint32 listener_ids = 2;
  bool has_dynamic_attr_name = 3;
  bool has_dynamic_listener_name = 4;
}

message FallthroughSurface {
  FallthroughSurfaceKind kind = 1;
  NoFallthroughReason reason = 2;
  repeated FallthroughBranch branches = 3;
}

message FallthroughBranch {
  uint32 branch_key_id = 1;
  uint32 condition_text_id = 2;
  repeated FallthroughPropEntry props = 3;
  repeated FallthroughEventEntry events = 4;
  repeated ResolvedRootStep root_chain = 5;
  BranchStatus status = 6;
}

message FallthroughPropEntry {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  uint32 raw_type_id = 3;
  repeated InheritedSource sources = 4;
}

message FallthroughEventEntry {
  uint32 name_id = 1;
  uint32 payload_node_id = 2;
  uint32 raw_signature_id = 3;
  repeated InheritedSource sources = 4;
}

message BranchStatus {
  BranchStatusKind kind = 1;
  repeated PartialBranchReason reasons = 2;
  UnresolvedBranchReason reason = 3;
}

message PartialBranchReason {
  PartialBranchReasonKind kind = 1;
  GenericResolutionFailure failure = 2;
}

message UnresolvedBranchReason {
  UnresolvedBranchReasonKind kind = 1;
  uint32 canonical_id_id = 2;
  uint32 import_source_id = 3;
  UnresolvedRootTargetReason root_target_reason = 4;
  GenericResolutionFailure failure = 5;
}

message ResolvedRootStep {
  ResolvedRootStepKind kind = 1;
  uint32 tag_id = 2;
  uint32 canonical_id_id = 3;
  uint32 component_name_id = 4;
  UnresolvedBranchReason reason = 5;
}

message ComponentMetaResolution {
  uint32 mode_id = 1;
  repeated ResolvedMacroMeta macros = 2;
}

message ResolvedMacroMeta {
  uint32 macro_index = 1;
  uint32 macro_kind_id = 2;
  uint32 type_name_id = 3;
  uint32 import_source_id = 4;
  ResolvedTypeDeclaration declaration = 5;
  repeated ResolvedNativeProp native_props = 6;
  repeated ResolvedPropField props = 7;
  repeated ResolvedEmitField emits = 8;
  repeated ResolvedSlotField slots = 9;
  ResolvedJsdocBlock jsdoc = 10;
}

message ResolvedNativeProp {
  uint32 name_id = 1;
  bool is_optional = 2;
  uint32 type_annotation_id = 3;
  uint32 visibility_id = 4;
  uint32 span_start = 5;
  uint32 span_end = 6;
}

message ResolvedPropField {
  uint32 name_id = 1;
  bool is_optional = 2;
  uint32 type_annotation_id = 3;
  uint32 description_id = 4;
  repeated JsdocTag tags = 5;
}

message ResolvedEmitField {
  uint32 name_id = 1;
  uint32 payload_type_id = 2;
  uint32 description_id = 3;
  repeated JsdocTag tags = 5;
}

message ResolvedSlotField {
  uint32 name_id = 1;
  bool is_required = 2;
  repeated ResolvedSlotBinding bindings = 3;
  uint32 return_type_id = 4;
  uint32 description_id = 5;
  repeated JsdocTag tags = 6;
}

message ResolvedSlotBinding {
  uint32 name_id = 1;
  uint32 type_annotation_id = 2;
}

message ResolvedJsdocBlock {
  uint32 description_id = 1;
  repeated ResolvedJsdocTag tags = 2;
}

message ResolvedJsdocTag {
  uint32 name_id = 1;
  uint32 text_id = 2;
  uint32 raw_type_id = 3;
  uint32 subject_name_id = 4;
  uint32 resolved_type_node_id = 5;
}

enum PrimitiveTag {
  PRIMITIVE_TAG_UNSPECIFIED = 0;
  PRIMITIVE_TAG_STRING = 1;
  PRIMITIVE_TAG_NUMBER = 2;
  PRIMITIVE_TAG_BOOLEAN = 3;
  PRIMITIVE_TAG_SYMBOL = 4;
  PRIMITIVE_TAG_BIGINT = 5;
  PRIMITIVE_TAG_ANY = 6;
  PRIMITIVE_TAG_UNKNOWN = 7;
  PRIMITIVE_TAG_VOID = 8;
  PRIMITIVE_TAG_NEVER = 9;
  PRIMITIVE_TAG_NULL = 10;
  PRIMITIVE_TAG_UNDEFINED = 11;
  PRIMITIVE_TAG_OBJECT = 12;
}

enum LiteralKind {
  LITERAL_KIND_UNSPECIFIED = 0;
  LITERAL_KIND_STRING = 1;
  LITERAL_KIND_NUMBER = 2;
  LITERAL_KIND_BOOLEAN = 3;
  LITERAL_KIND_BIG_INT = 4;
}

enum ObjectMemberKind {
  OBJECT_MEMBER_KIND_UNSPECIFIED = 0;
  OBJECT_MEMBER_KIND_PROPERTY = 1;
  OBJECT_MEMBER_KIND_INDEX_SIGNATURE = 2;
  OBJECT_MEMBER_KIND_CALL_SIGNATURE = 3;
  OBJECT_MEMBER_KIND_CONSTRUCT_SIGNATURE = 4;
  OBJECT_MEMBER_KIND_METHOD = 5;
}

enum MappedModifier {
  MAPPED_MODIFIER_UNSPECIFIED = 0;
  MAPPED_MODIFIER_NONE = 1;
  MAPPED_MODIFIER_ADD = 2;
  MAPPED_MODIFIER_REMOVE = 3;
}

enum ExpansionExactness {
  EXPANSION_EXACTNESS_UNSPECIFIED = 0;
  EXPANSION_EXACTNESS_EXACT_CONCRETE = 1;
  EXPANSION_EXACTNESS_EXACT_SYMBOLIC = 2;
  EXPANSION_EXACTNESS_INCOMPLETE = 3;
}

enum ExpansionExecutionStatus {
  EXPANSION_EXECUTION_STATUS_UNSPECIFIED = 0;
  EXPANSION_EXECUTION_STATUS_COMPLETED = 1;
  EXPANSION_EXECUTION_STATUS_CANCELLED = 2;
  EXPANSION_EXECUTION_STATUS_INTERRUPTED = 3;
  EXPANSION_EXECUTION_STATUS_HARD_STOP = 4;
}

enum ExpansionStopReason {
  EXPANSION_STOP_REASON_UNSPECIFIED = 0;
  EXPANSION_STOP_REASON_BUDGET_EXCEEDED = 1;
  EXPANSION_STOP_REASON_MAPPED_DEPTH_EXCEEDED = 2;
  EXPANSION_STOP_REASON_UNRESOLVED_REFERENCE = 3;
  EXPANSION_STOP_REASON_INDETERMINATE_CONDITIONAL = 4;
  EXPANSION_STOP_REASON_INFINITE_KEY_SPACE = 5;
  EXPANSION_STOP_REASON_UNSUPPORTED_OPERATOR = 6;
  EXPANSION_STOP_REASON_CONDITIONAL_CONTEXT_TRUNCATED = 7;
}

enum AcceptedSurfaceCompleteness {
  ACCEPTED_SURFACE_COMPLETENESS_UNSPECIFIED = 0;
  ACCEPTED_SURFACE_COMPLETENESS_EXACT = 1;
  ACCEPTED_SURFACE_COMPLETENESS_LOWER_BOUND = 2;
}

enum PublicInstanceCompleteness {
  PUBLIC_INSTANCE_COMPLETENESS_UNSPECIFIED = 0;
  PUBLIC_INSTANCE_COMPLETENESS_EXACT = 1;
  PUBLIC_INSTANCE_COMPLETENESS_PARTIAL = 2;
}

enum PublicInstanceMemberKind {
  PUBLIC_INSTANCE_MEMBER_KIND_UNSPECIFIED = 0;
  PUBLIC_INSTANCE_MEMBER_KIND_PROP = 1;
  PUBLIC_INSTANCE_MEMBER_KIND_SLOT_CONTAINER = 2;
  PUBLIC_INSTANCE_MEMBER_KIND_EXPOSED = 3;
}

enum AcceptedPropKind {
  ACCEPTED_PROP_KIND_UNSPECIFIED = 0;
  ACCEPTED_PROP_KIND_DECLARED_PROP = 1;
  ACCEPTED_PROP_KIND_ATTR = 2;
}

enum AcceptedEventKind {
  ACCEPTED_EVENT_KIND_UNSPECIFIED = 0;
  ACCEPTED_EVENT_KIND_DECLARED_EMIT = 1;
  ACCEPTED_EVENT_KIND_LISTENER = 2;
}

enum MemberProvenanceKind {
  MEMBER_PROVENANCE_KIND_UNSPECIFIED = 0;
  MEMBER_PROVENANCE_KIND_DECLARED = 1;
  MEMBER_PROVENANCE_KIND_INHERITED = 2;
}

enum InheritedSourceKind {
  INHERITED_SOURCE_KIND_UNSPECIFIED = 0;
  INHERITED_SOURCE_KIND_NATIVE_TAG = 1;
  INHERITED_SOURCE_KIND_COMPONENT = 2;
}

enum MemberAvailabilityKind {
  MEMBER_AVAILABILITY_KIND_UNSPECIFIED = 0;
  MEMBER_AVAILABILITY_KIND_ALWAYS = 1;
  MEMBER_AVAILABILITY_KIND_CONDITIONAL = 2;
}

enum NoFallthroughReason {
  NO_FALLTHROUGH_REASON_UNSPECIFIED = 0;
  NO_FALLTHROUGH_REASON_INHERIT_ATTRS_FALSE = 1;
  NO_FALLTHROUGH_REASON_MULTI_ROOT = 2;
  NO_FALLTHROUGH_REASON_BRANCH_NOT_SINGLE_ROOT = 3;
  NO_FALLTHROUGH_REASON_ROOT_V_FOR = 4;
  NO_FALLTHROUGH_REASON_NO_TEMPLATE = 5;
  NO_FALLTHROUGH_REASON_EMPTY_TEMPLATE = 6;
  NO_FALLTHROUGH_REASON_TEXT_OR_INTERPOLATION_ROOT = 7;
}

enum RootReachabilityKind {
  ROOT_REACHABILITY_KIND_UNSPECIFIED = 0;
  ROOT_REACHABILITY_KIND_NO_FALLTHROUGH = 1;
  ROOT_REACHABILITY_KIND_BRANCHES = 2;
}

enum RootInfoKind {
  ROOT_INFO_KIND_UNSPECIFIED = 0;
  ROOT_INFO_KIND_NONE = 1;
  ROOT_INFO_KIND_SINGLE = 2;
  ROOT_INFO_KIND_CONDITIONAL = 3;
  ROOT_INFO_KIND_MULTIPLE = 4;
}

enum RootTargetKind {
  ROOT_TARGET_KIND_UNSPECIFIED = 0;
  ROOT_TARGET_KIND_NATIVE_ELEMENT = 1;
  ROOT_TARGET_KIND_DYNAMIC_COMPONENT_USAGE = 2;
  ROOT_TARGET_KIND_COMPONENT_USAGE = 3;
  ROOT_TARGET_KIND_UNRESOLVED = 4;
}

enum UnresolvedRootTargetReasonKind {
  UNRESOLVED_ROOT_TARGET_REASON_KIND_UNSPECIFIED = 0;
  UNRESOLVED_ROOT_TARGET_REASON_KIND_DYNAMIC_COMPONENT_IS = 1;
  UNRESOLVED_ROOT_TARGET_REASON_KIND_SLOT_OUTLET = 2;
  UNRESOLVED_ROOT_TARGET_REASON_KIND_UNSUPPORTED_BUILTIN = 3;
  UNRESOLVED_ROOT_TARGET_REASON_KIND_MISSING_USAGE_LINK = 4;
  UNRESOLVED_ROOT_TARGET_REASON_KIND_UNRESOLVED_IMPORT = 5;
  UNRESOLVED_ROOT_TARGET_REASON_KIND_UNKNOWN_ROOT_TARGET = 6;
}

enum FallthroughSurfaceKind {
  FALLTHROUGH_SURFACE_KIND_UNSPECIFIED = 0;
  FALLTHROUGH_SURFACE_KIND_NONE = 1;
  FALLTHROUGH_SURFACE_KIND_BRANCHES = 2;
}

enum GenericResolutionFailure {
  GENERIC_RESOLUTION_FAILURE_UNSPECIFIED = 0;
  GENERIC_RESOLUTION_FAILURE_SPREAD_INPUT = 1;
  GENERIC_RESOLUTION_FAILURE_DYNAMIC_KEY = 2;
  GENERIC_RESOLUTION_FAILURE_MISSING_TYPE = 3;
  GENERIC_RESOLUTION_FAILURE_UNSUPPORTED_EXPRESSION = 4;
  GENERIC_RESOLUTION_FAILURE_MISSING_USAGE_LINK = 5;
  GENERIC_RESOLUTION_FAILURE_UNRESOLVED_CHILD_GENERIC_SURFACE = 6;
}

enum BranchStatusKind {
  BRANCH_STATUS_KIND_UNSPECIFIED = 0;
  BRANCH_STATUS_KIND_RESOLVED = 1;
  BRANCH_STATUS_KIND_PARTIALLY_UNRESOLVED = 2;
  BRANCH_STATUS_KIND_UNRESOLVED = 3;
}

enum PartialBranchReasonKind {
  PARTIAL_BRANCH_REASON_KIND_UNSPECIFIED = 0;
  PARTIAL_BRANCH_REASON_KIND_DYNAMIC_ATTR_NAME = 1;
