syntax = "proto3";

package verter.v1;

message ComponentMetaPayload {
  uint32 schema_version = 1;
  TypeGraph type_graph = 2;
  repeated TypeRegistryEntry type_registry = 3;
  ComponentMetaBody body = 4;
  // Audit-only. Populated only when host audit_enabled=true AND
  // footprint_capture=true (matches LSP hover-provenance gate at
  // server.rs:6918-6953). Default-mode consumers see this field absent.
  OriginGraph origin_graph = 5;
}

message OriginGraph {
  repeated OriginNode nodes = 1;
  repeated OriginEdge edges = 2;
  repeated string meta_strings = 3;
}

message OriginNode {
  uint32 id = 1;
  uint32 kind_id = 2;
  uint32 label_id = 3;
}

message OriginEdge {
  uint32 source = 1;
  uint32 target = 2;
  uint32 kind_id = 3;
  uint32 meta_index = 4;
  bool has_meta = 5;
}

message TypeGraph {
  repeated string strings = 1;
  repeated TypeNode nodes = 2;
}

message TypeNode {
  oneof kind {
    PrimitiveNode primitive = 1;
    LiteralNode literal = 2;
    UnionNode union = 3;
    IntersectionNode intersection = 4;
    ArrayNode array = 5;
    TupleNode tuple = 6;
    ObjectNode object = 7;
    FunctionNode function = 8;
    RefNode ref = 9;
    TypeParameterNode type_parameter = 10;
    KeyOfNode key_of = 11;
    TypeOfNode type_of = 12;
    IndexedAccessNode indexed_access = 13;
    ConditionalNode conditional = 14;
    MappedNode mapped = 15;
    TemplateLiteralNode template_literal = 16;
    ParenthesizedNode parenthesized = 17;
    UnknownNode unknown = 18;
    InferNode infer = 19;
    RestNode rest = 20;
    RecursiveRefNode recursive_ref = 21;
    SyntheticSlotBindingNode synthetic_slot_binding = 22;
  }
}

// Intrinsic, leaf carrier minted by `publish_merged_bindings` when a slot
// binding (or `defineSlots` binding) has no parser-side binding expression.
// Carrier identity is the full (scope, surface_kind, slot_name, binding_name,
// value_node) tuple; consumers MUST NOT resolve `binding_name_id` as a type
// alias through `TypeRegistry`. `value_node` is serialized as a decimal
// STRING to avoid JS Number precision loss on `u64` semantic-node ids.
message SyntheticSlotBindingNode {
  string value_node = 1;
  uint32 scope_canonical_id = 2;
  uint32 surface_kind = 3;
  uint32 slot_name_id = 4;
  uint32 binding_name_id = 5;
}

message PrimitiveNode {
  PrimitiveTag primitive = 1;
}

message LiteralNode {
  LiteralKind literal_kind = 1;
  uint32 string_id = 2;
  double number_value = 3;
  bool boolean_value = 4;
}

message UnionNode {
  repeated uint32 type_node_ids = 1;
}

message IntersectionNode {
  repeated uint32 type_node_ids = 1;
}

message ArrayNode {
  uint32 element_node_id = 1;
  bool readonly = 2;
}

message TupleNode {
  bool readonly = 1;
  repeated TupleElement elements = 2;
}

message TupleElement {
  uint32 label_id = 1;
  uint32 type_node_id = 2;
  bool optional = 3;
  bool rest = 4;
}

message ObjectNode {
  repeated ObjectMember members = 1;
}

message ObjectMember {
  ObjectMemberKind kind = 1;
  reserved 2;
  uint32 type_node_id = 3;
  bool optional = 4;
  bool readonly = 5;
  uint32 key_name_id = 6;
  uint32 key_type_node_id = 7;
  uint32 value_type_node_id = 8;
  uint32 function_node_id = 9;
  ComponentPropertyKey property_key = 10;
  ComponentObjectMethodKind method_kind = 11;
  bool has_implementation_body = 12;
}

message ComponentPropertyKey {
  oneof key {
    uint32 string_id = 1;
    sint64 canonical_number = 2;
    GraphUniqueSymbolKey unique_symbol = 3;
    uint32 computed_node_id = 4;
  }
}

message GraphUniqueSymbolKey {
  uint32 canonical_id = 1;
  uint32 owner_kind = 2;
  uint32 owner_ordinal = 3;
  uint32 symbol = 4;
  repeated uint32 member_path = 5;
}

enum ComponentObjectMethodKind {
  COMPONENT_OBJECT_METHOD_KIND_METHOD = 0;
  COMPONENT_OBJECT_METHOD_KIND_GET = 1;
  COMPONENT_OBJECT_METHOD_KIND_SET = 2;
}

message FunctionNode {
  repeated FunctionParameter parameters = 1;
  uint32 return_type_node_id = 2;
  repeated uint32 type_parameter_node_ids = 3;
}

message FunctionParameter {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  bool optional = 3;
  bool rest = 4;
}

message RefNode {
  uint32 name_id = 1;
  repeated uint32 type_argument_node_ids = 2;
}

message TypeParameterNode {
  uint32 name_id = 1;
  uint32 constraint_node_id = 2;
  uint32 default_node_id = 3;
}

message KeyOfNode {
  uint32 operand_node_id = 1;
}

message TypeOfNode {
  repeated uint32 path_ids = 1;
}

message IndexedAccessNode {
  uint32 object_node_id = 1;
  uint32 index_node_id = 2;
}

message ConditionalNode {
  uint32 check_node_id = 1;
  uint32 extends_node_id = 2;
  uint32 true_type_node_id = 3;
  uint32 false_type_node_id = 4;
}

message MappedNode {
  uint32 parameter_id = 1;
  uint32 source_node_id = 2;
  uint32 value_node_id = 3;
  MappedModifier optional_modifier = 4;
  MappedModifier readonly_modifier = 5;
  uint32 name_type_node_id = 6;
}

message TemplateLiteralNode {
  repeated uint32 quasi_ids = 1;
  repeated uint32 expression_node_ids = 2;
}

message ParenthesizedNode {
  uint32 inner_node_id = 1;
}

message UnknownNode {
  uint32 raw_id = 1;
}

message InferNode {
  uint32 name_id = 1;
}

message RestNode {
  uint32 inner_node_id = 1;
}

message RecursiveRefNode {
  uint32 name_id = 1;
  repeated uint32 type_argument_node_ids = 2;
  repeated ConditionalFrameNode conditional_context = 3;
}

message ConditionalFrameNode {
  uint32 branch = 1;
  bool decided = 2;
  uint32 check_node_id = 3;
  uint32 extends_node_id = 4;
}

message TypeRegistryEntry {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  uint32 raw_type_id = 4;
  ResolvedTypeDeclaration declaration = 5;
}

message ComponentMetaBody {
  uint32 file_path_id = 1;
  bool options_api = 2;
  repeated PropMeta props = 3;
  repeated EventMeta events = 4;
  repeated SlotMeta slots = 5;
  repeated ModelMeta models = 6;
  repeated ExposedMeta exposed = 7;
  repeated ComponentUsage components = 8;
  repeated TemplateRefMeta template_refs = 9;
  repeated ImportMeta imports = 10;
  repeated BindingMeta bindings = 11;
  repeated VueApiCallMeta vue_api_calls = 12;
  repeated StyleMeta styles = 13;
  ComponentFlags flags = 14;
  repeated AcceptedPropMeta accepted_props = 15;
  repeated AcceptedEventMeta accepted_events = 16;
  AcceptedSurfaceCompleteness accepted_surface_completeness = 17;
  RootReachability root_reachability = 18;
  FallthroughSurface fallthrough_surface = 19;
  ComponentMetaResolution resolution = 20;
  RootInfo root_info = 21;
  PublicInstanceMeta public_instance = 22;
  reserved 23;
  reserved "sfc_blocks";
  repeated MacroExpansionDiagnosticEntry macro_expansion_diagnostics = 24;
  OrderedSfcStructure ordered_sfc_structure = 25;
  ComponentContractAvailability component_public_contract = 26;
  ResultCompleteness result_completeness = 27;
}

// Typed completeness of the published component surface. COMPLETE means the
// payload is the full surface the component declares; PARTIAL means the
// producing compute degraded and members may be missing or unverified, and
// carries the reason classes it degraded for. Without this position an
// empty-because-degraded payload is indistinguishable from an
// empty-because-nothing-is-declared payload.
message ResultCompleteness {
  ResultCompletenessKind kind = 1;
  repeated SurfacePartialReason partial_reasons = 2;
}

message MacroExpansionDiagnosticEntry {
  uint32 macro_kind_id = 1;
  uint32 macro_index = 2;
  ExpansionExactness exactness = 3;
  ExpansionExecutionStatus execution_status = 4;
  repeated ExpansionDiagnostic diagnostics = 5;
}

message JsdocTag {
  uint32 name_id = 1;
  uint32 text_id = 2;
}

message ExpansionMetadata {
  ExpansionExactness exactness = 1;
  ExpansionExecutionStatus execution_status = 2;
  repeated ExpansionDiagnostic diagnostics = 3;
}

message ExpansionDiagnostic {
  ExpansionStopReason reason = 1;
  uint32 context_id = 2;
  uint32 property_name_id = 3;
}

message TypePublication {
  TypePublicationKind kind = 1;
  TypePublicationFailure failure = 2;
  TypePublicationAbsence absence = 3;
  TypePublicationProvenance provenance = 4;
  TypePublicationSemanticAuthority semantic_authority = 5;
  TypePublicationExactness exactness = 6;
  TypePublicationReason reason = 7;
  TypePublicationPolicyReason policy_reason = 8;
  SymbolicEquivalenceKind symbolic_proof = 9;
}

message TerminalTypeDisplay {
  uint32 text_id = 1;
}

message ComponentContractAvailability {
  oneof availability {
    ComponentPublicContract supported = 1;
    ComponentContractUnsupported unsupported = 2;
  }
}

message ComponentContractUnsupported {
  uint32 adapter_id = 1;
  ComponentContractUnsupportedReason reason = 2;
  ComponentMetaOutputLane output_lane = 3;
  uint32 index = 4;
  uint32 inner_index = 5;
  bool has_inner_index = 6;
  ComponentMetaOutputFailure output_failure = 7;
  ContractSurface publication_surface = 8;
  TypePublicationFailure publication_failure = 9;
  TypePublicationProvenance publication_provenance = 10;
  repeated ResolutionDiagnostic diagnostics = 11;
}

message ComponentPublicContract {
  uint32 adapter_id = 1;
  ContractExactness exactness = 2;
  repeated ContractDegradation degradation = 3;
  ContractProvenance provenance = 4;
  repeated PublicProp props = 5;
  repeated PublicEvent events = 6;
  repeated PublicSlot slots = 7;
}

message ContractDegradation {
  ContractSurface surface = 1;
  ContractDegradationReason reason = 2;
  repeated ResolutionDiagnostic diagnostics = 3;
}

message ContractSurface {
  ContractSurfaceKind kind = 1;
  uint32 name_id = 2;
  uint32 binding_id = 3;
  uint32 overload_index = 4;
}

message ResolutionDiagnostic {
  ResolutionDiagnosticKind kind = 1;
  uint32 context_id = 2;
  uint32 property_name_id = 3;
}

message PublicTypeReference {
  uint32 type_node_id = 1;
  TypePublication publication = 2;
  TerminalTypeDisplay terminal_display = 3;
}

message PublicProp {
  uint32 name_id = 1;
  bool optional = 2;
  bool has_default = 3;
  PublicTypeReference type = 4;
  ContractExactness exactness = 5;
  repeated ContractDegradation degradation = 6;
  ContractProvenance provenance = 7;
}

message PublicEvent {
  uint32 name_id = 1;
  repeated PublicCallSignature overloads = 2;
  PublicDerivedHandlerShape derived_handler = 3;
  ContractExactness exactness = 4;
  repeated ContractDegradation degradation = 5;
  ContractProvenance provenance = 6;
}

message PublicCallSignature {
  PublicTypeReference source = 1;
  repeated PublicParameter parameters = 2;
  uint32 return_type_node_id = 3;
}

message PublicParameter {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  bool optional = 3;
  bool rest = 4;
}

message PublicDerivedHandlerShape {
  repeated PublicHandlerSignature overloads = 1;
}

message PublicHandlerSignature {
  repeated PublicParameter parameters = 1;
  uint32 return_type_node_id = 2;
}

message PublicSlot {
  uint32 name_id = 1;
  bool optional = 2;
  PublicSlotInput input = 3;
  PublicTypeReference return_type = 4;
  ContractExactness exactness = 5;
  repeated ContractDegradation degradation = 6;
  ContractProvenance provenance = 7;
}

message PublicSlotInput {
  repeated PublicSlotBinding bindings = 1;
}

message PublicSlotBinding {
  uint32 name_id = 1;
  PublicTypeReference type = 2;
}

message PropMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  reserved 4;
  reserved "raw_type_id";
  bool required = 5;
  bool has_default = 6;
  uint32 default_value_id = 7;
  uint32 description_id = 8;
  repeated JsdocTag tags = 9;
  // Producer fact: did the SFC author write this prop name explicitly as a
  // member of the `defineProps<T>()` type argument's own body (or the
  // directly-referenced interface's own body)? Distinguishes author-
  // declared names from names that arrived via heritage / utility-type
  // expansion. Consumed by
  // `@verter/component-meta/published-surface`'s `Refined` policy.
  bool declared_in_macro_type_arg = 10;
  TypePublication publication = 11;
  TerminalTypeDisplay terminal_display = 12;
}

message EventMeta {
  uint32 name_id = 1;
  uint32 payload_node_id = 2;
  ExpansionMetadata payload_expansion = 3;
  uint32 raw_signature_id = 4;
  uint32 description_id = 5;
  repeated JsdocTag tags = 6;
  TypePublication publication = 7;
  TerminalTypeDisplay terminal_display = 8;
}

message SlotMeta {
  uint32 name_id = 1;
  bool is_scoped = 2;
  repeated SlotBindingMeta bindings = 3;
  bool is_required = 4;
  uint32 return_type_id = 5;
  uint32 description_id = 6;
  repeated JsdocTag tags = 7;
  // Producer fact: does this slot come from the component's own AUTHORED
  // slots surface (the resolved `defineSlots<T>()` macro surface or a
  // template `<slot>` element)? Consumed by the
  // `@verter/component-meta/published-surface` Compat/Refined slot
  // blocklist — an author-declared slot is never blocked.
  bool declared_in_macro_type_arg = 8;
  uint32 return_value_node_id = 9;
  TypePublication return_publication = 10;
  TerminalTypeDisplay return_terminal_display = 11;
}

message SlotBindingMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  reserved 4;
  reserved "raw_type_id";
  TypePublication publication = 5;
  TerminalTypeDisplay terminal_display = 6;
}

message ModelMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
}

message ExposedMeta {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  ExpansionMetadata type_expansion = 3;
  uint32 description_id = 4;
  repeated JsdocTag tags = 5;
}

message PublicInstanceMeta {
  PublicInstanceCompleteness completeness = 1;
  repeated PublicInstanceMemberMeta members = 2;
}

message PublicInstanceMemberMeta {
  uint32 name_id = 1;
  PublicInstanceMemberKind kind = 2;
  uint32 type_node_id = 3;
  ExpansionMetadata type_expansion = 4;
  uint32 raw_type_id = 5;
  uint32 description_id = 6;
  repeated JsdocTag tags = 7;
}

message OrderedSfcStructure {
  uint32 schema_version = 1;
  string artifact_token = 2;
  repeated StructureBlock blocks = 3;
  repeated MarkupNode markup_nodes = 4;
  reserved 5;
  reserved "markup_root_tokens";
}

message StructureBlock {
  oneof kind {
    SectionBlock section = 1;
    MarkupRootBlock markup_root = 2;
  }
}

message SectionBlock {
  StructureSection common = 1;
  repeated string markup_root_tokens = 2;
}

message MarkupRootBlock {
  string block_token = 1;
  string markup_root_token = 2;
}

message BlockContentBasisTokenV1 {
  string value = 1;
}

message StructureSection {
  string block_token = 1;
  CarrierBlockRole role = 2;
  AuthoredName authored_name = 3;
  CanonicalRange opening_range = 4;
  CanonicalRange opening_name_range = 5;
  CanonicalRange content_range = 6;
  CanonicalRange closing_range = 7;
  CanonicalRange closing_name_range = 8;
  CanonicalRange full_range = 9;
  SyntaxTermination termination = 10;
  reserved 11;
  reserved "recovery";
  repeated CarrierAttribute attributes = 12;
  BlockContentBasisTokenV1 block_content_basis_token = 13;
  CanonicalRange attribute_insertion_anchor = 14;
}

message CarrierBlockRole {
  oneof kind {
    Empty template_host = 1;
    ScriptBlockRole script = 2;
    StyleBlockRole style = 3;
    CustomBlockRole custom = 4;
  }
}

message Empty {}
message ScriptBlockRole { string role = 1; string dialect = 2; }
message StyleBlockRole { string dialect = 1; bool scoped = 2; string module = 3; }
message CustomBlockRole { string normalized_name = 1; }

message AuthoredName {
  string spelling = 1;
  string normalized = 2;
  CanonicalRange range = 3;
}

message AuthoredSlice {
  string text = 1;
  CanonicalRange range = 2;
}

message CanonicalRange {
  string source_space_token = 1;
  PositionEncoding encoding = 2;
  oneof representation {
    OffsetRange offset_range = 3;
    LineCharacterRange line_character_range = 4;
  }
  string encoding_session_token = 5;
}

message OffsetRange { uint32 start = 1; uint32 end = 2; }
message LineCharacter { uint32 line = 1; uint32 character = 2; }
message LineCharacterRange { LineCharacter start = 1; LineCharacter end = 2; }
enum PositionEncoding {
  POSITION_ENCODING_UNSPECIFIED = 0;
  POSITION_ENCODING_UTF8_BYTES = 1;
  POSITION_ENCODING_UTF16_CODE_UNITS = 2;
  POSITION_ENCODING_UTF32_CODE_POINTS = 3;
}

message SyntaxTermination {
  oneof kind {
    Empty closed = 1;
    Empty self_closing = 2;
    Empty void = 3;
    Empty unclosed_eof = 4;
    RecoveredTermination recovered = 5;
  }
}
message RecoveredTermination { string reason = 1; CanonicalRange recovery_range = 2; }

message CarrierAttribute {
  oneof kind {
    NamedAttribute named = 1;
    SpreadAttribute spread = 2;
    DirectiveAttribute directive = 3;
    AttachAttribute attach = 4;
  }
}
message NamedAttribute {
  string attribute_token = 1;
  AuthoredName name = 2;
  string syntax = 3;
  AttributeValue value = 4;
  CanonicalRange full_range = 5;
  string duplicate_of = 6;
}
message SpreadAttribute {
  string attribute_token = 1;
  CanonicalRange full_range = 2;
  CanonicalRange open_range = 3;
  CanonicalRange expression_range = 4;
  CanonicalRange close_range = 5;
  SyntaxTermination termination = 6;
}
message AttachAttribute {
  string attribute_token = 1;
  CanonicalRange full_range = 2;
  CanonicalRange keyword_range = 3;
  CanonicalRange expression_range = 4;
  CanonicalRange close_range = 5;
  SyntaxTermination termination = 6;
}
message DirectiveAttribute {
  string attribute_token = 1;
  string family = 2;
  CanonicalRange prefix_range = 3;
  AuthoredName local_name = 4;
  DirectiveArgument argument = 5;
  repeated DirectiveModifier modifiers = 6;
  AttributeValue value = 7;
  CanonicalRange full_range = 8;
  string duplicate_of = 9;
}
message DirectiveArgument {
  oneof kind {
    Empty none = 1;
    AuthoredName static_name = 2;
    DynamicAttributeSyntax dynamic = 3;
  }
}
message DirectiveModifier {
  AuthoredSlice authored = 1;
  string normalized = 2;
  CanonicalRange separator_range = 3;
  CanonicalRange name_range = 4;
  CanonicalRange full_range = 5;
}
message DynamicAttributeSyntax {
  CanonicalRange full_range = 1;
  CanonicalRange open_range = 2;
  CanonicalRange expression_range = 3;
  CanonicalRange close_range = 4;
  SyntaxTermination termination = 5;
}
message AttributeValue {
  oneof kind {
    Empty missing = 1;
    StaticAttributeValue static_value = 2;
    DynamicAttributeSyntax expression = 3;
    MixedAttributeValue mixed = 4;
  }
}
message StaticAttributeValue {
  AuthoredSlice raw = 1;
  string decoded = 2;
  string quote = 3;
  CanonicalRange value_range = 4;
  CanonicalRange inner_range = 5;
}
message MixedAttributeValue { CanonicalRange full_range = 1; repeated AttributeValuePart parts = 2; }
message AttributeValuePart {
  oneof kind {
    AuthoredSlice static_value = 1;
    DynamicAttributeSyntax expression = 2;
  }
}

message MarkupNode {
  string node_token = 1;
  string parent_node_token = 2;
  repeated string child_node_tokens = 3;
  reserved 4 to 9;
  oneof syntax {
    MarkupElementSyntax element = 10;
    TextSyntax text = 11;
    CommentSyntax comment = 12;
    InterpolationSyntax interpolation = 13;
    GenericMarkupSyntax svelte_control_block = 14;
    GenericMarkupSyntax svelte_clause = 15;
    GenericMarkupSyntax svelte_standalone_tag = 16;
    RecoveredSyntax recovered = 17;
    UnknownSyntax unknown = 18;
  }
}
message MarkupElementSyntax {
  AuthoredName authored_name = 1;
  string namespace = 2;
  string kind = 3;
  CanonicalRange opening_range = 4;
  CanonicalRange opening_name_range = 5;
  CanonicalRange attribute_insertion_anchor = 6;
  CanonicalRange content_range = 7;
  CanonicalRange closing_range = 8;
  CanonicalRange closing_name_range = 9;
  CanonicalRange full_range = 10;
  bool self_closing = 11;
  bool void_element = 12;
  bool raw_text = 13;
  SyntaxTermination termination = 14;
  repeated CarrierAttribute attributes = 15;
}
message TextSyntax { CanonicalRange content_range = 1; }
message CommentSyntax {
  CanonicalRange opening_range = 1; CanonicalRange content_range = 2;
  CanonicalRange closing_range = 3; CanonicalRange full_range = 4;
  SyntaxTermination termination = 5;
}
message InterpolationSyntax {
  string family = 1; CanonicalRange opening_range = 2;
  CanonicalRange expression_range = 3; CanonicalRange closing_range = 4;
  CanonicalRange full_range = 5; SyntaxTermination termination = 6;
}
message GenericMarkupSyntax { CanonicalRange full_range = 1; SyntaxTermination termination = 2; }
message RecoveredSyntax {
  CanonicalRange opening_range = 1; CanonicalRange opening_name_range = 2;
  CanonicalRange content_range = 3; CanonicalRange closing_range = 4;
  CanonicalRange closing_name_range = 5; CanonicalRange full_range = 6;
  SyntaxTermination termination = 7; string expected = 8; string reason = 9;
}
message UnknownSyntax {
  CanonicalRange opening_range = 1; CanonicalRange opening_name_range = 2;
  CanonicalRange content_range = 3; CanonicalRange closing_range = 4;
  CanonicalRange closing_name_range = 5; CanonicalRange full_range = 6;
  SyntaxTermination termination = 7; AuthoredSlice authored_head = 8; string reason = 9;
}

message ResolvedTypeDeclaration {
  uint32 requested_name_id = 1;
  uint32 resolved_name_id = 2;
  uint32 canonical_source_id = 3;
  uint32 span_start = 4;
  uint32 span_end = 5;
  uint32 kind_id = 6;
  uint32 text_id = 7;
}

message ComponentUsage {
  uint32 name_id = 1;
  uint32 import_source_id = 2;
  bool is_dynamic = 3;
  repeated ComponentPropUsage props = 4;
  repeated uint32 slots_used_ids = 5;
  repeated uint32 static_class_ids = 6;
  bool has_dynamic_class = 7;
  repeated uint32 v_model_ids = 8;
  // Framework-neutral two-way bindings (the Svelte `bind:` family). Empty for
  // Vue (two-way bindings are carried in v_model_ids).
  repeated ComponentBindingUsage bindings = 9;
  // Framework-neutral events (the legacy Svelte `on:` directive only — a plain
  // `on*` attribute is a prop, never an event). Empty for Vue.
  repeated ComponentEventUsage events = 10;
}

message ComponentBindingUsage {
  uint32 name_id = 1;
  repeated uint32 modifier_ids = 2;
}

message ComponentEventUsage {
  uint32 name_id = 1;
  uint32 handler_expression_id = 2;
  bool is_inline = 3;
  repeated uint32 modifier_ids = 4;
}

message ComponentPropUsage {
  uint32 name_id = 1;
  bool is_bound = 2;
  uint32 constness_id = 3;
}

message TemplateRefMeta {
  uint32 name_id = 1;
  bool is_dynamic = 2;
  uint32 target_tag_id = 3;
}

message ImportMeta {
  uint32 source_id = 1;
  bool is_type_only = 2;
  repeated ImportBindingMeta bindings = 3;
}

message ImportBindingMeta {
  uint32 name_id = 1;
  uint32 kind_id = 2;
  uint32 imported_name_id = 3;
  bool is_type_only = 4;
}

message BindingMeta {
  uint32 name_id = 1;
  uint32 kind_id = 2;
  uint32 reactivity_kind_id = 3;
  uint32 type_annotation_id = 4;
  bool used_in_template = 5;
  bool used_in_style = 6;
  // The demand-resolved whole-return reactive-wrapper role of a composable
  // binding, interned from a CLOSED vocabulary. Id 0 means the role was never
  // demanded for this binding — distinct from the "none" discriminant, which is
  // a completed non-wrapper proof.
  uint32 return_wrapper_role_id = 7;
  // The exact typed degradation reason, present only alongside the
  // "unresolved" role. Carried separately so a reason can never collapse onto
  // the bare role discriminant.
  uint32 return_wrapper_unresolved_reason_id = 8;
}

message VueApiCallMeta {
  uint32 api_id = 1;
  uint32 arg_value_id = 2;
}

message StyleMeta {
  uint32 lang_id = 1;
  bool scoped = 2;
  bool is_module = 3;
  uint32 module_name_id = 4;
  repeated uint32 class_ids = 5;
  repeated uint32 id_ids = 6;
  repeated uint32 custom_property_ids = 7;
  repeated uint32 v_bind_ids = 8;
