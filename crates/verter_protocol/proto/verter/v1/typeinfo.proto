enum GraphDiagnosticSeverity {
  GRAPH_DIAGNOSTIC_SEVERITY_INFO = 0;
  GRAPH_DIAGNOSTIC_SEVERITY_WARN = 1;
  GRAPH_DIAGNOSTIC_SEVERITY_ERROR = 2;
}

// FrameworkTag — wire identifier for a framework a component surface
// belongs to. A `FrameworkTag` value's existence is NOT a support
// guarantee; support is asserted only by a registered adapter, and is
// surfaced per-request via `FrameworkSurfaceKindStatus`; new tag
// values land only together with their adapter's vertical.
enum FrameworkTag {
  FRAMEWORK_TAG_NONE = 0;
  FRAMEWORK_TAG_VUE = 1;
  FRAMEWORK_TAG_SVELTE = 2;
  FRAMEWORK_TAG_REACT = 3;
  FRAMEWORK_TAG_SOLID = 4;
  FRAMEWORK_TAG_OPEN_CANONICAL = 5;
}

// FrameworkSurfaceKindSupport — per-kind support discriminator carried
// by `FrameworkSurfaceKindStatus`. UNSPECIFIED is invalid in
// server-produced v3 payloads.
enum FrameworkSurfaceKindSupport {
  FRAMEWORK_SURFACE_KIND_SUPPORT_UNSPECIFIED = 0;
  FRAMEWORK_SURFACE_KIND_SUPPORT_SUPPORTED = 1;
  FRAMEWORK_SURFACE_KIND_SUPPORT_UNSUPPORTED = 2;
  FRAMEWORK_SURFACE_KIND_SUPPORT_PARTIAL = 3;
}

enum FrameworkSurfaceKind {
  FRAMEWORK_SURFACE_KIND_PROPS = 0;
  FRAMEWORK_SURFACE_KIND_EMITS = 1;
  FRAMEWORK_SURFACE_KIND_SLOTS = 2;
  FRAMEWORK_SURFACE_KIND_OPTIONS = 3;
  FRAMEWORK_SURFACE_KIND_EXPOSE = 4;
  FRAMEWORK_SURFACE_KIND_MODEL = 5;
}

// ----------- Query error -----------

message GraphQueryError {
  oneof kind {
    GraphQueryErrorMiss miss = 1;
    GraphQueryErrorUnsupportedIntrinsic unsupported_intrinsic = 2;
    GraphQueryErrorBudgetExceeded budget_exceeded = 3;
    GraphQueryErrorUnstableState unstable_state = 4;
    GraphQueryErrorAliasCycle alias_cycle = 5;
    GraphQueryErrorRecursiveRef recursive_ref = 6;
    GraphQueryErrorOther other = 7;
    GraphQueryErrorDeclPlaceholder decl_placeholder = 8;
  }
}

message GraphQueryErrorMiss {}
message GraphQueryErrorUnsupportedIntrinsic { uint32 name_id = 1; }
message GraphQueryErrorBudgetExceeded {
  GraphBudgetDomain domain = 1;
  uint32 limit = 2;
  uint64 actual = 3;
  uint32 context_name_id = 4;
}
message GraphQueryErrorUnstableState { uint32 attempts = 1; }
message GraphQueryErrorAliasCycle {}
message GraphQueryErrorRecursiveRef { uint32 name_id = 1; }
message GraphQueryErrorOther { uint32 message_name_id = 1; }
message GraphQueryErrorDeclPlaceholder {
  uint32 canonical_name_id = 1;
  uint32 name_id = 2;
  bytes whole_hash = 3;
}

enum GraphBudgetDomain {
  GRAPH_BUDGET_DOMAIN_LOCAL_CLOSURE = 0;
  GRAPH_BUDGET_DOMAIN_FRONTIER = 1;
  GRAPH_BUDGET_DOMAIN_BUILDER_EXPANSION = 2;
  GRAPH_BUDGET_DOMAIN_SOLVER_RESOLVE_STEPS = 3;
  GRAPH_BUDGET_DOMAIN_SOLVER_ARENA_NODES = 4;
  GRAPH_BUDGET_DOMAIN_SOLVER_INSTANTIATION_DEPTH = 5;
}

// ----------- Structured type expression -----------
//
// Closed taxonomy of expression forms the typeinfo graph
// `EvaluateTypeExpressionGraphRequest.expression` may carry. The
// `oneof kind` covers every supported expression — adding a new arm
// requires bumping `SemanticTypeGraph.schema_version`.

message StructuredTypeExpression {
  // 23 - 100 reserved for additive variants of the `kind` oneof.
  // Same enforcement rationale as `GraphTypeNode` above: protoc
  // rejects reusing these tags with a different shape; the
  // directive lives at the message scope because proto3 forbids
  // `reserved` inside an `oneof`. Adding a variant requires
  // bumping `SemanticTypeGraph.schema_version`.
  reserved 23 to 100;
  oneof kind {
    ExprReference reference = 1;
    ExprUnion union = 2;
    ExprIntersection intersection = 3;
    ExprIndexedAccess indexed_access = 4;
    ExprKeyOf keyof = 5;
    ExprTypeOf typeof_expr = 6;
    ExprTuple tuple = 7;
    ExprArray array = 8;
    ExprObject object_literal = 9;
    ExprMapped mapped = 10;
    ExprConditional conditional = 11;
    ExprLiteral literal = 12;
    ExprPrimitive primitive = 13;
    ExprTemplateLiteral template_literal = 14;
    ExprInfer infer_expr = 15;
    ExprFunction function_expr = 16;
    ExprClass class_expr = 17;
    ExprThisType this_type = 18;
    ExprSatisfies satisfies_expr = 19;
    ExprUniqueSymbol unique_symbol = 20;
    ExprNoInfer no_infer = 21;
    ExprLocalTypeRef local_type_ref = 22;
  }
}

message ExprReference {
  string scope_canonical = 1;
  string name = 2;
  repeated StructuredTypeExpression type_arguments = 3;
  repeated ImportSpecDto extra_imports = 4;
}
message ExprUnion { repeated StructuredTypeExpression members = 1; }
message ExprIntersection { repeated StructuredTypeExpression members = 1; }
message ExprIndexedAccess {
  StructuredTypeExpression object = 1;
  StructuredTypeExpression index = 2;
}
message ExprKeyOf { StructuredTypeExpression operand = 1; }
message ExprTypeOf {
  string value_root_canonical = 1;
  repeated string path = 2;
}
message ExprTuple {
  repeated TupleElementExpr elements = 1;
  bool readonly = 2;
}
message TupleElementExpr {
  string label = 1;
  bool has_label = 2;
  StructuredTypeExpression value = 3;
  bool optional_element = 4;
  bool rest = 5;
}
message ExprArray { StructuredTypeExpression element = 1; bool readonly = 2; }
message ExprObject {
  repeated ObjectMemberExpr members = 1;
  repeated IndexSignatureExpr index_signatures = 2;
  // Overload order is meaning-affecting.
  repeated ExprFunction call_signatures = 3;
  repeated ExprFunction construct_signatures = 4;
}
message ObjectMemberExpr {
  reserved 1, 2;
  StructuredTypeExpression value = 3;
  bool optional_member = 4;
  bool readonly = 5;
  PropertyKeyExpr property_key = 6;
  GraphObjectMemberKind member_kind = 7;
}
message PropertyKeyExpr {
  oneof key {
    string string_value = 1;
    sint64 canonical_number = 2;
    UniqueSymbolKeyExpr unique_symbol = 3;
    StructuredTypeExpression computed = 4;
  }
}
message UniqueSymbolKeyExpr {
  string canonical_id = 1;
  uint32 owner_kind = 2;
  uint32 owner_ordinal = 3;
  string symbol = 4;
  repeated string member_path = 5;
}
message IndexSignatureExpr {
  GraphIndexKeyKind key_kind = 1;
  StructuredTypeExpression value = 2;
  bool readonly = 3;
}
message MappedTypeParamExpr {
  string binder_id = 1;
  string name = 2;
  StructuredTypeExpression constraint = 3;
}
message ExprLocalTypeRef { string binder_id = 1; }
message ExprMapped {
  MappedTypeParamExpr type_param = 1;
  StructuredTypeExpression name_remap = 2;
  bool has_name_remap = 3;
  StructuredTypeExpression value_type = 4;
  GraphMappedModifier readonly_modifier = 5;
  GraphMappedModifier optional_modifier = 6;
}
message ExprConditional {
  StructuredTypeExpression check = 1;
  StructuredTypeExpression extends_type = 2;
  StructuredTypeExpression true_branch = 3;
  StructuredTypeExpression false_branch = 4;
}
message ExprLiteral { GraphLiteralValue value = 1; }
message ExprPrimitive { GraphPrimitiveKind kind = 1; }
message ExprTemplateLiteral {
  repeated string quasis = 1;
  repeated StructuredTypeExpression expressions = 2;
}
message ExprInfer {
  string name = 1;
  StructuredTypeExpression constraint = 2;
  bool has_constraint = 3;
}
message ExprFunction {
  repeated TypeParameterExpr type_parameters = 1;
  FunctionParameterExpr this_param = 2;
  bool has_this_param = 3;
  repeated FunctionParameterExpr parameters = 4;
  FunctionReturnExpr return_expr = 5;
  GraphSignatureKind signature_kind = 6;
}
message FunctionReturnExpr {
  oneof kind {
    StructuredTypeExpression type = 1;
    TypePredicateExpr predicate = 2;
    AssertionEffectExpr assertion = 3;
  }
}
message TypePredicateExpr {
  PredicateSubject parameter = 1;
  StructuredTypeExpression predicate_type = 2;
  bool asserts = 3;
}
message PredicateSubject {
  oneof kind {
    // The identifier-name variant of a type-predicate subject:
    // carries the name of the function parameter that the predicate
    // narrows (`x is T` → the `x` identifier).
    PredicateSubjectName identifier = 1;
    PredicateSubjectThis this_subject = 2;
  }
}
// Identifier-name subject of a type predicate. The `name` field is
// the interned identifier id of the parameter the predicate
// narrows in `x is T`.
message PredicateSubjectName { uint32 name = 1; }
message PredicateSubjectThis {}
message AssertionEffectExpr {
  oneof kind {
    AssertionEffectIdentifier identifier = 1;
    AssertionEffectThis this_assert = 2;
    AssertionEffectCondition condition = 3;
  }
}
message AssertionEffectIdentifier {
  uint32 name = 1;
  StructuredTypeExpression predicate = 2;
  bool has_predicate = 3;
}
message AssertionEffectThis {
  StructuredTypeExpression predicate = 1;
  bool has_predicate = 2;
}
message AssertionEffectCondition {}
message TypeParameterExpr {
  string name = 1;
  StructuredTypeExpression constraint = 2;
  bool has_constraint = 3;
  StructuredTypeExpression default_type = 4;
  bool has_default = 5;
  GraphVariance variance = 6;
  bool is_const = 7;
}
message FunctionParameterExpr {
  string name = 1;
  StructuredTypeExpression type_ref = 2;
  bool optional = 3;
  bool rest = 4;
  GraphInferencePolicy inference_policy = 5;
}
message ExprClass {
  string class_name = 1;
  bool has_class_name = 2;
  repeated TypeParameterExpr type_parameters = 3;
  repeated ObjectMemberExpr instance_members = 4;
  repeated ObjectMemberExpr static_members = 5;
}
message ExprThisType {}
message ExprSatisfies {
  StructuredTypeExpression value = 1;
  StructuredTypeExpression constraint = 2;
}
message ExprUniqueSymbol { string decl_canonical = 1; string name = 2; }
message ExprNoInfer { StructuredTypeExpression inner = 1; }

// ----------- Typed request errors -----------

message TypeInfoRequestError {
  // Wire-compat reservation: field number 11 and the name
  // `missing_relate_endpoint` inside `kind` are reserved and must
  // not be reused for a different variant. A `Relate` request is
  // answered with `unsupported_operation`, so no producer ever emits a
  // dedicated variant in slot 11.
  // Proto3 forbids `reserved` inside an `oneof` block, so the
  // directive lives at the enclosing message scope.
  reserved 11;
  reserved "missing_relate_endpoint";
  oneof kind {
    TypeInfoRequestErrorMissingProjectionContext missing_projection_context = 1;
    TypeInfoRequestErrorMissingDisplayPolicy missing_display_policy = 2;
    TypeInfoRequestErrorInvalidMode invalid_mode = 3;
    TypeInfoRequestErrorMissingClosurePolicy missing_closure_policy = 4;
    TypeInfoRequestErrorUnknownSchemaVersion unknown_schema_version = 5;
    TypeInfoRequestErrorMalformedPayload malformed_payload = 6;
    TypeInfoRequestErrorOmittedRoots omitted_roots = 7;
    TypeInfoRequestErrorUnstableState unstable_state = 8;
    TypeInfoRequestErrorMalformedStructuredExpression malformed_structured_expression = 9;
    TypeInfoRequestErrorMissingProjectPath missing_project_path = 10;
    TypeInfoRequestErrorExpansionBudgetOutOfRange expansion_budget_out_of_range = 12;
    TypeInfoRequestErrorUnknownFrameworkProfile unknown_framework_profile = 13;
    TypeInfoRequestErrorStaleBasis stale_basis = 14;
    TypeInfoRequestErrorUnknownNodeRef unknown_node_ref = 15;
    TypeInfoRequestErrorUnsupportedOperation unsupported_operation = 16;
    TypeInfoRequestErrorUnknownSource unknown_source = 17;
  }
}

// Typed error for an issued `NodeRef` whose committed input basis no
// longer describes what the host's current view observes (schema 12): a
// source, dependency, configuration or overlay it read has changed. The
// position is never re-answered against the newer inputs; the client asks
// the originating question again for a current address.
message TypeInfoRequestErrorStaleBasis {
  NodeRef node_ref = 1;
}

// Typed error for a well-shaped `NodeRef` the host does not hold (schema
// 12): never issued, evicted from the bounded index, or differing from an
// issued tuple in any component.
message TypeInfoRequestErrorUnknownNodeRef {
  NodeRef node_ref = 1;
}

// Typed error for a well-formed request naming an operation this host
// does not serve. It answers before any payload check, at every accepted
// schema version, and echoes the requested operation. The host serves
// resolve-symbol, expand-around and framework-surfaces; asking again with
// a different payload cannot succeed.
message TypeInfoRequestErrorUnsupportedOperation {
  GraphOperation operation = 1;
}

// Typed error for a request whose subject names a source the host does not
// know: no loaded or loadable file has that path. It answers before any
// resolution, and echoes the path. A known source without the requested
// name is not this error; it is the graph's miss answer.
message TypeInfoRequestErrorUnknownSource {
  string path = 1;
}

// Typed error for a well-formed `FrameworkProfileRef` (32 bytes) that
// names no profile this host admits (schema 11): unknown, unadmitted or
// minted under another descriptor-schema epoch. Carries the rejected
// reference only — the recovery action is discovery through
// `TypeInfoCapabilityHandshakeResponse.framework_profiles`, never a
// guessed family or release.
message TypeInfoRequestErrorUnknownFrameworkProfile {
  FrameworkProfileRef profile = 1;
}

message TypeInfoRequestErrorMissingProjectionContext {}
message TypeInfoRequestErrorMissingDisplayPolicy {}
message TypeInfoRequestErrorInvalidMode { string received = 1; }
message TypeInfoRequestErrorMissingClosurePolicy {}
message TypeInfoRequestErrorUnknownSchemaVersion {
  uint32 wire_version = 1;
  uint32 server_version = 2;
  repeated uint32 server_supported_versions = 3;
}
message TypeInfoRequestErrorMalformedPayload { string detail = 1; }
message TypeInfoRequestErrorOmittedRoots {}
message TypeInfoRequestErrorUnstableState { uint32 attempts = 1; }
message TypeInfoRequestErrorMalformedStructuredExpression { string detail = 1; }
message TypeInfoRequestErrorMissingProjectPath {}
// Typed error for an expansion budget that falls outside the
// server-supported range. Carries both the rejected request budgets
// (`node_budget`, `depth_budget`) and the server-enforced maxima
// (`node_budget_max`, `depth_budget_max`) so the caller can clamp
// or surface the discrepancy.
message TypeInfoRequestErrorExpansionBudgetOutOfRange {
  uint32 node_budget = 1;
  uint32 depth_budget = 2;
  uint32 node_budget_max = 3;
  uint32 depth_budget_max = 4;
}

enum GraphRelateEndpoint {
  GRAPH_RELATE_ENDPOINT_SOURCE = 0;
  GRAPH_RELATE_ENDPOINT_TARGET = 1;
}
