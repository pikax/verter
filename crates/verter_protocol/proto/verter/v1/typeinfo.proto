syntax = "proto3";

package verter.v1;

import "verter/v1/compiler_intrinsics.proto";

// ---------------------------------------------------------------------------
// FFI request/response DTOs for typeinfo session entry points.
//
// These structures are the wire shape the typeinfo session host methods
// accept; NAPI / WASM callers depend on the field numbers and message
// names below. The richer typeinfo-graph contracts further down this
// file cover the structured-projection surface.
// ---------------------------------------------------------------------------

// EvaluateTypeExpressionRequestDto — wire-form mirror of
// `verter_session::typeinfo::types::EvaluateTypeExpressionRequest`.
//
// Field numbers and names are stable; do not renumber.
message EvaluateTypeExpressionRequestDto {
  string scope_canonical = 1;
  string expression = 2;
  repeated ImportSpecDto extra_imports = 3;
  // Stringly-tagged projection mode for forwards compatibility —
  // adding a new mode does not require renumbering. Producers and
  // consumers compare against the canonical enum values:
  // "identity", "navigate", "shallow", "expanded", "skeleton".
  string mode = 4;
  bool cacheable = 5;
}

// ImportSpecDto — wire-form mirror of
// `verter_session::typeinfo::types::ImportSpec`.
message ImportSpecDto {
  string specifier = 1;
  repeated NamedImportDto bindings = 2;
}

// NamedImportDto — wire-form mirror of
// `verter_session::typeinfo::types::NamedImport`. The oneof carries
// the variant payload; consumers branch on the kind field discriminant.
message NamedImportDto {
  oneof kind {
    DefaultImportDto default_import = 1;
    NamedBindingDto named = 2;
    NamespaceImportDto namespace_import = 3;
  }
}

// `import <local_name> from "<specifier>"`
message DefaultImportDto {
  string local_name = 1;
}

// `import { <exported_name> [as <local_alias>] } from "<specifier>"`
// — `type_only` indicates a `type`-qualified binding.
message NamedBindingDto {
  string exported_name = 1;
  // Optional rename. Empty string means "no alias" — proto3 cannot
  // distinguish "" from "absent" without a wrapper, so consumers
  // treat empty as None.
  string local_alias = 2;
  bool type_only = 3;
}

// `import * as <local_name> from "<specifier>"`
message NamespaceImportDto {
  string local_name = 1;
}

// SymbolEntryDto — wire-form mirror of
// `verter_session::typeinfo::types::SymbolEntry`: one entry of the
// list-symbols answer (`TypeInfoGraphResponse.symbol_list`).
message SymbolEntryDto {
  string name = 1;
  // Stringly-tagged kind. Canonical values:
  // "typeAlias", "interface", "class", "const", "let", "var",
  // "function", "asyncFunction", "classValue", "enum".
  string kind = 2;
  // SFC-absolute span. Encoded as `(start, end)`; absent when the
  // host had no analysis-snapshot span for this symbol. UTF-8 byte
  // offsets, 0-based half-open, in the file the symbol list was requested for
  // (schema 9 unit contract).
  uint32 span_start = 3;
  uint32 span_end = 4;
  // Discriminator for the optional span — a separate field instead
  // of an `optional` modifier so the proto3 wire form stays at the
  // base level and consumers can distinguish "has_span: true,
  // start: 0, end: 0" from "has_span: false".
  bool has_span = 5;
  bool is_exported = 6;
}

// SymbolEntryListDto — the list-symbols answer: the file's own top-level
// declarations, sorted by name then kind.
message SymbolEntryListDto {
  repeated SymbolEntryDto entries = 1;
}

// ListSymbolsRequest — the list-symbols operation's payload: the file
// whose top-level declarations are listed (schema 12).
message ListSymbolsRequest {
  string canonical_id = 1;
}

// ---------------------------------------------------------------------------
// Typeinfo graph wire contracts.
//
// These messages are the protobuf-authoritative wire surface for the
// typeinfo graph substrate. Rust DTOs are generated by `prost-build`;
// TypeScript DTOs are generated by the existing protobuf path under
// `packages/proto/src/gen/verter/v1/typeinfo_pb.ts`. Names are
// prefixed with `Graph` to avoid collision with the component-meta
// proto's `TypeNode` / `TypeGraph` / `Signature` messages that share
// the `verter.v1` package. The Rust-side typed API at
// `verter_protocol::typeinfo` re-exports these under a `graph`
// submodule without the `Graph` prefix.
// ---------------------------------------------------------------------------

// SemanticTypeGraph — top-level wire envelope for every typeinfo
// graph query response. Producers MUST set schema_version.
message SemanticTypeGraph {
  // Tag 2 / name `query` held the retired request echo. Reserved so the
  // tag and name are never reused; a graph encoded with it decodes with
  // `fact_identity` absent.
  reserved 2;
  reserved "query";
  // Bumped on incompatible additive changes (e.g., new oneof arms).
  uint32 schema_version = 1;
  // Indexed by GraphTypeNodeId.
  repeated GraphTypeNode nodes = 3;
  // Indexed by GraphSymbolId.
  repeated GraphSymbolNode symbols = 4;
  // Indexed by GraphSignatureRef.
  repeated GraphSignature signatures = 5;
  repeated GraphOriginEdge edges = 6;
  // GraphTypeNodeId list of root nodes for this snapshot.
  repeated uint32 root_ids = 7;
  // Per-node exactness — paired (GraphTypeNodeId, ExactnessStatus).
  repeated GraphNodeStatus exactness = 8;
  repeated GraphDiagnostic diagnostics = 9;
  // Maps the snapshot-local GraphTypeNodeId to a stable
  // `ResolvedDeclSlotIdentity` carrier (populated only when the
  // request asked for provenance).
  repeated GraphNodeIdMapEntry node_id_map = 10;
  repeated GraphSymbolIdMapEntry symbol_id_map = 11;
  // Interned-string carrier — every wire-side string identifier
  // resolves through this table so the envelope stays compact for
  // workspace-scale snapshots. See the typeinfo wire-surface
  // intern-table rule for the round-trip contract.
  GraphStringTable strings = 12;
  // The payload-side relation-proof table (schema 5, add-only). Indexed
  // by the opaque proof id a relation payload references
  // (`RelationProofId`; `GraphConditionalResolutionSelected.proof_ref`).
  // The proof witness rides this table BY ID — it is never embedded on
  // the type-values surface (no `GraphTypeNode` arm; the retired tag-28
  // arm is reserved at `GraphTypeNode` scope). A consumer that ignores
  // the new field keeps working.
  repeated GraphRelationProofEntry relation_proofs = 13;
  // The fact this graph answers: the same query identity and committed
  // input basis its issued `NodeRef`s name.
  GraphFactIdentity fact_identity = 14;
}

// The identity of the fact a graph answers. Each present digest is
// exactly 32 bytes. Presentation and export options (display policy,
// closure, include flags) never enter it.
message GraphFactIdentity {
  // The fact's descriptor-specific query identity digest.
  bytes query_identity_digest = 1;
  // The committed native input basis the answer's references are admitted
  // under. Empty when the answer committed none (a miss, or no reference
  // issued).
  bytes input_basis_digest = 2;
}

// GraphTypeNode — the closed taxonomy of typeinfo graph nodes. The
// `oneof kind` is the canonical place to add new variants; the
// reserved range (34-100) is enforced future-additive space. Bump
// `SemanticTypeGraph.schema_version` whenever a variant is added.
message GraphTypeNode {
  // 34 - 100 reserved for additive variants of the `kind` oneof.
  // protoc rejects reusing any of these tags with a different
  // shape until a real variant lands. Adding a variant requires
  // bumping `SemanticTypeGraph.schema_version`. The directive lives
  // at the enclosing message level because proto3 forbids
  // `reserved` inside an `oneof` block.
  reserved 35 to 100;
  // Tag 28 / name `relation_proof` held the retired relation-proof
  // oneof arm. The proof witness moved OFF the type-values surface to
  // the payload-side `SemanticTypeGraph.relation_proofs` table (field
  // 13, schema 5), referenced by opaque proof id. The tag and name are
  // reserved so off-tree clients that decoded the original schema keep
  // round-tripping the retired arm as an unknown field, and so neither
  // the tag nor the name is ever reused. The directive lives at the
  // enclosing message level because proto3 forbids `reserved` inside
  // an `oneof` block.
  reserved 28;
  reserved "relation_proof";
  oneof kind {
    GraphPrimitive primitive = 1;
    GraphLiteral literal = 2;
    GraphUniqueSymbol unique_symbol = 3;
    GraphUnion union = 4;
    GraphIntersection intersection = 5;
    GraphObject object = 6;
    GraphArray array = 7;
    GraphTuple tuple = 8;
    GraphReference reference = 9;
    GraphAliasInstantiation alias_instantiation = 10;
    GraphTypeParameter type_parameter = 11;
    GraphKeyOf key_of = 12;
    GraphIndexedAccess indexed_access = 13;
    GraphConditional conditional = 14;
    GraphMapped mapped = 15;
    GraphTemplateLiteral template_literal = 16;
    // Field names below avoid Rust / TS reserved-word identifiers
    // (`typeof`, `satisfies`, `class`, `enum`, `infer`). The Rust
    // message-type names stay semantic; the field selectors avoid
    // collisions with `r#typeof` / `r#enum` etc.
    GraphTypeOf typeof_node = 17;
    GraphSatisfies satisfies_node = 18;
    GraphClass class_node = 19;
    GraphThisType this_type = 20;
    GraphMergedDeclaration merged_declaration = 21;
    GraphAmbientModule ambient_module = 22;
    GraphModuleAugmentation module_augmentation = 23;
    GraphAmbientNamespace ambient_namespace = 24;
    GraphGlobalAugmentation global_augmentation = 25;
    GraphFlowNarrowing flow_narrowing = 26;
    GraphContextualType contextual_type = 27;
    GraphInfer infer_node = 29;
    GraphEnum enum_node = 30;
    GraphOpaque opaque = 31;
    GraphCycle cycle = 32;
    GraphObjectSpreadProgram object_spread_program = 33;
    GraphIntrinsicApplication intrinsic_application = 34;
  }
}

// ----------- Per-variant payloads -----------

message GraphPrimitive { GraphPrimitiveKind kind = 1; }

message GraphLiteral { GraphLiteralValue value = 1; }

message GraphUniqueSymbol { uint32 decl_symbol_id = 1; }

message GraphUnion { repeated uint32 member_node_ids = 1; }
message GraphIntersection { repeated uint32 member_node_ids = 1; }

message GraphObject {
  repeated GraphObjectMember members = 1;
  repeated GraphIndexSignature index_signatures = 2;
  // Overload order is meaning-affecting; both arenas are ordered.
  repeated uint32 call_signature_refs = 3;
  repeated uint32 construct_signature_refs = 4;
  uint32 flags = 5;
}

// Canonical source-ordered authority for every spread-bearing object. The
// effect list is never replaced by a derived member surface.
message GraphObjectSpreadProgram {
  repeated GraphObjectConstructionEffect effects = 1;
}

// An applied compiler-native type operation (`Awaited<T>` once the checker
// has resolved its identity as compiler-native rather than as a declaration
// reference).
//
// Deliberately NOT `GraphReference` / `GraphAliasInstantiation`: those name a
// declaration symbol, and an intrinsic names none. Encoding one through them
// would let a userland type spelled `Awaited` capture a compiler operation.
// The op rides as a closed enum, never a string id, so it can never reach the
// symbol table or be resolved as a name.
//
// Operands are graph node ids, preserving DAG identity and sharing.
message GraphIntrinsicApplication {
  CompilerIntrinsicTypeOp op = 1;
  repeated uint32 argument_node_ids = 2;
}

// One lossless source-ordered object-construction effect.
message GraphObjectConstructionEffect {
  oneof kind {
    GraphObjectNamedEffect direct_property = 1;
    GraphObjectNamedEffect direct_method = 2;
    GraphObjectNamedEffect direct_get = 3;
    GraphObjectNamedEffect direct_set = 4;
    GraphObjectIndexEffect direct_index = 5;
    GraphObjectSignatureEffect direct_call = 6;
    GraphObjectSignatureEffect direct_construct = 7;
    GraphObjectSpreadEffect spread = 8;
  }
}

// Lossless payload shared by property/method/get/set effects. The enclosing
// oneof arm is the authored kind discriminator. `readonly` is meaningful for
// properties; `has_implementation_body` is meaningful for methods/accessors.
message GraphObjectNamedEffect {
  GraphPropertyKey property_key = 1;
  uint32 value_node_id = 2;
  bool optional = 3;
  bool readonly = 4;
  bool has_implementation_body = 5;
  GraphAccessibility accessibility = 6;
  GraphObjectMemberSpans spans = 7;
  uint32 declaration_origin_name_id = 8;
  bool has_declaration_origin = 9;
  bool declared_in_macro_type_arg = 10;
  GraphObjectMergeRole merge_role = 11;
  GraphObjectExcessOrigin excess_origin = 12;
}

message GraphObjectIndexEffect {
  uint32 key_type_node_id = 1;
  uint32 value_type_node_id = 2;
  bool readonly = 3;
  GraphObjectIndexSpans spans = 4;
  uint32 declaration_origin_name_id = 5;
  bool has_declaration_origin = 6;
}

message GraphObjectSignatureEffect { uint32 signature_node_id = 1; }
message GraphObjectSpreadEffect { uint32 operand_node_id = 1; }

message GraphObjectMemberSpans {
  GraphSpanRef declaration = 1;
  GraphSpanRef name = 2;
  GraphSpanRef type_annotation = 3;
}

message GraphObjectIndexSpans {
  GraphSpanRef declaration = 1;
  GraphSpanRef key = 2;
  GraphSpanRef value = 3;
}

enum GraphObjectMergeRole {
  GRAPH_OBJECT_MERGE_ROLE_AUTHORED = 0;
  GRAPH_OBJECT_MERGE_ROLE_OWN_BODY = 1;
  GRAPH_OBJECT_MERGE_ROLE_HERITAGE = 2;
}

enum GraphObjectExcessOrigin {
  GRAPH_OBJECT_EXCESS_ORIGIN_NON_LITERAL = 0;
  GRAPH_OBJECT_EXCESS_ORIGIN_FRESH_OWN = 1;
  GRAPH_OBJECT_EXCESS_ORIGIN_SPREAD_TAINTED = 2;
}

message GraphObjectMember {
  reserved 1, 2;
  uint32 value_node_id = 3;
  bool optional = 4;
  bool readonly = 5;
  GraphAccessibility accessibility = 6;
  bool static_side = 7;
  // 0 when no declaration symbol is recorded.
  uint32 declaration_symbol_id = 8;
  GraphPropertyKey property_key = 9;
  GraphObjectMemberKind member_kind = 10;
  bool has_implementation_body = 11;
}

message GraphPropertyKey {
  oneof key {
    uint32 string_id = 1;
    sint64 canonical_number = 2;
    uint32 unique_symbol_decl_id = 3;
    uint32 computed_node_id = 4;
  }
}

enum GraphObjectMemberKind {
  GRAPH_OBJECT_MEMBER_KIND_PROPERTY = 0;
  GRAPH_OBJECT_MEMBER_KIND_METHOD = 1;
  GRAPH_OBJECT_MEMBER_KIND_GET = 2;
  GRAPH_OBJECT_MEMBER_KIND_SET = 3;
}

message GraphIndexSignature {
  GraphIndexKeyKind key_kind = 1;
  uint32 value_node_id = 2;
  bool readonly = 3;
}

message GraphArray { uint32 element_node_id = 1; bool readonly = 2; }

message GraphTuple {
  repeated GraphTupleElement elements = 1;
  bool readonly = 2;
}

message GraphTupleElement {
  // 0 when unlabeled.
  uint32 label_name_id = 1;
  uint32 value_node_id = 2;
  bool optional = 3;
  bool rest = 4;
}

message GraphReference { uint32 symbol_id = 1; }

message GraphAliasInstantiation {
  uint32 alias_symbol_id = 1;
  repeated uint32 type_argument_node_ids = 2;
  uint32 target_node_id = 3;
  // 0 when no display Ref is associated.
  uint32 display_ref_node_id = 4;
}

message GraphTypeParameter {
  uint32 symbol_id = 1;
  uint32 decl_slot_ref = 2;
  uint32 param_index = 3;
  uint32 name_id = 4;
  // 0 when absent.
  uint32 constraint_node_id = 5;
  uint32 default_node_id = 6;
  GraphVariance variance = 7;
  bool is_const = 8;
  bool no_infer = 9;
  GraphTypeParameterBinding binding = 10;
}

message GraphTypeParameterBinding {
  oneof kind {
    GraphTypeParameterBindingUnbound unbound = 1;
    GraphTypeParameterBindingConcrete concrete = 2;
    GraphTypeParameterBindingInferred inferred = 3;
    GraphTypeParameterBindingSubstituted substituted = 4;
  }
}

message GraphTypeParameterBindingUnbound {}
message GraphTypeParameterBindingConcrete { uint32 type_ref_node_id = 1; }
message GraphTypeParameterBindingInferred {
  uint32 type_ref_node_id = 1;
  uint32 source_origin_ref = 2;
}
message GraphTypeParameterBindingSubstituted {
  uint32 type_ref_node_id = 1;
  uint32 from_node_id = 2;
}

message GraphKeyOf { uint32 base_node_id = 1; }

message GraphIndexedAccess {
  uint32 object_node_id = 1;
  uint32 index_node_id = 2;
}

message GraphConditional {
  uint32 check_node_id = 1;
  uint32 extends_node_id = 2;
  uint32 true_branch_node_id = 3;
  uint32 false_branch_node_id = 4;
  bool distributive = 5;
  GraphConditionalResolution resolution = 6;
}

message GraphConditionalResolution {
  oneof kind {
    GraphConditionalResolutionSelected selected_true = 1;
    GraphConditionalResolutionSelected selected_false = 2;
    GraphConditionalResolutionUnresolvedGeneric unresolved_generic = 3;
    GraphConditionalResolutionDistributed distributed = 4;
    GraphConditionalResolutionUnsupported unsupported = 5;
  }
}

message GraphConditionalResolutionSelected { uint32 proof_ref = 1; }
message GraphConditionalResolutionUnresolvedGeneric {
  repeated uint32 blocker_node_ids = 1;
  GraphRelationUnknownReason reason = 2;
}
message GraphConditionalResolutionDistributed {
  repeated GraphDistributedConditionalCase cases = 1;
}
message GraphDistributedConditionalCase {
  uint32 case_node_id = 1;
  uint32 result_node_id = 2;
}
message GraphConditionalResolutionUnsupported {
  GraphUnsupportedConstruct reason = 1;
}

message GraphMapped {
  uint32 key_type_node_id = 1;
  uint32 source_node_id = 2;
  // 0 when absent.
  uint32 name_remap_node_id = 3;
  uint32 value_type_node_id = 4;
  GraphMappedModifier readonly_modifier = 5;
  GraphMappedModifier optional_modifier = 6;
}

message GraphTemplateLiteral {
  // Interned name ids for each quasi segment.
  repeated uint32 quasi_name_ids = 1;
  repeated uint32 expression_node_ids = 2;
}

message GraphTypeOf {
  uint32 value_root_ref = 1;
  repeated uint32 path_name_ids = 2;
}

message GraphSatisfies {
  uint32 value_node_id = 1;
  uint32 constraint_node_id = 2;
}

message GraphClass {
  uint32 symbol_id = 1;
  repeated uint32 type_parameter_node_ids = 2;
  repeated GraphHeritageClause heritage = 3;
  repeated GraphObjectMember members = 4;
  repeated GraphObjectMember static_members = 5;
  repeated uint32 construct_signature_refs = 6;
  uint32 flags = 7;
}

message GraphHeritageClause {
  GraphHeritageKind kind = 1;
  uint32 base_node_id = 2;
  repeated uint32 type_argument_node_ids = 3;
}

message GraphThisType { uint32 decl_symbol_id = 1; }

message GraphMergedDeclaration {
  uint32 merged_symbol_id = 1;
  repeated GraphDeclarationPart parts = 2;
}

message GraphDeclarationPart {
  uint32 source_canonical_name_id = 1;
  uint32 declaration_node_id = 2;
  GraphDeclarationPartKind kind = 3;
}

message GraphAmbientModule {
  uint32 specifier_name_id = 1;
  uint32 module_namespace_node_id = 2;
}

message GraphModuleAugmentation {
  uint32 specifier_name_id = 1;
  repeated GraphDeclarationPart parts = 2;
}

message GraphAmbientNamespace {
  uint32 namespace_name_id = 1;
  uint32 namespace_node_id = 2;
}

message GraphGlobalAugmentation {
  repeated GraphDeclarationPart parts = 1;
}

message GraphFlowNarrowing {
  uint32 site_span_ref = 1;
  uint32 narrowed_node_id = 2;
  uint32 base_node_id = 3;
}

message GraphContextualType {
  uint32 site_span_ref = 1;
  uint32 contextual_node_id = 2;
}

// ----------- Relation proofs (schema 5) -----------

// GraphRelationProofEntry — one entry of the payload-side relation-proof
// table (`SemanticTypeGraph.relation_proofs` field 13), addressed by the
// opaque proof id a relation payload references. FOUR shapes, mirroring
// the value-domain relation-proof taxonomy: the derivation / failure /
// cycle witness rides this table BY ID — it is never embedded on the
// type-values surface (no `GraphTypeNode` arm).
message GraphRelationProofEntry {
  oneof kind {
    GraphRelationDerivation assignable = 1;
    GraphRelationFailure not_assignable = 2;
    GraphRelationBudgetCap budget_exceeded = 3;
    GraphRelationCycleKeys coinductive_cycle = 4;
  }
}

// Positive structural derivation: which sub-relations held, member by
// member and across variance arms.
message GraphRelationDerivation {
  repeated GraphSubRelationRef sub_derivations = 1;
}

// Negative: the failure reason plus the failing structural sub-relation.
// CONTENT-FREE — the sub-relation reference carries no session-bearing
// full relation key (the negative carve-out).
message GraphRelationFailure {
  GraphRelationFailureCode reason = 1;
  GraphSubRelationRef failing_sub = 2;
}

// The budget / recursion cap that stopped the relate (rides a public but
// never-warm BudgetExceeded payload).
message GraphRelationBudgetCap {
  GraphBudgetExceededKind kind = 1;
  uint32 limit = 2;
}

// The set of COMPLETED full relation keys that co-discharged a
// coinductive cycle, referenced by opaque key id — never a
// session-bearing key.
message GraphRelationCycleKeys {
  repeated uint32 keys = 1;
}

// Content-free reference to a structural sub-relation: the source /
// target graph nodes plus the structural position they relate at.
message GraphSubRelationRef {
  uint32 source_node_id = 1;
  uint32 target_node_id = 2;
  GraphSubRelationPositionKind position_kind = 3;
  // Interned member name (the graph string table) when position_kind is
  // GRAPH_SUB_RELATION_POSITION_KIND_MEMBER; 0 otherwise.
  uint32 position_name_id = 4;
  // The parameter / type-argument index when position_kind is
  // GRAPH_SUB_RELATION_POSITION_KIND_PARAMETER or
  // GRAPH_SUB_RELATION_POSITION_KIND_TYPE_ARGUMENT; 0 otherwise.
  uint32 position_index = 5;
}

message GraphInfer {
  uint32 name_id = 1;
  // 0 when absent.
  uint32 constraint_node_id = 2;
}

message GraphEnum {
  uint32 symbol_id = 1;
  repeated GraphEnumMember members = 2;
  bool is_const = 3;
}

message GraphEnumMember {
  uint32 name_id = 1;
  GraphEnumMemberValue value = 2;
}

message GraphEnumMemberValue {
  oneof kind {
    int64 numeric = 1;
    uint32 string_name_id = 2;
    bool computed = 3;
  }
}

message GraphOpaque { GraphQueryError error = 1; }

message GraphCycle {
  uint32 cycle_root_node_id = 1;
  // The participating declaration symbols, for diagnostics.
  repeated uint32 participants = 2;
}

// ----------- Signatures -----------

message GraphSignature {
  repeated uint32 type_parameter_node_ids = 1;
  GraphThisParameter this_param = 2;
  repeated GraphSignatureParameter parameters = 3;
  uint32 return_type_node_id = 4;
  GraphTypePredicate return_predicate = 5;
  GraphAssertionEffect asserts = 6;
  uint32 overload_index = 7;
  bool is_construct = 8;
  bool is_implementation = 9;
  bool is_abstract = 10;
  uint32 flags = 11;
  GraphSignatureKind signature_kind = 12;
  GraphSignatureOrigin signature_origin = 13;
}

message GraphThisParameter {
  bool present = 1;
  uint32 type_node_id = 2;
}

message GraphSignatureParameter {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  bool optional = 3;
  bool rest = 4;
  GraphInferencePolicy inference_policy = 5;
}

message GraphTypePredicate {
  bool present = 1;
  GraphPredicateSubject subject = 2;
  uint32 predicate_type_node_id = 3;
  bool asserts = 4;
}

message GraphAssertionEffect {
  bool present = 1;
  oneof kind {
    GraphAssertionEffectIdentifier identifier = 2;
    GraphAssertionEffectThis this_assert = 3;
    GraphAssertionEffectCondition condition = 4;
  }
}

message GraphAssertionEffectIdentifier {
  uint32 name_id = 1;
  uint32 predicate_node_id = 2;
}
message GraphAssertionEffectThis { uint32 predicate_node_id = 1; }
message GraphAssertionEffectCondition {}

message GraphPredicateSubject {
  oneof kind {
    GraphPredicateSubjectIdentifier identifier = 1;
    GraphPredicateSubjectThis this_subject = 2;
  }
}
message GraphPredicateSubjectIdentifier { uint32 name_id = 1; }
message GraphPredicateSubjectThis {}

// ----------- Symbols and identity -----------

message GraphSymbolNode {
  uint32 name_id = 1;
  uint32 canonical_name_id = 2;
  GraphSymbolNamespace namespace = 3;
  // 0 when no decl slot is recorded yet.
  uint32 decl_slot_ref = 4;
}

message GraphSymbolIdMapEntry {
  // GraphSymbolId.
  uint32 symbol_id = 1;
  GraphResolvedDeclSlotIdentity identity = 2;
}

message GraphNodeIdMapEntry {
  // GraphTypeNodeId.
  uint32 node_id = 1;
  // Stable identity carrier — populated only when the request asked
  // for provenance.
  GraphResolvedDeclSlotIdentity identity = 2;
  // The host-issued address of the exported node (schema 12), independent
  // of `include_provenance`. Present only where the producer holds an exact
  // replayable position: a declaration root, or a framework member whose
  // producer published a replayable source. `node_id` only associates the
  // address with this graph's node; it is never itself the address.
  NodeRef node_ref = 3;
}

// NodeRef — a host-issued address of one exported fact position (schema
// 12). The tuple is opaque to clients: the host mints it, registers it in a
// bounded index and admits only the WHOLE tuple it issued. Copying or
// computing bytes never retargets an address, and a substituted basis
// names nothing. Every present digest is exactly 32 bytes.
message NodeRef {
  // The fact's descriptor-specific query identity digest.
  bytes query_identity_digest = 1;
  // The committed native input basis the fact was observed under.
  bytes input_basis_digest = 2;
  // The producer's content-free declaration slot.
  bytes decl_slot_digest = 3;
  // The producer's typed role of a nested position; empty for a
  // declaration root.
  bytes role_digest = 4;
}

message GraphResolvedDeclSlotIdentity {
  uint32 canonical_name_id = 1;
  uint32 decl_name_id = 2;
  bytes whole_hash = 3;
  GraphSymbolNamespace namespace = 4;
}

// ----------- Origin edges -----------

message GraphOriginEdge {
  uint32 source_node_id = 1;
  uint32 target_node_id = 2;
  GraphOriginEdgeKind kind = 3;
  // Optional metadata payload — index into the string table when
  // `has_meta` is true.
  uint32 meta_name_id = 4;
  bool has_meta = 5;
}

// ----------- Exactness, diagnostics -----------

message GraphNodeStatus {
  uint32 node_id = 1;
  GraphExactness exactness = 2;
}

message GraphDiagnostic {
  GraphDiagnosticSeverity severity = 1;
  uint32 message_name_id = 2;
  // Optional originating span. SFC-absolute UTF-8 byte offsets, 0-based
  // half-open, in the file `span_canonical_name_id` names. Emitted only when
  // exact; otherwise `has_span` is false and the offsets are not meaningful.
  uint32 span_canonical_name_id = 3;
  uint32 span_start = 4;
  uint32 span_end = 5;
  bool has_span = 6;
}

// ----------- Closure / path / context -----------

message GraphClosurePolicy {
  oneof kind {
    GraphClosureRootOnly root_only = 1;
    GraphClosurePath path = 2;
    GraphClosureOneLevel one_level = 3;
    GraphClosureExpanded expanded = 4;
    GraphClosureProjectionRequired projection_required = 5;
  }
}

message GraphClosureRootOnly {}
message GraphClosurePath { repeated GraphTypePathSegment path = 1; }
message GraphClosureOneLevel {}
message GraphClosureExpanded {
  // No default. The validator rejects missing budgets explicitly.
  uint32 node_budget = 1;
  uint32 depth_budget = 2;
}
message GraphClosureProjectionRequired { GraphProjectionKind projection = 1; }

message GraphTypePathSegment {
  oneof kind {
    GraphPathSegmentProperty property = 1;
    GraphPathSegmentIndex index = 2;
    GraphPathSegmentTypeArgument type_argument = 3;
    GraphPathSegmentConstructorArgument constructor_argument = 4;
    GraphPathSegmentReturnType return_type = 5;
  }
}
message GraphPathSegmentProperty { uint32 name_id = 1; }
message GraphPathSegmentIndex { uint32 index = 1; }
message GraphPathSegmentTypeArgument { uint32 position = 1; }
message GraphPathSegmentConstructorArgument { uint32 position = 1; }
message GraphPathSegmentReturnType {}

message GraphProjectionReductionContext {
  GraphProjectionMode mode = 1;
  GraphReductionDemand demand = 2;
}

message GraphDisplayPolicy {
  GraphDisplayQualification qualification = 1;
  GraphDisplayBranding branding = 2;
  GraphDisplayBudgets budgets = 3;
}
message GraphDisplayBudgets {
  uint32 max_string_length = 1;
  uint32 max_depth = 2;
}

// ----------- String table -----------

message GraphStringTable {
  // Interned strings; consumers MAY index by GraphInternedNameId.
  repeated string entries = 1;
}

// ----------- Public requests / responses -----------

// TypeInfoGraphResponse — wrapper distinguishing successful payloads
// from typed validation / execution errors. Audit envelope is carried
// separately by the host runtime; this DTO does not duplicate it.
// The `framework_surface` arm (schema 3) carries the framework
// component-surface payload produced by the framework-surfaces
// operation; the framework-surface operation requires schema 3, while
// schema 2 stays accepted for the legacy operations.
message TypeInfoGraphResponse {
  oneof kind {
    SemanticTypeGraph graph = 1;
    TypeInfoRequestError error = 2;
    FrameworkSurfacePayload framework_surface = 3;
    SymbolEntryListDto symbol_list = 4;
  }
}

// TypeInfoGraphRequest — generic envelope covering every typeinfo
// operation. The closed `operation` discriminator decides which payload
// arm carries the call; `relate` has no payload arm. The host serves
// resolve-symbol, expand-around, framework-surfaces and list-symbols; a
// request for any other operation is answered with
// `TypeInfoRequestError.unsupported_operation` whatever its payload.
message TypeInfoGraphRequest {
  uint32 schema_version = 1;
  GraphOperation operation = 2;
  oneof payload {
    ResolveSymbolGraphRequest resolve_symbol = 3;
    EvaluateTypeExpressionGraphRequest evaluate_type_expression = 4;
    ProjectPathGraphRequest project_path = 5;
    FlowNarrowingRequest flow_narrowing = 6;
    ContextualTypeRequest contextual_type = 7;
    ExpandGraphAroundRequest expand_around = 8;
    FrameworkSurfaceRequest framework_surface = 9;
    ListSymbolsRequest list_symbols = 10;
  }
}

message ResolveSymbolGraphRequest {
  string canonical_id = 1;
  string name = 2;
  GraphProjectionReductionContext context = 3;
  GraphClosurePolicy closure = 4;
  GraphDisplayPolicy display_policy = 5;
  bool include_provenance = 6;
  bool include_diagnostics = 7;
  repeated GraphProjectionRequest include_projection = 8;
  bool include_degraded = 9;
}

message EvaluateTypeExpressionGraphRequest {
  string scope_canonical = 1;
  StructuredTypeExpression expression = 2;
  repeated ImportSpecDto extra_imports = 3;
  GraphProjectionReductionContext context = 4;
  GraphClosurePolicy closure = 5;
  GraphDisplayPolicy display_policy = 6;
  bool include_provenance = 7;
  bool include_diagnostics = 8;
  repeated GraphProjectionRequest include_projection = 9;
}

message ProjectPathGraphRequest {
  string canonical_id = 1;
  string name = 2;
  // REQUIRED — empty path is a typed error.
  repeated GraphTypePathSegment path = 3;
  GraphProjectionReductionContext context = 4;
  GraphClosurePolicy closure = 5;
  GraphDisplayPolicy display_policy = 6;
  bool include_provenance = 7;
  bool include_diagnostics = 8;
  repeated GraphProjectionRequest include_projection = 9;
  bool include_degraded = 10;
}

message FlowNarrowingRequest {
  string canonical_id = 1;
  GraphSpanRef span = 2;
  GraphProjectionReductionContext context = 3;
  GraphDisplayPolicy display_policy = 4;
  bool include_provenance = 5;
  bool include_diagnostics = 6;
}

message ContextualTypeRequest {
  string canonical_id = 1;
  GraphSpanRef span = 2;
  GraphProjectionReductionContext context = 3;
  GraphDisplayPolicy display_policy = 4;
  bool include_provenance = 5;
  bool include_diagnostics = 6;
}

// ExpandGraphAroundRequest — expand one host-issued position (schema 12,
// the operation's floor). Schema 12 retired the parent graph handle and
// the graph-local target (fields 1 and 2, reserved): a position is named
// only by the `NodeRef` a previous answer published in its
// `node_id_map`. A tuple the host never issued, has evicted or does not
// hold whole is `UnknownNodeRef`; an issued tuple whose basis no longer
// describes the current inputs is `StaleBasis`. The `context.mode` must be
// the mode the reference was issued under (a resolve-symbol request's mode;
// NAVIGATE for a framework member's type); any other mode is
// MalformedPayload. Like resolve-symbol, the answer is published whatever
// demand is named. The closure policy bounds the expansion.
message ExpandGraphAroundRequest {
  reserved 1, 2;
  reserved "parent_graph", "target";
  NodeRef node_ref = 8;
  GraphProjectionReductionContext context = 3;
  GraphClosurePolicy closure = 4;
  GraphDisplayPolicy display_policy = 5;
  bool include_provenance = 6;
  bool include_diagnostics = 7;
}

message FrameworkSurfaceRequest {
  ComponentSelector selector = 1;
  GraphProjectionReductionContext context = 2;
  GraphClosurePolicy closure = 3;
  GraphDisplayPolicy display_policy = 4;
  bool include_provenance = 5;
  bool include_diagnostics = 6;
  repeated GraphProjectionRequest include_projection = 7;
  // The framework-surface operation's schema floor is 11 (the typed
  // `ComponentSelector.framework_profile`); a lower version is a typed
  // MalformedPayload before execution.
  uint32 schema_version = 8;
  // The facet demand (schema 10): the surface kinds this request asks for.
  // The list is REQUIRED — non-empty, no duplicate, no UNSPECIFIED value —
  // and the response carries exactly one `FrameworkSurfaceKindEntry` per
  // requested kind, in enum-tag order; an undemanded kind is omitted,
  // neither resolved nor filled.
  repeated FrameworkSurfaceKind requested_kinds = 9;
}

// ComponentSelector — the typed `Component` selector: a file, an
// export name and the typed framework profile the component is read under.
//
// Schema 11 retired the open adapter-id string (field 4, reserved) in
// favour of `framework_profile`: a host-admitted `FrameworkProfileId`
// reference. A display family (`FrameworkTag`, an adapter spelling, a file
// extension) is never a selector.
message ComponentSelector {
  reserved 4;
  reserved "framework_adapter_id";
  string canonical_id = 1;
  // Empty when the canonical is its own default export.
  string export_name = 2;
  bool has_export_name = 3;
  // REQUIRED from schema 11. The profile is discovered through
  // `TypeInfoCapabilityHandshakeResponse.framework_profiles`; a reference the
  // host does not admit is the typed `UnknownFrameworkProfile` error.
  FrameworkProfileRef framework_profile = 5;
}

// FrameworkProfileRef — a reference to one host-admitted semantic framework
// profile (`verter_identity::successor::FrameworkProfileId`): exactly one
// release over the carriers it claims, under the host's descriptor-schema
// epoch. `digest` is the identity's 32-byte canonical digest, exactly as the
// host advertised it. The host never reconstructs an identity from these
// bytes: it resolves them against its admitted profile index, so a
// reference the host did not mint fails before any semantic work. A
// digest whose length is not 32 is a MalformedPayload.
message FrameworkProfileRef {
  bytes digest = 1;
}

// FrameworkProfileAdvertisement — one admitted profile a host answers
// `framework_profile` references for. `family` and `release` are the
// manifest coordinates the profile was minted from (an exact release,
// never a range); `framework` is the display family and nothing else.
message FrameworkProfileAdvertisement {
  FrameworkProfileRef profile = 1;
  string family = 2;
  string release = 3;
  FrameworkTag framework = 4;
}

message GraphProjectionRequest {
  GraphProjectionKind kind = 1;
  // Optional projection-specific options blob — empty when none.
  bytes options_payload = 2;
}

// A range in the file `canonical_id` names: UTF-8 byte offsets, 0-based
// half-open (schema 9 unit contract). On a request an inverted or file-less
// ref is a typed MalformedPayload before execution.
message GraphSpanRef {
  string canonical_id = 1;
  uint32 start = 2;
  uint32 end = 3;
}

// ----------- Schema-version handshake -----------

message TypeInfoCapabilityHandshakeRequest {
  uint32 client_version = 1;
}

message TypeInfoCapabilityHandshakeResponse {
  uint32 server_version = 1;
  // Every version the server is prepared to accept. The client
  // intersects with its own supported set.
  repeated uint32 server_supported_versions = 2;
  // Every framework profile this host admits (schema 11), in digest order.
  // A `ComponentSelector.framework_profile` names one of these.
  repeated FrameworkProfileAdvertisement framework_profiles = 3;
}

// ----------- Framework surface payload -----------

// FrameworkSurfacePayload — the framework component-surface response
// (schema 3+). A framework-surface response carries EXACTLY ONE
// `FrameworkSurfaceKindEntry` per REQUESTED `FrameworkSurfaceKind`
// (`FrameworkSurfaceRequest.requested_kinds`, schema 10). Schema 4 added
// the add-only `FrameworkSurfaceMember.default_value_id` + `origin` fields.
// `selector` is the typed selector echo (schema 11): the file, export and
// the `framework_profile` the host resolved the surface under, built from
// the admitted identity. `framework` is the display family only.
message FrameworkSurfacePayload {
  uint32 schema_version = 1;
  ComponentSelector selector = 2;
  FrameworkTag framework = 3;
  // The graph nodes that describe the framework surface types (props,
  // emits, slots, options, expose). Indices index into the snapshot.
  SemanticTypeGraph graph = 4;
  repeated FrameworkSurfaceKindEntry surfaces = 5;
}

message FrameworkSurfaceKindEntry {
  FrameworkSurfaceKind kind = 1;
  repeated FrameworkSurfaceMember members = 2;
  // Per-kind support status (schema 3). Decides how `members` reads:
  // an empty member list under SUPPORTED is supported-empty, never
  // implicit unsupport.
  FrameworkSurfaceKindStatus status = 3;
}

// FrameworkSurfaceKindStatus — per-kind status semantics:
// - SUPPORTED: `members` is authoritative (empty = supported-empty);
// - UNSUPPORTED: `members` is empty, `exactness` is
//   GRAPH_EXACTNESS_UNSUPPORTED, and at least one diagnostic explains
//   the unsupport;
// - PARTIAL: `members` is a usable subset; diagnostics explain what
//   is missing;
// - UNSPECIFIED: invalid in server-produced v3 payloads.
// Reuses the existing `GraphExactness` and `GraphDiagnostic`
// vocabulary — no parallel diagnostic taxonomy.
message FrameworkSurfaceKindStatus {
  FrameworkSurfaceKindSupport support = 1;
  GraphExactness exactness = 2;
  repeated GraphDiagnostic diagnostics = 3;
}

message FrameworkSurfaceMember {
  uint32 name_id = 1;
  uint32 type_node_id = 2;
  bool required = 3;
  bool readonly = 4;
  // The member's runtime DEFAULT value source text, interned into the
  // graph string table (schema 4, add-only). Defaults are runtime
  // expressions (a destructuring default RHS, a `$bindable(<default>)`
  // fallback), not types — they ride a string id, never a type node.
  // `optional` so a string-table id of 0 (a legitimate intern slot) is
  // NOT confused with "no default"; absent ⇒ the member has no default.
  // A consumer that ignores this field keeps working.
  optional uint32 default_value_id = 5;
  // The member's DECLARATION origin (schema 4, add-only): the resolver-
  // known per-member declaration plus the ordered hop chain to it.
  // Absent when no origin was resolver-known. Populated only from routes
  // the shared resolver already traversed — never source-text-guessed.
  FrameworkSurfaceMemberOrigin origin = 6;
}

// The declaration ORIGIN of a framework-surface member (schema 4): the
// resolver-known declaration plus the ordered hop chain the shared
// resolver traversed to reach it. Framework-neutral — populated from
// resolver-known routes only. Typeinfo-graph-LOCAL (string ids index the
// graph string table); intentionally NOT the component-meta wire's
// `PropOrigin`/`ResolvedTypeDeclaration` (the two public wires stay
// decoupled).
message FrameworkSurfaceMemberOrigin {
  // The per-member resolved declaration (its declaring file, resolved
  // name, span, kind). Absent for an inline/local member that has a
  // declaration FILE but no separately-named declaration to resolve.
  FrameworkSurfaceMemberDeclaration declaration = 1;
  // The ordered hop chain from the requesting file to the declaration.
  repeated FrameworkSurfaceOriginHop chain = 2;
}

// One member's resolved declaration on the framework-surface graph wire
// (schema 4). String ids index the graph string table.
message FrameworkSurfaceMemberDeclaration {
  uint32 requested_name_id = 1;
  uint32 resolved_name_id = 2;
  uint32 canonical_source_id = 3;
  // UTF-8 byte offsets, 0-based half-open, in the file `canonical_source_id`
  // names (schema 9 unit contract). Meaningful only when `has_span` is true;
  // a producer sets it only for an exact range (`span_start <= span_end`) and
  // otherwise leaves both offsets 0 with `has_span` false.
  uint32 span_start = 4;
  uint32 span_end = 5;
  FrameworkSurfaceDeclarationKind kind = 6;
  bool has_span = 7;
}

// One hop in a framework-surface member's origin chain (schema 4).
// `kind` selects which fields apply. String ids index the graph string
// table.
//
// Every string-id field is PRESENCE-AWARE (proto3 `optional` / explicit
// has-bit): an unset field decodes as absent (None), NOT as string-table
// id 0. The graph string table is zero-based (entry 0 is a real interned
// string), so a plain `uint32` field defaulting to 0 would alias a real
// table entry — a sentinel collision that fabricates data for an N/A
// field. Mirroring `FrameworkSurfaceMember.default_value_id`'s pattern,
// each hop field is set ONLY when its hop kind genuinely carries it; the
// decoder reads presence and never resolves an unset field through the
// string table. Schema 4, add-only: the field numbers are unchanged
// (presence is a wire-compatible has-bit on the same tag).
message FrameworkSurfaceOriginHop {
  FrameworkSurfaceOriginHopKind kind = 1;
  // Import / Reexport: the source module canonical. Absent (unset) when
  // the hop kind does not carry it.
  optional uint32 from_id = 2;
  // Import: the raw import specifier. Absent when unrecorded or N/A.
  optional uint32 specifier_id = 3;
  // Import: the imported name in the source module. Absent when N/A.
  optional uint32 imported_name_id = 4;
  // Reexport: the module the symbol re-exports to. Absent when N/A.
  optional uint32 to_id = 5;
  // Reexport: the name the symbol is re-exported under. Absent when N/A.
  optional uint32 exported_name_id = 6;
  // Reexport: the original name before the re-export rename. Absent when
  // N/A.
  optional uint32 original_name_id = 7;
  // Alias: the alias target name. Absent when N/A.
  optional uint32 alias_name_id = 8;
}

enum FrameworkSurfaceOriginHopKind {
  FRAMEWORK_SURFACE_ORIGIN_HOP_KIND_UNSPECIFIED = 0;
  FRAMEWORK_SURFACE_ORIGIN_HOP_KIND_LOCAL = 1;
  FRAMEWORK_SURFACE_ORIGIN_HOP_KIND_IMPORT = 2;
  FRAMEWORK_SURFACE_ORIGIN_HOP_KIND_REEXPORT = 3;
  FRAMEWORK_SURFACE_ORIGIN_HOP_KIND_ALIAS = 4;
}

enum FrameworkSurfaceDeclarationKind {
  FRAMEWORK_SURFACE_DECLARATION_KIND_UNKNOWN = 0;
  FRAMEWORK_SURFACE_DECLARATION_KIND_INTERFACE = 1;
  FRAMEWORK_SURFACE_DECLARATION_KIND_TYPE_ALIAS = 2;
  FRAMEWORK_SURFACE_DECLARATION_KIND_CLASS = 3;
}

