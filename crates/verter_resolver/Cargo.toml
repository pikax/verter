[package]
name = "verter_resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Deterministic semantic resolution primitives for Verter"
publish = false

[dependencies]
hotpath = { version = "0.13", optional = true }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
parking_lot = "0.12"
rustc-hash = { workspace = true }
verter_analysis = { path = "../verter_analysis" }
verter_core = { path = "../verter_core" }
verter_span = { path = "../verter_span" }
verter_type_runtime = { path = "../verter_type_runtime", optional = true }
verter_vfs = { path = "../verter_vfs" }

[features]
default = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]
type-runtime = ["verter_type_runtime"]
