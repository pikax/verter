[package]
name = "verter_parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vue 3 SFC parser — tokenization, parsing, AST types, and shared utilities"
repository.workspace = true
documentation = "https://github.com/pikax/verter"
homepage.workspace = true
authors.workspace = true
keywords = ["vue", "parser", "sfc", "typescript"]
categories = ["compilers", "parsing"]
publish = false

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# Opt-in audit trace: emits `parser_cache_audit_hit` core trace events for
# every `TypeResolutionContext::cached_named_resolution` hit so cache-key
# sufficiency can be validated against the raw resolution graph. Enable
# from a downstream feature alias (e.g. `verter_session/parser_cache_audit`).
parser_cache_audit = []
# Reservation counting and fault injection for the stack containment
# (`oxc_parse::faults`), for downstream tests of its typed failures.
stack-fault-injection = []

[dependencies]
verter_debug_assert = { workspace = true }
verter_span = { path = "../verter_span", version = "0.0.1-beta.1" }
verter_language = { path = "../verter_language", version = "0.0.1-beta.3" }
verter_type_expr = { workspace = true }
verter_type_expr_oxc = { workspace = true }
hotpath = { version = "0.23", optional = true }
memchr = "2.8.0"
rustc-hash = { workspace = true }
smallvec = "1.15"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
stacker = "0.1.25"
psm = "0.1.32"
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_diagnostics = "0.151.0"
bumpalo = { version = "3.20.3", features = ["collections"] }
serde = { workspace = true }
phf = { version = "0.13.1", features = ["macros"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading"] }
