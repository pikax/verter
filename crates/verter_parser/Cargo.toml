[package]
name = "verter_parser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vue 3 SFC parser — tokenization, parsing, AST types, and shared utilities"
repository.workspace = true
documentation = "https://github.com/pikax/verter"
homepage.workspace = true
authors.workspace = true
keywords = ["vue", "parser", "sfc", "typescript"]
categories = ["compilers", "parsing"]
publish = false

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# Opt-in audit trace: emits `parser_cache_audit_hit` core trace events for
# every `TypeResolutionContext::cached_named_resolution` hit so cache-key
# sufficiency can be validated against the raw resolution graph. Enable
# from a downstream feature alias (e.g. `verter_session/parser_cache_audit`).
parser_cache_audit = []

[dependencies]
verter_span = { path = "../verter_span", version = "0.0.1-beta.1" }
verter_type_expr = { workspace = true }
verter_type_expr_oxc = { workspace = true }
hotpath = { version = "0.16", optional = true }
bitflags = "2.11"
memchr = "2.8.0"
rustc-hash = { workspace = true }
smallvec = "1.15"
lazy_static = "1.5.0"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_diagnostics = "0.126.0"
bumpalo = { version = "3.20.3", features = ["collections"] }
serde = { workspace = true }
serde_repr = "0.1.20"
serde_json = { workspace = true }
allocator-api2 = "0.4.0"
phf = { version = "0.13.1", features = ["macros"] }
sha2 = { workspace = true }
hex = "0.4.3"
