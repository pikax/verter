[package]
name = "verter_tsc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "verter-tsc — Vue SFC type checker using Verter codegen"

[[bin]]
name = "verter-tsc"
path = "src/main.rs"

[dependencies]
verter_core = { path = "../verter_core" }
verter_host = { path = "../verter_host" }
verter_vfs = { path = "../verter_vfs" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = "1"
tempfile = "3"
base64 = "0.22"
oxc_allocator = { workspace = true }
oxc_sourcemap = "6.0.2"
walkdir = "2"
