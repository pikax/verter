[[example]]
# Reads the dispatch-loop investigation counters and drives the stall
# watchdog, both of which exist only under `semantic-observe`.
name = "audit_real_component_meta"
path = "examples/audit_real_component_meta.rs"
required-features = ["semantic-observe"]

[[example]]
# Prints the host's provenance counters, which exist only under
# `semantic-observe`.
name = "currency_phase_probe"
path = "examples/currency_phase_probe.rs"
required-features = ["semantic-observe"]

[[example]]
# Per-request resolver-context port call counts; the counters exist only
# under `semantic-observe`, so an unmeasured build is a hard build error.
name = "resolver_dispatch_profile"
path = "examples/resolver_dispatch_profile.rs"
required-features = ["semantic-observe"]

[[example]]
name = "route_overhead_baseline"
path = "examples/route_overhead_baseline.rs"

[[example]]
# Requires `semantic-observe`: the whole point of this cell is to prove
# `compile_prepared`/`compile_batch` skip re-parsing by reading the real
# `compiler.carrier_parse.calls` counter (`verter_audit::attribution`).
# Without the feature that counter does not exist in the build at all —
# `verter_audit::attribution::{read, reset}` genuinely fail to resolve
# (see that module's own doc: "There is no disabled stub returning
# zero.") — so `required-features` makes an unmeasured run a hard build
# error instead of a silently-passing no-op.
name = "compiler_route_overhead"
path = "examples/compiler_route_overhead.rs"
required-features = ["semantic-observe"]

[[example]]
# Reads the decl-lowering handoff rendezvous profile, which exists only
# under `semantic-observe`.
name = "profile_real_component_meta"
path = "examples/profile_real_component_meta.rs"
required-features = ["semantic-observe"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The profiler itself is native-only: on wasm32 `hotpath` stays in its
# no-op mode, so `semantic-observe` builds for every target.
hotpath = { version = "0.23", optional = true, features = ["hotpath"] }
