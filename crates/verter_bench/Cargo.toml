[package]
name = "verter_bench"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
description = "Benchmarks and examples for verter_compiler"

[features]
# The one measurement opt-in (see docs/arch/semantic-observe.md): the
# work-attribution counter table and its reader, the currency-chokepoint
# wall-clock/call-count timers and the `hotpath` profiler instrumentation, in
# every layer this harness links. Production binaries never request it.
semantic-observe = [
  "verter_audit/semantic-observe",
  "verter_compiler/semantic-observe",
  "verter_workspace/semantic-observe",
  "verter_semantic/semantic-observe",
  "verter_session/semantic-observe",
  "verter_diagnostics/semantic-observe",
  "dep:hotpath",
]
# Allocation profiling through hotpath's own allocator, on top of the
# coordinated opt-in.
hotpath-alloc = ["semantic-observe", "verter_compiler/hotpath-alloc", "hotpath/hotpath-alloc"]
# The long-churn soak runner (`src/soak/`, `verter-soak`). Default-off
# tooling opt-in that forwards only the session's soak seams: the engine's
# flight rendezvous and the retention account's ACTIVE-occupancy window.
# Audit/footprint capture and `semantic-observe` stay off in this lane.
soak-support = ["verter_session/soak-support", "verter_type_engine/soak-support"]

[dependencies]
# `bench` unlocks `template`/`script` module visibility (see
# `verter_compiler`'s own Cargo.toml) for the benches/examples below; it does
# NOT gate `compile`/`compile_with_parsed`/`compile_client`, so it stays on
# the plain, non-dev dependency edge.
verter_compiler = { path = "../verter_compiler", features = ["bench"] }
verter_css_syntax = { path = "../verter_css_syntax" }
verter_parser = { path = "../verter_parser" }
verter_session = { path = "../verter_session" }
verter_type_engine = { path = "../verter_type_engine" }
verter_workspace = { path = "../verter_workspace" }
verter_lsp = { path = "../verter_lsp" }
tokio = { version = "1.52", features = ["rt", "sync"] }
verter_session_query = { workspace = true }
verter_audit = { path = "../verter_audit" }
verter_execution = { path = "../verter_execution" }
verter_diagnostics = { path = "../verter_diagnostics" }
verter_semantic = { path = "../verter_semantic" }
verter_semantic_source = { workspace = true }
verter_span = { path = "../verter_span" }
verter_type_expr = { workspace = true }
blake3 = { workspace = true }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_ast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1.25"
walkdir = "2.5"
glob = "0.3.3"
rayon = "1.12"
tempfile = "3.27"
sha2 = { workspace = true }
hotpath = { version = "0.23", optional = true }

# Process statistics for the semantic benchmark probe (`src/semantic_perf/process_stats.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
verter_supervise = { path = "../verter_supervise" }
# Activates `test-support` on `verter_compiler` for THIS crate's own
# bench/example targets only — `real_world_compile_bench.rs` and the
# `new_impl_check`/`profile_ast`/`vapor_check` examples measure the raw
# `compile`/`compile_with_parsed` one-shot core directly rather than through
# `StandaloneCompiler`'s atomic-publish wrapper. The regular `[dependencies]`
# edge above does NOT enable the feature: Cargo unifies dev-dependency
# features only for a package's own test/bench/example targets, never for
# its normal lib/bin build or for sibling workspace members sharing the same
# `verter_compiler` instance — so a plain `cargo check --workspace` (or any
# other crate's build) never observes `test-support` turned on because of
# this crate. Same idiom as the `verter_scheduler`/`verter_semantic`/
# `verter_compiler` dev-dependency edges in `verter_session`'s Cargo.toml.
verter_compiler = { path = "../verter_compiler", features = ["test-support"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
smallvec = "1.15"

[[bin]]
name = "css_latency_gate"
path = "src/bin/css_latency_gate.rs"

# The Verter arm of `scripts/benchmark/semantic-perf.mjs` (production library,
# system allocator) and its separately labelled allocation-counting twin.
[[bin]]
name = "semantic_perf_probe"
path = "src/bin/semantic_perf_probe.rs"

[[bin]]
name = "semantic_perf_probe_counted"
path = "src/bin/semantic_perf_probe_counted.rs"

# The long-churn soak runner (`src/soak/`): runs and verifies one mode of
# the frozen workload registered as evidence run `rev11-l1-soak`.
[[bin]]
name = "verter-soak"
path = "src/bin/verter-soak.rs"
required-features = ["soak-support"]

