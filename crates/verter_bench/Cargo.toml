[package]
name = "verter_bench"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
description = "Benchmarks and examples for verter_core"

[features]
hotpath = ["verter_core/hotpath", "dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["verter_core/hotpath-alloc", "hotpath", "hotpath/hotpath-alloc"]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]

[dependencies]
verter_core = { path = "../verter_core", features = ["bench"] }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_ast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2"
rayon = "1.7"
hotpath = { version = "0.13", optional = true }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
smallvec = "1"

[[bench]]
name = "bindings_bench"
harness = false

[[bench]]
name = "vfor_bench"
harness = false

[[bench]]
name = "vslot_bench"
harness = false

[[bench]]
name = "tokenizer_bench"
harness = false

[[bench]]
name = "css_bench"
harness = false

[[bench]]
name = "box_element_bench"
harness = false

[[bench]]
name = "stack_elements_bench"
harness = false

[[bench]]
name = "smallvec_children_bench"
harness = false

[[bench]]
name = "code_transform_bench"
harness = false

[[bench]]
name = "real_world_compile_bench"
harness = false

[[bench]]
name = "oxc_template_bench"
harness = false

[[bench]]
name = "new_impl_comparison"
harness = false


[[example]]
name = "expression_validator"
path = "examples/expression_validator.rs"

[[example]]
name = "check_matrix"
path = "examples/check_matrix.rs"

[[example]]
name = "profile_ast"
path = "examples/profile_ast.rs"

[[example]]
name = "new_impl_check"
path = "examples/new_impl_check.rs"

[[example]]
name = "vapor_check"
path = "examples/vapor_check.rs"
