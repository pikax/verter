[package]
name = "verter_bench"
version.workspace = true
edition.workspace = true
license = "MIT"
publish = false
description = "Benchmarks and examples for verter_core"

[dependencies]
verter_core = { path = "../verter_core" }
oxc_allocator = "0.112.0"
oxc_parser = "0.112.0"
oxc_span = "0.112.0"
oxc_ast = "0.112.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
rayon = "1.7"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "bindings_bench"
harness = false

[[bench]]
name = "vfor_bench"
harness = false

[[bench]]
name = "vslot_bench"
harness = false

[[bench]]
name = "tokenizer_bench"
harness = false

[[bench]]
name = "codegen_comparison"
harness = false

[[bench]]
name = "css_bench"
harness = false

[[example]]
name = "codegen"
path = "examples/codegen.rs"

[[example]]
name = "check"
path = "examples/check.rs"

[[example]]
name = "expression_validator"
path = "examples/expression_validator.rs"

[[example]]
name = "check_matrix"
path = "examples/check_matrix.rs"
