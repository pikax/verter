[package]
name = "verter_bench"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
description = "Benchmarks and examples for verter_compiler"

[features]
hotpath = [
  "verter_compiler/hotpath",
  "verter_session/hotpath",
  "verter_diagnostics/hotpath",
  "dep:hotpath",
  "hotpath/hotpath",
]
hotpath-alloc = ["verter_compiler/hotpath-alloc", "hotpath", "hotpath/hotpath-alloc"]
# Measurement-only rail for `examples/currency_phase_probe.rs`. Enables the
# per-site wall-clock/call-count timers on the currency chokepoints.
currency_probe = ["verter_session/currency_probe", "verter_workspace/currency_probe"]
# Measurement-only rail for `examples/attribution_baseline.rs`. Turns on the
# work-attribution counter table and its reader. This is the ONLY edge in the
# workspace that requests `verter_audit/attribution`; no production binary
# does, which is what keeps the counters unreadable in a shipped build.
attribution = ["verter_audit/attribution"]

[dependencies]
# `bench` unlocks `template`/`script` module visibility (see
# `verter_compiler`'s own Cargo.toml) for the benches/examples below; it does
# NOT gate `compile`/`compile_with_parsed`/`compile_client`, so it stays on
# the plain, non-dev dependency edge.
verter_compiler = { path = "../verter_compiler", features = ["bench"] }
verter_css_syntax = { path = "../verter_css_syntax" }
verter_parser = { path = "../verter_parser" }
verter_session = { path = "../verter_session" }
verter_workspace = { path = "../verter_workspace" }
verter_audit = { path = "../verter_audit" }
verter_diagnostics = { path = "../verter_diagnostics" }
verter_semantic = { path = "../verter_semantic" }
verter_span = { path = "../verter_span" }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_ast = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2.5"
glob = "0.3.3"
rayon = "1.12"
tempfile = "3.27"
hotpath = { version = "0.23", optional = true }

[dev-dependencies]
# Activates `test-support` on `verter_compiler` for THIS crate's own
# bench/example targets only — `real_world_compile_bench.rs` and the
# `new_impl_check`/`profile_ast`/`vapor_check` examples measure the raw
# `compile`/`compile_with_parsed` one-shot core directly rather than through
# `StandaloneCompiler`'s atomic-publish wrapper. The regular `[dependencies]`
# edge above does NOT enable the feature: Cargo unifies dev-dependency
# features only for a package's own test/bench/example targets, never for
# its normal lib/bin build or for sibling workspace members sharing the same
# `verter_compiler` instance — so a plain `cargo check --workspace` (or any
# other crate's build) never observes `test-support` turned on because of
# this crate. Same idiom as the `verter_scheduler`/`verter_semantic`/
# `verter_compiler` dev-dependency edges in `verter_session`'s Cargo.toml.
verter_compiler = { path = "../verter_compiler", features = ["test-support"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
smallvec = "1.15"

