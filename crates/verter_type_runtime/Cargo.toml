[package]
name = "verter_type_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "External TypeScript backend sessions (tsserver/TSGO) for Verter type expansion"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = "0.12.5"
tokio = { version = "1.52", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"
verter_span = { path = "../verter_span" }
verter_language = { path = "../verter_language" }
# The tsgo `--api` ATTACH transport: the dual-surface OWNED provider attaches an
# `--api` checker (diagnostics + reflection) to its own `tsgo --lsp` process over
# the server-minted pipe (the `custom/initializeAPISession` attach), reusing the
# vscode-jsonrpc transport + typed checker client this crate would otherwise
# duplicate.
verter_tsgo_api = { path = "../verter_tsgo_api" }

[dev-dependencies]
blake3 = { workspace = true }
verter_test_support = { path = "../verter_test_support" }
# Compile-fail SEAL witness for the branded `DisplaySignature` (P1-03): the
# fixtures under `tests/cases/compile-fail/` prove the out-of-crate forge
# vectors (struct literal, witness forge, Deserialize, &str coercion) do not
# compile. Gated behind the `compile-fail` feature (see [features]).
trybuild = "1.0"
# Per-test isolated temp dirs (auto-cleaned) for the discovery version-parse
# tests, so parallel runs never collide on a fixed temp path.
tempfile = "3.27"
# `test-util` provides the paused virtual clock (`#[tokio::test(start_paused = true)]`)
# the resilient restart-interleaving tests use to drive respawn backoff
# deterministically without any wall-clock sleep.
tokio = { version = "1.52", features = [
    "test-util",
    "macros",
    "rt",
    "sync",
    "time",
    "io-util",
] }

[features]
default = []
# Opt-in: enables the trybuild compile-fail SEAL fixtures
# (`tests/cases/compile_fail.rs` — the `DisplaySignature` brand seal).
# trybuild spawns a full `cargo build` of a fixture crate linking
# `verter_type_runtime`, so each fixture is `#[ignore]`d unless this feature is
# on. Run LOCALLY with `cargo nextest run -p verter_type_runtime --features
# compile-fail` (or `cargo test`). It is NOT wired into the default gate
# (`node scripts/gate.mjs`) or any CI workflow — the seals it asserts are also
# enforced structurally by the normal build, so a broken seal fails the
# ordinary compile. Recorded in `docs/arch/gate-integrity-ledger.md`.
compile-fail = []
