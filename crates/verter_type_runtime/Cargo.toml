[package]
name = "verter_type_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "External TypeScript backend sessions (tsserver/TSGO) for Verter type expansion"
publish = false

# TEST-ONLY fake-engine shim. The owned-attach test needs a process that
# answers `--version` deterministically, so the gate's accept/refuse verdict is
# chosen by the test rather than by whatever tsgo the machine has. Never built
# by a default/release build: the feature is enabled only by this crate's own
# test builds through the dev-dependency on itself below.
[[bin]]
name = "verter_type_runtime_fake_engine"
path = "src/bin/verter_type_runtime_fake_engine.rs"
required-features = ["test-fake-engine"]

[dependencies]
verter_debug_assert = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = "0.12.5"
tokio = { version = "1.52", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"
verter_span = { path = "../verter_span" }
verter_language = { path = "../verter_language" }
# The tsgo `--api` ATTACH transport: the dual-surface OWNED provider attaches an
# `--api` checker (diagnostics + reflection) to its own `tsgo --lsp` process over
# the server-minted pipe (the `custom/initializeAPISession` attach), reusing the
# vscode-jsonrpc transport + typed checker client this crate would otherwise
# duplicate.
verter_tsgo_api = { path = "../verter_tsgo_api" }

[dev-dependencies]
blake3 = { workspace = true }
verter_test_support = { path = "../verter_test_support" }
# Self dev-dependency: enables `test-fake-engine` for THIS crate's test builds
# only, so the fake-engine shim bin exists for `cargo test` (CARGO_BIN_EXE_)
# while default/release builds never produce it.
verter_type_runtime = { path = ".", features = ["test-fake-engine"] }
# Per-test isolated temp dirs (auto-cleaned) for the discovery version-parse
# tests, so parallel runs never collide on a fixed temp path.
tempfile = "3.27"
# `test-util` provides the paused virtual clock (`#[tokio::test(start_paused = true)]`)
# the resilient restart-interleaving tests use to drive respawn backoff
# deterministically without any wall-clock sleep.
tokio = { version = "1.52", features = [
    "test-util",
    "macros",
    "rt",
    "sync",
    "time",
    "io-util",
] }

[features]
default = []
test-fake-engine = ["verter_tsgo_api/test-fake-engine"]
