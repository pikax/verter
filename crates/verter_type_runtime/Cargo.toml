[package]
name = "verter_type_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "External TypeScript backend sessions (tsserver/TSGO) for Verter type expansion"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = "0.12.5"
tokio = { version = "1.52", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
tracing = "0.1.44"
verter_span = { path = "../verter_span" }
verter_language = { path = "../verter_language" }

[features]
default = []
