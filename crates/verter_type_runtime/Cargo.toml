[package]
name = "verter_type_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "External TypeScript backend sessions (tsserver/TSGO) for Verter type expansion"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = "0.12"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt", "macros"] }
tracing = "0.1"
verter_span = { path = "../verter_span" }

[features]
default = []
# Enables LSP-integration tests that depend on verter_host and LSP internals.
# Not enabled by default — only used when running tests from verter_lsp context.
__lsp_tests = []
