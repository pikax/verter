[package]
name = "verter_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust LSP server for Verter — Language Server Protocol implementation for Vue SFCs"
publish = false

[features]
hotpath = ["verter_session/hotpath", "verter_diagnostics/hotpath"]
# Opt-in test-support seam for items the SEPARATE integration-test binary needs
# (`#[cfg(any(test, feature = "test-support"))]`) — e.g. the delivered-ledger
# read `ProjectSync::delivered_provider_content`. Activated by the self-edge in
# dev-dependencies below (the same pattern as `verter_session`'s self-edge), so
# the seam exists for this crate's own test targets. The invariant this
# delivers is DEFAULT-OFF, not unconditional unreachability: no default build
# compiles the seam (it is not in the `default` feature closure — guard-enforced
# by `test_support_feature_is_not_in_default_build` in
# tests/cases/test_support_feature_off_in_default_build.rs) and no current
# dependent enables it, but an explicit opt-in (`--all-features`, or a future
# dependent declaring `features = ["test-support"]`) does compile it.
test-support = []

[dependencies]
verter_debug_assert = { workspace = true }
verter_session = { path = "../verter_session" }
verter_language = { path = "../verter_language" }
verter_audit = { path = "../verter_audit" }
verter_scheduler = { path = "../verter_scheduler" }
verter_workspace = { path = "../verter_workspace" }
verter_semantic = { path = "../verter_semantic" }
verter_diagnostics = { path = "../verter_diagnostics" }
verter_actions = { path = "../verter_actions" }
verter_span = { path = "../verter_span" }
verter_type_runtime = { path = "../verter_type_runtime" }
verter_ffi = { path = "../verter_ffi" }
verter_protocol = { path = "../verter_protocol" }
verter_tsgo_api = { path = "../verter_tsgo_api" }
# `CodeTransform` owns every edit to generated code, including the provider-side
# carrier import-specifier projection: the transform emits the delivered bytes
# and the geometry its position map is derived from, so the two can never
# describe different edits.
verter_compiler = { path = "../verter_compiler" }
verter_type_expr = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_sourcemap = "7.0.0"
blake3 = { workspace = true }
tower-lsp-server = "0.23"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "sync",
  "process",
  "time",
  "net",
  "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dashmap = "6.2"
glob = "0.3.3"
lru = "0.18"
parking_lot = "0.12.5"
# Atomic temp-then-rename for the on-disk carrier-snapshot store (the §2.2
# content-addressed blobs + atomic manifest swap). `NamedTempFile::persist`
# atomically replaces an existing target on every platform (ReplaceFile/
# MoveFileEx on Windows, rename(2) on Unix) — the cross-platform atomic-replace
# the published manifest swap requires. Also a dev-dependency (below) for the
# existing test seams; promoted to a runtime dep here for the store.
tempfile = "3.27"

[[bin]]
name = "verter-lsp"
path = "src/main.rs"

[dev-dependencies]
futures-util = "0.3.32"
tower-service = "0.3.3"
# Additive feature: unifies onto the main `tokio` dependency for test builds
# only, activating `start_paused`/virtual-time control so deterministic tests
# can prove "resolved via a signal, not a timer" as an exact virtual-clock
# assertion instead of a wall-clock margin.
tokio = { version = "1.52", features = ["test-util"] }
verter_macro_dto = { path = "../verter_macro_dto" }
# Test builds only: activates the snapshot-publication receipt seam a
# `cfg(test)` on `verter_workspace` could not expose across crates.
verter_workspace = { path = "../verter_workspace", features = ["test-support"] }
verter_test_support = { path = "../verter_test_support" }
paste = "1.0.15"
# Activates only test seams used by this crate's tests: cache-admission force
# controls (`test-support`) and project-binding constructors (`test-util`).
verter_session = { path = "../verter_session", features = ["test-support", "test-util"] }
verter_css_syntax = { path = "../verter_css_syntax", features = ["test-support"] }
# Structural `[features]`-table parse for the `test-support` default-off
# architecture guard (tests/cases/test_support_feature_off_in_default_build.rs),
# mirroring verter_session's dev-dependency of the same purpose.
toml = "1.1"
# Self-edge that activates `verter_lsp`'s OWN `test-support` feature for its
# test targets (unit + integration): feature unification gives the lib those
# seams exactly when it is built for this crate's tests, never for a production
# dependent. Mirrors `verter_session`'s self-edge.
verter_lsp = { path = ".", features = ["test-support"] }
# Used by `tests/editor_liveness_guards.rs` to AST-parse the LSP provider-sync
# source so the delegated-stale-close detector is robust against multiline call
# spans, bare-local stale sets, and aliased delegation (a line-based scan is
# trivially evadable). Mirrors `verter_session`'s syn-based architecture guards.
syn = { version = "2.0", features = ["full", "visit", "parsing"] }
# Used by `tests/stdio_launch_smoke.rs` to build the verter-lsp launch argv and
# initializationOptions through the SHARED editor-client launch contract, so the
# stdio handshake smoke also pins that contract (the same source the Lapce/Zed
# clients consume).
verter-editor-client = { path = "../verter-editor-client" }
