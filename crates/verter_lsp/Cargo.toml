[package]
name = "verter_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust LSP server for Verter — Language Server Protocol implementation for Vue SFCs"
publish = false

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath", "verter_session/hotpath", "verter_diagnostics/hotpath"]

[dependencies]
verter_session = { path = "../verter_session", features = ["session_metrics", "scheduler"] }
hotpath = { version = "0.13", optional = true }
verter_scheduler = { path = "../verter_scheduler" }
verter_workspace = { path = "../verter_workspace" }
verter_semantic = { path = "../verter_semantic" }
verter_diagnostics = { path = "../verter_diagnostics" }
verter_actions = { path = "../verter_actions" }
verter_span = { path = "../verter_span" }
verter_type_runtime = { path = "../verter_type_runtime" }
verter_mcp = { path = "../verter_mcp" }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_sourcemap = "6.0.2"
tower-lsp-server = "0.23"
rmcp = { version = "1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "sync",
  "process",
  "time",
  "net",
  "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
glob = "0.3"
parking_lot = "0.12"

[[bin]]
name = "verter-lsp"
path = "src/main.rs"

[dev-dependencies]
futures-util = "0.3"
paste = "1"
tempfile = "3.26.0"
