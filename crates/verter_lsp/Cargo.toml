[package]
name = "verter_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
verter_host = { path = "../verter_host" }
verter_analysis = { path = "../verter_analysis" }
oxc_sourcemap = "6.0.2"
tower-lsp-server = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "process", "time"] }
tracing = "0.1"
dashmap = "6"
glob = "0.3"

[[bin]]
name = "verter-lsp"
path = "src/main.rs"
