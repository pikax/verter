# The `#[oracle_row]` attribute proc-macro for the TS7 oracle harness
# (`docs/arch/u0-oracle-harness-design.md` §Q4). A proc-macro crate cannot also
# export non-proc-macro items, so it is its own crate; it is a DEV-dependency of
# `verter_session` (the lifted bodies are `#[cfg(test)]` unit tests), keeping it
# out of the production build + the resolver dep closure.
[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
