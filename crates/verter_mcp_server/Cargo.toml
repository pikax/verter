[package]
name = "verter_mcp_server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Standalone MCP server entry point for Verter — runs verter_mcp as an out-of-process binary so verter_lsp does not need to depend on verter_mcp by default"
publish = false

[[bin]]
name = "verter-mcp-server"
path = "src/main.rs"

[dependencies]
verter_mcp = { path = "../verter_mcp" }
tokio = { version = "1.52", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
verter_test_support = { path = "../verter_test_support" }
