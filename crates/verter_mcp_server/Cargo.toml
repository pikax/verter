[package]
name = "verter_mcp_server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Standalone MCP server entry point for Verter — runs verter_mcp as an out-of-process binary so verter_lsp does not need to depend on verter_mcp by default"
publish = false

[[bin]]
name = "verter-mcp-server"
path = "src/main.rs"

[dependencies]
verter_mcp = { path = "../verter_mcp" }
verter_diagnostics = { path = "../verter_diagnostics" }
verter_session = { path = "../verter_session" }
verter_semantic = { path = "../verter_semantic" }
verter_workspace = { path = "../verter_workspace" }
rmcp = { version = "1", features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
