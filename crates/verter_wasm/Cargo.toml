[package]
name = "verter_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "WebAssembly bindings for Verter Vue compiler (wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
verter_audit = { path = "../verter_audit" }
verter_session = { path = "../verter_session", version = "0.0.1-beta.1" }
verter_ffi = { path = "../verter_ffi", version = "0.0.1-beta.1" }
verter_compiler = { path = "../verter_compiler", version = "0.0.1-beta.1" }
verter_semantic = { path = "../verter_semantic" }
verter_type_expr = { workspace = true }
verter_diagnostics = { path = "../verter_diagnostics", version = "0.0.1-beta.1" }
verter_actions = { path = "../verter_actions", version = "0.0.1-beta.1" }
verter_protocol = { path = "../verter_protocol", version = "0.0.1-beta.1" }
verter_span = { path = "../verter_span" }
prost = "0.14.3"
wasm-bindgen = "0.2.122"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = { version = "0.1.7", optional = true }
# The wasm32-unknown-unknown backend selection in `.cargo/config.toml`
# (`getrandom_backend="wasm_js"`) requires the `wasm_js` cargo feature to
# also be enabled on every `getrandom` major reachable from this crate's
# dependency graph. `getrandom` 0.4 is the only major reached here.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.72"
verter_identity = { path = "../verter_identity" }
verter_css_syntax = { path = "../verter_css_syntax", features = ["test-support"] }
verter_semantic = { path = "../verter_semantic", features = ["test-support"] }
verter_session = { path = "../verter_session", features = ["test-support"] }
