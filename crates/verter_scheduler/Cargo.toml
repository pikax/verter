[package]
name = "verter_scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Async file scheduler for Verter — driver-owned DAG with typed identity admission, dependency gating, and per-class capacity accounting"
publish = false

[features]
# `hotpath/parking_lot` turns on hotpath's drop-in instrumented wrapper for
# `parking_lot::Mutex`, used for the scheduler's central DAG lock
# (`new_dag_mutex` in scheduler.rs — every admission, dispatch, and
# completion acquires it). The submission-inbox `crossbeam_channel` is NOT
# wrapped: `Sender<Submission>`/`Receiver<Submission>` are referenced by
# fully-qualified `crossbeam_channel::` path throughout scheduler.rs, so
# swapping the inbox's own construction to `hotpath::wrap::crossbeam_channel`
# would type-mismatch against every one of those call sites — adopting it
# would need those signatures converted to a shared type alias first, which
# is out of scope here.
hotpath = ["dep:hotpath", "hotpath/hotpath", "hotpath/parking_lot"]
# Exposes this crate's test-only instrumentation to cross-crate test code:
# the HostCpuPool internals (per-pool identity token TLS,
# `HostCpuPool::pool_id`, `HostCpuPool::build_count`, the
# `host_cpu_pool_token` re-export) and the `Scheduler::test_*` hooks
# (dispatch pause, batch-admit seam, per-admit epoch trace, analysis-snapshot
# clear) together with the fields and firing sites they need.
#
# This feature — never a build profile — is the sole declared availability
# contract for those items. A `cfg(debug_assertions)` gate would be a
# profile accident: the predicate is evaluated per compilation unit, so a
# dependent crate compiling its own tests under a profile with debug
# assertions off would see the items vanish from this crate while its test
# code still referenced them, and the same gate silently changes what is
# compiled between a dependent's debug and release builds.
#
# Production binaries MUST NOT enable this feature; downstream crates that
# need it for their own tests add `features = ["test-support"]` only in
# `[dev-dependencies]`, which Cargo unifies into their test/bench/example
# targets and not into a production build.
test-support = []

[dependencies]
verter_debug_assert = { workspace = true }
arc-swap = "1.9"
hotpath = { version = "0.23", optional = true }
parking_lot = "0.12.5"
rustc-hash = { workspace = true }
smallvec = "1.15"
dashmap = "6.2"
crossbeam-channel = "0.5.15"
verter_audit = { path = "../verter_audit" }
verter_language = { path = "../verter_language" }
verter_span = { path = "../verter_span" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[dev-dependencies]
