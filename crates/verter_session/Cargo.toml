[package]
name = "verter_session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Top-level session API for Verter — compilation, caching, dependency tracking, multi-file orchestration"
publish = false

[features]
default = []
session_metrics = []
# Opt-in: the TS7 oracle harness GENERATION side (the §4 generation spike + the
# snapshot generator), which drives the pinned tsgo via `verter_type_runtime`.
# `docs/arch/u0-oracle-harness-design.md` §3 invariant 1: tsgo is GENERATION-ONLY
# and lives behind this feature, NEVER in the default resolver/production build.
# The default gate (`cargo nextest run --workspace`, `cargo test -p verter_session`)
# does NOT enable it, so tsgo stays out of the default dependency closure — pinned
# by `oracle_tsgo_forbidden.rs::tsgo_not_reachable_from_resolver`. Activated via
# `cargo test -p verter_session --features oracle-gen` (the spike).
oracle-gen = ["dep:verter_type_runtime", "dep:tokio"]
# Opt-in: enables tests that read from `.integration-tests/repos/...`
# alongside the workspace. The default `cargo test --workspace --tests`
# run MUST stay hermetic — it does NOT enable this feature. Tests that
# need a live third-party clone (e.g., property-based corpus parity vs.
# the upstream nuxt-ui submodule) must gate themselves behind
# `#[cfg(feature = "external-corpus")]`.
external-corpus = []
# Opt-in: enables the trybuild compile-fail driver
# (`tests/g_compile/compile_fail.rs::workspace_accessor_visibility`). trybuild
# spawns a full `cargo build` of a fixture crate linking `verter_session`
# (~100s), so the test is `#[ignore]`d out of the default inner-loop run and
# enabled in CI via `cargo nextest run -p verter_session --features compile-fail`.
compile-fail = []
# Phase 11b diagnosis benchmark: enables the corpus-driven
# `repo_first_pass_diagnosis_corpus` integration test that the vitest
# at `packages/benchmark/src/repo-first-pass.spec.ts` invokes via
# `cargo test --features diagnosis-bench --test repo_first_pass_diagnosis_corpus`.
# Default `cargo test --workspace --tests` run does NOT enable this
# feature — corpus drift is detected by the harness before
# the work begins.
diagnosis-bench = ["external-corpus"]
# Debug-mode audit: on every `HostNamedTypeCacheAdapter::get` hit, recompute
# the slow-path resolution and assert structural equality against the cached
# value. Catches cache-key insufficiencies (a cached entry returned for a
# key that should resolve differently). Not gated behind `debug_assertions`
# because the slow path is expensive; opt-in for focused audit runs only.
parser_cache_audit = ["verter_compiler/parser_cache_audit"]
hotpath = [
  "dep:hotpath",
  "hotpath/hotpath",
  "verter_compiler/hotpath",
  "verter_semantic/hotpath",
  "verter_scheduler/hotpath",
  "verter_workspace/hotpath",
]

[dependencies]
verter_audit = { path = "../verter_audit" }
verter_compiler = { path = "../verter_compiler" }
verter_protocol = { path = "../verter_protocol" }
prost = "0.14.3"
verter_semantic = { path = "../verter_semantic" }
verter_type_expr = { workspace = true }
verter_type_expr_oxc = { workspace = true }
verter_span = { path = "../verter_span" }
verter_workspace = { path = "../verter_workspace" }
verter_scheduler = { path = "../verter_scheduler" }
# tsgo LSP driver — OPTIONAL, activated ONLY by the `oracle-gen` feature (the
# generation spike + snapshot generator). NEVER on the default build closure
# (tsgo is GENERATION-ONLY, design §3 inv 1). Pinned by
# `oracle_tsgo_forbidden.rs::tsgo_not_reachable_from_resolver`.
verter_type_runtime = { path = "../verter_type_runtime", optional = true }
# Async runtime for the `oracle-gen` spike's `#[tokio::test]` tsgo driver. OPTIONAL
# (only the `oracle-gen` feature activates it) so it stays off the default closure.
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "io-util", "process", "sync"], optional = true }
bitflags = "2.11"
dashmap = "6.2"
hotpath = { version = "0.16", optional = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
rustc-hash = { workspace = true }
self_cell = { workspace = true }
smallvec = "1.15"
uuid = { version = "1.23", features = ["v4"] }
sha2 = { workspace = true }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
serde = { workspace = true }
tracing = "0.1.44"
serde_json = { workspace = true }
sourcemap = "9.3"
thiserror = "2.0"
arc-swap = "1.9"
parking_lot = "0.12.5"
indexmap = "2.14"
similar = "3"
# ts-rs is a REGULAR dependency (not dev) so derives compile into production
# builds — the audit record types export their TS equivalents via a normal
# #[test], not a feature gate. Binary-size overhead (~50KB on WASM worst
# case) is documented in plan §1.4.
ts-rs = "12"
# Phase 10a — compile-time `assert_obj_safe!(ResolverContext)` lives in
# the production `src/resolver_core/resolver_context.rs` module so the
# dyn-compatibility check fails the build at any future trait edit that
# would forfeit dyn-safety. Therefore `static_assertions` is a REGULAR
# dependency, not a dev-dependency. Zero-cost: the macro expands to
# trait-object construction inside an inert const, so no runtime code is
# emitted.
static_assertions = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"
# uuid 1.22 split RNG into explicit features. On wasm32-unknown-unknown
# the `js` feature routes through wasm-bindgen + WebCrypto.
uuid = { version = "1.23", features = ["js"] }

# Windows process-RSS reporting in `component_meta_audit::current_process_rss`.
# Requires `K32GetProcessMemoryInfo` (kernel32.dll, exposed by
# `Win32_System_ProcessStatus`) and `GetCurrentProcess` (kernel32.dll,
# exposed by `Win32_System_Threading`). Workspace already pulls in
# `windows-sys = 0.61` via transitive deps, so we pin the same major to
# avoid a second copy in the dependency graph.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

# Phase 9b — Rayon-backed batch compile (`host_compile.rs`) is native-only.
# WASM continues to use the single-file `upsert` + `get_virtual_file` path.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# uuid 1.22 split RNG into explicit features. Native targets use
# `rng-getrandom` for v4 generation.
uuid = { version = "1.23", features = ["rng-getrandom"] }

[dev-dependencies]
# Oracle harness snapshot-identity hashing (test-only — the harness lives under
# `#[cfg(test)] mod typeinfo_tests`, so blake3 stays out of the production /
# resolver dependency closure, preserving `tsgo_not_reachable_from_resolver`).
blake3 = { workspace = true }
# `#[oracle_row]` attribute proc-macro for lifted TS7 oracle rows (test-only,
# §Q4). Dev-dependency keeps it out of the production / resolver dep closure.
verter_session_oracle_macro = { path = "../verter_session_oracle_macro" }
criterion = { version = "0.8.2", features = ["html_reports"] }
toml = "1.1"
verter_parser = { path = "../verter_parser" }
# Activates the `test-support` feature on `verter_scheduler` for
# `cargo test --package verter_session` (and example/bench) builds only.
# The regular dependency above does NOT enable the feature, so
# `cargo build --release --package verter_session` still compiles
# verter_scheduler without `host_cpu_pool_token`, `HostCpuPool::pool_id`,
# `HostCpuPool::build_count`, or the per-pool identity TLS. Cargo
# unifies feature requirements per-target — for tests/examples/benches
# the union includes `test-support`; for production it does not.
verter_scheduler = { path = "../verter_scheduler", features = ["test-support"] }
verter_type_expr = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
tempfile = "3.27"
walkdir = "2.5"
regex = "1.12"
# Phase 6b sub-plan §6b.D2b — T11 compile-fail trybuild target verifies
# that `VerterHost::workspace()` is gated behind `pub(crate)` and is not
# callable from external compilation units.
trybuild = "1.0"
tracing-test = "0.2.6"
# Phase 8 — `no_off_store_host_caches` static guard parses
# `crates/verter_session/src/lib.rs` via syn::parse_file to enumerate
# `VerterHost` fields and assert each cache-shaped field is either
# allow-listed (with phase-report citation) or lives on `ProjectTypeStore`.
# Phase 10a — `no_concrete_verter_host_in_seal_scope` static guard parses
# every file under the resolver-tier seal scope via `syn::Visit`,
# requiring the `visit` and `parsing` features in addition to the
# original `full`+`extra-traits` set.
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "parsing"] }
quote = "1.0.45"

# Generator for the SemanticQueryKeySpec table artifact (sole writer of
# `src/semantic_query/query_key_spec_table.txt`). Run via the pnpm script
# `gen:query-key-spec`; the diff-test only re-renders + compares.
[[bin]]
name = "gen-query-key-spec"
path = "src/bin/gen_query_key_spec.rs"

[[bench]]
name = "host_bench"
harness = false
