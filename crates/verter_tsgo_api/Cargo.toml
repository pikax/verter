[package]
name = "verter_tsgo_api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rust-native client for the tsgo (typescript-go) `--api` MessagePack protocol: hand-written wire codec, single-writer process actor, sync host-callback FS adapter, and interactive/batch scheduling lanes."
publish = false
# Bins are explicit-only: the fake engine is TEST tooling, never a shipped bin.
autobins = false

[features]
# Builds the TEST-ONLY fake tsgo engine (the `verter_tsgo_fake_engine` bin and
# the `fake_engine` module). Enabled by this crate's own test suite via the
# dev-dependency on itself below, and by consumer crates' test lanes the same
# way — never by a default/release build.
test-fake-engine = []

[[bin]]
name = "verter_tsgo_fake_engine"
path = "src/bin/verter_tsgo_fake_engine.rs"
required-features = ["test-fake-engine"]

[dependencies]
# Async runtime for the process actor + scheduling lanes. `net` adds the
# named-pipe (Windows) / Unix-domain-socket transport the `--api` ATTACH path
# connects to (the server-minted pipe). Feature set otherwise matches the
# workspace's other tokio consumers (verter_type_runtime / verter_napi).
tokio = { version = "1.52", features = ["io-util", "process", "sync", "time", "rt", "rt-multi-thread", "macros", "net"] }
# Immutable overlay snapshot published lock-free to the sync FS-callback path.
arc-swap = "1.9"
# Non-async synchronization for the pending-request table + lane bookkeeping.
parking_lot = "0.12.5"
# JSON payloads ride inside the MessagePack `bin` frame fields (the tsgo `--api`
# high-level ops encode params/results as `JSON.stringify(...)` UTF-8 bytes).
serde = { workspace = true }
serde_json = { workspace = true }
# Binary `--api` op results (getSourceFile / typeToTypeNode) ride a base64
# `{ data }` field on the vscode-jsonrpc ATTACH wire; the JSON parity oracle also
# base64-encodes carrier content for the Node harness.
base64 = "0.22.1"
# The leaf coordinate owner: the `--api` diagnostic offset contract (`pos`/`end`
# are UTF-16 code units) delegates the numeric UTF-16→byte / UTF-16→(line,col)
# conversion to `verter_span` so there is ONE offset-normalization implementation.
verter_span = { path = "../verter_span" }

# The Unix control-socket bind verifies the socket's private parent dir is owned by
# the current euid (`geteuid`) before binding — a Unix-only ownership check, so `libc`
# is a Unix-only dependency (workspace-resolved version, matching verter_relay_shim).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows control named pipe is created with an EXPLICIT owner-only DACL (the
# current-user SID only) so it matches the Unix side's `0o600` socket bar instead of
# inheriting the process token's broader ambient default DACL. Building that security
# descriptor needs the token/SID, ACL, and security-descriptor Win32 surface. `LocalFree`
# lives in `Win32_Foundation` (not `Win32_System_Memory`); the token calls in
# `Win32_System_Threading`; `SetEntriesInAclW`/`GetSecurityInfo` in
# `Win32_Security_Authorization`. `windows-sys 0.61` is already resolved in the workspace
# lockfile, so this adds no new package version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    # `Win32::System::Pipes` re-exports the named-pipe access/mode flags
    # (`PIPE_ACCESS_DUPLEX`, …) from `Win32::Storage::FileSystem` gated on
    # `all(Win32_Security, Win32_Storage_FileSystem)`, so the fake named-pipe
    # engine needs this feature explicitly (never relying on cross-crate
    # feature-unification leakage, which `--all-targets` resolution breaks).
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
] }

# NOTE: the STANDALONE `--api` transport uses the spawned engine's stdin/stdout
# pipes on EVERY platform (no platform-specific pipe crate). The shipped JS sync
# client uses a Windows named pipe only because Node's libuv handles cannot do
# synchronous fd I/O; the async tokio standalone transport reads/writes the stdio
# pipes directly (`tsgo --api` over stdio is verified working on Windows). The
# separate ATTACH path DOES connect to a server-minted named pipe / UDS — the pipe
# the `tsgo --lsp` server mints for `custom/initializeAPISession` — served through
# tokio's `net` feature, NOT a sync-fd workaround.

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time", "sync"] }
# Self dev-dependency: enables the `test-fake-engine` feature for THIS crate's
# test builds only (cargo builds dev-dependencies when compiling tests), so the
# fake engine bin exists for `cargo test` (CARGO_BIN_EXE_) while a default
# `cargo build` / release never produces it.
verter_tsgo_api = { path = ".", features = ["test-fake-engine"] }
