# The Svelte probe-state manifest: one pinned external workload, the complete
# ratified case inventory, and one declared cell per case per dimension.
#
# The corpus is a WORKLOAD, never an oracle. Nothing here derives an
# expected output from it: a cell records what Verter is expected to do and
# which authority owns that behaviour.
#
# This corpus COMMITS no components. Its `fixtures` tree is written by the
# upstream generator at the pinned revision, so every inventory row carries the
# SHA-256 of the case's LF-normalized bytes: the revision pin says which
# generator ran, and the digest says what it produced.
#
# Only `Route` may gate, because `compiler.public-request-route` is the only
# authority behind these cells whose owning node is implemented. Every
# `Compile` cell is a canary or a known-fail owned by
# `svelte.runtime-client-product`, and is promoted only when that authority is
# implemented and the promotion is ratified.
#
# No Svelte structural comparator exists, so every `Structural` cell is an
# owned skip rather than a silent pass — as are `Runtime` and `Map`, whose
# executor and validator are unbound for every framework.
#
# The `smoke` slice is the deterministic lexicographic first-`min_cases` of
# each stratum, and is checked to equal that derivation, so what a pull
# request runs is readable here and cannot be quietly re-scoped.

framework = "svelte"
comparison = "none"
