[package]
name = "verter_analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Static analysis for Vue SFCs — imports, exports, bindings, type resolution"
publish = false

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
verter_span = { path = "../verter_span" }
hotpath = { version = "0.13", optional = true }
verter_workspace = { path = "../verter_workspace" }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
sha2 = { workspace = true }
bitflags = "2"
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "analysis_bench"
harness = false

[[bench]]
name = "project_index_bench"
harness = false

[[bench]]
name = "type_eval_bench"
harness = false
