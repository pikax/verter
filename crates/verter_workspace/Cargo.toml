[package]
name = "verter_workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Workspace layer for Verter — file access, resolution, project ownership"
publish = false

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
# Measurement-only: enables the `currency_probe` wall-clock/call-count rail
# (`src/currency_probe.rs`). Absent from `default`; requested ONLY by the
# `verter_bench` measurement harness, never by a production edge.
currency_probe = []
# Tests that require third-party repository checkouts beside this repo
# (Testing-Hermeticity): excluded from the default canonical run; enable
# explicitly with `--features external-corpus`.
external-corpus = []
# Test-only observation seams (currently the snapshot-publication receipt).
# Off by default; requested by dependent crates' dev-dependencies so a
# cross-crate test can see a seam `cfg(test)` on THIS crate would hide.
# Exposes test-only constructors for otherwise crate-private identity
# newtypes (`ResolutionWorldId`, `SessionFingerprint`, `WorkspaceAuthorityId`)
# so a downstream crate's own unit tests can build a concrete
# `ResolutionBasis`-shaped value without minting through `Engine`/
# `WorkspaceRead::capture_resolution_world` — production code never uses
# these constructors. Matches the repo-wide `test-support` feature
# convention (e.g. `verter_css_syntax`).
test-support = []

[dependencies]
verter_debug_assert = { workspace = true }
arc-swap = "1.9"
dashmap = "6.2"
rustc-hash = { workspace = true }
hotpath = { version = "0.23", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
glob = "0.3.3"
imbl = "7.0.1"
parking_lot = "0.12.5"
smallvec = "1.15"
thiserror = "2.0"
verter_audit = { path = "../verter_audit" }
verter_language = { path = "../verter_language" }
verter_scheduler = { path = "../verter_scheduler" }
verter_semantic = { path = "../verter_semantic" }
verter_span = { path = "../verter_span" }
verter_type_expr = { workspace = true }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
tracing = "0.1.44"
walkdir = "2.5"
verter_tsgo_api = { path = "../verter_tsgo_api" }

[dev-dependencies]
tempfile = "3.27"
