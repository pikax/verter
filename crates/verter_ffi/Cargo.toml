[package]
name = "verter_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "FFI types for Verter — shared serializable structs for NAPI/WASM boundaries"
publish = false

[features]
default = []
scheduler = ["verter_session/scheduler"]

[dependencies]
verter_session = { path = "../verter_session", version = "0.0.1-beta.1", default-features = false }
verter_analysis = { path = "../verter_analysis" }
verter_diagnostics = { path = "../verter_diagnostics", version = "0.0.1-beta.1" }
verter_actions = { path = "../verter_actions", version = "0.0.1-beta.1" }
verter_resolver = { path = "../verter_resolver" }
verter_span = { path = "../verter_span" }
serde = { workspace = true }
