[package]
name = "verter_compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vue 3 SFC compiler — codegen, lowering, IDE output, style processing, source maps"
repository.workspace = true
documentation = "https://github.com/pikax/verter"
homepage.workspace = true
authors.workspace = true
keywords = ["vue", "compiler", "sfc", "typescript", "codegen"]
categories = ["compilers", "template-engine"]

[features]
# Exposes `template` (and `script`) as `pub` instead of `pub(crate)` — see
# `src/lib.rs`. Primarily for the benchmark harness, but also the visibility
# unlock the `segmented_overwrite_authority_is_unreachable_outside_the_crate`
# trybuild fixture needs: with `template` `pub(crate)`, an external fixture
# can't even NAME `template::code_gen::types::SegmentedOverwriteAuthority`,
# so its compile failure would prove module-privacy, not the item-level
# `pub(in ...)` restriction under test. Run that test with
# `cargo test -p verter_compiler --features bench --test main segmented_overwrite_compile_fail`.
bench = []
dhat-heap = []
# Gates the Svelte reference-drift / live-compiler harness
# (`tests/cases/svelte_oracle_harness.rs`), including the live golden-vs-pinned-compiler
# `--check` drift gate. EXCLUDED from the default canonical run
# (`cargo nextest run --workspace` + `cargo test -p verter_session --tests`) so
# the default suite never shells `node` / invokes the live svelte compiler — it
# keeps the HERMETIC committed-golden structural guard in
# `tests/cases/svelte_goldens_in_sync.rs`. Run the live oracle with
# `cargo test -p verter_compiler --features svelte-oracle --test main svelte_oracle_harness`.
svelte-oracle = []
# Opt-in Svelte conformance-observability side channel (the typed observations
# the Svelte conformance corpus tooling consumes): a thread-local trace captured
# at the parse/lowering producer boundaries — static-attribute quoting + HTML
# entity source representation (lexical provenance the semantic IR erases) —
# plus the CSS matcher's tri-state `MatchCertainty` facts (per-selector
# certainty, used/scoped selector spans, scoped element identities), returned by
# `svelte::runtime::conformance_trace::capture` /
# `compile_client_with_conformance_trace`. ZERO cost when off: the module, its
# producer hooks, and every trace collection site are compiled out, and the
# production IR structs carry no trace state under either setting.
conformance-trace = []
# Enables the corpus-only JSONL parse probe used to regenerate committed
# framework parse evidence. The binary is absent from default builds.
external-corpus = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
# Opt-in test-support seam for items the SEPARATE integration-test binary
# (`tests/cases/**`) must see but a normal `cargo build` must NOT compile.
# The integration binary links `verter_compiler` as a NON-test dependency, so
# a `#[cfg(test)]` item on the lib is invisible to it. This feature threads
# the needle: absent from `default`, so production builds don't enable it,
# yet the `[dev-dependencies]` self-edge below turns it ON for this crate's
# OWN test targets (the integration binary among them). Currently gates the
# `emit_static_style_object` re-export at crate root the A17 routing test
# (`style_declaration_list_routing.rs`) needs — `template` stays
# `pub(crate)` in every production build (see `template`'s own `bench`
# feature gate above; this is deliberately a SEPARATE mechanism, since
# `bench` widens `template`'s own visibility wholesale and interacts with
# `trybuild`'s feature-detection fallback for the unrelated
# `segmented_overwrite_compile_fail` fixture).
test-support = []

[dependencies]
verter_debug_assert = { workspace = true }
verter_ecma = { workspace = true }
verter_audit = { path = "../verter_audit" }
verter_css_syntax = { path = "../verter_css_syntax" }
verter_identity = { path = "../verter_identity" }
verter_language = { path = "../verter_language" }
verter_macro_dto = { workspace = true }
verter_parser = { path = "../verter_parser" }
verter_semantic = { path = "../verter_semantic" }
verter_span = { path = "../verter_span", version = "0.0.1-beta.1" }
verter_type_expr = { workspace = true }
verter_type_expr_oxc = { workspace = true }
hotpath = { version = "0.23", optional = true }
bitflags = "2.11"
memchr = "2.8.0"
# Arbitrary-precision integers for the Svelte client const-fold evaluator's BigInt
# values (a faithful port of official `scope.evaluate`, where `NUMBER` includes
# BigInt). Already a transitive dep via `oxc_ecmascript`; pinned directly here so
# the fold evaluator can name the type.
num-bigint = "0.4"
# IEEE-754 half-precision for the const-fold evaluator's `Math.f16round` global —
# an EXACT round-to-nearest-even f64→f16→f64 round-trip matching JS. Already a
# transitive dev-dep via criterion; pinned directly so the fold matches official.
half = "2"
rustc-hash = { workspace = true }
smallvec = "1.15"
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_diagnostics = "0.126.0"
serde = { workspace = true }
serde_json = { workspace = true }
oxc_sourcemap = "7.0.0"
base64 = "0.22.1"
sha2 = { workspace = true }
hex = "0.4.3"
lightningcss = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[dev-dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
tempfile = "3.27"
trybuild = "1.0"
# Activates the `test-support` feature on `verter_css_syntax` for
# `cargo test --package verter_compiler` (and example/bench) builds only —
# the `parse_inline_style_declarations` invocation counter the A17 "shared
# parser invoked exactly once" routing proof binds to
# (`style_declaration_list_routing.rs`, `ssr::css_to_js_object_tests`). The
# regular dependency above does NOT enable the feature, so production builds
# compile `parse_inline_style_declarations` without the counter TLS or its
# increment.
verter_css_syntax = { path = "../verter_css_syntax", features = ["test-support"] }
# Self-edge that activates this crate's OWN `test-support` feature for its
# test / example / bench targets ONLY (the integration binary `tests/cases/**`
# among them) — same idiom as the `verter_css_syntax` edge above.
verter_compiler = { path = ".", features = ["test-support"] }

[[bin]]
name = "parse_corpus_probe"
path = "src/bin/parse_corpus_probe.rs"
required-features = ["external-corpus"]
