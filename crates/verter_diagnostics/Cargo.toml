[package]
name = "verter_diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Vue SFC diagnostic engine — lint rules and DiagnosticSet"

[features]
# The coordinated, default-off observation opt-in (see docs/arch/semantic-observe.md):
# compiles this crate's `hotpath` measurement attributes. No production edge
# enables it.
semantic-observe = ["dep:hotpath"]

[dependencies]
verter_session_query = { workspace = true }
verter_span = { path = "../verter_span" }
hotpath = { version = "0.23", optional = true }
verter_semantic = { path = "../verter_semantic" }
verter_language = { path = "../verter_language" }
verter_workspace = { path = "../verter_workspace" }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
verter_type_expr = { path = "../verter_type_expr" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The profiler itself is native-only: on wasm32 `hotpath` stays in its
# no-op mode, so `semantic-observe` builds for every target.
hotpath = { version = "0.23", optional = true, features = ["hotpath"] }
