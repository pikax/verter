[package]
name = "verter_mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "MCP server for Verter — Model Context Protocol server for AI-assisted Vue development"
publish = false

[lib]
name = "verter_mcp"
path = "src/lib.rs"

[[bin]]
name = "verter-mcp"
path = "src/main.rs"

[dependencies]
verter_audit = { path = "../verter_audit" }
verter_session = { path = "../verter_session" }
verter_semantic = { path = "../verter_semantic" }
verter_workspace = { path = "../verter_workspace" }
verter_diagnostics = { path = "../verter_diagnostics" }
verter_actions = { path = "../verter_actions" }
verter_protocol = { path = "../verter_protocol" }
rmcp = { version = "1.7", features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }
tokio = { version = "1.52", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.2"
clap = { version = "4.6", features = ["derive"] }
walkdir = "2.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
axum = "0.8.9"

[dev-dependencies]
verter_span = { path = "../verter_span" }
