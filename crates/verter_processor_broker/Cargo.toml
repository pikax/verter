[package]
name = "verter_processor_broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Fresh denied-worker launch, attestation, authenticated framing, and broker correlation substrate."
publish = false
autobins = false

[[bin]]
name = "verter-processor-worker"
path = "src/bin/verter_processor_worker.rs"

[dependencies]
sha2 = { workspace = true }
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
trybuild = "1.0"
