[package]
name = "verter_formatter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Typed byte coordinate domains and provenance identity for the Verter formatter — the foundation under native document formatting"
keywords = ["vue", "compiler", "formatter"]
categories = ["compilers"]

# The only production dependency is the regular-expression engine that runs
# the pinned text-width tables. No parser, semantic, host, protocol or routing
# crate: the renderer cannot parse source, analyze semantics or dispatch a
# request.
[dependencies]
regex = "=1.13.1"
