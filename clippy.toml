# Workspace-wide clippy configuration.
#
# `disallowed-macros` bans the raw `debug_assert!`/`debug_assert_eq!`/
# `debug_assert_ne!` macros. These vanish entirely — condition, arguments,
# and any side effect the condition expression performs — when
# `debug_assertions` is off (release, and the gate's `no-debug-assertions`
# shipped-cfg profile). A condition or argument expression that performs a
# state transition (a mutation, a counter bump, anything beyond a pure
# predicate) silently never runs in a shipped build if it lives inside one
# of these macros. See docs/contributing/gate-performance.md for the measured
# clippy behavior this config
# depends on: `std::debug_assert` also catches the bare `debug_assert!` and
# `core::debug_assert!` spellings (same resolved path), but `debug_assert_eq`
# and `debug_assert_ne` are distinct paths that need their own entries.
#
# `verter_debug_assert::{verter_debug_assert, verter_debug_assert_eq,
# verter_debug_assert_ne}` is the sanctioned replacement — same
# debug-only-check semantics, but callers precompute any side-effecting
# value into a `let` binding first (which always runs, in every profile)
# and pass the resulting inert value/bool into the macro.
disallowed-macros = [
  { path = "std::debug_assert",    reason = "use verter_debug_assert::verter_debug_assert! — precompute any side-effecting value first, the raw macro's condition never runs in a shipped build" },
  { path = "std::debug_assert_eq", reason = "use verter_debug_assert::verter_debug_assert_eq! — precompute any side-effecting value first, the raw macro's arguments never evaluate in a shipped build" },
  { path = "std::debug_assert_ne", reason = "use verter_debug_assert::verter_debug_assert_ne! — precompute any side-effecting value first, the raw macro's arguments never evaluate in a shipped build" },
]
