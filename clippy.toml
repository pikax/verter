# Workspace-wide clippy configuration.
#
# `disallowed-macros` bans the raw `debug_assert!`/`debug_assert_eq!`/
# `debug_assert_ne!` macros. These vanish entirely — condition, arguments,
# and any side effect the condition expression performs — when
# `debug_assertions` is off (release, and the gate's `no-debug-assertions`
# shipped-cfg profile). A condition or argument expression that performs a
# state transition (a mutation, a counter bump, anything beyond a pure
# predicate) silently never runs in a shipped build if it lives inside one
# of these macros. See docs/contributing/gate-performance.md for the measured
# clippy behavior this config
# depends on: `std::debug_assert` also catches the bare `debug_assert!` and
# `core::debug_assert!` spellings (same resolved path), but `debug_assert_eq`
# and `debug_assert_ne` are distinct paths that need their own entries.
#
# `verter_debug_assert::{verter_debug_assert, verter_debug_assert_eq,
# verter_debug_assert_ne}` is the sanctioned replacement — same
# debug-only-check semantics, but callers precompute any side-effecting
# value into a `let` binding first (which always runs, in every profile)
# and pass the resulting inert value/bool into the macro.
disallowed-macros = [
  { path = "std::debug_assert",    reason = "use verter_debug_assert::verter_debug_assert! — precompute any side-effecting value first, the raw macro's condition never runs in a shipped build" },
  { path = "std::debug_assert_eq", reason = "use verter_debug_assert::verter_debug_assert_eq! — precompute any side-effecting value first, the raw macro's arguments never evaluate in a shipped build" },
  { path = "std::debug_assert_ne", reason = "use verter_debug_assert::verter_debug_assert_ne! — precompute any side-effecting value first, the raw macro's arguments never evaluate in a shipped build" },
]

# `ignore-interior-mutability` lets a `FactVersionRef` key hash sets and
# maps. A `ResultReceipt`'s `Eq`/`Ord`/`Hash` read only its immutable
# evidence (digest, facts); the only interior mutability it reaches is the
# process retention account behind its own `RetentionCharge` and a fact-tree
# node's charge and claimed flag, which never participate in a receipt's or a
# `FactSet`'s identity. `bytes::Bytes` keeps
# clippy's default. Per-crate clippy.toml files carry their own copy (clippy
# does not merge this file into a crate that has its own).
# A `RetentionCharge` reaches the retention account's counters solely to
# release its bytes; a charge carried by a self-charged record (an interned
# identity, a budget profile) never participates in that record's equality or
# hash.
# An owned allocation (`Owned`, `OwnedStr`, `OwnedSlice`) reaches its
# self-charge solely for retention accounting; equality, order and hash read
# only its immutable payload.
# Node roots and signature epoch leases reach mutable storage solely for
# lifetime management. Their immutable operands/version attachments never
# mutate a key's semantic equality or hash (see IdentityNodeRoots/SignatureVersion).
# An owned, self-charged handle (`Owned`, `OwnedSlice`, `OwnedStr`) reaches
# its cell's charge slot solely to charge and release its allocation; its
# `Eq`/`Ord`/`Hash` read only the immutable value.
# A literal value identity holds its node's shared payload, which reaches the
# payload's held-release charge slot solely for lifetime accounting; its
# `Eq`/`Hash` read only the immutable literal value and its precomputed hash.
# A graph payload read (`NodeData`) reaches its payload cell's release slot
# solely to give back the payload's charge when its last holder drops; its
# `Eq`/`Hash` read only the immutable payload.
ignore-interior-mutability = [
  "bytes::Bytes",
  "verter_session_query::facts::receipt::ResultReceipt",
  "verter_session_query::retention::RetentionCharge",
  "verter_type_engine::project_semantic_dispatch::canonical_algebra::LiteralValueIdentity",
  "verter_type_engine::semantic_query_memo::node_roots::NodeRootSet",
  "verter_type_engine::signature_kernel::lifetime::SignatureEpochLease",
  "verter_retention::owned::Owned",
  "verter_retention::owned::OwnedSlice",
  "verter_retention::owned::OwnedStr",
  "verter_retention::RetentionCharge",
  "verter_type_engine::semantic_query_memo::arena::NodeData",
]
