name: Download artifact (bounded retry)
description: >-
  actions/download-artifact with a bounded retry. The artifact service
  intermittently answers the artifact LIST call with a 403 from its
  intermediary; the action classifies that as non-retryable and fails the job
  on the spot, so a consumer of a perfectly good artifact went red for a reason
  unrelated to the tree. Three attempts with a growing pause absorb that class.
  Nothing downstream of the download is retried, so a real failure stays
  visible, and a missing artifact still fails on the third attempt.

inputs:
  name:
    description: The artifact name, exactly as uploaded.
    required: true
  path:
    description: The destination directory.
    required: true

runs:
  using: composite
  steps:
    - id: first
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::download of artifact '${{ inputs.name }}' failed on attempt 1/3; retrying in 20s"
        sleep 20
    - id: second
      if: steps.first.outcome == 'failure'
      uses: actions/download-artifact@v7
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::download of artifact '${{ inputs.name }}' failed on attempt 2/3; retrying in 40s"
        sleep 40
    - id: third
      if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
