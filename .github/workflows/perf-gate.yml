name: Perf Gate

# Candidate and runtime-selected baseline builds run interleaved on one runner.
# Nightly comparisons default to the candidate's immediate parent. Manual runs
# may choose a baseline ref, resolved once before either build. Checkout IDs are
# run provenance, never committed historical acceptance evidence. Distinct build,
# corpus, engine, coverage and content checks remain required.

on:
  schedule:
    - cron: "0 5 * * *" # 5 AM UTC daily (the nightly blocking run)
  workflow_dispatch:
    inputs:
      baseline-ref:
        description: "Comparison ref (empty selects candidate parent; resolved once per run)"
        required: false
        default: ""
      samples:
        description: "Samples per side (>=7 for the blocking gate)"
        required: false
        default: "7"
  pull_request:
    paths:
      - "packages/benchmark/src/perf/**"
      - "packages/benchmark/baselines/**"
      - "test-corpora/perf/**"
      - ".github/workflows/perf-gate.yml"

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Per-PR: correctness only (NOT the perf gate) ──────────────────────────
  perf-harness-correctness:
    name: Perf harness correctness (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify perf harness imports
        run: |
          pnpm --filter @verter/lsp-test-client build
          pnpm --filter @verter/benchmark exec node --import tsx -e 'await import("./src/perf/lsp-driver.ts")'
      # The gate predicate + evaluation math, the discriminating gate-property
      # specs (skip/degenerate/tail/correctness/behavioral/arming), and the
      # corpus determinism + manifest-freshness rails — pure unit specs, no
      # binaries, no corpus materialization. The per-PR correctness contract.
      - name: Perf harness unit specs
        run: >
          pnpm --filter @verter/benchmark exec vitest run
          src/perf/stats.spec.ts src/perf/gate.spec.ts src/perf/baseline.spec.ts src/perf/corpus.spec.ts
          src/perf/lsp-driver.spec.ts src/perf/lsp-binary-resolution.spec.ts
          src/perf/workloads.spec.ts src/perf/run.spec.ts
          src/perf/axis-a-child.spec.ts src/perf/audit-attribution.spec.ts
          src/perf/vize-bench.spec.ts
      # Verify the corpus generator reproduces its committed manifest hash (the
      # integrity rail) — fast, in-memory, no materialization. OS-independent:
      # the generator emits POSIX paths + LF, so this hash matches on every OS.
      - name: Corpus manifest hash check
        run: |
          PRODUCED=$(node test-corpora/perf/synthetic-15k/generator/generate.mjs --hash-only)
          COMMITTED=$(node -e "console.log(require('./test-corpora/perf/synthetic-15k/manifest.json').contentHash)")
          echo "produced:  $PRODUCED"
          echo "committed: $COMMITTED"
          test "$PRODUCED" = "$COMMITTED" || {
            echo "::error::corpus generator output does not match the committed manifest hash — refresh manifest.json"
            exit 1
          }

  # ── Nightly-on-main: the full self-referential gate (BLOCKING) ────────────
  perf-gate-nightly:
    name: Self-referential perf gate (nightly, blocking)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest # the ONE canonical blocking perf environment
    timeout-minutes: 60
    steps:
      # A workflow_dispatch may pass an arbitrary `samples`; the blocking gate
      # computes p50/p95/p99 over the pooled per-side distribution and needs at
      # least the blocking floor of 7 samples/side to support those tail
      # percentiles. Validate the floor FIRST — before the expensive candidate +
      # baseline builds — so a sub-floor run fails fast with a clear message
      # (evaluateGate also enforces it, but a late failure wastes the full build).
      - name: Validate samples floor
        env:
          SAMPLES: ${{ github.event.inputs.samples || '7' }}
        run: |
          if ! echo "$SAMPLES" | grep -qE '^[0-9]+$'; then
            echo "::error::perf gate samples '$SAMPLES' is not a non-negative integer."
            exit 1
          fi
          if [ "$SAMPLES" -lt 7 ]; then
            echo "::error::perf gate samples=$SAMPLES is below the blocking floor of 7 — a full/armed run needs >=7 samples/side for stable p50/p95/p99. Re-run with samples>=7."
            exit 1
          fi
          echo "samples=$SAMPLES (>= blocking floor 7)"

      - name: Checkout candidate (HEAD)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # resolve this run's comparison checkout

      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            target-baseline
          key: ${{ runner.os }}-perf-gate-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-gate-cargo-
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The tsgo engine (typescript@7.0.2, the TS 7 native compiler) is PINNED
      # in the workspace-root devDeps; --frozen-lockfile brings exactly that
      # version. The gate resolves the installed `typescript` version and FAILS a
      # full run on a mismatch with the manifest's tsgoVersion — so there is NO
      # runtime `pnpm add @latest` (which would mutate the lockfile after a
      # frozen install and float the engine).
      - run: pnpm install --frozen-lockfile

      # Vitest aliases this package to source; the runtime harness needs dist.
      # One candidate-side driver measures both separately built server sides.
      - name: Build and verify perf harness imports
        run: |
          pnpm --filter @verter/lsp-test-client build
          pnpm --filter @verter/benchmark exec node --import tsx -e 'await import("./src/perf/lsp-driver.ts")'

      - name: Resolve baseline ref
        id: baseline
        env:
          CANDIDATE_REF: ${{ github.sha }}
          BASELINE_REF: ${{ github.event.inputs.baseline-ref || '' }}
        run: pnpm --filter @verter/benchmark exec node --import tsx src/perf/baseline.ts

      # --- Build the CANDIDATE (HEAD): native + binaries ---
      - name: Build candidate (native + verter-tsc + verter_lsp)
        # Axis A attributes carrier counts and costs from `compileWithAudit`
        # records, which only a binding built with `semantic-observe` captures.
        run: |
          pnpm --filter @verter/native build:observe
          cargo build --release -p verter_tsc -p verter_lsp
          mkdir -p artifacts/candidate-bin
          cp target/release/verter-tsc artifacts/candidate-bin/
          cp target/release/verter-lsp artifacts/candidate-bin/

      # Build the resolved baseline in a separate worktree.
      - name: Build baseline (resolved ref — native + verter-tsc + verter_lsp)
        env:
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          git worktree add ../verter-baseline "$BASELINE_REF"
          cd ../verter-baseline
          pnpm install --frozen-lockfile
          # Axis A loads each side's OWN @verter/native, so the baseline worktree
          # MUST build native too (not only the binaries). A baseline that
          # compiles audit capture behind `semantic-observe` builds the capturing
          # binding, like the candidate; an older one captures unconditionally.
          if node -e "process.exit(require('./packages/native/package.json').scripts['build:observe'] ? 0 : 1)"; then
            pnpm --filter @verter/native build:observe
          else
            pnpm run build:native
          fi
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-baseline" cargo build --release -p verter_tsc -p verter_lsp
          mkdir -p "$GITHUB_WORKSPACE/artifacts/baseline-bin"
          cp "$GITHUB_WORKSPACE/target-baseline/release/verter-tsc" "$GITHUB_WORKSPACE/artifacts/baseline-bin/"
          cp "$GITHUB_WORKSPACE/target-baseline/release/verter-lsp" "$GITHUB_WORKSPACE/artifacts/baseline-bin/"

      - name: Run self-referential perf gate
        env:
          SAMPLES: ${{ github.event.inputs.samples || '7' }}
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @verter/benchmark exec node --import tsx src/perf/gate.ts \
            --samples "$SAMPLES" --out "$GITHUB_WORKSPACE/artifacts/perf-gate-result.json" \
            --baseline-ref "$BASELINE_REF" \
            --candidate-bin "$GITHUB_WORKSPACE/artifacts/candidate-bin" \
            --baseline-bin "$GITHUB_WORKSPACE/artifacts/baseline-bin" \
            --candidate-native "$GITHUB_WORKSPACE/packages/native" \
            --baseline-native "$GITHUB_WORKSPACE/../verter-baseline/packages/native" \
            --baseline-root "$GITHUB_WORKSPACE/../verter-baseline"

      # The gate itself always writes perf-gate-result.json — even on a
      # pre-report failure (corpus-hash mismatch / import / setup) it emits a
      # pass:false error JSON before exiting nonzero. This fallback covers the
      # remaining case: a build/setup step that fails BEFORE the gate runs, so
      # the always() upload below is never empty.
      - name: Ensure a perf-gate artifact exists
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          F="$GITHUB_WORKSPACE/artifacts/perf-gate-result.json"
          if [ ! -f "$F" ]; then
            printf '{"timestamp":"%s","pass":false,"error":"perf gate produced no result (a build/setup step failed before the gate ran)"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$F"
          fi

      # The CI artifact (raw ordered samples per side, ratios, CIs, memory,
      # correctness/behavioral results, corpus hash, baseline ref, mode, engine
      # version, threads) is uploaded EVEN on failure, and is guaranteed present.
      - name: Upload perf-gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-result
          path: artifacts/perf-gate-result.json
          if-no-files-found: error
