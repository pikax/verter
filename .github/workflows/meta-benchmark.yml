name: Component Meta Benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to benchmark"
        required: false
        default: "main"

  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  check-trigger:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/meta-benchmark')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      pr-number: ${{ steps.get-pr.outputs.pr-number }}
      pr-sha: ${{ steps.get-pr.outputs.pr-sha }}
      pr-ref: ${{ steps.get-pr.outputs.pr-ref }}
    steps:
      - name: Check comment author
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const commentBody = comment.body.trim();

            if (!commentBody.startsWith('/meta-benchmark')) {
              core.setOutput('should-run', 'false');
              return;
            }

            const { data: collaborator } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: comment.user.login
            });

            const hasPermission = ['admin', 'write'].includes(collaborator.permission);
            core.setOutput('should-run', hasPermission ? 'true' : 'false');

            if (!hasPermission) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${comment.user.login} Sorry, you don't have permission to trigger benchmarks.`
              });
            } else {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                content: 'rocket'
              });
            }

      - name: Get PR details
        if: steps.check.outputs.should-run == 'true'
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('pr-number', context.issue.number);
            core.setOutput('pr-sha', pr.head.sha);
            core.setOutput('pr-ref', pr.head.ref);

  resolve-target:
    needs: check-trigger
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && needs.check-trigger.outputs.should-run == 'true'))
    runs-on: ubuntu-latest
    outputs:
      target-sha: ${{ steps.resolve.outputs.target-sha }}
    steps:
      - name: Resolve latest nuxt-ui SHA
        id: resolve
        run: |
          TARGET_SHA=$(git ls-remote https://github.com/nuxt/ui.git refs/heads/v4 | awk '{print $1}')
          if [ -z "$TARGET_SHA" ]; then
            echo "Failed to resolve nuxt-ui v4 SHA" >&2
            exit 1
          fi
          echo "target-sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved nuxt-ui v4 to $TARGET_SHA"

  build-verter:
    needs: [check-trigger, resolve-target]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && needs.check-trigger.outputs.should-run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "ref=refs/pull/${{ needs.check-trigger.outputs.pr-number }}/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-ui-benchmark-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native package
        run: pnpm --filter @verter/native build

      - name: Build component-meta
        run: pnpm --filter @verter/component-meta build

      - name: Upload Verter benchmark build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: verter-meta-build
          path: |
            packages/native/dist/
            packages/component-meta/dist/
          retention-days: 7

  expected-baseline:
    needs: [check-trigger, resolve-target]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && needs.check-trigger.outputs.should-run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "ref=refs/pull/${{ needs.check-trigger.outputs.pr-number }}/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare pinned nuxt-ui checkout
        run: |
          pnpm --filter @verter/benchmark bench:meta:ui:setup -- --ref=${{ needs.resolve-target.outputs.target-sha }}

      - name: Build vue-component-meta expected artifacts
        run: |
          pnpm --filter @verter/benchmark bench:meta:ui -- \
            --backends=vue-component-meta \
            --expected=vue-component-meta \
            --expected-dir=packages/benchmark/benchmark-results/meta-ui-expected \
            --build-expected-only

      - name: Upload expected artifacts
        uses: actions/upload-artifact@v6
        with:
          name: expected-baseline-meta-ui
          path: packages/benchmark/benchmark-results/meta-ui-expected/
          retention-days: 7

  benchmark:
    needs: [check-trigger, resolve-target, build-verter, expected-baseline]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && needs.check-trigger.outputs.should-run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [vue-component-meta, verter, tsserver, tsgo]
        scenario: [single_cold, single_warm, repo_first_pass, repo_warm_second_pass]
    permissions:
      contents: write
      pull-requests: write
      checks: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "ref=refs/pull/${{ needs.check-trigger.outputs.pr-number }}/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: meta-ui-benchmark-build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Verter build artifacts
        uses: actions/download-artifact@v7
        with:
          name: verter-meta-build
          path: .

      - name: Download expected artifacts
        uses: actions/download-artifact@v7
        with:
          name: expected-baseline-meta-ui
          path: packages/benchmark/benchmark-results/meta-ui-expected

      - name: Prepare pinned nuxt-ui checkout
        run: |
          pnpm --filter @verter/benchmark bench:meta:ui:setup -- --ref=${{ needs.resolve-target.outputs.target-sha }}

      - name: Prewarm tsgo
        if: matrix.backend == 'tsgo'
        run: |
          pnpm --filter @verter/benchmark bench:meta:ui:json -- \
            --backends=tsgo \
            --scenarios=single_cold \
            --limit=1 \
            --repeats=1 \
            --expected=none \
            --output-dir=packages/benchmark/benchmark-results/meta-ui-prewarm > /dev/null

      - name: Run meta-ui benchmark
        run: |
          pnpm --filter @verter/benchmark bench:meta:ui -- \
            --backends=${{ matrix.backend }} \
            --scenarios=${{ matrix.scenario }} \
            --repeats=5 \
            --warmup-passes=1 \
            --expected-dir=packages/benchmark/benchmark-results/meta-ui-expected \
            --output-dir=packages/benchmark/benchmark-results/meta-ui

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v6
        with:
          name: meta-ui-${{ matrix.backend }}-${{ matrix.scenario }}
          path: packages/benchmark/benchmark-results/meta-ui/meta-ui-${{ matrix.backend }}-${{ matrix.scenario }}.json
          retention-days: 30

  report:
    needs: [check-trigger, resolve-target, benchmark]
    if: |
      always() &&
      needs.benchmark.result != 'cancelled' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && needs.check-trigger.outputs.should-run == 'true'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "ref=refs/pull/${{ needs.check-trigger.outputs.pr-number }}/head" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.checkout-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: meta-ui-*
          merge-multiple: true
          path: meta-ui-benchmark-artifacts

      - name: Generate aggregate report
        id: generate-report
        run: |
          pnpm --filter @verter/benchmark bench:meta:ui:report -- \
            --input-dir=../../meta-ui-benchmark-artifacts \
            --markdown-out=../../meta-ui-benchmark-comment.md \
            --json-out=../../meta-ui-benchmark-results.json

          echo "comment<<EOF" >> "$GITHUB_OUTPUT"
          cat meta-ui-benchmark-comment.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload combined report
        uses: actions/upload-artifact@v6
        with:
          name: meta-ui-benchmark-results-all
          path: |
            meta-ui-benchmark-results.json
            meta-ui-benchmark-comment.md
            meta-ui-benchmark-artifacts/
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'issue_comment' && needs.check-trigger.outputs.pr-number
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `${{ steps.generate-report.outputs.comment }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.check-trigger.outputs.pr-number }},
              body: comment
            });

      - name: Create check run
        if: github.event_name == 'issue_comment' && needs.check-trigger.outputs.pr-sha
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ steps.generate-report.outputs.comment }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        with:
          script: |
            const benchmarkResult = process.env.BENCHMARK_RESULT;
            const conclusion = benchmarkResult === 'success'
              ? 'success'
              : benchmarkResult === 'cancelled'
                ? 'cancelled'
                : benchmarkResult === 'failure'
                  ? 'failure'
                  : 'neutral';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Component Meta Benchmark',
              head_sha: '${{ needs.check-trigger.outputs.pr-sha }}',
              status: 'completed',
              conclusion,
              output: {
                title: benchmarkResult === 'success'
                  ? `nuxt/ui@${{ needs.resolve-target.outputs.target-sha }} benchmarked`
                  : `nuxt/ui@${{ needs.resolve-target.outputs.target-sha }} benchmark incomplete (${benchmarkResult})`,
                summary: process.env.COMMENT_BODY
              }
            });

      - name: Summary
        run: |
          cat meta-ui-benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"
