name: Build verter-tsc

on:
  push:
    branches: [main]
    paths:
      - "crates/verter_tsc/**"
      - "crates/verter_core/**"
      - "crates/verter_host/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/verter_tsc/**"
      - "crates/verter_core/**"
      - "crates/verter_host/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: build-tsc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tsc:
    name: Build verter-tsc (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            npm-pkg: linux-x64-gnu
            binary: verter-tsc
          - target: x86_64-apple-darwin
            os: macos-15-intel
            npm-pkg: darwin-x64
            binary: verter-tsc
          - target: aarch64-apple-darwin
            os: macos-15
            npm-pkg: darwin-arm64
            binary: verter-tsc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-pkg: win32-x64-msvc
            binary: verter-tsc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tsc-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tsc-${{ matrix.target }}-
      - name: Build verter-tsc binary
        run: cargo build --release --package verter_tsc --target ${{ matrix.target }}
        shell: bash
      - name: Smoke test binary
        if: matrix.target != 'aarch64-apple-darwin'
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-${{ matrix.npm-pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
