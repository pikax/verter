name: tsserver nightly

# tsserver is the legacy engine; tsgo is the main platform, and pull request CI
# (`ci.yml`) tests it in full. This workflow runs, on `main` once a day, every
# tsserver-specific lane that pull request CI no longer runs:
#
#   - the serial tsserver provider lane (`provider-ci.mjs run tsserver`);
#   - the @verter/typescript-plugin (tsserver plugin) suites: native-free,
#     the carrier-routing guard among them, and the native-backed `src/tsc`
#     specs;
#   - the VS Code E2E routes on tsserver (`@tsserver` and
#     `editor-owned-project@editor-tsserver`, `printCiMatrix.js --tier=tsserver`);
#   - the editor-neutral LSP contract's tsserver route.
#
# The workflow and job names are stable: a failure here is triaged from the
# `tsserver nightly result` job, which fails when any lane did not succeed.
# Run it by hand with `gh workflow run tsserver-nightly.yml`.

on:
  # DEMO ONLY (#908): run the nightly once on this branch to validate it.
  push:
    branches: [ci/speed-selective-demo]
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily, before the 06:00 Nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsserver-nightly
  cancel-in-progress: false

jobs:
  providers:
    name: tsserver providers
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      # Must equal rust-toolchain.toml's channel; see ci.yml.
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # A daily run; its targets would crowd the 10 GB cache budget pull
          # requests restore from (see ci.yml, "Caches").
          save-if: false
          key: tsserver-nightly-providers
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The live tsserver tests resolve the plugin through its workspace probe
      # location. pnpm install creates the symlink but not these build outputs.
      - name: Build the tsserver plugin prerequisites
        run: pnpm --filter @verter/language-shared --filter @verter/typescript-plugin build
      - name: Run serial tsserver provider tests
        env:
          VERTER_REQUIRE_TSSERVER: "1"
        run: node scripts/provider-ci.mjs run tsserver
      - name: Upload provider test timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: provider-test-timings-tsserver
          path: ${{ format('{0}/provider-timings/*.json', env.CARGO_TARGET_DIR || 'target') }}
          if-no-files-found: warn

  plugin:
    name: tsserver plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # A daily run; its targets would crowd the 10 GB cache budget pull
          # requests restore from (see ci.yml, "Caches").
          save-if: false
          key: tsserver-nightly-native
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the tsserver plugin prerequisites
        run: pnpm --filter @verter/language-shared --filter @verter/typescript-plugin build
      # These source-level specs do not import @verter/native; the src/tsc
      # specs below do.
      - name: Native-free TypeScript plugin tests
        run: pnpm vitest run packages/typescript-plugin/src --exclude 'packages/typescript-plugin/src/tsc/**'
      - name: Build native binding (release)
        if: ${{ !cancelled() }}
        run: pnpm run build:native
      - name: Build TS packages
        if: ${{ !cancelled() }}
        run: pnpm run build:ts
      - name: Native-backed @verter/typescript-plugin tests
        if: ${{ !cancelled() }}
        run: pnpm vitest run packages/typescript-plugin/src/tsc

  editor-build:
    name: tsserver editor build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.e2e-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # A daily run; its targets would crowd the 10 GB cache budget pull
          # requests restore from (see ci.yml, "Caches").
          save-if: false
          key: tsserver-nightly-lsp-debug
      - name: Build verter-lsp, relay shim, DX baseline and MCP server (debug)
        run: cargo build -p verter_lsp -p verter_relay_shim -p verter_dx_baseline -p verter_mcp
      - uses: actions/upload-artifact@v6
        with:
          name: ci-lsp-debug-bins
          path: |
            target/debug/verter-lsp
            target/debug/verter-relay-shim
            target/debug/verter-dx-baseline
            target/debug/verter-mcp
          if-no-files-found: error
          retention-days: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare VS Code E2E artifacts
        run: pnpm --filter verter-vscode prepare:e2e:ts
      - name: Derive the tsserver VS Code E2E route matrix
        id: e2e-matrix
        shell: bash
        run: echo "matrix=$(node packages/vue-vscode/out-test/e2e/printCiMatrix.js --tier=tsserver)" >> "$GITHUB_OUTPUT"
      - name: Upload built extension
        uses: actions/upload-artifact@v6
        with:
          name: vscode-e2e-build
          path: |
            packages/language-shared/dist/
            packages/typescript-plugin/dist/
            packages/vue-vscode/dist/
            packages/vue-vscode/out-test/
          retention-days: 1

  vscode-e2e:
    name: tsserver VS Code E2E (shard ${{ matrix.shard }}/${{ matrix.shard_count }})
    needs: editor-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.editor-build.outputs.matrix) }}
    env:
      # The same reviewed editor baseline as ci.yml's vscode-e2e.
      E2E_VSCODE_VERSION: "1.135.0"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download editor integration binaries
        uses: ./.github/actions/download-artifact
        with:
          name: ci-lsp-debug-bins
          path: target/debug
      - name: Make editor integration binaries executable
        run: chmod +x target/debug/verter-lsp target/debug/verter-relay-shim target/debug/verter-mcp
      - name: Download built extension
        uses: ./.github/actions/download-artifact
        with:
          name: vscode-e2e-build
          path: packages
      # The VS Code host cache and acquisition retry, as in ci.yml's vscode-e2e.
      - name: Resolve VS Code host cache key
        id: vscode-host
        shell: bash
        run: |
          test_electron=$(node -p "require('./packages/vue-vscode/node_modules/@vscode/test-electron/package.json').version")
          echo "key=vscode-host-${RUNNER_OS}-${RUNNER_ARCH}-${E2E_VSCODE_VERSION}-test-electron-${test_electron}" >> "$GITHUB_OUTPUT"
      - name: Restore VS Code ${{ env.E2E_VSCODE_VERSION }}
        id: vscode-cache
        uses: actions/cache/restore@v5
        with:
          path: packages/vue-vscode/.vscode-test/vscode-linux-x64-${{ env.E2E_VSCODE_VERSION }}
          key: ${{ steps.vscode-host.outputs.key }}
      - name: Acquire VS Code ${{ env.E2E_VSCODE_VERSION }}
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if node packages/vue-vscode/out-test/e2e/acquireVscode.js "$E2E_VSCODE_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((15 * 2 ** (attempt - 1)))
              echo "::warning::VS Code $E2E_VSCODE_VERSION download failed on attempt $attempt/4; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::VS Code $E2E_VSCODE_VERSION could not be downloaded after 4 attempts. This is a host download failure, not a test failure."
          exit 1
      - name: Save VS Code ${{ env.E2E_VSCODE_VERSION }}
        if: steps.vscode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: packages/vue-vscode/.vscode-test/vscode-linux-x64-${{ env.E2E_VSCODE_VERSION }}
          key: ${{ steps.vscode-cache.outputs.cache-primary-key }}
      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ matrix.shard_count }})
        run: |
          echo "Routes: ${E2E_ROUTES}"
          xvfb-run -a pnpm --filter verter-vscode test:e2e:run
        env:
          E2E_ROUTES: ${{ matrix.routes }}
          VERTER_REQUIRE_TSSERVER: "1"
          VERTER_REQUIRE_TSGO: "1"
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tsserver-e2e-diagnostics-shard-${{ matrix.shard }}
          path: |
            /tmp/verter-e2e-timing-*.json
            /tmp/verter-e2e-*.log
            /tmp/verter-e2e-*.log.runsummary
          if-no-files-found: ignore

  editor-neutral:
    name: tsserver editor-neutral LSP contract
    needs: editor-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download editor integration binaries
        uses: ./.github/actions/download-artifact
        with:
          name: ci-lsp-debug-bins
          path: target/debug
      - name: Make editor integration binaries executable
        run: chmod +x target/debug/verter-lsp target/debug/verter-relay-shim target/debug/verter-mcp
      - name: Download provider integration builds
        uses: ./.github/actions/download-artifact
        with:
          name: vscode-e2e-build
          path: packages
      - name: Build editor-neutral contract packages
        run: pnpm --filter "@verter/dx-harness..." build
      - name: Run the tsserver contract
        env:
          VERTER_EDITOR_NEUTRAL_ROUTES: tsserver
          VERTER_EDITOR_NEUTRAL_RECEIPT: ${{ runner.temp }}/verter-editor-neutral-lsp-tsserver.json
        run: pnpm --filter @verter/dx-harness test:editor-neutral-lsp
      - name: Upload editor-neutral contract receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editor-neutral-lsp-receipt-tsserver
          path: ${{ runner.temp }}/verter-editor-neutral-lsp-tsserver.json
          if-no-files-found: error
          retention-days: 7

  # The one job to watch: it fails when any lane above did not succeed,
  # skipped or cancelled included (nothing here is meant to skip).
  result:
    name: tsserver nightly result
    if: always()
    needs: [providers, plugin, editor-build, vscode-e2e, editor-neutral]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every tsserver lane succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          node -e '
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const bad = Object.entries(needs).filter(([, job]) => job.result !== "success");
            for (const [name, job] of bad) console.log(`::error::${name}: ${job.result}`);
            process.exit(bad.length === 0 ? 0 : 1);
          '
