name: Integration Test

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      source:
        description: 'Plugin source: "npm" for published version, "artifact" for PR build'
        required: true
        default: 'artifact'
        type: choice
        options:
          - artifact
          - npm
      dist-tag:
        description: 'NPM dist-tag (only used when source is npm)'
        required: false
        default: 'alpha'
        type: string
      projects:
        description: 'Projects to test (comma-separated, or "all" for default set)'
        required: false
        default: 'all'
        type: string

  # Called by release workflow
  workflow_call:
    inputs:
      source:
        description: 'Plugin source'
        required: true
        type: string
      dist-tag:
        description: 'NPM dist-tag'
        required: false
        type: string
        default: 'alpha'

  # PR comment trigger (/integration)
  issue_comment:
    types: [created]

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  # Check if workflow should run (for PR comment trigger)
  check-trigger:
    name: Check Trigger
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment'
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      pr-number: ${{ steps.check.outputs.pr-number }}
      pr-sha: ${{ steps.check.outputs.pr-sha }}
    steps:
      - name: Check comment trigger
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.toLowerCase();
            const isPR = !!context.payload.issue.pull_request;
            const hasIntegrationCommand = comment.includes('/integration');
            
            if (!hasIntegrationCommand) {
              console.log('Not a PR comment with /integration command');
              core.setOutput('should-run', 'false');
              return;
            }
            
            // Check if user has write permission
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login
              });
              
              const hasPermission = ['admin', 'write'].includes(permission.permission);
              
              if (!hasPermission) {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: '-1'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  body: '❌ Only users with write permission can trigger integration tests.'
                });
                core.setOutput('should-run', 'false');
                return;
              }
            } catch (error) {
              console.log('Permission check failed:', error);
              core.setOutput('should-run', 'false');
              return;
            }
            
            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            
            // React with eyes to acknowledge
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
            
            core.setOutput('should-run', 'true');
            core.setOutput('pr-number', context.payload.issue.number);
            core.setOutput('pr-sha', pr.head.sha);

  # Setup and build (if source is artifact)
  setup:
    name: Setup Verter
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name != 'issue_comment' || 
       (needs.check-trigger.result != 'skipped' && needs.check-trigger.outputs.should-run == 'true'))
    needs: [check-trigger]
    steps:
      - name: Determine source
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "source=${{ inputs.source }}" >> $GITHUB_OUTPUT
            echo "dist-tag=${{ inputs.dist-tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "source=${{ inputs.source }}" >> $GITHUB_OUTPUT
            echo "dist-tag=${{ inputs.dist-tag }}" >> $GITHUB_OUTPUT
          else
            # PR comment trigger - build from artifact
            echo "source=artifact" >> $GITHUB_OUTPUT
            echo "dist-tag=alpha" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PR
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ needs.check-trigger.outputs.pr-number }}/head

      - name: Checkout
        if: github.event_name != 'issue_comment'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.source.outputs.source == 'artifact'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.source.outputs.source == 'artifact'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        if: steps.source.outputs.source == 'artifact'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.source.outputs.source == 'artifact'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: napi-release

      - name: Install dependencies
        if: steps.source.outputs.source == 'artifact'
        run: pnpm install --frozen-lockfile

      - name: Build native (fast CI profile)
        if: steps.source.outputs.source == 'artifact'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: pnpm run build:native

      - name: Build vite-plugin
        if: steps.source.outputs.source == 'artifact'
        run: pnpm --filter @verter/vite-plugin build

      - name: Create local registry tarball
        if: steps.source.outputs.source == 'artifact'
        run: |
          mkdir -p dist
          # Pack packages
          cd packages/native && pnpm pack --pack-destination ../../dist && cd ../..
          cd packages/vite-plugin && pnpm pack --pack-destination ../../dist && cd ../..
          
          echo "✅ Packages packed:"
          ls -lh dist/*.tgz

      - name: Upload Verter packages artifact
        if: steps.source.outputs.source == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: verter-packages
          path: dist/*.tgz
          if-no-files-found: error
          
      - name: Upload workspace artifact for artifact-based testing
        if: steps.source.outputs.source == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: verter-workspace  
          path: |
            packages/native/
            packages/vite-plugin/
            !**/.turbo
            !**/node_modules
          if-no-files-found: error

      - name: Save source info
        run: |
          echo "source=${{ steps.source.outputs.source }}" >> source-info.txt
          echo "dist_tag=${{ steps.source.outputs.dist-tag }}" >> source-info.txt

      - name: Upload source info
        uses: actions/upload-artifact@v4
        with:
          name: source-info
          path: source-info.txt

  # Test matrix for real-world Vue projects
  test-project:
    name: Test ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    needs: [setup]
    if: always() && needs.setup.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: vuetify
            repo: vuetifyjs/vuetify
            branch: master
            build-cmd: pnpm run build
            test-cmd: pnpm --filter vuetify test:unit
            package-manager: pnpm
          - name: oku-primitives
            repo: oku-ui/primitives
            branch: main
            build-cmd: pnpm run build
            test-cmd: pnpm run test
            package-manager: pnpm
          - name: hoppscotch
            repo: hoppscotch/hoppscotch
            branch: main
            build-cmd: pnpm --filter @hoppscotch/selfhost-web build
            test-cmd: pnpm --filter @hoppscotch/common test
            package-manager: pnpm

    steps:
      - name: Download source info
        uses: actions/download-artifact@v4
        with:
          name: source-info

      - name: Read source info
        id: source
        run: |
          source source-info.txt
          echo "source=$source" >> $GITHUB_OUTPUT
          echo "dist-tag=$dist_tag" >> $GITHUB_OUTPUT

      - name: Checkout test project
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.project.repo }}
          ref: ${{ matrix.project.branch }}
          path: test-project
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ matrix.project.package-manager }}
          cache-dependency-path: test-project/**/pnpm-lock.yaml

      - name: Install project dependencies
        working-directory: test-project
        run: |
          ${{ matrix.project.package-manager }} install --no-frozen-lockfile

      - name: Create baseline copy
        run: cp -al test-project test-baseline

      - name: Download Verter workspace artifact
        if: steps.source.outputs.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: verter-workspace
          path: verter-workspace

      - name: Hoist Verter packages for subpackage resolution
        working-directory: test-project
        run: |
          # pnpm strict isolation prevents subpackages from resolving workspace-root deps
          # Hoist @verter/* so vite configs in nested packages can import them
          echo 'public-hoist-pattern[]=@verter/*' >> .npmrc

      - name: Install Verter packages (from artifact/workspace)
        if: steps.source.outputs.source == 'artifact'
        working-directory: test-project
        run: |
          echo "📦 Installing Verter from workspace builds"
          ${{ matrix.project.package-manager }} add -w ../verter-workspace/packages/native ../verter-workspace/packages/vite-plugin
          echo "✅ Verter packages installed from workspace"

      - name: Install Verter vite-plugin (from npm)
        if: steps.source.outputs.source == 'npm'
        working-directory: test-project
        run: |
          echo "Installing from npm with dist-tag: ${{ steps.source.outputs.dist-tag }}"
          ${{ matrix.project.package-manager }} add -w @verter/vite-plugin@${{ steps.source.outputs.dist-tag }}

      - name: Replace vue() with verter() in all Vite/Vitest configs
        working-directory: test-project
        run: |
          # Find all vite and vitest config files that reference @vitejs/plugin-vue
          CONFIG_FILES=$(grep -rl "@vitejs/plugin-vue" --include="vite.config.*" --include="vitest.config.*" . || true)

          if [ -z "$CONFIG_FILES" ]; then
            echo "❌ No config files with @vitejs/plugin-vue found"
            exit 1
          fi

          echo "📝 Found config files to modify:"
          echo "$CONFIG_FILES"
          echo "---"

          for CONFIG_FILE in $CONFIG_FILES; do
            echo "📝 Modifying $CONFIG_FILE"
            cat "$CONFIG_FILE"
            echo "---"

            sed -i "s|from '@vitejs/plugin-vue'|from '@verter/vite-plugin'|g" "$CONFIG_FILE"
            sed -i "s|from \"@vitejs/plugin-vue\"|from \"@verter/vite-plugin\"|g" "$CONFIG_FILE"
            sed -i 's|import vue from|import verter from|g' "$CONFIG_FILE"
            sed -i 's|import Vue from|import verter from|g' "$CONFIG_FILE"
            sed -i 's|vue(|verter(|g' "$CONFIG_FILE"
            sed -i 's|Vue(|verter(|g' "$CONFIG_FILE"

            echo "📝 Modified:"
            cat "$CONFIG_FILE"
            echo "==="
          done

      - name: Build baseline and Verter in parallel
        id: parallel-build
        continue-on-error: true
        run: |
          # Run both builds concurrently
          (
            set -o pipefail
            START=$(date +%s)
            cd test-baseline && ${{ matrix.project.build-cmd }} > ../baseline-build.log 2>&1
            echo "$?:$(($(date +%s) - START))" > ../baseline-result.txt
          ) &
          BASELINE_PID=$!

          (
            set -o pipefail
            START=$(date +%s)
            cd test-project && ${{ matrix.project.build-cmd }} > ../verter-build.log 2>&1
            echo "$?:$(($(date +%s) - START))" > ../verter-result.txt
          ) &
          VERTER_PID=$!

          # Wait for both builds to finish
          wait $BASELINE_PID || true
          wait $VERTER_PID || true

          # Parse results (exit_code:duration)
          IFS=':' read B_EXIT B_DUR < baseline-result.txt
          IFS=':' read V_EXIT V_DUR < verter-result.txt

          echo "baseline_duration=$B_DUR" >> $GITHUB_OUTPUT
          echo "baseline_outcome=$([ "$B_EXIT" = "0" ] && echo success || echo failure)" >> $GITHUB_OUTPUT
          echo "verter_duration=$V_DUR" >> $GITHUB_OUTPUT
          echo "verter_status=$([ "$V_EXIT" = "0" ] && echo success || echo failed)" >> $GITHUB_OUTPUT

          echo "Baseline: ${B_DUR}s (exit $B_EXIT) | Verter: ${V_DUR}s (exit $V_EXIT)"

      - name: Baseline tests
        id: baseline-test
        working-directory: test-baseline
        continue-on-error: true
        run: |
          if [ -z "${{ matrix.project.test-cmd }}" ]; then
            echo "duration=0" >> $GITHUB_OUTPUT
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          START=$(date +%s)
          if ${{ matrix.project.test-cmd }} 2>&1 | tee ../baseline-test.log; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          END=$(date +%s)
          echo "duration=$((END - START))" >> $GITHUB_OUTPUT

          # Extract test counts (vitest/jest: "Tests  42 passed | 3 failed (45)")
          TP=$(grep -oE '[0-9]+ passed' ../baseline-test.log | tail -1 | grep -oE '[0-9]+' || true)
          TF=$(grep -oE '[0-9]+ failed' ../baseline-test.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "test_passed=${TP:-0}" >> $GITHUB_OUTPUT
          echo "test_failed=${TF:-0}" >> $GITHUB_OUTPUT

      - name: Verter tests
        id: verter-test
        working-directory: test-project
        continue-on-error: true
        run: |
          if [ -z "${{ matrix.project.test-cmd }}" ]; then
            echo "duration=0" >> $GITHUB_OUTPUT
            echo "status=skipped" >> $GITHUB_OUTPUT
            echo "test_passed=0" >> $GITHUB_OUTPUT
            echo "test_failed=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          START=$(date +%s)
          if ${{ matrix.project.test-cmd }} 2>&1 | tee ../verter-test.log; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          END=$(date +%s)
          echo "duration=$((END - START))" >> $GITHUB_OUTPUT

          # Extract test counts (vitest/jest: "Tests  42 passed | 3 failed (45)")
          TP=$(grep -oE '[0-9]+ passed' ../verter-test.log | tail -1 | grep -oE '[0-9]+' || true)
          TF=$(grep -oE '[0-9]+ failed' ../verter-test.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "test_passed=${TP:-0}" >> $GITHUB_OUTPUT
          echo "test_failed=${TF:-0}" >> $GITHUB_OUTPUT

      - name: Generate project report
        if: always()
        run: |
          TEST_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat > report-${{ matrix.project.name }}.md << 'EOF'
          # Integration Test Report: ${{ matrix.project.name }}
          
          **Repository:** ${{ matrix.project.repo }}  
          **Branch:** ${{ matrix.project.branch }}  
          **Test Date:** TEST_DATE_PLACEHOLDER  
          **Plugin Source:** ${{ steps.source.outputs.source }}  
          
          ## Build Comparison
          
          | Compiler | Build Time | Status |
          |----------|-----------|--------|
          | Vue (baseline) | ${{ steps.parallel-build.outputs.baseline_duration }}s | ${{ steps.parallel-build.outputs.baseline_outcome }} |
          | Verter | ${{ steps.parallel-build.outputs.verter_duration }}s | ${{ steps.parallel-build.outputs.verter_status }} |
          
          **Build Time Delta:** 
          EOF
          
          # Replace placeholder with actual date
          sed -i "s/TEST_DATE_PLACEHOLDER/$TEST_DATE/" report-${{ matrix.project.name }}.md
          
          BASELINE="${{ steps.parallel-build.outputs.baseline_duration }}"
          VERTER="${{ steps.parallel-build.outputs.verter_duration }}"
          
          if [ -n "$BASELINE" ] && [ -n "$VERTER" ] && [ "$BASELINE" -gt 0 ] && [ "$VERTER" -gt 0 ]; then
            DIFF=$((VERTER - BASELINE))
            PERCENT=$((DIFF * 100 / BASELINE))
            if [ $DIFF -gt 0 ]; then
              echo "🔴 +${DIFF}s (+${PERCENT}%) slower" >> report-${{ matrix.project.name }}.md
            elif [ $DIFF -lt 0 ]; then
              DIFF_ABS=$((DIFF * -1))
              PERCENT_ABS=$((PERCENT * -1))
              echo "🟢 -${DIFF_ABS}s (-${PERCENT_ABS}%) faster" >> report-${{ matrix.project.name }}.md
            else
              echo "⚪ Same build time" >> report-${{ matrix.project.name }}.md
            fi
          else
            echo "N/A (build failed)" >> report-${{ matrix.project.name }}.md
          fi
          
          cat >> report-${{ matrix.project.name }}.md << 'EOF'
          
          ## Test Comparison
          
          | Compiler | Test Time | Status |
          |----------|-----------|--------|
          | Vue (baseline) | ${{ steps.baseline-test.outputs.duration }}s | ${{ steps.baseline-test.outputs.status }} |
          | Verter | ${{ steps.verter-test.outputs.duration }}s | ${{ steps.verter-test.outputs.status }} |
          
          ## Build Logs
          
          <details>
          <summary>Baseline Build Log (Vue)</summary>
          
          ```
          EOF
          
          if [ -f baseline-build.log ]; then
            tail -n 100 baseline-build.log >> report-${{ matrix.project.name }}.md
          fi
          
          cat >> report-${{ matrix.project.name }}.md << 'EOF'
          ```
          
          </details>
          
          <details>
          <summary>Verter Build Log</summary>
          
          ```
          EOF
          
          if [ -f verter-build.log ]; then
            tail -n 100 verter-build.log >> report-${{ matrix.project.name }}.md
          fi
          
          cat >> report-${{ matrix.project.name }}.md << 'EOF'
          ```
          
          </details>
          
          ---
          
          **Conclusion:** 
          EOF
          
          # Determine overall status: pass (green), warning (yellow), or fail (red)
          BUILD_STATUS="${{ steps.parallel-build.outputs.verter_status }}"
          TEST_STATUS="${{ steps.verter-test.outputs.status }}"
          BASELINE_BUILD="${{ steps.parallel-build.outputs.baseline_duration }}"
          VERTER_BUILD="${{ steps.parallel-build.outputs.verter_duration }}"
          BASELINE_TEST="${{ steps.baseline-test.outputs.duration }}"
          VERTER_TEST="${{ steps.verter-test.outputs.duration }}"
          
          # Create status metadata file
          mkdir -p status
          echo "project=${{ matrix.project.name }}" > status/status.txt
          echo "build_status=$BUILD_STATUS" >> status/status.txt
          echo "test_status=$TEST_STATUS" >> status/status.txt
          echo "baseline_build=$BASELINE_BUILD" >> status/status.txt
          echo "verter_build=$VERTER_BUILD" >> status/status.txt
          echo "baseline_test=$BASELINE_TEST" >> status/status.txt
          echo "verter_test=$VERTER_TEST" >> status/status.txt
          echo "baseline_test_passed=${{ steps.baseline-test.outputs.test_passed }}" >> status/status.txt
          echo "baseline_test_failed=${{ steps.baseline-test.outputs.test_failed }}" >> status/status.txt
          echo "baseline_test_status=${{ steps.baseline-test.outputs.status }}" >> status/status.txt
          echo "verter_test_passed=${{ steps.verter-test.outputs.test_passed }}" >> status/status.txt
          echo "verter_test_failed=${{ steps.verter-test.outputs.test_failed }}" >> status/status.txt
          
          # Calculate overall status
          OVERALL_STATUS="fail"
          CONCLUSION_MSG=""
          
          if [ "$BUILD_STATUS" != "success" ]; then
            OVERALL_STATUS="fail"
            CONCLUSION_MSG="❌ **Failed** - Verter build failed"
          elif [ "$TEST_STATUS" = "failed" ]; then
            OVERALL_STATUS="fail"
            CONCLUSION_MSG="❌ **Failed** - Verter tests failed"
          else
            # Build and tests passed, check performance
            BUILD_SLOWER=false
            TEST_SLOWER=false
            
            if [ -n "$BASELINE_BUILD" ] && [ -n "$VERTER_BUILD" ] && [ "$BASELINE_BUILD" -gt 0 ] && [ "$VERTER_BUILD" -gt "$BASELINE_BUILD" ]; then
              BUILD_SLOWER=true
            fi
            
            if [ -n "$BASELINE_TEST" ] && [ -n "$VERTER_TEST" ] && [ "$BASELINE_TEST" -gt 0 ] && [ "$VERTER_TEST" -gt "$BASELINE_TEST" ]; then
              TEST_SLOWER=true
            fi
            
            if [ "$BUILD_SLOWER" = true ] || [ "$TEST_SLOWER" = true ]; then
              OVERALL_STATUS="warning"
              CONCLUSION_MSG="⚠️ **Warning** - Verter is slower than Vue"
              if [ "$BUILD_SLOWER" = true ] && [ "$TEST_SLOWER" = true ]; then
                CONCLUSION_MSG="$CONCLUSION_MSG (build and tests)"
              elif [ "$BUILD_SLOWER" = true ]; then
                CONCLUSION_MSG="$CONCLUSION_MSG (build only)"
              else
                CONCLUSION_MSG="$CONCLUSION_MSG (tests only)"
              fi
            else
              OVERALL_STATUS="pass"
              CONCLUSION_MSG="✅ **Passed** - Verter is faster or equal to Vue"
            fi
          fi
          
          echo "overall_status=$OVERALL_STATUS" >> status/status.txt
          echo "$CONCLUSION_MSG" >> report-${{ matrix.project.name }}.md

      - name: Upload project report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project.name }}
          path: |
            report-${{ matrix.project.name }}.md
            status/status.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.project.name }}
          path: |
            baseline-build.log
            baseline-test.log
            verter-build.log
            verter-test.log
          if-no-files-found: ignore

      - name: Add to job summary
        if: always()
        run: |
          cat report-${{ matrix.project.name }}.md >> $GITHUB_STEP_SUMMARY

  # Aggregate results and create final summary
  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [test-project]
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports

      - name: Generate aggregate summary
        run: |
          SUMMARY_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat > integration-test-summary.md << 'HEADER'
          # Verter Integration Test Summary

          HEADER

          # Replace placeholder metadata inline
          cat >> integration-test-summary.md << EOF
          **Workflow Run:** ${{ github.run_number }} | **Trigger:** ${{ github.event_name }} | **Date:** $SUMMARY_DATE

          EOF

          TOTAL=0
          PASSED=0
          WARNING=0
          FAILED=0

          # First pass: collect data for the summary table
          TABLE_ROWS=""

          for report_dir in reports/report-*; do
            if [ -d "$report_dir" ] && [ -f "$report_dir/status/status.txt" ]; then
              TOTAL=$((TOTAL + 1))

              # Reset variables before sourcing
              project="" build_status="" test_status="" overall_status=""
              baseline_build="" verter_build="" baseline_test="" verter_test=""
              baseline_test_passed="" baseline_test_failed="" baseline_test_status=""
              verter_test_passed="" verter_test_failed=""

              source "$report_dir/status/status.txt"

              PROJECT="$project"

              # Status icon
              if [ "$overall_status" = "pass" ]; then
                PASSED=$((PASSED + 1))
                STATUS_ICON="✅"
              elif [ "$overall_status" = "warning" ]; then
                WARNING=$((WARNING + 1))
                STATUS_ICON="⚠️"
              else
                FAILED=$((FAILED + 1))
                STATUS_ICON="❌"
              fi

              # Build delta
              BUILD_DELTA="N/A"
              if [ -n "$baseline_build" ] && [ -n "$verter_build" ] && [ "$baseline_build" -gt 0 ] && [ "$verter_build" -gt 0 ]; then
                DIFF=$((verter_build - baseline_build))
                PCT=$((DIFF * 100 / baseline_build))
                if [ $DIFF -gt 0 ]; then
                  BUILD_DELTA="+${DIFF}s (+${PCT}%)"
                elif [ $DIFF -lt 0 ]; then
                  BUILD_DELTA="${DIFF}s (${PCT}%)"
                else
                  BUILD_DELTA="same"
                fi
              fi

              # Vue test summary
              VUE_TESTS="—"
              if [ "$baseline_test_status" = "skipped" ]; then
                VUE_TESTS="skipped"
              elif [ "${baseline_test_failed:-0}" -gt 0 ] 2>/dev/null; then
                VUE_TESTS="❌ ${baseline_test_failed} failed / $((baseline_test_passed + baseline_test_failed))"
              elif [ "${baseline_test_passed:-0}" -gt 0 ] 2>/dev/null; then
                VUE_TESTS="✅ ${baseline_test_passed} passed"
              elif [ "$baseline_test_status" = "passed" ]; then
                VUE_TESTS="✅ passed"
              elif [ "$baseline_test_status" = "failed" ]; then
                VUE_TESTS="❌ failed"
              fi

              # Verter test summary
              VERTER_TESTS="—"
              if [ "$test_status" = "skipped" ]; then
                VERTER_TESTS="skipped"
              elif [ "${verter_test_failed:-0}" -gt 0 ] 2>/dev/null; then
                VERTER_TESTS="❌ ${verter_test_failed} failed / $((verter_test_passed + verter_test_failed))"
              elif [ "${verter_test_passed:-0}" -gt 0 ] 2>/dev/null; then
                VERTER_TESTS="✅ ${verter_test_passed} passed"
              elif [ "$test_status" = "passed" ]; then
                VERTER_TESTS="✅ passed"
              elif [ "$test_status" = "failed" ]; then
                VERTER_TESTS="❌ failed"
              fi

              TABLE_ROWS="${TABLE_ROWS}| **${PROJECT}** | ${baseline_build:-—}s | ${VUE_TESTS} | ${verter_build:-—}s | ${VERTER_TESTS} | ${BUILD_DELTA} | ${STATUS_ICON} |
          "
            fi
          done

          # Determine overall workflow status
          WORKFLOW_STATUS="✅ Passed"
          if [ "$FAILED" -gt 0 ]; then
            WORKFLOW_STATUS="❌ Failed"
          elif [ "$WARNING" -gt 0 ]; then
            WORKFLOW_STATUS="⚠️ Warning"
          fi

          # Write summary table
          cat >> integration-test-summary.md << EOF
          | Project | Vue Build | Vue Tests | Verter Build | Verter Tests | Build Delta | Status |
          |---------|-----------|-----------|--------------|--------------|-------------|--------|
          ${TABLE_ROWS}
          **Results:** ${PASSED} passed, ${WARNING} warnings, ${FAILED} failed (total: ${TOTAL}) | **Overall:** ${WORKFLOW_STATUS}

          ---

          ## Detailed Reports

          EOF

          # Store overall status for PR comment check
          echo "$WORKFLOW_STATUS" > overall-status.txt
          echo "$FAILED" > failed-count.txt

          # Append individual reports
          for report_dir in reports/report-*; do
            if [ -d "$report_dir" ]; then
              for md_file in "$report_dir"/*.md; do
                [ -f "$md_file" ] && cat "$md_file" >> integration-test-summary.md
              done
              echo "" >> integration-test-summary.md
              echo "---" >> integration-test-summary.md
              echo "" >> integration-test-summary.md
            fi
          done

      - name: Upload aggregate summary
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-summary
          path: integration-test-summary.md

      - name: Add to workflow summary
        run: |
          cat integration-test-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR comment (if triggered from PR)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('integration-test-summary.md', 'utf8');
            const overallStatus = fs.readFileSync('overall-status.txt', 'utf8').trim();
            const failedCount = parseInt(fs.readFileSync('failed-count.txt', 'utf8').trim());
            
            // Get PR details to get the head SHA
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });
            
            // Determine check status based on failures
            let checkConclusion = 'success';
            let checkTitle = 'Integration Tests Passed';
            
            if (failedCount > 0) {
              checkConclusion = 'failure';
              checkTitle = `Integration Tests Failed (${failedCount} project(s))`;
            } else if (overallStatus.includes('⚠️')) {
              checkConclusion = 'neutral';
              checkTitle = 'Integration Tests Passed with Warnings';
            }
            
            // Create a check run for the PR
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Verter Integration Tests',
                head_sha: pr.head.sha,
                status: 'completed',
                conclusion: checkConclusion,
                output: {
                  title: checkTitle,
                  summary: summary,
                  text: `Full results: ${context.payload.repository.html_url}/actions/runs/${context.runId}`
                }
              });
            } catch (error) {
              console.log('Failed to create check run:', error.message);
              // Continue with comment posting even if check creation fails
            }
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });
            
            // Find existing bot comment
            const botComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('🧪 Verter Integration Test Summary')
            );
            
            const commentBody = summary + `\n\n---\n**Status:** ${overallStatus}\n\n[View Full Details](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: commentBody
              });
            }
            
            // React with checkmark to original comment
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });
