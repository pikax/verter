name: zed

# Builds the Zed extension and runs its host-target unit suite. The extension is a
# wasm32-wasip2 cdylib: a thin LSP launcher that delegates all decision logic
# (argv, initializationOptions, server discovery, the platform matrix) to the
# shared `verter-editor-client` crate, with the `zed_extension_api` glue isolated
# behind `cfg(target_os = "wasi")`. The wasm build is the integration smoke that
# catches a wasip1/wasip2 mismatch or a `zed_extension_api` API drift (a wrong
# target yields a `__wasi_init_tp` load error in Zed), and the host-target tests
# exercise the pure launch surface plus the manifest and lockfile guards.
#
# A real-Zed UI smoke is out of scope for v0: Zed has no headless-editor harness
# comparable to @vscode/test-electron, so the real-server end-to-end check is
# deferred, mirroring how the lapce and neovim jobs defer their real-server smoke.

on:
  push:
    branches: [main]
    paths:
      - "extensions/zed/**"
      - ".github/workflows/zed.yml"
  pull_request:
    paths:
      - "extensions/zed/**"
      - ".github/workflows/zed.yml"

jobs:
  build:
    name: zed extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform portability is a CRITICAL rule: the extension must build
        # and the host-target launch surface must pass on all three host OSes. The
        # run steps use `shell: bash` so the same scripts work under Git-bash on the
        # Windows runner.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (with wasm32-wasip2)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Build the extension (wasm32-wasip2)
        shell: bash
        run: cargo build --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 --release

      - name: Run host-target unit tests
        shell: bash
        run: cargo test --manifest-path extensions/zed/Cargo.toml

      - name: Clippy (wasm32-wasip2)
        shell: bash
        run: cargo clippy --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 -- -D warnings

      - name: Rustfmt check
        shell: bash
        working-directory: extensions/zed
        run: cargo fmt --check
