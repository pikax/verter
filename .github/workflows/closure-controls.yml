name: Closure Control Replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closure-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: On-demand closure mutations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: closure-replay
      - uses: taiki-e/install-action@nextest
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Replay recorded mutations
        run: node --test roadmap/0.1.0-tama/tools/closure-controls.test.mjs
