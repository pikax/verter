name: CI

on:
  push:
    branches: main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      proto: ${{ steps.filter.outputs.proto }}
      js: ${{ steps.filter.outputs.js }}
      wasm: ${{ steps.filter.outputs.wasm }}
      playground: ${{ steps.filter.outputs.playground }}
      vscode: ${{ steps.filter.outputs.vscode }}
      dx: ${{ steps.filter.outputs.dx }}
      editor_lsp: ${{ steps.filter.outputs.editor_lsp }}
      svelte_oracle: ${{ steps.filter.outputs.svelte_oracle }}
      svelte_client_smokes: ${{ steps.filter.outputs.svelte_client_smokes }}
      svelte_perf: ${{ steps.filter.outputs.svelte_perf }}
      editors: ${{ steps.filter.outputs.editors }}
      tama: ${{ steps.filter.outputs.tama }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/nextest.toml'
              - 'rust-toolchain.toml'
              - 'scripts/check-integration-test-layout.mjs'
              - 'scripts/integration-test-layout-allowlist.json'
              - 'scripts/gate*.mjs'
              # Dedicated BF2 lane authority. A driver/self-test-only change
              # must run the lane it can weaken rather than passing through a
              # skipped required job.
              - 'scripts/bf2-authoritative.mjs'
              - 'scripts/bf2-ci-lane-selftest.mjs'
              - 'scripts/compiler-ci-lane-selftest.mjs'
              - 'scripts/provider-ci*.mjs'
              - 'packages/framework-conformance-harness/**'
              - 'packages/language-shared/**'
              - 'packages/svelte-jsx/**'
              # BF2's workspace-domain TypeScript observation resolves both
              # @verter/svelte-jsx and @verter/types.
              - 'packages/types/**'
              - 'packages/typescript-plugin/**'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            proto:
              - 'crates/verter_protocol/proto/**'
              - 'packages/proto/src/gen/**'
              - 'buf.gen.yaml'
              - 'scripts/check-proto-generated.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            js:
              - 'packages/**'
              - '!packages/playground/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'scripts/gen-svelte-goldens.mjs'
              - 'scripts/sccache-env.mjs'
              - 'scripts/sccache-env.test.mjs'
              - 'scripts/compiler-ci-lane-selftest.mjs'
              - 'scripts/provider-ci*.mjs'
              - 'scripts/svelte-golden-lib.mjs'
              - 'crates/verter_compiler/tests/svelte_oracle_corpus/**'
              # test:scripts validates the required BF2 dependencies in the
              # release graph; release-only changes must execute that guard.
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
            # Gates `wasm-build` ALONE, which both builds the browser artifact
            # and verifies the committed carrier fixture against it. So this
            # filter decides whether that fixture check runs at all, and it must
            # cover everything the artifact is built from — a crate that is in
            # the build closure but not here changes carrier output while the
            # check that would catch it is skipped.
            #
            # `crates/**` rather than an enumerated closure: the closure derived
            # from `cargo metadata` (verter_wasm's transitive normal + build
            # dependencies that are workspace members) is 27 crates, and an
            # enumerated list silently goes stale the next time one of them
            # takes a new dependency — the exact failure this check exists to
            # end. A directory wildcard cannot drift. The cost is that
            # `wasm-build` also runs for the 19 workspace crates outside the
            # closure; over-running a cached build is cheap, under-running the
            # freshness check is not. Manifests and the lockfile are included
            # because a dependency bump (an OXC version, say) moves compiler
            # output without touching a single crate path.
            wasm:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'packages/wasm/**'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            playground:
              - 'crates/verter_compiler/**'
              - 'crates/verter_parser/**'
              - 'crates/verter_session/**'
              - 'crates/verter_workspace/**'
              - 'crates/verter_semantic/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_span/**'
              - 'crates/verter_wasm/**'
              - 'crates/verter_lsp/**'
              - 'packages/wasm/**'
              - 'packages/playground/**'
              - '.github/workflows/ci.yml'
            vscode:
              - 'crates/verter_compiler/**'
              - 'crates/verter_parser/**'
              - 'crates/verter_session/**'
              - 'crates/verter_workspace/**'
              - 'crates/verter_semantic/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_lsp/**'
              - 'crates/verter_relay_shim/**'
              - 'crates/verter_span/**'
              - 'crates/verter_tsgo_api/**'
              - 'crates/verter_type_runtime/**'
              - 'packages/vue-vscode/**'
              - 'packages/language-shared/**'
              - 'packages/typescript-plugin/**'
              - '.github/workflows/ci.yml'
            dx:
              - 'crates/verter_dx_baseline/**'
              - 'crates/verter_lsp/**'
              # The crate that OWNS CompletionResolveData, is_actionable, tsserver
              # completion parsing, offset stamping, and resolve routing — the
              # exact logic the real-provider auto-import parity gate proves. A
              # runtime-only resolve regression MUST trip this filter, or the
              # parity gate would silently skip.
              - 'crates/verter_type_runtime/**'
              - 'packages/dx-harness/**'
              - 'packages/lsp-test-client/**'
              # The tsserver carrier-membership plugin and the library it emits
              # against. The raw-LSP spine smoke BUILDS both as load-bearing
              # prerequisites and gets no carrier semantics without them, so a
              # change that breaks the plugin must trip this filter — otherwise
              # the job that would catch it is skipped for that very change.
              - 'packages/typescript-plugin/**'
              - 'packages/language-shared/**'
              - 'scripts/dx/**'
              - '.github/workflows/ci.yml'
            # Dependency closure for the editor-neutral raw-LSP contract. This is
            # intentionally broader than either the VS Code or DX-only filters:
            # the contract drives the real compiler/LSP, provider plugin, relay,
            # and shared typed test substrate without an editor process.
            editor_lsp:
              - 'crates/verter_compiler/**'
              - 'crates/verter_audit/**'
              - 'crates/verter_parser/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_language/**'
              - 'crates/verter_macro_dto/**'
              - 'crates/verter_no_storedspan/**'
              - 'crates/verter_no_storedspan_derive/**'
              - 'crates/verter_no_typeexpr/**'
              - 'crates/verter_no_typeexpr_derive/**'
              - 'crates/verter_protocol/**'
              - 'crates/verter_scheduler/**'
              - 'crates/verter_session/**'
              - 'crates/verter_session_oracle_macro/**'
              - 'crates/verter_session_query/**'
              - 'crates/verter_workspace/**'
              - 'crates/verter_semantic/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_lsp/**'
              - 'crates/verter_relay_shim/**'
              - 'crates/verter_span/**'
              - 'crates/verter_tsgo_api/**'
              - 'crates/verter_type_expr/**'
              - 'crates/verter_type_expr_oxc/**'
              - 'crates/verter_type_runtime/**'
              - 'crates/verter-editor-client/**'
              - 'packages/dx-harness/**'
              - 'packages/lsp-test-client/**'
              - 'packages/language-shared/**'
              - 'packages/native/**'
              - 'packages/svelte-jsx/**'
              - 'packages/typescript-plugin/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            svelte_oracle:
              - 'scripts/gen-svelte-goldens.mjs'
              - 'scripts/svelte-golden-lib.mjs'
              - 'scripts/gen-svelte-name-parity-corpus.mjs'
              - 'crates/verter_compiler/tests/svelte_oracle_corpus/**'
              - 'crates/verter_compiler/tests/fixtures/svelte/name_parity_corpus.json'
              - 'crates/verter_compiler/tests/fixtures/svelte/remove_typescript_nodes.5.56.10.js'
              - 'crates/verter_compiler/tests/svelte_oracle_harness.rs'
              - 'crates/verter_compiler/tests/svelte_goldens_in_sync.rs'
              - 'crates/verter_compiler/src/svelte_oracle.rs'
              - 'crates/verter_compiler/Cargo.toml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            svelte_client_smokes:
              - 'crates/verter_compiler/src/svelte/**'
              - 'packages/svelte-runtime-tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            # Editor-client integration surface (Helix / Lapce / Zed / Neovim).
            # These lanes used to live in four standalone workflows that each
            # built `verter-lsp --release` themselves — twelve uncached release
            # builds of the server per Rust change. They now share the single
            # `build-editor-lsp` artifact below.
            editors:
              - 'editors/**'
              - 'extensions/lapce/**'
              - 'extensions/zed/**'
              - 'crates/**'
              - 'scripts/editor-contracts/**'
              - 'packages/lsp-test-client/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            svelte_perf:
              - 'crates/verter_compiler/**'
              - 'crates/verter_parser/**'
              - 'crates/verter_napi/**'
              - 'packages/native/**'
              - 'packages/benchmark/package.json'
              - 'packages/benchmark/src/svelte-perf-*.ts'
              - 'packages/benchmark/src/svelte-perf-manifest.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            tama:
              - 'roadmap/0.1.0-tama/**'
              - '.claude/skills/multi-agent-orchestration/**'
              - 'CLAUDE.md'
              - '.github/workflows/ci.yml'

  tama-roadmap:
    name: Tama Roadmap
    needs: detect-changes
    if: needs.detect-changes.outputs.tama == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate DAG-managed files
        run: |
          node roadmap/0.1.0-tama/tools/validate-program-dag.mjs --strict
          node --test roadmap/0.1.0-tama/tools/implementation-ledger.test.mjs

  # ---------------------------------------------------------------------------
  # `dtolnay/rust-toolchain@1.97.1` (not `@stable`) in every job below, and in
  # every other workflow. The version MUST equal `rust-toolchain.toml`'s
  # `channel` — see that file for why the compiler is pinned at all.
  #
  # The action does not read `rust-toolchain.toml`; it installs the toolchain
  # named by its `@ref` and `rustup default`s it, and rustup's toolchain-file
  # override then outranks that default. So with a drifted `@stable` the action
  # would install `targets:`/`components:` onto a toolchain the build never
  # uses, and `cargo build --target <t>` would fail on missing `std`.
  # ---------------------------------------------------------------------------
  rust-fmt:
    name: Rust Format
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  proto-fmt:
    name: Proto Generated Format/Freshness
    needs: detect-changes
    if: needs.detect-changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:check

  rust-clippy:
    name: Rust Clippy
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # The two build configurations no other job compiles.
  #
  # Every other Rust job here builds the HOST target in DEBUG. Both of the
  # configurations below have already shipped defects that were structurally
  # invisible to that:
  #
  # - RELEASE. `debug_assert!` gates on `cfg!`, a RUNTIME constant, so its body
  #   still name-resolves in release. A `#[cfg(debug_assertions)]` helper called
  #   inside one is an E0425 in every release build — the napi and wasm
  #   artifacts included — while compiling clean in debug. `release.yml` builds
  #   release, but that runs on a tag, which is far too late.
  #
  # - wasm32-unknown-unknown. `rust-clippy` above is host-only and cannot see
  #   target-gated code at all. The existing `editor-lapce` / `editor-zed` jobs
  #   do run wasm clippy, but against `wasm32-wasip1`/`wasip2` and the SEPARATE
  #   `extensions/*` manifests; nothing linted the wasm32 build that the
  #   playground and `@verter/wasm` consumers actually run.
  #
  # `cargo check` (not `build`) for release: this is a compile-configuration
  # gate, not an artifact producer, and skipping codegen keeps it cheap.
  # ---------------------------------------------------------------------------
  rust-build-configs:
    name: Rust Build Configurations
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-build-configs
      - name: Check the release configuration
        run: cargo check --workspace --release
      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p verter_wasm -- -D warnings

  # Build the provider-free default-feature Rust test universe once. Real
  # providers have separate serial libtest jobs below because each third-party
  # engine needs explicit initialization and lifecycle management.
  rust-test-build:
    name: Rust Test Build
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      # The GitHub backend makes repeat builds portable across fresh runners.
      # Bump the namespace only for an intentional cache-generation reset.
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "verter-rust-test-v1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          # REQUIRED by the gate's wasm JavaScript-boundary lane. Those tests are
          # `#[cfg(target_arch = "wasm32")]`, so no host-target run can execute
          # them; without this target the gate's prerequisite preflight fails
          # loudly rather than skipping them.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Job-scoped by default. The previous shared
          # `${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}` key was
          # used by SEVEN ci.yml jobs building different artifact sets; on an
          # exact key hit actions/cache skips the save, so only the first job
          # to finish ever wrote a cache and the other six restored a
          # `target/` that did not match their build.
          key: rust-test
      # Start with the compile-heavy canonical gate only. The existing target
      # cache remains useful for registry/final artifacts while sccache proves
      # its hit rate before a wider matrix rollout.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      # setup-node enables package-manager caching from package.json metadata,
      # so pnpm must already be on PATH even though this job does not install
      # the JavaScript workspace.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Anti-binary-growth integration-test layout
        run: node scripts/check-integration-test-layout.mjs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Build the shared Rust test archive
        run: |
          mkdir -p artifacts
          # act has no GitHub Actions cache service. Compile the same archive
          # directly there; GitHub keeps the telemetry-enforced sccache path.
          if [ "${ACT:-}" = "true" ]; then
            cargo nextest archive --workspace --archive-file artifacts/rust-nextest-archive.tar.zst
          else
            node scripts/run-cached.mjs -- 'cargo nextest archive --workspace --archive-file artifacts/rust-nextest-archive.tar.zst'
          fi
      # Fail closed before upload if a selector has gone stale, overlaps another
      # lane, or would leave a provider lane empty.
      - name: Verify the provider CI partition
        run: node scripts/provider-ci.mjs verify --archive-file artifacts/rust-nextest-archive.tar.zst
      - name: Upload the shared Rust test archive
        uses: actions/upload-artifact@v6
        with:
          name: rust-nextest-archive
          path: artifacts/rust-nextest-archive.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  rust-test:
    name: Rust Test (Core ${{ matrix.shard }}/4)
    needs: [detect-changes, rust-test-build]
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Core still owns generated-binding and compiler-tool tests that use the
      # workspace's pinned JavaScript toolchain. Proto freshness has its own
      # lint-style job and real providers have their own lifecycle jobs below.
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Download the shared Rust test archive
        uses: actions/download-artifact@v7
        with:
          name: rust-nextest-archive
          path: artifacts
      - name: Run core Rust tests from the shared archive
        env:
          NEXTEST_PROFILE: ci
        run: |
          mkdir -p target/rust-nextest-archive
          export VERTER_NEXTEST_FILTER="$(node scripts/provider-ci.mjs filter core)"
          cargo nextest run --archive-file artifacts/rust-nextest-archive.tar.zst --extract-to target/rust-nextest-archive --no-fail-fast --partition "hash:${{ matrix.shard }}/4" -E "$VERTER_NEXTEST_FILTER"
      - name: Locate nextest JUnit report
        if: always()
        id: junit
        run: |
          found=$(find target -type f -path '*/nextest/ci/junit.xml' -print -quit)
          if [ -z "$found" ]; then
            echo "::error::nextest ci junit.xml not found — the test report would be silently empty"
            find target -type d -name nextest -print 2>/dev/null || true
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "JUnit report: $found"
      - name: Test report
        if: always() && steps.junit.outputs.path != ''
        uses: dorny/test-reporter@v3
        with:
          name: Rust Core Test Results (${{ matrix.shard }}/4)
          path: ${{ steps.junit.outputs.path }}
          reporter: java-junit
          fail-on-error: false

  rust-tsserver-live:
    name: Rust Test (tsserver)
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "verter-provider-tsserver-v1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-provider-tsserver
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The live tsserver tests resolve the plugin through its workspace probe
      # location. pnpm install creates the symlink but not these build outputs.
      - name: Build the tsserver plugin prerequisites
        run: pnpm --filter @verter/language-shared --filter @verter/typescript-plugin build
      - name: Run serial tsserver provider tests
        env:
          VERTER_REQUIRE_TSSERVER: "1"
        run: node scripts/provider-ci.mjs run tsserver
      # These source-level plugin specs do not import @verter/native. The two
      # src/tsc specs that do are retained in native-test below.
      - name: Native-free TypeScript plugin tests
        run: pnpm vitest run packages/typescript-plugin/src --exclude 'packages/typescript-plugin/src/tsc/**'
  rust-tsgo-live:
    name: Rust Test (tsgo)
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "verter-provider-tsgo-v1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-provider-tsgo
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The lockfile install provides the pinned project-local tsgo engine.
      - run: pnpm install --frozen-lockfile
      - name: Run serial tsgo provider tests
        env:
          VERTER_REQUIRE_TSGO: "1"
        run: node scripts/provider-ci.mjs run tsgo

  # Required and parallel with the shared archive build. Compile-fail fixtures
  # are standalone Cargo work, not test cases, so this job owns their cached
  # execution outside the nextest inventory.
  compiler-contracts:
    name: Compiler Contracts
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "verter-compiler-contracts-v1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: compiler-contracts
          cache-directories: target/tests/trybuild
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify compiler contracts lane and cache ownership
        run: node --test scripts/compiler-ci-lane-selftest.mjs
      - name: Run workspace compile contracts
        run: node scripts/compile-contracts.mjs
      - name: Verify generated Svelte artifacts
        run: >-
          cargo test --package verter_compiler --test main
          cases::svelte_generated_artifacts_freshness::generated_svelte_artifacts_match_their_authoritative_inputs
          -- --exact
      # The workspace archive unifies verter_svelte_conformance's
      # `conformance-trace` dev feature into verter_compiler. This isolated
      # package build is a different feature configuration, so it cannot be
      # represented by or fanned out from that archive.
      - name: verter_compiler default feature-off build + lib tests (isolated)
        run: |
          cargo build -p verter_compiler
          cargo test -p verter_compiler --lib

  # Required and parallel with the shared archive lanes. The core filter omits
  # `verter_session/bf2-authoritative`; this lane owns its pinned oracle setup,
  # exact source/list inventory admission, and full-capacity nextest run.
  bf2-authoritative:
    name: BF2 Authoritative
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "verter-bf2-authoritative-v1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: bf2-authoritative
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace TypeScript observation is part of BF2 and refuses to
      # degrade when @verter/types or @verter/svelte-jsx is unavailable.
      - name: Build BF2 TypeScript declaration prerequisites
        run: pnpm run build:ts
      # Provisioning is the explicit network boundary. The lane command only
      # realizes these pinned closures offline and fails setup if unusable.
      - name: Provision BF2's offline oracle npm cache
        run: node packages/framework-conformance-harness/scripts/provision-oracle-npm-cache.mjs
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Verify BF2 CI lane contract
        run: node --test scripts/bf2-ci-lane-selftest.mjs
      - name: Run exact BF2 authoritative inventory
        env:
          NEXTEST_PROFILE: ci
        run: node scripts/bf2-authoritative.mjs

  js-build-test:
    name: JS Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # gen-svelte-goldens invokes the Rust semantic-comment extractor. Pin the
      # toolchain instead of relying on GitHub-hosted runner preinstalls.
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Svelte oracle goldens in sync with pinned compiler
        run: node scripts/gen-svelte-goldens.mjs --check
      - name: Build TS packages
        run: pnpm run build:ts
      - name: Run tests
        run: |
          pnpm --filter @verter/types exec vitest --run --reporter=default --reporter=junit --outputFile=../../test-results/vitest-junit.xml
      - name: vue-vscode unit specs (discovered, NOT enumerated)
        # DISCOVERY BY PATTERN, with quarantine by explicit EXCLUSION.
        #
        # This job used to name vue-vscode specs individually, on the premise
        # that `packageManifest*`/`ssrReadiness` were broken and blocked a
        # blanket package run. They are not: with the `Build TS packages` step
        # above, all 40 spec files under packages/vue-vscode/src pass. What the
        # filename list actually did was leave the other 37 in no CI job at
        # all. Four paths were named across this job's two old steps, but only
        # THREE of them were vue-vscode specs — `carrier-routing-no-vue-gate`,
        # `extensionTsService.autoimport` and `extensionTsService.diagnostics`;
        # the fourth was typescript-plugin's own carrier-routing guard, which
        # still runs in the step below. So 37 of the 40 never ran:
        # `extensionTsService.resolution.spec.ts` and
        # `extensionTsServiceRegistry.spec.ts` were both added on 2026-07-26 and
        # were never once executed by CI, so three fail-closed provider guards
        # regressed with nothing watching them.
        #
        # A spec added under packages/vue-vscode/src now runs here by default.
        # A spec that must NOT run is quarantined by adding an `--exclude` on
        # this step, where it is visible and named alongside its reason.
        #
        # Quarantined: none.
        run: pnpm vitest run packages/vue-vscode/src
      - name: Carrier-routing no-Vue-gate guard (typescript-plugin)
        # The full native-free plugin suite runs in rust-tsserver-live. Keep
        # this focused duplicate as an early JS-only carrier-routing signal;
        # src/tsc remains in native-test because those specs import .node code.
        run: pnpm vitest run packages/typescript-plugin/src/carrier-routing-no-vue-gate.spec.ts
      - name: Rust build-tooling helper self-tests (sccache-env, publish set)
        # Explicit-path root vitest run: scripts/ is not a workspace package,
        # so `pnpm -r run test` never reaches these specs — same convention as
        # the carrier-routing guards step above.
        run: pnpm run test:scripts
      - name: Binary distribution guards (platform packages + release wiring)
        # Each binary family's platform matrix reconciled against its platform
        # packages, the release build matrix, and the derived publish set. Run
        # by explicit path for the same reason as the steps above — this job
        # does not run `pnpm -r run test`, so an unreferenced spec never runs.
        run: pnpm vitest run packages/binary-launcher packages/verter-lsp packages/verter-mcp
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: JS Test Results
          path: test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Verify package tarballs
        run: node scripts/verify-packages.mjs

  svelte-oracle:
    name: Svelte Oracle (live, feature-gated)
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte_oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: svelte-oracle
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the pinned `svelte` devDependency so the feature-gated harness
      # can shell `node scripts/gen-svelte-goldens.mjs` over the live compiler.
      - run: pnpm install --frozen-lockfile
      # The oracle-derived component-name-parity corpus in sync with the pinned
      # compiler (the name-parity analogue of the goldens `--check`; also run via the
      # feature-gated Rust rail `pinned_compiler_still_yields_every_committed_name_parity_row`
      # below, this explicit step gives a fast, direct signal on a corpus / generator /
      # vendored-source edit).
      - name: Svelte name-parity corpus in sync with pinned compiler
        run: node scripts/gen-svelte-name-parity-corpus.mjs --check
      # Compiles AND runs the `svelte-oracle` feature-gated harness — the live
      # golden-vs-pinned-compiler drift gate, the topology_diff engine, and the
      # NormalizedGolden schema housed in `verter_compiler::svelte_oracle`.
      # `node` is present in this job, so the harness's live tests run (they
      # HARD-FAIL on a missing toolchain rather than skipping). The default
      # `cargo nextest run --workspace` run never opts into this feature, so it
      # stays node-free + hermetic.
      - name: Svelte oracle harness (live)
        run: cargo test -p verter_compiler --features svelte-oracle

  svelte-conformance:
    name: Svelte CSS Conformance (manifest + goldens drift)
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.svelte_oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: svelte-conformance
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the pinned `svelte` devDependency the conformance golden
      # check compiles against.
      - run: pnpm install --frozen-lockfile
      - name: Run consolidated Rust conformance tests
        run: >-
          cargo test --no-fail-fast -p verter_svelte_conformance
          --features conformance-tests --lib --bin verter_svelte_conformance
          --test main -- --test-threads=4
      # The committed fixture corpus + review artifacts against the typed
      # Rust manifest (also builds the CLI the golden check spawns for its
      # emit-plan).
      - name: Conformance corpus matches the manifest
        run: cargo run -p verter_svelte_conformance -- check
      # The committed conformance goldens against the emit-plan + the pinned
      # official compiler (the live-oracle drift gate for the CSS manifest).
      - name: Conformance goldens in sync with pinned compiler
        run: node scripts/gen-svelte-goldens.mjs --conformance --check

  svelte-client-smokes:
    name: Svelte Client Behavioral Smokes
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte_client_smokes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Svelte client behavioral smokes
        shell: bash
        working-directory: packages/svelte-runtime-tests
        run: |
          shopt -s failglob
          export LC_ALL=C
          pnpm exec vitest run test/svelte-client*-smoke.spec.ts

  svelte-compiler-benchmark:
    name: Svelte Compiler Benchmark (Verter vs official)
    needs: [detect-changes, build-native-node]
    if: needs.detect-changes.outputs.svelte_perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: svelte-compiler-benchmark
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Svelte benchmark contract
        run: pnpm --filter @verter/benchmark exec vitest run src/svelte-perf-contract.spec.ts
      - name: Verify benchmark corpus against official Svelte goldens
        run: |
          node scripts/gen-svelte-goldens.mjs --check
          cargo test -p verter_compiler --test main \
            cases::svelte_client_emit_topology::svelte_performance_manifest_is_oracle_proven_and_representative \
            -- --exact
      # Shared with native-test rather than a second release build of the napi
      # crate in this job.
      - name: Download release native compiler
        uses: actions/download-artifact@v7
        with:
          name: native-node
          path: packages/native/dist
      - name: Compare Verter and official Svelte compilers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @verter/benchmark bench:svelte:compiler -- \
            --json \
            --require-immutable \
            --out="$GITHUB_WORKSPACE/artifacts/svelte-compiler-benchmark.json"
      - name: Ensure benchmark artifact exists
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          result="$GITHUB_WORKSPACE/artifacts/svelte-compiler-benchmark.json"
          if [ ! -f "$result" ]; then
            printf '{"schemaVersion":3,"generatedAt":"%s","pass":false,"error":"Svelte compiler benchmark did not run to completion"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$result"
          fi
      - name: Upload Svelte compiler benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: svelte-compiler-benchmark
          path: artifacts/svelte-compiler-benchmark.json
          if-no-files-found: error

  # Consumes wasm-build's artifact rather than compiling wasm32 a second time.
  # These two jobs used to run `pnpm run build:wasm` independently, so any
  # change matching both filters paid for the wasm toolchain, wasm-bindgen and
  # a full wasm32 compile twice. No Rust toolchain is needed here now.
  #
  # This job also BUILDS the playground, which nothing in CI did before.
  # `packages/playground/vite.config.ts` runs `verter()` with `vue()` commented
  # out, so the playground's own 25 SFCs compile through Verter's VDOM codegen
  # at build time — it is the dogfooding surface, and it had no build coverage
  # at all. A compiler defect sat in it undetected until a bundler change turned
  # a silent runtime bug into a build error.
  #
  # The build lives HERE, not in a job of its own, because both expensive
  # prerequisites already exist as artifacts: wasm32 from `wasm-build` and the
  # release `.node` from `build-native-node` (which `@verter/unplugin`, and so
  # `verter()`, loads). Running `pnpm --filter @verter/playground build` instead
  # would recompile both from source — the ~4 minutes of wasm toolchain this
  # job was explicitly restructured to stop paying twice.
  #
  # THE TOTAL DELIBERATE COST, not just this job's share of it. Inside these
  # steps it is `build:ts` plus `vite build`, with no Rust toolchain. But the
  # larger half is paid upstream: `build-native-node` now also fires on the
  # `playground` filter, and that is a release `napi build --release` under a
  # 40-minute timeout, newly triggered by any of the 111 tracked files under
  # packages/playground/** — a README or `.gitignore` edit included — with this
  # job serialized behind it. That widening is load-bearing, not incidental:
  # under the previous `rust || js` condition those same 111 files satisfy this
  # job's own `if:` while its producer skips, and a skipped job skips its
  # dependents, so the job would be silently disabled. See its `if:` below.
  #
  # The consequence to know before reading a red run: a playground-only PR can
  # now fail on a Rust COMPILE error out of `build-native-node` while
  # `rust-test`, `rust-clippy` and `rust-fmt` are all skipped, none of the three
  # being on the `playground` filter.
  playground-test:
    name: Playground Unit Tests & Build
    needs: [detect-changes, wasm-build, build-native-node]
    if: needs.detect-changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download WASM build
        uses: actions/download-artifact@v7
        with:
          name: wasm-build
          path: packages/wasm
      - name: Playground tests
        run: pnpm --filter @verter/playground test
      # MANDATORY wasm gate. `src/core/compiler.spec.ts` is the ONE playground
      # spec that drives the built WASM host, so it is excluded from the
      # package's artifact-independent default `test` script (root `pnpm test`
      # and a plain dev checkout have no `packages/wasm/wasm/`, where 19 of its
      # 41 running tests fail — 43 in the file, two of them `it.skip`). This
      # job downloaded the artifact, so this step is that spec's ONLY
      # enforcement point — same arrangement as `native-test`'s
      # `@verter/component-meta test:native`.
      - name: Playground WASM compiler spec
        run: pnpm --filter @verter/playground test:wasm
      # Everything below builds the app. The .node is what `verter()` runs the
      # SFCs through; `build:ts` supplies the workspace deps the playground
      # imports (type-ir, proto, types, language-shared, component-meta,
      # unplugin) — the same set `build:workspace-deps` would build from source.
      - name: Download native binding
        uses: actions/download-artifact@v7
        with:
          name: native-node
          path: packages/native/dist
      - name: Build TS packages
        run: pnpm run build:ts
      # @verter/wasm's build no longer implicitly copies its output into the
      # playground package (build-lane separation — no package-level build
      # modifies another package). The playground syncs explicitly.
      - name: Sync WASM into the playground
        run: pnpm --filter @verter/playground run sync:wasm
      - name: Build the playground
        run: pnpm --filter @verter/playground exec vite build

  wasm-build:
    name: WASM Build
    needs: detect-changes
    # Also runs for `playground`, which consumes this job's artifact.
    if: needs.detect-changes.outputs.wasm == 'true' || needs.detect-changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-build
      # Prebuilt binary. The previous guarded `cargo install` compiled
      # wasm-bindgen-cli from source on any runner where the version probe
      # missed, which is every cold cache.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Full publication-ready lane (bindgen + wasm-opt), deliberately NOT the
      # root `pnpm build:wasm` — that is the host-developer lane and never
      # runs wasm-opt. This artifact is uploaded for playground-test/release.
      - name: Build WASM
        run: pnpm --filter @verter/wasm build
      - name: Smoke test WASM
        run: node -e "const fs = require('fs'); const wasm = fs.readFileSync('packages/wasm/wasm/verter_wasm_bg.wasm'); console.log('WASM size:', wasm.length, 'bytes'); if (wasm.length < 1000) throw new Error('WASM too small');"
      # The committed carrier fixture the playground's in-context
      # LanguageService guards load is a snapshot of real host output. Those
      # guards read the snapshot, never the host, so nothing else in the suite
      # notices when compiler output moves and the snapshot does not. This runs
      # here because this is the job that HAS the artifact: it compares against
      # the bytes just built, and its path filter is the artifact's own build
      # closure, so every change that can move carrier output reaches it.
      # Unconditional and non-advisory — a difference fails the job.
      #
      # Invoked as the script, not `pnpm --filter ... run check:wasm-fixtures`:
      # pnpm exits 0 when a filter matches no package AND when a matched
      # package has no such script (`--fail-if-no-match` fixes only the first),
      # so renaming either the package or the script would turn this step into
      # a green no-op. The script resolves every path from its own location and
      # needs no workspace resolution.
      - name: Verify committed carrier fixtures against the built WASM
        run: node packages/playground/scripts/capture-wasm-carrier-fixtures.mjs --check
      # Shared with playground-test so wasm32 is compiled ONCE per run.
      - name: Upload WASM build
        uses: actions/upload-artifact@v6
        with:
          name: wasm-build
          path: |
            packages/wasm/wasm/
            packages/wasm/dist/
          if-no-files-found: error
          retention-days: 1
      - name: Build TS packages
        run: pnpm run build:ts
      - name: Test @verter/wasm
        run: pnpm --filter @verter/wasm test

  # ---------------------------------------------------------------------------
  # The ONE debug build of the Rust binaries every editor/DX integration job
  # drives. `build-vscode-e2e` (via `prepare:e2e`) and `dx-harness-hermetic`
  # each used to run their own debug `cargo build -p verter_lsp`, so a PR
  # touching both filters paid for two full debug workspace compiles. Both now
  # download this artifact, which also removes the Rust toolchain from those
  # jobs entirely.
  #
  # Debug (not release) is deliberate: these are the binaries the e2e/DX lanes
  # have always driven. The editor CONTRACT jobs need a release binary for
  # realistic stdio latency and use `build-editor-lsp` instead.
  # ---------------------------------------------------------------------------
  build-lsp-debug:
    name: Build debug LSP binaries
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.vscode == 'true' ||
      needs.detect-changes.outputs.editor_lsp == 'true' ||
      needs.detect-changes.outputs.dx == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-lsp-debug
      - name: Build verter-lsp, relay shim, DX baseline and MCP server (debug)
        run: cargo build -p verter_lsp -p verter_relay_shim -p verter_dx_baseline -p verter_mcp
      - uses: actions/upload-artifact@v6
        with:
          name: lsp-debug-bins
          path: |
            target/debug/verter-lsp
            target/debug/verter-relay-shim
            target/debug/verter-dx-baseline
            target/debug/verter-mcp
          if-no-files-found: error
          retention-days: 1

  build-vscode-e2e:
    name: Build editor integration E2E
    needs: detect-changes
    if: needs.detect-changes.outputs.vscode == 'true' || needs.detect-changes.outputs.editor_lsp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.e2e-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test VS Code E2E harness units
        run: pnpm --filter verter-vscode test:e2e:lib:unit
      # The TS half of `prepare:e2e` only. Its cargo half is `prepare:e2e:rust`,
      # covered by build-lsp-debug above; `prepare:e2e` still runs both for
      # local development.
      - name: Prepare VS Code E2E artifacts
        run: pnpm --filter verter-vscode prepare:e2e:ts
      - name: Derive VS Code E2E route matrix
        id: e2e-matrix
        shell: bash
        run: echo "matrix=$(node packages/vue-vscode/out-test/e2e/printCiMatrix.js)" >> "$GITHUB_OUTPUT"
      - name: Upload built extension
        uses: actions/upload-artifact@v6
        with:
          name: vscode-e2e-build
          path: |
            packages/language-shared/dist/
            packages/typescript-plugin/dist/
            packages/vue-vscode/dist/
            packages/vue-vscode/out-test/
          retention-days: 1

  editor-neutral-lsp:
    name: Editor-neutral LSP contract
    needs: [detect-changes, build-lsp-debug, build-vscode-e2e]
    if: needs.detect-changes.outputs.editor_lsp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download editor integration binaries
        uses: actions/download-artifact@v7
        with:
          name: lsp-debug-bins
          path: target/debug
      - name: Make editor integration binaries executable
        run: chmod +x target/debug/verter-lsp target/debug/verter-relay-shim target/debug/verter-mcp
      - name: Download provider integration builds
        uses: actions/download-artifact@v7
        with:
          name: vscode-e2e-build
          path: packages
      - name: Build editor-neutral contract packages
        run: pnpm --filter "@verter/dx-harness..." build
      - name: Run tsserver, tsgo, and real shared-tsgo contract
        env:
          VERTER_EDITOR_NEUTRAL_RECEIPT: ${{ runner.temp }}/verter-editor-neutral-lsp.json
        run: pnpm --filter @verter/dx-harness test:editor-neutral-lsp
      - name: Upload editor-neutral contract receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editor-neutral-lsp-receipt
          path: ${{ runner.temp }}/verter-editor-neutral-lsp.json
          if-no-files-found: error
          retention-days: 7

  vscode-e2e:
    name: VS Code E2E (${{ matrix.fixture }} / ${{ matrix.type_provider }})
    needs: [detect-changes, build-lsp-debug, build-vscode-e2e]
    # Temporarily disabled: the 32-route matrix remains reproducible locally in
    # Docker, while CI keeps the editor-neutral LSP contract as the required
    # integration signal without downloading a separate 330 MB VS Code per leg.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-vscode-e2e.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download editor integration binaries
        uses: actions/download-artifact@v7
        with:
          name: lsp-debug-bins
          path: target/debug
      - name: Make editor integration binaries executable
        run: chmod +x target/debug/verter-lsp target/debug/verter-relay-shim target/debug/verter-mcp
      - name: Download built extension
        uses: actions/download-artifact@v7
        with:
          name: vscode-e2e-build
          path: packages
      - name: Run E2E tests (${{ matrix.fixture }} / ${{ matrix.type_provider }})
        run: xvfb-run -a pnpm --filter verter-vscode test:e2e:run
        env:
          E2E_FIXTURE: ${{ matrix.fixture }}
          E2E_TYPE_PROVIDER: ${{ matrix.type_provider }}
          # Keep the required matrix on the reviewed editor baseline. Local
          # reproduction can set the same variable or opt into another build.
          E2E_VSCODE_VERSION: "1.135.0"
          VERTER_REQUIRE_TSSERVER: "1"
          VERTER_REQUIRE_TSGO: "1"
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics-${{ matrix.fixture }}-${{ matrix.type_provider }}
          path: |
            /tmp/verter-e2e-timing-*.json
            /tmp/verter-e2e-*.log
            /tmp/verter-e2e-*.log.runsummary
          if-no-files-found: ignore

  # The ONE release build of the native N-API binding. `native-test` and
  # `svelte-compiler-benchmark` each ran `pnpm run build:native` themselves, so
  # any change matching both filters paid for two full release builds of the
  # napi crate. Gated on the broader `rust || js` (native-test's closure gate),
  # which is a superset of `svelte_perf`, so the producer is always present
  # when either consumer runs.
  build-native-node:
    name: Build native binding
    needs: detect-changes
    # Also runs for `playground`, which consumes this job's artifact to build
    # the app — a playground-only change sets neither `rust` nor `js` (the `js`
    # filter excludes packages/playground/**), and a skipped job skips its
    # dependents, which would silently disable playground-test.
    if: >-
      needs.detect-changes.outputs.rust == 'true' ||
      needs.detect-changes.outputs.js == 'true' ||
      needs.detect-changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-native-node
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native binding (release)
        run: pnpm run build:native
      - uses: actions/upload-artifact@v6
        with:
          name: native-node
          path: packages/native/dist/
          if-no-files-found: error
          retention-days: 1

  native-test:
    name: Native Package Tests
    needs: [detect-changes, build-native-node]
    # Dependency-closure gate: this job builds the real native binding and
    # drives the @verter/component-meta native-eval suite against it, whose
    # dependency closure spans every workspace crate plus the JS workspace
    # deps it imports (type-ir, proto, types, language-shared, root
    # manifests/lockfile/tsconfig). A hand-written path subset silently
    # skips the job for closure members it forgot, so the gate is the broad
    # rust/js change outputs: ANY Rust or JS change runs native-eval.
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The real .node comes from build-native-node, so this job needs no Rust
      # toolchain and no cargo cache.
      - name: Download native binding
        uses: actions/download-artifact@v7
        with:
          name: native-node
          path: packages/native/dist
      - name: Build TS packages
        run: pnpm run build:ts
      - name: Test @verter/native
        run: pnpm --filter @verter/native test
      - name: Native-backed @verter/typescript-plugin tests
        run: pnpm vitest run packages/typescript-plugin/src/tsc
      - name: Test @verter/unplugin
        run: pnpm --filter @verter/unplugin test
      # MANDATORY native-eval gate: the @verter/component-meta suite that
      # exercises the REAL native binding (excluded from the package's
      # artifact-independent default `test` script, so this is its only
      # enforcement point). Sequenced after `build:native` (the .node
      # artifact) and `build:ts` (the workspace deps it imports); a
      # native-eval regression fails this required job.
      - name: Native-eval @verter/component-meta
        run: pnpm --filter @verter/component-meta test:native

  dx-harness-hermetic:
    name: DX Harness (raw-LSP hermetic)
    needs: [detect-changes, build-lsp-debug]
    if: needs.detect-changes.outputs.dx == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The differential-baseline bridge and the verter raw-LSP server the spine
      # smoke drives over the vendored corpus. Both used to be built here with
      # their own debug `cargo build`, duplicating the compile `build-vscode-e2e`
      # was already doing; they now come from the shared build-lsp-debug
      # artifact, which removes the Rust toolchain from this job entirely.
      - name: Download debug LSP binaries
        uses: actions/download-artifact@v7
        with:
          name: lsp-debug-bins
          path: target/debug
      - name: Make debug LSP binaries executable
        run: chmod +x target/debug/verter-lsp target/debug/verter-relay-shim target/debug/verter-mcp target/debug/verter-dx-baseline
      # Build the harness (and its workspace deps, including the lsp-test-client) so
      # the gates can import the published dist and drive both real binaries.
      - name: Build DX harness
        run: pnpm --filter "@verter/dx-harness..." build
      # `@verter/typescript-plugin` is what makes a `.vue` carrier a member of its
      # configured tsserver project (`getExternalFiles` + `extraFileExtensions`), so
      # the raw-LSP spine smoke cannot get ANY carrier semantics without it. It is a
      # `tsc -b` output `pnpm install` does not produce and is NOT in the DX harness's
      # dependency closure, so it needs its own build step here. Deliberately NOT
      # `--filter @verter/typescript-plugin...` — the trailing ellipsis pulls in
      # `@verter/native`'s release napi build.
      - name: Build the tsserver carrier-membership plugin
        run: pnpm --filter @verter/language-shared --filter @verter/typescript-plugin build
      # Pure-hermetic unit suite (no real binary; the integration specs self-skip
      # without their bin env gates).
      - name: DX harness hermetic unit suite
        run: pnpm --filter @verter/dx-harness test:unit
      # The non-vacuous strict differential: spawns the real tsserver-backed baseline
      # over the committed vendored corpus and FAILS unless the pinned tool root,
      # vendored Vue version-sync, versioned artifact-sync refusal, and baseline-ran>0
      # all hold.
      - name: Strict differential baseline gate
        env:
          DX_REPO_ROOT: ${{ github.workspace }}
          DX_BASELINE_BIN: ${{ github.workspace }}/target/debug/verter-dx-baseline
        run: node scripts/dx/dx-ci-gate.mjs
      # Real-provider auto-import PARITY (Issue #1's headline guarantee): spawns the
      # vendored tsgo AND the pinned tsserver through the baseline bridge, resolves
      # an unimported-symbol completion through each, and asserts BOTH produce the
      # SAME auto-import edit. `DX_REQUIRE_PROVIDERS=1` makes a provider that fails
      # to spawn a HARD FAILURE so this proof can never vacuously skip on a runner
      # where the assets are present.
      - name: Real-provider auto-import parity gate
        env:
          DX_BASELINE_BIN: ${{ github.workspace }}/target/debug/verter-dx-baseline
          DX_REQUIRE_PROVIDERS: "1"
        run: pnpm --filter @verter/dx-harness exec vitest --run test/providerResolveParity.integration.test.ts
      # The verter raw-LSP spine: drives the REAL verter-lsp over the vendored
      # hermetic corpus (pinned tsserver, no network) and FAILS unless verter-lsp
      # starts, reaches readiness, RESPONDS to hover/definition/completion, and
      # produces at least one contentful response. It records the differential but
      # does NOT enforce verter-vs-tsgo parity — verter's known divergences must not
      # turn the required gate red. The full record-and-diff corpus sweep is the
      # scheduled dx-extended.yml job.
      - name: Verter raw-LSP spine smoke
        env:
          DX_REPO_ROOT: ${{ github.workspace }}
          DX_LSP_BIN: ${{ github.workspace }}/target/debug/verter-lsp
          DX_BASELINE_BIN: ${{ github.workspace }}/target/debug/verter-dx-baseline
        run: node scripts/dx/dx-lsp-smoke.mjs
      # NEGATIVE CONTROL for the step above. `packages/typescript-plugin/dist` is
      # the package's OUTPUT directory, not a plugin probe location: tsserver
      # resolves the package name out of `<probe>/node_modules`, which does not
      # exist there. It nonetheless used to LOOK correct — the plugin still loaded,
      # via Node's ancestor walk into pnpm's private `.pnpm/node_modules` hoist
      # dir — so the smoke passed while the probe it declared did no work.
      #
      # Without this control the preflight is never exercised against a wrong
      # probe by CI, and a regression back to that layout would stay green through
      # the same fallback. A PASS here is therefore a FAILURE of the gate.
      - name: Verter raw-LSP spine smoke refuses a non-probe plugin path
        env:
          DX_REPO_ROOT: ${{ github.workspace }}
          DX_LSP_BIN: ${{ github.workspace }}/target/debug/verter-lsp
          DX_BASELINE_BIN: ${{ github.workspace }}/target/debug/verter-dx-baseline
          DX_PLUGIN_PATH: ${{ github.workspace }}/packages/typescript-plugin/dist
        run: |
          if node scripts/dx/dx-lsp-smoke.mjs; then
            echo "::error::DX raw-LSP smoke accepted a non-probe plugin path; the plugin probe \
            preflight is not enforcing a direct hit and the gate can pass on the pnpm \
            ancestor-walk fallback"
            exit 1
          fi
          echo "negative control: a non-probe plugin path is refused"

  # ---------------------------------------------------------------------------
  # Editor-client integration (Helix / Lapce / Zed / Neovim)
  #
  # These four lanes previously lived in standalone helix.yml / lapce.yml /
  # zed.yml / neovim.yml workflows. Each built `verter-lsp --release` itself,
  # with NO cargo cache and a 3-OS (neovim: 3-OS x 3-version = 9-leg) matrix,
  # so a single `crates/**` push triggered TWELVE uncached release builds of
  # the server. They now consume ONE shared binary built by `build-editor-lsp`.
  #
  # What was dropped as genuinely redundant rather than as lost coverage:
  # `verter-editor-client` is a WORKSPACE member, so its full test suite,
  # clippy and rustfmt are already covered by rust-test / rust-clippy /
  # rust-fmt above. The lapce and zed extensions are SEPARATE cargo manifests
  # and are NOT covered anywhere else, so their build/test/clippy/fmt lanes are
  # preserved here in full.
  # ---------------------------------------------------------------------------
  build-editor-lsp:
    name: Build editor LSP binary
    needs: detect-changes
    if: needs.detect-changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-editor-lsp
      - name: Build verter-lsp (release)
        run: cargo build -p verter_lsp --release
      - uses: actions/upload-artifact@v6
        with:
          name: editor-lsp
          path: target/release/verter-lsp
          if-no-files-found: error
          retention-days: 1

  editor-helix:
    name: Editor contract (Helix 25.07.1)
    needs: [detect-changes, build-editor-lsp]
    if: needs.detect-changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: editor-helix
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download shared verter-lsp
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp
          path: target/release

      - name: Install pinned Helix with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helix-25.07.1-x86_64-linux.tar.xz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz
          echo "3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
          echo "HELIX_RUNTIME=${RUNNER_TEMP}/helix-25.07.1-x86_64-linux/runtime" >> "$GITHUB_ENV"

      - name: Provision the shipped Helix configuration and server
        shell: bash
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/helix-config/helix"
          mkdir -p "$config" "${RUNNER_TEMP}/verter-bin"
          cp editors/helix/languages.toml "$config/languages.toml"
          cp target/release/verter-lsp "${RUNNER_TEMP}/verter-bin/verter-lsp"
          chmod +x "${RUNNER_TEMP}/verter-bin/verter-lsp"
          echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/helix-config" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/verter-bin" >> "$GITHUB_PATH"

      - name: Prove Vue and Svelte select only the executable Verter server
        shell: bash
        run: |
          set -euo pipefail
          hx --version | grep -F "helix 25.07.1"
          for language in vue svelte; do
            output=$(NO_COLOR=1 hx --health "$language" 2>&1)
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -F "verter-lsp"
            if printf '%s\n' "$output" | grep -Eiq 'vue-language-server|svelteserver|svelte-language-server'; then
              echo "::error::$language has a second framework language server configured"
              exit 1
            fi
          done

      # Examples are not built by the workspace `cargo nextest run`, so this
      # target is NOT covered by rust-test above and is preserved here.
      - name: Test the exported rootless Helix shipping plan
        shell: bash
        run: cargo test -p verter-editor-client --example helix_plan

      - name: Install neutral-client fixture dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the parsed Helix shipping plan over stdio
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/editor-contracts/plan-contract.test.mjs
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${RUNNER_TEMP}/verter-bin/verter-lsp"
          plan="${RUNNER_TEMP}/helix-launch-plan.json"
          cargo run --quiet -p verter-editor-client --example helix_plan -- "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"

  editor-lapce:
    name: Editor contract (Lapce volt)
    needs: [detect-changes, build-editor-lsp]
    if: needs.detect-changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: editor-lapce
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download shared verter-lsp
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp
          path: target/release
      - name: Make verter-lsp executable
        run: chmod +x target/release/verter-lsp

      # extensions/lapce is a SEPARATE cargo manifest, not a workspace member,
      # so none of the following is covered by rust-test / rust-clippy /
      # rust-fmt above.
      - name: Build the volt (wasm32-wasip1)
        shell: bash
        run: cargo build --manifest-path extensions/lapce/Cargo.toml --target wasm32-wasip1 --release

      - name: Run host-target unit tests
        shell: bash
        run: cargo test --manifest-path extensions/lapce/Cargo.toml

      - name: Clippy (wasm32-wasip1)
        shell: bash
        run: cargo clippy --manifest-path extensions/lapce/Cargo.toml --target wasm32-wasip1 -- -D warnings

      - name: Rustfmt check
        shell: bash
        working-directory: extensions/lapce
        run: cargo fmt --check

      - name: Install JavaScript test dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the exact Lapce launch plan over stdio
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/editor-contracts/plan-contract.test.mjs
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${GITHUB_WORKSPACE}/target/release/verter-lsp"
          plan="${RUNNER_TEMP}/lapce-launch-plan.json"
          cargo run --quiet --manifest-path extensions/lapce/Cargo.toml --example contract_plan -- "$root" "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"

  editor-zed:
    name: Editor contract (Zed extension)
    needs: [detect-changes, build-editor-lsp]
    if: needs.detect-changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: editor-zed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download shared verter-lsp
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp
          path: target/release
      - name: Make verter-lsp executable
        run: chmod +x target/release/verter-lsp

      # extensions/zed is a SEPARATE cargo manifest, not a workspace member, so
      # none of the following is covered by rust-test / rust-clippy / rust-fmt
      # above. A wasip1/wasip2 mismatch yields a `__wasi_init_tp` load error in
      # Zed, which only this build catches.
      - name: Build the extension (wasm32-wasip2)
        shell: bash
        run: cargo build --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 --release

      - name: Run host-target unit tests
        shell: bash
        run: cargo test --manifest-path extensions/zed/Cargo.toml

      - name: Clippy (wasm32-wasip2)
        shell: bash
        run: cargo clippy --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 -- -D warnings

      - name: Rustfmt check
        shell: bash
        working-directory: extensions/zed
        run: cargo fmt --check

      - name: Install JavaScript test dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the exact Zed launch plan over stdio
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/editor-contracts/plan-contract.test.mjs
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${GITHUB_WORKSPACE}/target/release/verter-lsp"
          plan="${RUNNER_TEMP}/zed-launch-plan.json"
          cargo run --quiet --manifest-path extensions/zed/Cargo.toml --example contract_plan -- "$root" "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"

  editor-neovim:
    name: Editor contract (Neovim plenary)
    needs: [detect-changes, build-editor-lsp]
    if: needs.detect-changes.outputs.editors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Download shared verter-lsp
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp
          path: target/release
      - name: Make verter-lsp executable
        run: chmod +x target/release/verter-lsp

      - name: Install the pinned real-client fixture toolchain
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: editors/nvim/tests/fixtures/real-client/package-lock.json

      - name: Provision tsgo and framework types
        working-directory: editors/nvim/tests/fixtures/real-client
        run: npm ci --ignore-scripts

      # Single pinned stable release. The retired matrix also covered the
      # v0.11.0 floor and nightly; nightly in particular was an early-warning
      # lane for upstream LSP-client changes, and that signal is no longer
      # collected here.
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.3

      - name: Checkout plenary.nvim
        uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
          path: .ci/plenary.nvim

      # The verdict below decides this job. Prove it can still separate a green
      # suite from a failing one BEFORE spending a suite run on it — a guard that
      # cannot match plenary's real (ANSI-coloured) output makes the job either
      # unpassable or unfailable, and both look like an ordinary red job.
      - name: Plenary verdict guard
        run: node --test scripts/editor-contracts/plenary-outcome-guard.test.mjs

      - name: Run plenary busted suite
        shell: bash
        env:
          PLENARY_PATH: ${{ github.workspace }}/.ci/plenary.nvim
        run: |
          set -euo pipefail
          # `smoke_spec.lua` drives a REAL stdio attach and fails closed if
          # $VERTER_LSP_BIN is missing.
          VERTER_LSP_BIN="${GITHUB_WORKSPACE}/target/release/verter-lsp"
          if [ ! -x "${VERTER_LSP_BIN}" ]; then
            echo "::error::shared verter-lsp not found/executable at ${VERTER_LSP_BIN}"
            exit 1
          fi
          export VERTER_LSP_BIN
          VERTER_TSGO_BIN=$(node --input-type=module -e \
            "import getExePath from './editors/nvim/tests/fixtures/real-client/node_modules/typescript/lib/getExePath.js'; console.log(getExePath().replaceAll('\\\\', '/'))")
          if [ ! -x "${VERTER_TSGO_BIN}" ]; then
            echo "::error::fixture TypeScript 7 engine not found/executable at ${VERTER_TSGO_BIN}"
            exit 1
          fi
          export VERTER_TSGO_BIN
          echo "using VERTER_LSP_BIN=${VERTER_LSP_BIN}"
          echo "using VERTER_TSGO_BIN=${VERTER_TSGO_BIN}"
          # Load minimal_init.lua into the PARENT nvim with `-u` so the
          # `PlenaryBustedDirectory` command exists (it is defined by plenary,
          # which minimal_init prepends to the rtp). Without `-u` the parent
          # nvim has no plenary and the command is a no-op, so the suite would
          # silently fail to run.
          #
          # Capture output so we can fail the job even on plenary builds that do
          # not propagate a nonzero exit code on test failure.
          out=$(nvim --headless --noplugin \
            -u editors/nvim/tests/minimal_init.lua \
            -c "PlenaryBustedDirectory editors/nvim/tests/ {minimal_init='editors/nvim/tests/minimal_init.lua'}" \
            -c "qa!" 2>&1) || rc=$?
          rc=${rc:-0}
          echo "$out"
          # plenary COLOURISES its summary counters: the bytes are
          # `\033[32mSuccess: \033[0m<TAB>43`, not `Success: 43`. ESC is not
          # `[[:space:]]`, so a pattern matched against the raw capture stops at
          # the escape and never reaches the digit — the success proof below
          # becomes unsatisfiable and the failure proof survives only on whichever
          # token happens to be uncoloured. Strip SGR/CSI sequences once, here,
          # and decide on the plain text. `$'\033'` puts a literal ESC in the sed
          # script rather than an escape sed itself must interpret; GNU and BSD
          # sed disagree about `\x1b` and this job has run on both.
          plain=$(printf '%s\n' "$out" | sed $'s/\033\\[[0-9;]*[A-Za-z]//g')
          # Whitespace-tolerant failure tokens. plenary prints `Failed : <n>`
          # and `Errors : <n>` (ONE space, variable padding), so a two-space
          # pattern never matches and the gate could go green on a real failure.
          if printf '%s\n' "$plain" | grep -Eq 'Tests Failed|Schedule Error|Failed[[:space:]]*:[[:space:]]*[1-9]|Errors?[[:space:]]*:[[:space:]]*[1-9]'; then
            echo "::error::Neovim plenary suite reported failures"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::Neovim exited non-zero ($rc)"
            exit "$rc"
          fi
          if ! printf '%s\n' "$plain" | grep -Eq 'Success(es)?[[:space:]]*:[[:space:]]*[1-9]|[1-9][0-9]*[[:space:]]+success'; then
            echo "::error::Neovim test output did not prove that any assertion-bearing test ran"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Aggregate gate. Branch protection should require THIS job and nothing else.
  #
  # Almost every job above is gated on a  path filter, so on any
  # given PR most of them legitimately SKIP. A skipped job cannot be used as a
  # required status check (it never reports success), so requiring the
  # individual jobs either blocks every PR or silently protects nothing. This
  # job always runs, and fails if ANY dependency failed or was cancelled --
  # skipped is accepted, failure is not.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - tama-roadmap
      - rust-fmt
      - proto-fmt
      - rust-clippy
      - rust-build-configs
      - rust-test-build
      - rust-test
      - rust-tsserver-live
      - rust-tsgo-live
      - compiler-contracts
      - bf2-authoritative
      - js-build-test
      - svelte-oracle
      - svelte-conformance
      - svelte-client-smokes
      - svelte-compiler-benchmark
      - playground-test
      - wasm-build
      - build-vscode-e2e
      - editor-neutral-lsp
      - vscode-e2e
      - native-test
      - dx-harness-hermetic
      - build-lsp-debug
      - build-native-node
      - build-editor-lsp
      - editor-helix
      - editor-lapce
      - editor-zed
      - editor-neovim
    steps:
      - name: Verify no dependency failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::at least one CI job failed"; exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::at least one CI job was cancelled"; exit 1
          fi
          echo "All CI jobs succeeded or were legitimately skipped."
