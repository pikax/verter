name: CI

on:
  push:
    branches: main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      wasm: ${{ steps.filter.outputs.wasm }}
      playground: ${{ steps.filter.outputs.playground }}
      vscode: ${{ steps.filter.outputs.vscode }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'scripts/v5-process/**'
              - '.github/workflows/ci.yml'
            js:
              - 'packages/**'
              - '!packages/playground/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'scripts/v5-process/**'
              - '.github/workflows/ci.yml'
            wasm:
              - 'crates/verter_core/**'
              - 'crates/verter_analysis/**'
              - 'crates/verter_host/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_wasm/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_span/**'
              - 'packages/wasm/**'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            playground:
              - 'crates/verter_core/**'
              - 'crates/verter_analysis/**'
              - 'crates/verter_host/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_span/**'
              - 'crates/verter_wasm/**'
              - 'crates/verter_lsp/**'
              - 'packages/wasm/**'
              - 'packages/playground/**'
              - '.github/workflows/ci.yml'
            vscode:
              - 'crates/verter_core/**'
              - 'crates/verter_analysis/**'
              - 'crates/verter_host/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_lsp/**'
              - 'crates/verter_span/**'
              - 'packages/vue-vscode/**'
              - 'packages/language-shared/**'
              - 'packages/typescript-plugin/**'
              - '.github/workflows/ci.yml'
            native:
              - 'crates/verter_napi/**'
              - 'crates/verter_core/**'
              - 'crates/verter_analysis/**'
              - 'crates/verter_host/**'
              - 'crates/verter_ffi/**'
              - 'crates/verter_diagnostics/**'
              - 'crates/verter_actions/**'
              - 'crates/verter_span/**'
              - 'packages/native/**'
              - 'packages/unplugin/**'
              - 'packages/typescript-plugin/**'
              - 'packages/core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  rust-fmt:
    name: Rust Format
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo clippy --workspace -- -D warnings

  rust-test:
    name: Rust Test
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate v5/process parity manifest
        run: node scripts/v5-process/validate_manifest.mjs
      - name: Prewarm tsgo cache
        run: npx -y @typescript/native-preview --version
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Rust tests (strict tsgo)
        env:
          VERTER_REQUIRE_TSGO: "1"
        run: cargo nextest run --workspace --profile ci
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Rust Test Results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false

  rust-coverage:
    name: Rust Coverage
    needs: [detect-changes, rust-test]
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Prewarm tsgo cache
        run: npx -y @typescript/native-preview --version
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        env:
          VERTER_REQUIRE_TSGO: "1"
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  js-build-test:
    name: JS Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate v5/process parity manifest
        run: node scripts/v5-process/validate_manifest.mjs
      - name: Build TS packages
        run: pnpm run build:ts
      - name: Run tests
        run: pnpm vitest --run --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml
      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JS Test Results
          path: test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Verify package tarballs
        run: node scripts/verify-packages.mjs

  playground-test:
    name: Playground Unit Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Playground tests
        run: pnpm --filter @verter/playground test

  wasm-build:
    name: WASM Build
    needs: detect-changes
    if: needs.detect-changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Smoke test WASM
        run: node -e "const fs = require('fs'); const wasm = fs.readFileSync('packages/wasm/wasm/verter_wasm_bg.wasm'); console.log('WASM size:', wasm.length, 'bytes'); if (wasm.length < 1000) throw new Error('WASM too small');"
      - name: Build TS packages
        run: pnpm run build:ts
      - name: Test @verter/wasm
        run: pnpm --filter @verter/wasm test

  vscode-e2e:
    name: VS Code E2E (${{ matrix.fixture }})
    needs: detect-changes
    if: needs.detect-changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - single-project
          - barrel-exports
          - path-aliases
          - monorepo
          - tsconfig-extends
          - tsconfig-references
          - composite-paths
          - no-config
          - single-file
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build LSP binary
        run: cargo build -p verter_lsp
      - name: Build extension dependencies
        run: pnpm --filter @verter/language-shared build
      - name: Build extension
        run: pnpm --filter verter-vscode build:dev
      - name: Compile E2E tests
        run: pnpm --filter verter-vscode pretest:e2e
      - name: Run E2E tests (${{ matrix.fixture }})
        run: xvfb-run -a pnpm --filter verter-vscode test:e2e
        env:
          E2E_FIXTURE: ${{ matrix.fixture }}
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timing-${{ matrix.fixture }}
          path: /tmp/verter-e2e-timing-*.json
          if-no-files-found: ignore

  native-test:
    name: Native Package Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native binary
        run: pnpm run build:native
      - name: Build TS packages
        run: pnpm run build:ts
      - name: Test @verter/native
        run: pnpm --filter @verter/native test
      - name: Test @verter/typescript-plugin
        run: pnpm --filter @verter/typescript-plugin test
      - name: Test @verter/unplugin
        run: pnpm --filter @verter/unplugin test
