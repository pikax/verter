name: Release

on:
  push:
    tags:
      - "v*"
  # Callable so a release REHEARSAL runs this exact job graph with publishing
  # switched off, rather than a parallel copy that drifts. See
  # release-check.yml, which is a thin caller passing dry_run: true.
  workflow_call:
    inputs:
      dry_run:
        description: >-
          Run validation, the full test matrix and every build, but skip all
          publishing (crates.io, npm, Marketplace, GitHub Release) and the
          post-release integration tests.
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  # ---------------------------------------------------------------------------
  # Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      is-prerelease: ${{ steps.check.outputs.is-prerelease }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
      dry-run: ${{ steps.check.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          # `inputs` is empty on a tag push, so this is false unless a caller
          # (release-check.yml) explicitly asked for a rehearsal.
          DRY_RUN="${{ inputs.dry_run == true }}"
          echo "dry-run=${DRY_RUN}" >> $GITHUB_OUTPUT
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN — full validation, tests and builds will run; nothing will be published"
          fi

          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "dist-tag=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-beta"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "dist-tag=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "dist-tag=rc" >> $GITHUB_OUTPUT
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "dist-tag=latest" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pre-publish validation
        run: |
          echo "=== Version & dependency checks ==="
          node scripts/check-versions.mjs

          # Fail on VS Code extension warnings (e.g. @types/vscode > engines.vscode)
          node scripts/check-versions.mjs --json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            if (data.vscodeWarnings && data.vscodeWarnings.length > 0) {
              data.vscodeWarnings.forEach(w => console.error('::error::' + w));
              process.exit(1);
            }
            console.log('VS Code extension checks passed');
          "

          echo ""
          echo "=== Cargo publish dry-run ==="
          # Dry-run verter_span (no local deps, can always be validated)
          cargo publish -p verter_span --dry-run --allow-dirty 2>&1 || {
            echo "::error::cargo publish dry-run failed for verter_span"
            exit 1
          }
          # Note: verter_compiler dry-run is skipped here because verter_span may not
          # yet exist on crates.io. The publish-crates job handles sequencing.
          echo "All pre-publish checks passed"

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  # BLOCKING. This job gates publish-crates, publish-npm and publish-vscode:
  # a red suite stops the release rather than shipping past it.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Rust gate
        env:
          VERTER_REQUIRE_TSGO: "1"
        run: node scripts/gate.mjs
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - name: JS tests
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Build native binaries (matrix — for npm platform packages)
  # ---------------------------------------------------------------------------
  build-native:
    name: Build Native (${{ matrix.target }})
    needs: validate
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # build-native was the ONLY build matrix with no cargo cache at all —
      # build-tsc, build-lsp and build-mcp-server all had one — so every
      # release recompiled the full napi dependency graph from scratch on
      # all seven target legs.
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-native-${{ matrix.target }}
      - name: Setup Zig
        if: matrix.use-cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      # Prebuilt binary rather than `cargo install cargo-zigbuild --locked`,
      # which compiled it from source in EVERY cross matrix leg of every build
      # job (8 legs per release).
      - name: Install cargo-zigbuild
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build native
        working-directory: packages/native
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            npx napi build -o dist --platform --release --manifest-path ../../crates/verter_napi/Cargo.toml --target ${{ matrix.target }} --cross-compile
          else
            npx napi build -o dist --platform --release --manifest-path ../../crates/verter_napi/Cargo.toml --target ${{ matrix.target }}
          fi
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.target, 'aarch64-apple') && '11.0' || startsWith(matrix.target, 'x86_64-apple') && '10.12' || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: packages/native/dist/*.node
          if-no-files-found: error

      # The NAPI-generated JS loader (`dist/index.js`) is what the
      # committed root `index.js` wrapper requires at runtime; it owns
      # platform detection + the optional-dependency fallback. It is
      # identical across every target (same exported idents + package
      # name), so upload it from ONE canonical native build. The
      # publish-npm job drops it into the main package's `dist/` before
      # packing — without any `.node`, which ships only in the
      # per-platform optional-dependency packages.
      - name: Upload generated napi loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v6
        with:
          name: native-loader
          path: packages/native/dist/index.js
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build verter-tsc binary (matrix — for npm platform packages)
  # ---------------------------------------------------------------------------
  build-tsc:
    name: Build TSC (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            npm-pkg: linux-x64-gnu
            binary: verter-tsc
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            npm-pkg: linux-x64-musl
            binary: verter-tsc
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            npm-pkg: linux-arm64-gnu
            binary: verter-tsc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            npm-pkg: linux-arm64-musl
            binary: verter-tsc
          - target: x86_64-apple-darwin
            os: macos-15-intel
            npm-pkg: darwin-x64
            binary: verter-tsc
          - target: aarch64-apple-darwin
            os: macos-15
            npm-pkg: darwin-arm64
            binary: verter-tsc
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-pkg: win32-x64-msvc
            binary: verter-tsc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-tsc-${{ matrix.target }}
      - name: Setup Zig
        if: matrix.use-cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      # Prebuilt binary rather than `cargo install cargo-zigbuild --locked`,
      # which compiled it from source in EVERY cross matrix leg of every build
      # job (8 legs per release).
      - name: Install cargo-zigbuild
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build verter-tsc binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cargo zigbuild --release --package verter_tsc --target ${{ matrix.target }}
          else
            cargo build --release --package verter_tsc --target ${{ matrix.target }}
          fi
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: tsc-${{ matrix.npm-pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build LSP binary (matrix — for VS Code extension bundling)
  # ---------------------------------------------------------------------------
  build-lsp:
    name: Build LSP (${{ matrix.target }})
    needs: validate
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            vsce-target: linux-x64
            binary: verter-lsp
            shim-binary: verter-relay-shim
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            vsce-target: linux-arm64
            binary: verter-lsp
            shim-binary: verter-relay-shim
          - target: x86_64-apple-darwin
            os: macos-15-intel
            vsce-target: darwin-x64
            binary: verter-lsp
            shim-binary: verter-relay-shim
          - target: aarch64-apple-darwin
            os: macos-15
            vsce-target: darwin-arm64
            binary: verter-lsp
            shim-binary: verter-relay-shim
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            vsce-target: win32-x64
            binary: verter-lsp.exe
            shim-binary: verter-relay-shim.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-lsp-${{ matrix.target }}
      - name: Setup Zig
        if: matrix.use-cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      # Prebuilt binary rather than `cargo install cargo-zigbuild --locked`,
      # which compiled it from source in EVERY cross matrix leg of every build
      # job (8 legs per release).
      - name: Install cargo-zigbuild
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build editor binaries
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cargo zigbuild --release --package verter_lsp --package verter_relay_shim --target ${{ matrix.target }}
          else
            cargo build --release --package verter_lsp --package verter_relay_shim --target ${{ matrix.target }}
          fi
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: lsp-${{ matrix.vsce-target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            target/${{ matrix.target }}/release/${{ matrix.shim-binary }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build verter-mcp-server (matrix — standalone MCP HTTP/stdio binary)
  #
  # `verter_mcp` ships independently of `verter_lsp`: the LSP binary no
  # longer embeds the MCP server (Tier 3 §5.1 Step 3.1 retired the
  # embedding point + Cargo dep). Consumers that previously routed MCP
  # via `verter-lsp --mcp-port=...` spawn `verter-mcp-server` in its
  # own OS process. This job mirrors `build-lsp`'s platform matrix so
  # the standalone binary ships per-platform alongside the LSP.
  # ---------------------------------------------------------------------------
  build-mcp-server:
    name: Build MCP Server (${{ matrix.target }})
    needs: validate
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset-target: linux-x64
            binary: verter-mcp-server
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            asset-target: linux-arm64
            binary: verter-mcp-server
          - target: x86_64-apple-darwin
            os: macos-15-intel
            asset-target: darwin-x64
            binary: verter-mcp-server
          - target: aarch64-apple-darwin
            os: macos-15
            asset-target: darwin-arm64
            binary: verter-mcp-server
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset-target: win32-x64
            binary: verter-mcp-server.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-mcp-server-${{ matrix.target }}
      - name: Setup Zig
        if: matrix.use-cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      # Prebuilt binary rather than `cargo install cargo-zigbuild --locked`,
      # which compiled it from source in EVERY cross matrix leg of every build
      # job (8 legs per release).
      - name: Install cargo-zigbuild
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build verter-mcp-server binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cargo zigbuild --release --package verter_mcp_server --target ${{ matrix.target }}
          else
            cargo build --release --package verter_mcp_server --target ${{ matrix.target }}
          fi
        shell: bash
      - uses: actions/upload-artifact@v6
        with:
          name: mcp-server-${{ matrix.asset-target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build WASM
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build WASM
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm
      # Prebuilt binary. The previous guarded `cargo install` compiled
      # wasm-bindgen-cli from source on any runner where the version probe
      # missed, which is every cold cache.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Smoke test WASM
        run: node -e "const fs = require('fs'); const wasm = fs.readFileSync('packages/wasm/wasm/verter_wasm_bg.wasm'); console.log('WASM size:', wasm.length, 'bytes'); if (wasm.length < 1000) throw new Error('WASM too small');"
      - uses: actions/upload-artifact@v6
        with:
          name: wasm
          path: |
            packages/wasm/wasm/
            packages/wasm/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Editor-client integration — FULL matrix
  #
  # ci.yml runs a single fast Linux leg of each of these on every PR. The
  # release runs the full cross-OS matrix, which is where the Cross-Platform
  # Portability CRITICAL rule is actually discharged for the editor clients:
  # the Lapce/Zed volt builds, the Helix config contract, and the Neovim Lua
  # path-handling layer are all proven on macOS and Windows here.
  #
  # The three `build-editor-lsp` legs produce the ONLY release builds of
  # verter-lsp used by this section; every editor leg below downloads the
  # binary for its OS rather than rebuilding it (the retired standalone
  # workflows rebuilt it twelve times, uncached).
  # ---------------------------------------------------------------------------
  build-editor-lsp:
    name: Build editor LSP (${{ matrix.slug }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
            binary: verter-lsp
          - os: macos-latest
            slug: macos
            binary: verter-lsp
          - os: windows-latest
            slug: windows
            binary: verter-lsp.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-editor-lsp-${{ matrix.slug }}
      - name: Build verter-lsp (release)
        run: cargo build -p verter_lsp --release
      - uses: actions/upload-artifact@v6
        with:
          name: editor-lsp-${{ matrix.slug }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  editor-helix:
    name: Editor matrix — Helix (${{ matrix.os }})
    needs: [validate, build-editor-lsp]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-editor-helix-${{ matrix.slug }}

      # Cross-platform portability: the contract resolves the snippet path and
      # parses it on all three host OSes. `shell: bash` keeps one script under
      # Git-bash on the Windows runner.
      - name: Run the Helix config-contract test
        shell: bash
        run: cargo test -p verter-editor-client --test main cases::helix_config_contract

      - name: Run the whole verter-editor-client suite
        shell: bash
        run: cargo test -p verter-editor-client

      - name: Test the exported rootless Helix shipping plan
        shell: bash
        run: cargo test -p verter-editor-client --example helix_plan

      - name: Clippy
        shell: bash
        run: cargo clippy -p verter-editor-client -- -D warnings

      - name: Rustfmt check
        shell: bash
        run: cargo fmt -p verter-editor-client --check

      # The real-client lane is Linux-only: the pinned Helix release asset is a
      # linux-x86_64 archive.
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download shared verter-lsp
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp-${{ matrix.slug }}
          path: target/release

      - name: Install pinned Helix with checksum verification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/helix-25.07.1-x86_64-linux.tar.xz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz
          echo "3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b  $archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
          echo "HELIX_RUNTIME=${RUNNER_TEMP}/helix-25.07.1-x86_64-linux/runtime" >> "$GITHUB_ENV"

      - name: Provision the shipped Helix configuration and server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/helix-config/helix"
          mkdir -p "$config" "${RUNNER_TEMP}/verter-bin"
          cp editors/helix/languages.toml "$config/languages.toml"
          cp target/release/verter-lsp "${RUNNER_TEMP}/verter-bin/verter-lsp"
          chmod +x "${RUNNER_TEMP}/verter-bin/verter-lsp"
          echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/helix-config" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/verter-bin" >> "$GITHUB_PATH"

      - name: Prove Vue and Svelte select only the executable Verter server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          hx --version | grep -F "helix 25.07.1"
          for language in vue svelte; do
            output=$(NO_COLOR=1 hx --health "$language" 2>&1)
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -F "verter-lsp"
            if printf '%s\n' "$output" | grep -Eiq 'vue-language-server|svelteserver|svelte-language-server'; then
              echo "::error::$language has a second framework language server configured"
              exit 1
            fi
          done

      - name: Install neutral-client fixture dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the parsed Helix shipping plan over stdio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/editor-contracts/plan-contract.test.mjs
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${RUNNER_TEMP}/verter-bin/verter-lsp"
          plan="${RUNNER_TEMP}/helix-launch-plan.json"
          cargo run --quiet -p verter-editor-client --example helix_plan -- "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"

  editor-lapce:
    name: Editor matrix — Lapce volt (${{ matrix.os }})
    needs: [validate, build-editor-lsp]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-editor-lapce-${{ matrix.slug }}

      # extensions/lapce is a SEPARATE cargo manifest, not a workspace member,
      # so none of this is covered by the workspace `test` job above. The
      # portability rule mandates the volt build and host launch surface pass
      # on macOS, Windows AND Linux, so these run on all three.
      - name: Build the volt (wasm32-wasip1)
        shell: bash
        run: cargo build --manifest-path extensions/lapce/Cargo.toml --target wasm32-wasip1 --release

      - name: Run host-target unit tests
        shell: bash
        run: cargo test --manifest-path extensions/lapce/Cargo.toml

      - name: Clippy (wasm32-wasip1)
        shell: bash
        run: cargo clippy --manifest-path extensions/lapce/Cargo.toml --target wasm32-wasip1 -- -D warnings

      - name: Rustfmt check
        shell: bash
        working-directory: extensions/lapce
        run: cargo fmt --check

      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download shared verter-lsp
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp-${{ matrix.slug }}
          path: target/release
      - name: Make verter-lsp executable
        if: runner.os == 'Linux'
        run: chmod +x target/release/verter-lsp

      - name: Install JavaScript test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the exact Lapce launch plan over stdio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/editor-contracts/plan-contract.test.mjs
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${GITHUB_WORKSPACE}/target/release/verter-lsp"
          plan="${RUNNER_TEMP}/lapce-launch-plan.json"
          cargo run --quiet --manifest-path extensions/lapce/Cargo.toml --example contract_plan -- "$root" "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"

  editor-zed:
    name: Editor matrix — Zed extension (${{ matrix.os }})
    needs: [validate, build-editor-lsp]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-editor-zed-${{ matrix.slug }}

      # extensions/zed is a SEPARATE cargo manifest, not a workspace member. A
      # wasip1/wasip2 mismatch yields a `__wasi_init_tp` load error in Zed,
      # which only this build catches.
      - name: Build the extension (wasm32-wasip2)
        shell: bash
        run: cargo build --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 --release

      - name: Run host-target unit tests
        shell: bash
        run: cargo test --manifest-path extensions/zed/Cargo.toml

      - name: Clippy (wasm32-wasip2)
        shell: bash
        run: cargo clippy --manifest-path extensions/zed/Cargo.toml --target wasm32-wasip2 -- -D warnings

      - name: Rustfmt check
        shell: bash
        working-directory: extensions/zed
        run: cargo fmt --check

      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v5
        if: runner.os == 'Linux'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Download shared verter-lsp
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp-${{ matrix.slug }}
          path: target/release
      - name: Make verter-lsp executable
        if: runner.os == 'Linux'
        run: chmod +x target/release/verter-lsp

      - name: Install JavaScript test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the exact Zed launch plan over stdio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/editor-contracts/plan-contract.test.mjs
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${GITHUB_WORKSPACE}/target/release/verter-lsp"
          plan="${RUNNER_TEMP}/zed-launch-plan.json"
          cargo run --quiet --manifest-path extensions/zed/Cargo.toml --example contract_plan -- "$root" "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"

  editor-neovim:
    name: Editor matrix — nvim ${{ matrix.neovim }} (${{ matrix.os }})
    needs: [validate, build-editor-lsp]
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform portability: the Lua config layer must build path
        # strings and resolve the binary on all three host OSes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # v0.11.0 is the supported floor (`vim.lsp.config` / `vim.lsp.enable`
        # first landed in 0.11), v0.12.3 is current stable, nightly catches
        # upstream LSP-client changes before they ship.
        neovim: [v0.11.0, v0.12.3, nightly]
        include:
          - os: ubuntu-latest
            slug: linux
            binary: verter-lsp
          - os: macos-latest
            slug: macos
            binary: verter-lsp
          - os: windows-latest
            slug: windows
            binary: verter-lsp.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Download shared verter-lsp
        uses: actions/download-artifact@v7
        with:
          name: editor-lsp-${{ matrix.slug }}
          path: target/release

      - name: Install the pinned real-client fixture toolchain
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: editors/nvim/tests/fixtures/real-client/package-lock.json

      - name: Provision tsgo and framework types
        working-directory: editors/nvim/tests/fixtures/real-client
        run: npm ci --ignore-scripts

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Checkout plenary.nvim
        uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
          path: .ci/plenary.nvim

      - name: Run plenary busted suite
        shell: bash
        env:
          PLENARY_PATH: ${{ github.workspace }}/.ci/plenary.nvim
        run: |
          set -euo pipefail
          # `smoke_spec.lua` drives a REAL stdio attach and fails closed if
          # $VERTER_LSP_BIN is missing.
          VERTER_LSP_BIN="${GITHUB_WORKSPACE}/target/release/${{ matrix.binary }}"
          chmod +x "${VERTER_LSP_BIN}" 2>/dev/null || true
          if [ ! -x "${VERTER_LSP_BIN}" ]; then
            echo "::error::shared verter-lsp not found/executable at ${VERTER_LSP_BIN}"
            exit 1
          fi
          export VERTER_LSP_BIN
          VERTER_TSGO_BIN=$(node --input-type=module -e \
            "import getExePath from './editors/nvim/tests/fixtures/real-client/node_modules/typescript/lib/getExePath.js'; console.log(getExePath().replaceAll('\\\\', '/'))")
          if [ ! -x "${VERTER_TSGO_BIN}" ]; then
            echo "::error::fixture TypeScript 7 engine not found/executable at ${VERTER_TSGO_BIN}"
            exit 1
          fi
          export VERTER_TSGO_BIN
          echo "using VERTER_LSP_BIN=${VERTER_LSP_BIN}"
          echo "using VERTER_TSGO_BIN=${VERTER_TSGO_BIN}"
          # Load minimal_init.lua into the PARENT nvim with `-u` so the
          # `PlenaryBustedDirectory` command exists (it is defined by plenary,
          # which minimal_init prepends to the rtp). Without `-u` the parent
          # nvim has no plenary and the command is a no-op, so the suite would
          # silently fail to run.
          #
          # Capture output so we can fail the job even on plenary builds that do
          # not propagate a nonzero exit code on test failure.
          out=$(nvim --headless --noplugin \
            -u editors/nvim/tests/minimal_init.lua \
            -c "PlenaryBustedDirectory editors/nvim/tests/ {minimal_init='editors/nvim/tests/minimal_init.lua'}" \
            -c "qa!" 2>&1) || rc=$?
          rc=${rc:-0}
          echo "$out"
          # Whitespace-tolerant failure tokens. plenary prints `Failed : <n>`
          # and `Errors : <n>` (ONE space, variable padding), so a two-space
          # pattern never matches and the gate could go green on a real failure.
          if printf '%s\n' "$out" | grep -Eq 'Tests Failed|Schedule Error|Failed[[:space:]]*:[[:space:]]*[1-9]|Errors?[[:space:]]*:[[:space:]]*[1-9]'; then
            echo "::error::Neovim plenary suite reported failures"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::Neovim exited non-zero ($rc)"
            exit "$rc"
          fi
          if ! printf '%s\n' "$out" | grep -Eq 'Success(es)?[[:space:]]*:[[:space:]]*[1-9]|[1-9][0-9]*[[:space:]]+success'; then
            echo "::error::Neovim test output did not prove that any assertion-bearing test ran"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Publish Rust crates
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish Crates
    needs: [validate, test, editor-helix, editor-lapce, editor-zed, editor-neovim]
    if: needs.validate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: crates-io
      url: https://crates.io/crates/verter_compiler
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish verter_span
        run: |
          LOCAL=$(grep -oP 'version = "\K[^"]+' Cargo.toml | head -1)
          echo "Publishing verter_span $LOCAL..."
          OUTPUT=$(cargo publish -p verter_span --allow-dirty 2>&1) && RC=0 || RC=$?
          echo "$OUTPUT"
          if [ $RC -eq 0 ]; then
            echo "Waiting for crates.io index propagation..."
            sleep 30
          elif echo "$OUTPUT" | grep -q "already exists"; then
            echo "verter_span $LOCAL already on crates.io, skipping"
          else
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish verter_compiler
        run: |
          LOCAL=$(grep -oP 'version = "\K[^"]+' Cargo.toml | head -1)
          echo "Publishing verter_compiler $LOCAL..."
          OUTPUT=$(cargo publish -p verter_compiler --allow-dirty 2>&1) && RC=0 || RC=$?
          echo "$OUTPUT"
          if [ $RC -eq 0 ]; then
            echo "verter_compiler published successfully"
          elif echo "$OUTPUT" | grep -q "already exists"; then
            echo "verter_compiler $LOCAL already on crates.io, skipping"
          else
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish npm packages
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish npm
    needs: [validate, test, editor-helix, editor-lapce, editor-zed, editor-neovim, build-native, build-tsc, build-wasm]
    if: needs.validate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: npm
      url: https://www.npmjs.com/package/@verter/native
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Download all native artifacts into platform package dirs
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: /tmp/native-artifacts

      - name: Move native artifacts to platform packages
        run: |
          for dir in /tmp/native-artifacts/native-*/; do
            for node_file in "$dir"*.node; do
              [ -f "$node_file" ] || continue
              filename=$(basename "$node_file")
              # Extract platform from filename: verter-native.{platform}.node
              platform=$(echo "$filename" | sed 's/verter-native\.\(.*\)\.node/\1/')
              target_dir="packages/native/npm/${platform}"
              if [ -d "$target_dir" ]; then
                cp "$node_file" "$target_dir/"
                echo "Copied $filename -> $target_dir/"
              else
                echo "Warning: no platform dir for $platform"
              fi
            done
          done

      # Download all tsc artifacts into platform package dirs
      - uses: actions/download-artifact@v7
        with:
          pattern: tsc-*
          path: /tmp/tsc-artifacts

      - name: Move tsc artifacts to platform packages
        run: |
          for dir in /tmp/tsc-artifacts/tsc-*/; do
            platform=$(basename "$dir")
            platform=${platform#tsc-}  # strip "tsc-" prefix
            target_dir="packages/verter-tsc/npm/${platform}"
            if [ -d "$target_dir" ]; then
              cp "$dir"verter-tsc* "$target_dir/"
              chmod +x "$target_dir"/verter-tsc* 2>/dev/null || true
              echo "Copied verter-tsc binary -> $target_dir/"
            else
              echo "Warning: no tsc platform dir for $platform"
            fi
          done

      # Download WASM artifact
      - uses: actions/download-artifact@v7
        with:
          name: wasm
          path: packages/wasm/

      # Build TS packages
      - name: Build TS packages
        run: pnpm run build:ts

      # Prepare the @verter/native MAIN package for publishing.
      #
      # The root `index.js` is a thin wrapper that `require('./dist/index.js')`
      # — the NAPI-generated loader. That loader (built once on the canonical
      # native runner) owns platform detection + the optional-dependency
      # fallback, so the main package must ship `dist/index.js` (the loader)
      # and `dist/*.d.ts` (the types) but NO `.node`. The real binaries went
      # to `packages/native/npm/<triple>/` in the "Move native artifacts"
      # step above; the main package's `dist/` deliberately stays binary-free.
      - uses: actions/download-artifact@v7
        with:
          name: native-loader
          path: packages/native/dist
      - name: Generate @verter/native dist types
        run: pnpm --filter @verter/native run build:types
      # Gate publish on the packaging guards ONLY (hermetic — they build
      # their own fake install layouts / use `npm pack --dry-run`, so they
      # do NOT require a built `.node` in the main package's binary-free
      # `dist/`). The Rust-backed suite is covered by CI, not the publish
      # gate.
      - name: Guard @verter/native pack shape + loader fallback
        run: >-
          pnpm --filter @verter/native exec vitest run
          loader-fallback.spec.ts pack-shape.spec.ts clean-dist.spec.ts

      # Publish all packages that need publishing
      - name: Publish packages
        run: |
          DIST_TAG="${{ needs.validate.outputs.dist-tag }}"
          PUBLISH_ARGS="--access public --no-git-checks --provenance"

          if [ "$DIST_TAG" != "latest" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS --tag $DIST_TAG"
          fi

          TOTAL=0
          PUBLISHED=0
          SKIPPED=0
          FAILED=0
          HAD_FAILURE=false

          # Publish a single package with proper error handling.
          # Only E403 "already published" is tolerated — all other errors are fatal.
          # TLOG_CREATE_ENTRY_ERROR = provenance tlog conflict from a previous attempt;
          # retry without --provenance.
          publish_pkg() {
            local pkg_name="$1"
            TOTAL=$((TOTAL + 1))

            echo ""
            echo "--- Publishing $pkg_name ---"

            local output exit_code
            output=$(pnpm publish $PUBLISH_ARGS 2>&1) && exit_code=0 || exit_code=$?

            if [ $exit_code -eq 0 ]; then
              echo "  OK: $pkg_name published"
              PUBLISHED=$((PUBLISHED + 1))
              return 0
            fi

            # E403 / EPUBLISHCONFLICT = version already exists (safe to skip)
            if echo "$output" | grep -qiE "(E403|cannot publish over|previously published|EPUBLISHCONFLICT)"; then
              echo "  SKIP: $pkg_name already published"
              SKIPPED=$((SKIPPED + 1))
              return 0
            fi

            # TLOG conflict = provenance was signed in a previous attempt but publish
            # failed. Retry without --provenance.
            if echo "$output" | grep -q "TLOG_CREATE_ENTRY_ERROR"; then
              echo "  RETRY: $pkg_name (tlog conflict, retrying without --provenance)"
              local retry_args="${PUBLISH_ARGS//--provenance/}"
              output=$(pnpm publish $retry_args 2>&1) && exit_code=0 || exit_code=$?
              if [ $exit_code -eq 0 ]; then
                echo "  OK: $pkg_name published (without provenance)"
                PUBLISHED=$((PUBLISHED + 1))
                return 0
              fi
              if echo "$output" | grep -qiE "(E403|cannot publish over|previously published|EPUBLISHCONFLICT)"; then
                echo "  SKIP: $pkg_name already published"
                SKIPPED=$((SKIPPED + 1))
                return 0
              fi
            fi

            # Any other error is fatal
            echo "  FAIL: $pkg_name (exit code $exit_code)"
            echo "$output"
            FAILED=$((FAILED + 1))
            return 1
          }

          # Publish native platform packages first
          for platform_dir in packages/native/npm/*/; do
            if [ -f "$platform_dir/package.json" ]; then
              pkg_name=$(node -p "require('./$platform_dir/package.json').name")
              cd "$platform_dir"
              publish_pkg "$pkg_name" || HAD_FAILURE=true
              cd "$GITHUB_WORKSPACE"
            fi
          done

          # Publish tsc platform packages
          for platform_dir in packages/verter-tsc/npm/*/; do
            if [ -f "$platform_dir/package.json" ]; then
              pkg_name=$(node -p "require('./$platform_dir/package.json').name")
              cd "$platform_dir"
              publish_pkg "$pkg_name" || HAD_FAILURE=true
              cd "$GITHUB_WORKSPACE"
            fi
          done

          # Publish in topological order
          ORDER=$(node scripts/check-versions.mjs --json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            console.log(data.order.join('\n'));
          ")

          for pkg_dir in $ORDER; do
            pkg_name=$(node -p "require('./packages/$pkg_dir/package.json').name")
            cd "packages/$pkg_dir"
            publish_pkg "$pkg_name" || HAD_FAILURE=true
            cd "$GITHUB_WORKSPACE"
          done

          # Summary
          echo ""
          echo "=========================================="
          echo "  Publish Summary"
          echo "=========================================="
          echo "  Total:     $TOTAL"
          echo "  Published: $PUBLISHED"
          echo "  Skipped:   $SKIPPED (already published)"
          echo "  Failed:    $FAILED"
          echo "=========================================="

          if [ "$HAD_FAILURE" = "true" ]; then
            echo "::error::$FAILED package(s) failed to publish"
            exit 1
          fi

          if [ "$PUBLISHED" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "::error::No packages were published or already existed"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify critical packages on registry
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Verifying published packages (version: $LOCAL_VERSION)..."
          echo "Waiting 15s for registry propagation..."
          sleep 15

          CRITICAL_PACKAGES=(
            "@verter/native"
            "@verter/types"
            "@verter/unplugin"
          )

          MISSING=0
          for pkg in "${CRITICAL_PACKAGES[@]}"; do
            FOUND=$(npm view "$pkg@$LOCAL_VERSION" version 2>/dev/null || echo "")
            if [ "$FOUND" = "$LOCAL_VERSION" ]; then
              echo "  OK: $pkg@$LOCAL_VERSION"
            else
              echo "  MISSING: $pkg@$LOCAL_VERSION (got: ${FOUND:-nothing})"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "::error::$MISSING critical package(s) not found on registry after publishing"
            exit 1
          fi

          echo "All critical packages verified on registry"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish VS Code Extension (platform-specific VSIX)
  # ---------------------------------------------------------------------------
  publish-vscode:
    name: Publish VS Code Extension
    needs: [validate, test, build-lsp, build-native, publish-npm]
    if: needs.validate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=verter.verter-vscode
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build TS (extension + typescript-plugin dependencies)
      - name: Build TS packages
        run: pnpm run build:ts

      # Download all LSP binaries
      - uses: actions/download-artifact@v7
        with:
          pattern: lsp-*
          path: /tmp/lsp-artifacts

      # Download all native binaries
      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: /tmp/native-artifacts

      # Package and publish per platform
      - name: Package and publish VSIX
        run: |
          IS_PRE="${{ needs.validate.outputs.is-prerelease }}"

          PRE_RELEASE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi

          # Map: vsce-target → rust-target → native .node filename → lsp binary name
          declare -A RUST_TARGET=(
            [linux-x64]="x86_64-unknown-linux-gnu"
            [linux-arm64]="aarch64-unknown-linux-gnu"
            [darwin-x64]="x86_64-apple-darwin"
            [darwin-arm64]="aarch64-apple-darwin"
            [win32-x64]="x86_64-pc-windows-msvc"
          )
          declare -A NATIVE_FILE=(
            [linux-x64]="verter-native.linux-x64-gnu.node"
            [linux-arm64]="verter-native.linux-arm64-gnu.node"
            [darwin-x64]="verter-native.darwin-x64.node"
            [darwin-arm64]="verter-native.darwin-arm64.node"
            [win32-x64]="verter-native.win32-x64-msvc.node"
          )

          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            echo ""
            echo "=========================================="
            echo "  Packaging $platform"
            echo "=========================================="

            rust_target="${RUST_TARGET[$platform]}"
            native_file="${NATIVE_FILE[$platform]}"

            # --- LSP binary ---
            mkdir -p packages/vue-vscode/bin
            if [ "$platform" = "win32-x64" ]; then
              LSP_BIN="verter-lsp.exe"
              SHIM_BIN="verter-relay-shim.exe"
            else
              LSP_BIN="verter-lsp"
              SHIM_BIN="verter-relay-shim"
            fi
            cp "/tmp/lsp-artifacts/lsp-${platform}/${LSP_BIN}" "packages/vue-vscode/bin/${LSP_BIN}"
            chmod +x "packages/vue-vscode/bin/${LSP_BIN}" 2>/dev/null || true

            # package.mjs validates the target-specific relay executable's
            # format, architecture, and embedded Verter identity before it
            # mutates the extension dependency tree.
            SHIM_SOURCE="/tmp/lsp-artifacts/lsp-${platform}/${SHIM_BIN}"
            test -f "$SHIM_SOURCE"
            export VERTER_RELAY_SHIM_BINARY="$(realpath "$SHIM_SOURCE")"

            # --- Native binding ---
            # Place the platform's .node file where the esbuild prepareDeps() will find it
            mkdir -p packages/native/dist
            rm -f packages/native/dist/verter-native.*.node
            cp "/tmp/native-artifacts/native-${rust_target}/${native_file}" "packages/native/dist/${native_file}"

            # --- Clean previous build output ---
            rm -rf packages/vue-vscode/dist/node_modules
            # Only remove packages that package.mjs will recreate as real copies.
            # Keep @verter/language-shared (pnpm symlink) — esbuild bundles it.
            rm -rf packages/vue-vscode/node_modules/@verter/typescript-plugin
            rm -rf packages/vue-vscode/node_modules/@verter/native

            # --- Build & package (package.mjs handles dep copying + version patching + vsce) ---
            cd packages/vue-vscode
            node package.mjs --target "$platform" $PRE_RELEASE_FLAG
            cd "$GITHUB_WORKSPACE"
            unset VERTER_RELAY_SHIM_BINARY

            # --- Move VSIX ---
            VSIX_FILE=$(ls packages/vue-vscode/*.vsix | head -1)
            VSIX_NAME="verter-vscode-${platform}.vsix"
            mv "$VSIX_FILE" "/tmp/${VSIX_NAME}"

            echo "  VSIX: /tmp/${VSIX_NAME} ($(du -h "/tmp/${VSIX_NAME}" | cut -f1))"

            # --- Publish to VS Code Marketplace ---
            pnpm exec vsce publish --packagePath "/tmp/${VSIX_NAME}" $PRE_RELEASE_FLAG

            # --- Clean up for next platform ---
            rm -rf packages/vue-vscode/bin
          done

          echo ""
          echo "All platform VSIXes:"
          ls -lh /tmp/verter-vscode-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Upload all VSIX files for GitHub Release
      - uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: /tmp/verter-vscode-*.vsix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs:
      [
        validate,
        build-native,
        build-wasm,
        build-mcp-server,
        publish-npm,
        publish-vscode,
      ]
    if: needs.validate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-releases
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary rather than a from-source `cargo install`, which added
      # several minutes of compile to every release for a changelog generator.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --latest --strip header > /tmp/RELEASE_NOTES.md

      - name: Update CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # CHANGELOG.md was generated above from the TAG checkout, which is a
          # DETACHED HEAD at the tagged commit. Pushing that ref straight at
          # main (`git push origin HEAD:main`) is a non-fast-forward the moment
          # main has advanced past the tag — and it fails HERE, after npm,
          # crates.io and the Marketplace have already published, leaving a
          # shipped release whose changelog never landed. Replay the generated
          # file onto live main instead of pushing the tag's history at it.
          cp CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.release.md"
          git fetch origin main
          git checkout -B changelog-main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.release.md" CHANGELOG.md

          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md on main is already current"
            exit 0
          fi

          git commit -m "release: ${GITHUB_REF_NAME}"
          git push origin HEAD:main || {
            echo "push raced with a concurrent commit to main; retrying on refreshed main"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }

      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: /tmp/release-assets/native

      - uses: actions/download-artifact@v7
        with:
          name: wasm
          path: /tmp/release-assets/wasm

      - uses: actions/download-artifact@v7
        with:
          name: vsix
          path: /tmp/release-assets/vsix

      # `verter-mcp-server` ships as a separate per-platform binary so
      # downstream consumers (IDE integrations, container images,
      # automation) can pick it up without pulling the LSP binary or
      # vice versa. The decoupling is enforced at the source level by
      # the `no_cross_product_binary_imports` architecture guard.
      - uses: actions/download-artifact@v7
        with:
          pattern: mcp-server-*
          path: /tmp/release-assets/mcp-server

      - name: Stage and rename verter-mcp-server binaries
        run: |
          mkdir -p /tmp/release-assets/staged
          for dir in /tmp/release-assets/mcp-server/mcp-server-*; do
            [ -d "$dir" ] || continue
            target=$(basename "$dir" | sed 's/^mcp-server-//')
            if [ "$target" = "win32-x64" ]; then
              src="$dir/verter-mcp-server.exe"
              dest="/tmp/release-assets/staged/verter-mcp-server-${target}.exe"
            else
              src="$dir/verter-mcp-server"
              dest="/tmp/release-assets/staged/verter-mcp-server-${target}"
            fi
            cp "$src" "$dest"
            chmod +x "$dest" 2>/dev/null || true
          done
          ls -la /tmp/release-assets/staged/

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_PRE="${{ needs.validate.outputs.is-prerelease }}"

          PRERELEASE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Collect all .node, .wasm, .js, .vsix files PLUS the
          # platform-renamed verter-mcp-server binaries staged above.
          ASSETS=""
          for f in $(find /tmp/release-assets -name '*.node' -o -name '*.wasm' -o -name '*.js' -o -name '*.vsix' | head -50); do
            ASSETS="$ASSETS $f"
          done
          for f in /tmp/release-assets/staged/verter-mcp-server-*; do
            [ -f "$f" ] || continue
            ASSETS="$ASSETS $f"
          done

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/RELEASE_NOTES.md \
            $PRERELEASE_FLAG \
            $ASSETS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Integration Tests (after successful release)
  # ---------------------------------------------------------------------------
  integration-test:
    name: Run Integration Tests
    needs: [validate, publish-npm]
    # Consumes the PUBLISHED npm packages, so it cannot run in a rehearsal.
    if: needs.validate.outputs.dry-run != 'true'
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/integration-test.yml
    with:
      source: npm
      dist-tag: ${{ needs.validate.outputs.dist-tag }}
