name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  # ---------------------------------------------------------------------------
  # Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      is-prerelease: ${{ steps.check.outputs.is-prerelease }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "dist-tag=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-beta"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "dist-tag=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "dist-tag=rc" >> $GITHUB_OUTPUT
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "dist-tag=latest" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Build native binaries (matrix — for npm platform packages)
  # ---------------------------------------------------------------------------
  build-native:
    name: Build Native (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Zig
        if: matrix.use-cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: matrix.use-cross
        run: cargo install cargo-zigbuild --locked
      - name: Build native
        working-directory: packages/native
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            npx napi build -o dist --platform --release --manifest-path ../../crates/verter_napi/Cargo.toml --target ${{ matrix.target }} --cross-compile
          else
            npx napi build -o dist --platform --release --manifest-path ../../crates/verter_napi/Cargo.toml --target ${{ matrix.target }}
          fi
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.target, 'aarch64-apple') && '11.0' || startsWith(matrix.target, 'x86_64-apple') && '10.12' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: packages/native/dist/*.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build LSP binary (matrix — for VS Code extension bundling)
  # ---------------------------------------------------------------------------
  build-lsp:
    name: Build LSP (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            vsce-target: linux-x64
            binary: verter-lsp
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            vsce-target: linux-arm64
            binary: verter-lsp
          - target: x86_64-apple-darwin
            os: macos-15-intel
            vsce-target: darwin-x64
            binary: verter-lsp
          - target: aarch64-apple-darwin
            os: macos-15
            vsce-target: darwin-arm64
            binary: verter-lsp
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            vsce-target: win32-x64
            binary: verter-lsp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lsp-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lsp-${{ matrix.target }}-
      - name: Setup Zig
        if: matrix.use-cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: matrix.use-cross
        run: cargo install cargo-zigbuild --locked
      - name: Build LSP binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cargo zigbuild --release --package verter_lsp --target ${{ matrix.target }}
          else
            cargo build --release --package verter_lsp --target ${{ matrix.target }}
          fi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-${{ matrix.vsce-target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build WASM
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build WASM
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build WASM
        run: pnpm run build:wasm
      - name: Smoke test WASM
        run: node -e "const fs = require('fs'); const wasm = fs.readFileSync('packages/wasm/wasm/verter_wasm_bg.wasm'); console.log('WASM size:', wasm.length, 'bytes'); if (wasm.length < 1000) throw new Error('WASM too small');"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            packages/wasm/wasm/
            packages/wasm/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish Rust crates
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish Crates
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/verter_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish verter_core
        run: |
          # Check if this version is already published
          PUBLISHED=$(cargo search verter_core --limit 1 2>/dev/null | grep -oP 'verter_core = "\K[^"]+' || echo "")
          LOCAL=$(grep -oP 'version = "\K[^"]+' Cargo.toml | head -1)

          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "verter_core $LOCAL already published, skipping"
          else
            echo "Publishing verter_core $LOCAL (currently: ${PUBLISHED:-none})"
            cargo publish -p verter_core --allow-dirty
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish npm packages
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish npm
    needs: [validate, build-native, build-wasm]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@verter/core
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Download all native artifacts into platform package dirs
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: /tmp/native-artifacts

      - name: Move native artifacts to platform packages
        run: |
          for dir in /tmp/native-artifacts/native-*/; do
            for node_file in "$dir"*.node; do
              [ -f "$node_file" ] || continue
              filename=$(basename "$node_file")
              # Extract platform from filename: verter-native.{platform}.node
              platform=$(echo "$filename" | sed 's/verter-native\.\(.*\)\.node/\1/')
              target_dir="packages/native/npm/${platform}"
              if [ -d "$target_dir" ]; then
                cp "$node_file" "$target_dir/"
                echo "Copied $filename -> $target_dir/"
              else
                echo "Warning: no platform dir for $platform"
              fi
            done
          done

      # Download WASM artifact
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/wasm/

      # Build TS packages
      - name: Build TS packages
        run: pnpm run build:ts

      # Publish all packages that need publishing
      - name: Publish packages
        run: |
          DIST_TAG="${{ needs.validate.outputs.dist-tag }}"
          PUBLISH_ARGS="--access public --no-git-checks --provenance"

          if [ "$DIST_TAG" != "latest" ]; then
            PUBLISH_ARGS="$PUBLISH_ARGS --tag $DIST_TAG"
          fi

          # Publish platform packages first
          for platform_dir in packages/native/npm/*/; do
            if [ -f "$platform_dir/package.json" ]; then
              echo "Publishing $(basename $platform_dir)..."
              cd "$platform_dir"
              pnpm publish $PUBLISH_ARGS || echo "Already published or failed: $(basename $platform_dir)"
              cd "$GITHUB_WORKSPACE"
            fi
          done

          # Publish in topological order
          ORDER=$(node scripts/check-versions.mjs --json | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            console.log(data.order.join('\n'));
          ")

          for pkg_dir in $ORDER; do
            echo "Publishing $pkg_dir..."
            cd "packages/$pkg_dir"
            pnpm publish $PUBLISH_ARGS || echo "Already published or failed: $pkg_dir"
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish VS Code Extension (platform-specific VSIX)
  # ---------------------------------------------------------------------------
  publish-vscode:
    name: Publish VS Code Extension
    needs: [validate, build-lsp, build-native, publish-npm]
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=pikax.verter-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build TS (extension + typescript-plugin dependencies)
      - name: Build TS packages
        run: pnpm run build:ts

      # Download all LSP binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: lsp-*
          path: /tmp/lsp-artifacts

      # Download all native binaries
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: /tmp/native-artifacts

      # Package and publish per platform
      - name: Package and publish VSIX
        run: |
          IS_PRE="${{ needs.validate.outputs.is-prerelease }}"

          PRE_RELEASE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi

          # Map: vsce-target → rust-target → native .node filename → lsp binary name
          declare -A RUST_TARGET=(
            [linux-x64]="x86_64-unknown-linux-gnu"
            [linux-arm64]="aarch64-unknown-linux-gnu"
            [darwin-x64]="x86_64-apple-darwin"
            [darwin-arm64]="aarch64-apple-darwin"
            [win32-x64]="x86_64-pc-windows-msvc"
          )
          declare -A NATIVE_FILE=(
            [linux-x64]="verter-native.linux-x64-gnu.node"
            [linux-arm64]="verter-native.linux-arm64-gnu.node"
            [darwin-x64]="verter-native.darwin-x64.node"
            [darwin-arm64]="verter-native.darwin-arm64.node"
            [win32-x64]="verter-native.win32-x64-msvc.node"
          )

          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            echo ""
            echo "=========================================="
            echo "  Packaging $platform"
            echo "=========================================="

            rust_target="${RUST_TARGET[$platform]}"
            native_file="${NATIVE_FILE[$platform]}"

            # --- LSP binary ---
            mkdir -p packages/vue-vscode/bin
            if [ "$platform" = "win32-x64" ]; then
              LSP_BIN="verter-lsp.exe"
            else
              LSP_BIN="verter-lsp"
            fi
            cp "/tmp/lsp-artifacts/lsp-${platform}/${LSP_BIN}" "packages/vue-vscode/bin/${LSP_BIN}"
            chmod +x "packages/vue-vscode/bin/${LSP_BIN}" 2>/dev/null || true

            # --- Native binding ---
            # Place the platform's .node file where the esbuild prepareDeps() will find it
            mkdir -p packages/native/dist
            rm -f packages/native/dist/verter-native.*.node
            cp "/tmp/native-artifacts/native-${rust_target}/${native_file}" "packages/native/dist/${native_file}"

            # --- Clean previous build output ---
            rm -rf packages/vue-vscode/dist/node_modules
            rm -rf packages/vue-vscode/node_modules/@verter

            # --- Build & package (package.mjs handles dep copying + version patching + vsce) ---
            cd packages/vue-vscode
            node package.mjs --target "$platform" $PRE_RELEASE_FLAG
            cd "$GITHUB_WORKSPACE"

            # --- Move VSIX ---
            VSIX_FILE=$(ls packages/vue-vscode/*.vsix | head -1)
            VSIX_NAME="verter-vscode-${platform}.vsix"
            mv "$VSIX_FILE" "/tmp/${VSIX_NAME}"

            echo "  VSIX: /tmp/${VSIX_NAME} ($(du -h "/tmp/${VSIX_NAME}" | cut -f1))"

            # --- Publish to VS Code Marketplace ---
            npx @vscode/vsce publish --packagePath "/tmp/${VSIX_NAME}" $PRE_RELEASE_FLAG

            # --- Clean up for next platform ---
            rm -rf packages/vue-vscode/bin
          done

          echo ""
          echo "All platform VSIXes:"
          ls -lh /tmp/verter-vscode-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Upload all VSIX files for GitHub Release
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: /tmp/verter-vscode-*.vsix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [validate, build-native, build-wasm, publish-npm, publish-vscode]
    runs-on: ubuntu-latest
    environment:
      name: github-releases
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate changelog
        run: git-cliff --latest --strip header > /tmp/RELEASE_NOTES.md

      - name: Update CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "release: ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: /tmp/release-assets/native

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: /tmp/release-assets/wasm

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: /tmp/release-assets/vsix

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_PRE="${{ needs.validate.outputs.is-prerelease }}"

          PRERELEASE_FLAG=""
          if [ "$IS_PRE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Collect all .node, .wasm, .js, and .vsix files
          ASSETS=""
          for f in $(find /tmp/release-assets -name '*.node' -o -name '*.wasm' -o -name '*.js' -o -name '*.vsix' | head -50); do
            ASSETS="$ASSETS $f"
          done

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/RELEASE_NOTES.md \
            $PRERELEASE_FLAG \
            $ASSETS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Integration Tests (after successful release)
  # ---------------------------------------------------------------------------
  integration-test:
    name: Run Integration Tests
    needs: [validate, publish-npm]
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/integration-test.yml
    with:
      source: npm
      dist-tag: ${{ needs.validate.outputs.dist-tag }}
