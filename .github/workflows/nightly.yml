name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 6 AM UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Full compile contracts every night, independent of PR change detection.
  compiler-contracts:
    name: Compiler Contracts (${{ matrix.group }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        group: [core, compiler, session, session-observe]
    env:
      # Every group has a separate runner/cache, with one shared target for
      # its outer runners and nested trybuild builds. No concurrent writers.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/compiler-contracts
      CARGO_INCREMENTAL: "0"
      # Symbols are unnecessary for type/privacy contracts; retain debug assertions.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      # Shared across groups and nightly: identical compile units can hit.
      SCCACHE_GHA_VERSION: "verter-compiler-contracts-v2"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          # Exact trybuild stderr includes stdlib help snippets with rust-src.
          components: rust-src
      # Cache both outer runners and trybuild artifacts, without rust-cache's
      # target pruning traversing generated fixture workspaces. The revision
      # suffix lets main refresh artifacts after source-only changes.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compiler-contract-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/compiler-contracts
          key: ${{ runner.os }}-${{ runner.arch }}-compiler-contracts-v2-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/verter_compile_contracts_session_observe/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-compiler-contracts-v2-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/verter_compile_contracts_session_observe/Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-compiler-contracts-v2-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0
      - uses: pnpm/action-setup@v6
        if: matrix.group == 'compiler'
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: ${{ matrix.group == 'compiler' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
        if: matrix.group == 'compiler'
      - name: Verify compiler contracts lane and cache ownership
        run: node --test scripts/compiler-ci-lane-selftest.mjs
      - name: Run workspace compile contracts
        shell: bash
        run: node scripts/compile-contracts.mjs --group ${{ matrix.group }} 2>&1 | tee compile-contracts-${{ matrix.group }}.log
      - name: Verify generated Svelte artifacts
        if: matrix.group == 'compiler'
        run: >-
          cargo test --package verter_compiler --test main
          cases::svelte_generated_artifacts_freshness::generated_svelte_artifacts_match_their_authoritative_inputs
          -- --exact
      # Tests activate the dev-dependency self-edge's test-support feature,
      # so retain the separate production feature-off build as well.
      - name: verter_compiler default feature-off build + lib tests (isolated)
        if: matrix.group == 'compiler'
        run: |
          cargo build -p verter_compiler
          cargo test -p verter_compiler --lib
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: github.ref == 'refs/heads/main' && steps.compiler-contract-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/compiler-contracts
          key: ${{ steps.compiler-contract-cache.outputs.cache-primary-key }}
      - name: Upload compile-contract logs and per-configuration timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compile-contracts-${{ matrix.group }}
          path: compile-contracts-${{ matrix.group }}.log
          if-no-files-found: warn

  build-and-deploy:
    name: Build WASM & Deploy Playground
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # --- Rust + wasm-bindgen ---
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
      # Prebuilt binary. The previous guarded `cargo install` compiled
      # wasm-bindgen-cli from source on any runner where the version probe
      # missed, which is every cold cache.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      # --- Node + pnpm ---
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- Build WASM ---
      # Full publication-ready lane (bindgen + wasm-opt). Deliberately NOT the
      # root `pnpm build:wasm` — that is the host-developer lane and never
      # runs wasm-opt.
      - name: Build WASM
        run: pnpm --filter @verter/wasm build

      - name: Smoke test WASM
        run: node -e "const fs = require('fs'); const wasm = fs.readFileSync('packages/wasm/wasm/verter_wasm_bg.wasm'); console.log('WASM size:', wasm.length, 'bytes'); if (wasm.length < 1000) throw new Error('WASM too small');"

      # --- Upload WASM to nightly release ---
      - name: Upload WASM to nightly release
        run: |
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "SHA_SHORT=$SHA_SHORT" >> $GITHUB_ENV

          # Ensure nightly release exists
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly Builds" --notes "Rolling nightly WASM builds from main branch."

          # Upload WASM + glue JS with commit-suffixed names
          cp packages/wasm/wasm/verter_wasm_bg.wasm "verter_wasm_bg-${SHA_SHORT}.wasm"
          cp packages/wasm/wasm/verter_wasm.js "verter_wasm-${SHA_SHORT}.js"
          gh release upload nightly "verter_wasm_bg-${SHA_SHORT}.wasm" "verter_wasm-${SHA_SHORT}.js" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Update nightly manifest ---
      - name: Update nightly manifest
        run: |
          # Download existing manifest or create empty
          gh release download nightly -p nightly-manifest.json -D /tmp 2>/dev/null || \
            echo '{"commits":[]}' > /tmp/nightly-manifest.json

          export COMMIT_MSG=$(git log -1 --pretty=%s | head -c 200)

          # Prepend new commit, keep last 50
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('/tmp/nightly-manifest.json', 'utf8'));
            m.commits.unshift({
              sha: process.env.GITHUB_SHA,
              short: process.env.SHA_SHORT,
              date: new Date().toISOString(),
              message: process.env.COMMIT_MSG
            });
            m.commits = m.commits.slice(0, 50);
            m.latest = process.env.SHA_SHORT;
            fs.writeFileSync('/tmp/nightly-manifest.json', JSON.stringify(m, null, 2));
          "
          gh release upload nightly /tmp/nightly-manifest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          SHA_SHORT: ${{ env.SHA_SHORT }}

      # --- Cleanup old assets ---
      - name: Cleanup old nightly assets
        run: |
          KEEP=$(node -e "
            const m = JSON.parse(require('fs').readFileSync('/tmp/nightly-manifest.json', 'utf8'));
            const keep = new Set(['nightly-manifest.json']);
            m.commits.forEach(c => {
              keep.add('verter_wasm_bg-' + c.short + '.wasm');
              keep.add('verter_wasm-' + c.short + '.js');
            });
            keep.forEach(k => console.log(k));
          ")

          ASSETS=$(gh release view nightly --json assets -q '.assets[].name')

          for asset in $ASSETS; do
            if ! echo "$KEEP" | grep -qxF "$asset"; then
              echo "Deleting stale asset: $asset"
              gh release delete-asset nightly "$asset" -y || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Full capture-enabled correctness and observation coverage. Pull requests
  # keep a small host-backed smoke; this nightly retains the full core selection.
  rust-observe:
    name: Rust Test (instrumentation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: rust-observe
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Fetch locked Cargo dependencies
        run: cargo fetch --locked
      - name: Run the instrumentation lane
        timeout-minutes: 80
        id: nextest
        env:
          NEXTEST_PROFILE: ci
        run: |
          node scripts/ci-junit-metadata.mjs snapshot-env --out "$RUNNER_TEMP/nextest-env.json"
          argv="$(node scripts/observe-lane.mjs args)"
          echo "argv=$argv" >> "$GITHUB_OUTPUT"
          node scripts/observe-lane.mjs run
      - name: Locate nextest JUnit report
        if: always()
        id: junit
        run: |
          found=$(find target -type f -path '*/nextest/ci/junit.xml' -print -quit)
          if [ -z "$found" ]; then
            echo "::error::nextest ci junit.xml not found — the test report would be silently empty"
            exit 1
          fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
      - name: Nextest JUnit evidence
        if: always()
        uses: ./.github/actions/nextest-evidence
        with:
          junit-path: ${{ steps.junit.outputs.path }}
          name: nextest-evidence-rust-observe
          env-snapshot: ${{ runner.temp }}/nextest-env.json
          argv-json: ${{ steps.nextest.outputs.argv }}
      - name: Retain instrumentation test results
        if: always() && steps.junit.outputs.path != ''
        uses: actions/upload-artifact@v6
        with:
          name: rust-instrumentation-test-results
          path: ${{ steps.junit.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The nightly scale tier: every test under a `nightly_scale` module, at full
  # size, on the debug build, with the `nightly` nextest profile's own deadline
  # (`.config/nextest.toml`). The PR gate (profiles `default` and `ci`)
  # excludes exactly these tests and runs their smaller gate versions instead.
  # nextest fails a run that selects no test, so an emptied or mistyped tier
  # fails here rather than passing vacuously.
  # ---------------------------------------------------------------------------
  rust-scale-tier:
    name: Rust Test (nightly scale tier)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # It only builds and tests: no write token, and none left in the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-scale-tier
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run the nightly scale tier
        id: nextest
        env:
          NEXTEST_PROFILE: nightly
        run: |
          node scripts/compile-fixture-artifacts.mjs prepare --workspace
          cargo nextest run --workspace --no-fail-fast -E "$(node scripts/provider-ci.mjs filter core)"
      - name: Upload nightly scale tier JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nextest-nightly-scale-tier
          path: target/nextest/nightly/junit.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Rust coverage. Moved off the PR path: `cargo llvm-cov` changes RUSTFLAGS, so
  # it cannot share the rust-cache with rust-test and is a FULLY SEPARATE
  # instrumented compile + test run of the whole workspace, producing an
  # lcov.info artifact with no threshold, no gate and no upload to a coverage
  # service. As a nightly trend signal it costs nothing per PR. If you want
  # coverage to influence review, add diff-coverage reporting on changed lines
  # rather than moving this back onto every PR.
  #
  # Coverage measures the test partition CI runs, under the runners and
  # settings it runs them with: the provider-free core under nextest with the
  # `ci` profile (one process per test, which the process-wide retention and
  # binding counters rely on), and each real-provider lane as serial libtest
  # with its own require-provider switch. A single in-process
  # `cargo llvm-cov --workspace` run is not that universe: it executes the
  # profile-specific shipped-cfg canaries under the dev profile, skips the
  # compile-fixture metadata the core suites read, and runs every test of a
  # binary as concurrent threads of one process. Each lane is its own job, as
  # in CI: instrumented, the three lanes together do not fit one job's limit.
  # ---------------------------------------------------------------------------
  rust-coverage-lane:
    name: Rust Coverage (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
          - lane: tsgo
            require: VERTER_REQUIRE_TSGO
          - lane: tsserver
            require: VERTER_REQUIRE_TSSERVER
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      # One instrumented build cache for every lane, as before: a cache per
      # lane would crowd the 10 GB budget pull requests restore from.
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-coverage
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The lockfile install provides the pinned project-local tsgo engine,
      # discovered as `node_modules/.bin/tsc`, and the scripts every lane runs.
      - run: pnpm install --frozen-lockfile
      # The live provider tests resolve the tsserver plugin through its
      # workspace probe location; the install creates the symlink but not its
      # build outputs. CI's provider jobs build them for both engines.
      - name: Build the language-shared and plugin prerequisites
        if: matrix.lane != 'core'
        run: pnpm --filter @verter/language-shared --filter @verter/typescript-plugin build
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `show-env` instruments the ordinary cargo commands. Its default profile
      # file name carries the process id, so nextest's process per test would
      # leave one multi-megabyte profile per test, tens of thousands in all:
      # more than a runner's disk. The `%8m` pool merges each binary's
      # processes online into at most eight files.
      - name: Generate coverage
        id: nextest
        env:
          LANE: ${{ matrix.lane }}
          REQUIRE: ${{ matrix.require }}
          NEXTEST_PROFILE: ci
          LLVM_PROFILE_FILE_NAME: verter-%8m.profraw
        run: |
          source <(cargo llvm-cov show-env --sh)
          node scripts/ci-junit-metadata.mjs snapshot-env --out "$RUNNER_TEMP/nextest-env.json"
          cargo llvm-cov clean --workspace
          status=0
          if [ "$LANE" = core ]; then
            node scripts/compile-fixture-artifacts.mjs prepare --workspace || status=1
            nextest_argv=(nextest run --workspace --no-fail-fast -E "$(node scripts/provider-ci.mjs filter core)")
            echo "argv=$(node -e 'console.log(JSON.stringify(process.argv.slice(1)))' -- "${nextest_argv[@]}")" >> "$GITHUB_OUTPUT"
            cargo "${nextest_argv[@]}" || status=1
          else
            env "$REQUIRE=1" node scripts/provider-ci.mjs run "$LANE" || status=1
          fi
          cargo llvm-cov report --lcov --output-path "lcov-$LANE.info" || status=1
          exit "$status"
      - name: Nextest JUnit evidence
        if: always() && matrix.lane == 'core'
        uses: ./.github/actions/nextest-evidence
        with:
          name: nextest-evidence-rust-coverage-core
          env-snapshot: ${{ runner.temp }}/nextest-env.json
          argv-json: ${{ steps.nextest.outputs.argv }}
          matrix-json: ${{ toJSON(matrix) }}
      - name: Upload lane coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage-${{ matrix.lane }}
          path: lcov-${{ matrix.lane }}.info
          if-no-files-found: warn

  # The coverage result: one lcov.info over every lane (an lcov tracefile may
  # carry several records for one source file; lcov tools sum them), failing
  # when any lane did not succeed.
  rust-coverage:
    name: Rust Coverage
    needs: rust-coverage-lane
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: rust-coverage-*
          path: lanes
          merge-multiple: true
      - name: Merge lane coverage
        run: cat lanes/lcov-core.info lanes/lcov-tsgo.info lanes/lcov-tsserver.info > lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: lcov.info
      - name: Fail unless every lane succeeded
        if: needs.rust-coverage-lane.result != 'success'
        run: |
          echo "::error::a coverage lane did not succeed: ${{ needs.rust-coverage-lane.result }}"
          exit 1

  # ---------------------------------------------------------------------------
  # Svelte compiler benchmark: Verter against the official compiler on the
  # pinned corpus, with the 1.10x wall-time and RSS fences. Moved off the PR
  # path: a p50/p95 fence measured on a shared GitHub-hosted VM is not a
  # per-PR correctness signal, and it cost a runner plus the release native
  # build on every compiler change. The PR side (`svelte-compiler-benchmark`
  # in ci.yml) still proves the benchmark contract, the corpus against the
  # official goldens and the manifest's oracle proof; this job measures.
  # ---------------------------------------------------------------------------
  svelte-compiler-benchmark:
    name: Svelte Compiler Benchmark (Verter vs official)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: svelte-compiler-benchmark
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify benchmark corpus against official Svelte goldens
        run: node scripts/gen-svelte-goldens.mjs --check
      - name: Build native binding (release)
        run: pnpm run build:native
      - name: Compare Verter and official Svelte compilers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          pnpm --filter @verter/benchmark bench:svelte:compiler -- \
            --json \
            --require-immutable \
            --out="$GITHUB_WORKSPACE/artifacts/svelte-compiler-benchmark.json"
      - name: Ensure benchmark artifact exists
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          result="$GITHUB_WORKSPACE/artifacts/svelte-compiler-benchmark.json"
          if [ ! -f "$result" ]; then
            printf '{"schemaVersion":3,"generatedAt":"%s","pass":false,"error":"Svelte compiler benchmark did not run to completion"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$result"
          fi
      - name: Upload Svelte compiler benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: svelte-compiler-benchmark
          path: artifacts/svelte-compiler-benchmark.json
          if-no-files-found: error
