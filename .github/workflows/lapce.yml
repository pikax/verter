name: lapce

# Builds the Lapce volt and runs its host-target unit suite. The volt is a
# wasm32-wasip1 cdylib: a thin LSP launcher that delegates all decision logic
# (argv, initializationOptions, server discovery, the platform matrix) to the
# shared `verter-editor-client` crate, with the `lapce-plugin` glue isolated
# behind `cfg(target_os = "wasi")`. The wasm build is the integration smoke that
# catches a dependency float (e.g. an lsp-types bump past the Url->Uri rename),
# and the host-target tests exercise the pure launch surface plus the manifest
# and lockfile guards.
#
# Lapce has no headless GUI harness comparable to @vscode/test-electron. The
# Linux lane therefore builds the real volt, exports its production launch plan,
# and drives that exact plan against a real verter-lsp over stdio. This covers
# extension-owned discovery/argv/options plus Vue/Svelte behavior without
# pretending that a neutral client is a Lapce UI automation layer.

on:
  push:
    branches: [main]
    paths:
      - "extensions/lapce/**"
      - "crates/verter-editor-client/**"
      - "scripts/editor-contracts/**"
      - "editors/nvim/tests/fixtures/real-client/**"
      - "packages/lsp-test-client/**"
      - ".github/workflows/lapce.yml"
  pull_request:
    paths:
      - "extensions/lapce/**"
      - "crates/verter-editor-client/**"
      - "scripts/editor-contracts/**"
      - "editors/nvim/tests/fixtures/real-client/**"
      - "packages/lsp-test-client/**"
      - ".github/workflows/lapce.yml"

jobs:
  build:
    name: lapce volt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cross-platform portability is a CRITICAL rule: the volt must build and
        # the host-target launch surface must pass on all three host OSes. The
        # run steps use `shell: bash` so the same scripts work under Git-bash on
        # the Windows runner.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (with wasm32-wasip1)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - name: Build the volt (wasm32-wasip1)
        shell: bash
        run: cargo build --manifest-path extensions/lapce/Cargo.toml --target wasm32-wasip1 --release

      - name: Run host-target unit tests
        shell: bash
        run: cargo test --manifest-path extensions/lapce/Cargo.toml

      - name: Clippy (wasm32-wasip1)
        shell: bash
        run: cargo clippy --manifest-path extensions/lapce/Cargo.toml --target wasm32-wasip1 -- -D warnings

      - name: Rustfmt check
        shell: bash
        working-directory: extensions/lapce
        run: cargo fmt --check

      - name: Install pnpm for the shipping-plan smoke
        if: runner.os == 'Linux'
        uses: pnpm/action-setup@v4

      - name: Install Node.js for the shipping-plan smoke
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          npm ci --ignore-scripts --prefix editors/nvim/tests/fixtures/real-client

      - name: Build the real server and neutral client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build -p verter_lsp --release
          pnpm --filter @verter/lsp-test-client build

      - name: Drive the exact Lapce launch plan over stdio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE}/editors/nvim/tests/fixtures/real-client"
          bin="${GITHUB_WORKSPACE}/target/release/verter-lsp"
          plan="${RUNNER_TEMP}/lapce-launch-plan.json"
          cargo run --quiet --manifest-path extensions/lapce/Cargo.toml --example contract_plan -- "$root" "$bin" > "$plan"
          node scripts/editor-contracts/run-plan-smoke.mjs --plan="$plan" --root="$root"
