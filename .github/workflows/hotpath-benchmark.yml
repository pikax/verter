name: hotpath benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  upload:
    name: benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      HOTPATH_BENCHMARK: new_pipeline-real-full-kitchen-sink
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.97.1,profile=hotpath,valgrind=3.26.0
      HOTPATH_OUTPUT_FORMAT: json
      HOTPATH_CRITERION_ITERATIONS: 5000
      # Identical in every `cargo bench`, so both runs use the one build.
      BENCH_ARGS: --profile hotpath -p verter_bench --bench oxc_template_bench --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build benchmark
        run: cargo bench $BENCH_ARGS --no-run
      - name: Run benchmark natively
        env:
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: cargo bench $BENCH_ARGS -- --test --exact new_pipeline/real/full/kitchen-sink
      - name: Run benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload.json
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
          # Cargo starts the benchmark under Valgrind.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file=${{ runner.temp }}/callgrind.out.%p
        run: |
          cargo bench $BENCH_ARGS -- --test --exact new_pipeline/real/full/kitchen-sink
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and .meta.criterion.benchmark == "new_pipeline/real/full/kitchen-sink"' \
            "$HOTPATH_OUTPUT_PATH" > /dev/null

  report:
    name: benchmark (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HOTPATH_BENCHMARK: new_pipeline-real-full-kitchen-sink
      HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.97.1,profile=hotpath,valgrind=3.26.0
      HOTPATH_OUTPUT_FORMAT: json
      HOTPATH_CRITERION_ITERATIONS: 5000
      # Identical in every `cargo bench`, so both runs use the one build.
      BENCH_ARGS: --profile hotpath -p verter_bench --bench oxc_template_bench --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
      - name: Build benchmark
        run: cargo bench $BENCH_ARGS --no-run
      - name: Run benchmark natively
        env:
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: cargo bench $BENCH_ARGS -- --test --exact new_pipeline/real/full/kitchen-sink
      - name: Run benchmark under Callgrind and write the merged report
        env:
          # Absolute: Cargo starts the benchmark in the package directory.
          HOTPATH_OUTPUT_PATH: ${{ github.workspace }}/report.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
          # Cargo starts the benchmark under Valgrind.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file=${{ runner.temp }}/callgrind.out.%p
        run: |
          cargo bench $BENCH_ARGS -- --test --exact new_pipeline/real/full/kitchen-sink
          test -s "$HOTPATH_OUTPUT_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and .meta.criterion.benchmark == "new_pipeline/real/full/kitchen-sink"' \
            "$HOTPATH_OUTPUT_PATH" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: hotpath-report
          path: report.json
          retention-days: 1
          if-no-files-found: error
