name: Release Check

# A release REHEARSAL with two security-distinct entry points. An explicit
# workflow_dispatch invokes release.yml itself with `dry_run: true`, so it
# rehearses the EXACT job graph that will run on a real tag. A pull request
# cannot safely call that graph: reusable-workflow permissions may only stay
# the same or decrease, while release.yml necessarily requests write scopes
# for its (dry-run-skipped) publishing jobs. Granting those scopes to arbitrary
# PR code would defeat the read-only boundary. PRs therefore run the static
# release graph/security contracts, and trusted manual dispatch runs the full
# cross-OS rehearsal.
#
# A duplicated matrix would drift from the real pipeline and give false
# confidence, which is worse than no rehearsal at all.
#
# Defence in depth: the workflow default and PR job stay READ-ONLY. The manual
# call receives the permission superset GitHub requires to validate the nested
# graph, but passes NO registry or Marketplace secrets and `dry_run: true`
# skips every publishing and post-publish job.

#
# COST: this rehearsal runs the FULL release job graph, including the twelve
# macOS (10x) and Windows (2x) artifact-build legs. Those are the most
# expensive minutes in the estate, so the triggers are kept deliberately
# narrow: on demand, plus PRs that touch the release machinery ITSELF.
#
# Deliberately NOT triggered by:
#   - a schedule — a weekly cron would pay for the whole paid matrix every week
#     for a tree nobody is about to release;
#   - lockfile/manifest churn (`Cargo.lock`, `pnpm-lock.yaml`, `package.json`,
#     `packages/*/package.json`) — ordinary dependency work would drag the paid
#     matrix in on routine PRs. A version bump does rewrite those manifests, but
#     it is immediately followed by a tag, which runs the real release anyway;
#     rehearse it by hand first via workflow_dispatch.
on:
  # Rehearse on demand — run this before cutting a release tag.
  workflow_dispatch:
  # Auto-rehearse when the release machinery itself changes, which is the change
  # class a rehearsal exists to de-risk.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/integration-test.yml"
      - "scripts/check-versions.mjs"
      - "scripts/verify-packages.mjs"
      - "scripts/bump.mjs"
      - "packages/vue-vscode/package.mjs"

# Never let a rehearsal cancel or queue behind a real release.
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request-contract:
    name: Release workflow contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release workflow and package contracts
        run: pnpm --filter verter-vscode exec vitest run src/releasePackaging.spec.ts
      - name: Validate release rehearsal control plane
        run: node --test scripts/githubctl/tests/release-plan.test.mjs

  dry-run:
    name: Release dry run
    if: github.event_name == 'workflow_dispatch'
    # A called workflow may not elevate its caller. This trusted, explicit
    # dispatch grants the union requested by release.yml and its nested
    # integration workflow; PRs never enter this job.
    permissions:
      contents: write
      deployments: write
      id-token: write
      checks: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
