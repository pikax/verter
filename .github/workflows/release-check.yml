name: Release Check

# A release REHEARSAL. This is deliberately a thin caller rather than its own
# copy of the release pipeline: it invokes release.yml itself with
# `dry_run: true`, so what gets rehearsed is the EXACT job graph that will run
# on a real tag — validation, the blocking test job, the full cross-OS editor
# matrix, and every native/tsc/lsp/mcp/wasm build — with only the publishing
# and post-publish integration jobs skipped.
#
# A duplicated matrix would drift from the real pipeline and give false
# confidence, which is worse than no rehearsal at all.
#
# Defence in depth: this caller grants READ-ONLY permissions and passes NO
# secrets. Even if a `dry-run` conditional in release.yml were wrong, the
# publish jobs have no registry token, no VSCE PAT, and no write scope, so a
# rehearsal cannot ship anything.

on:
  # Rehearse on demand — run this before cutting a release tag.
  workflow_dispatch:
  # Auto-rehearse whenever the release machinery itself changes, since that is
  # exactly the change class a rehearsal exists to de-risk.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
      - ".github/workflows/integration-test.yml"
      - "scripts/check-versions.mjs"
      - "scripts/verify-packages.mjs"
      - "scripts/bump.mjs"
      - "packages/*/package.json"
      - "packages/*/npm/*/package.json"
      - "packages/vue-vscode/package.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
  # Catch drift that lands without touching the paths above (a dependency
  # float, a runner image change, an expired pinned asset).
  schedule:
    - cron: "0 5 * * 1"

# Never let a rehearsal cancel or queue behind a real release.
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Release dry run
    uses: ./.github/workflows/release.yml
    with:
      dry_run: true
