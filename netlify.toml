# Netlify configuration for Verter playground

[build]
  publish = "packages/playground/dist"
  command = "pnpm install && pnpm run build:ts && pnpm run build:playground"

# Deploy previews are built by GitHub Actions, but this config supports manual deployments
[build.environment]
  PNPM_VERSION = "10.22.0"
  NODE_VERSION = "20"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
