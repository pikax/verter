# Pinned build inputs for the Verter JetBrains plugin (JBT1).
#
# The supported IDE range declaration (tests/jetbrains-product/JBT1) and
# scripts/jetbrains-gate.mjs read these exact properties: changing one without
# the other fails the jetbrains gate preflight instead of shipping a claim the
# build does not make.
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Pinned IntelliJ Platform product + build. JBT0 pins official WebStorm as the
# comparator; unsupported editions are not claimed.
platformType=WS
platformVersion=2026.2.3
platformBuild=262.10968.77

# Declared supported range (patched into plugin.xml at build time).
pluginSinceBuild=262.10968
pluginUntilBuild=262.*

pluginGroup=dev.verter
pluginId=com.verter.jetbrains
pluginName=Verter
pluginVersion=0.1.0-jbt1
