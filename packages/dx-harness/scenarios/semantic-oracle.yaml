# Curated semantic-oracle scenarios: one per `.vue` counterpart under
# fixtures/hermetic/semantic-oracle/, each paired with an oracles/semantic/*.ts
# gold standard. Every probe asserts the `vueSemanticValidity` dimension — verter
# on the `.vue` is compared to tsgo on the curated `.ts`. The anchored member
# accesses are script positions, so they map strictly.
- id: oracle-define-props
  fixture: semantic-oracle
  entryFile: define-props.vue
  anchors: [props.title, props.count]
  script: []
  probes:
    - id: props-title-hover
      method: hover
      anchor: props.title
      mappingPolicy: strict
      confidence: high
      dimension: vueSemanticValidity
      requiresSourceMap: true
      requiredDrivers: [rawLsp, tsgo]
      capabilityRequirements: [positionEncoding]
    - id: props-count-hover
      method: hover
      anchor: props.count
      mappingPolicy: strict
      confidence: high
      dimension: vueSemanticValidity
      requiresSourceMap: true
      requiredDrivers: [rawLsp, tsgo]
      capabilityRequirements: [positionEncoding]
  invariants:
    - id: props-title-is-string
      anchor: props.title
      method: hover
      assertion: contains
      value: string
    - id: props-count-is-number
      anchor: props.count
      method: hover
      assertion: contains
      value: number
  baselines:
    tsgo: required
    tsserver: requiredForCi
    volar: optional
  thresholds:
    flakeWindows: 2
