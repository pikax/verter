<!doctype html>
<html>
  <head>
    <style>
      /* Dark mode only affects scrollbars and system UI, not user content.
         Applied per-element to avoid changing default text/background colors
         which would break components that don't set explicit colors. */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      (() => {
        window.process = { env: {} };
        window.__modules__ = {};
        window.__css__ = [];

        window.__export__ = (mod, key, get) => {
          Object.defineProperty(mod, key, {
            enumerable: true,
            configurable: true,
            get,
          });
        };

        window.__dynamic_import__ = (key) => {
          return Promise.resolve(window.__modules__[key]);
        };

        const originalConsole = { ...console };
        ["log", "info", "warn", "error"].forEach((method) => {
          console[method] = (...args) => {
            originalConsole[method](...args);
            parent.postMessage(
              {
                action: "console",
                method,
                args: args.map((arg) =>
                  typeof arg === "object" ? JSON.stringify(arg) : String(arg),
                ),
              },
              "*",
            );
          };
        });

        window.onerror = (msg, url, line, col, err) => {
          parent.postMessage(
            {
              action: "error",
              message: msg,
              stack: err?.stack,
            },
            "*",
          );
        };

        window.addEventListener("unhandledrejection", (e) => {
          parent.postMessage(
            {
              action: "error",
              message: e.reason?.message || String(e.reason),
              stack: e.reason?.stack,
            },
            "*",
          );
        });

        window.addEventListener("message", async (ev) => {
          const { action, scripts, css, frameworkId, svelteRuntimeFlags = [] } = ev.data;

          if (action === "eval") {
            try {
              window.__modules__ = {};
              window.__css__ = [];

              // Remove old styles
              document.querySelectorAll("style[data-v]").forEach((el) => el.remove());

              // Add CSS
              if (css) {
                const style = document.createElement("style");
                style.setAttribute("data-v", "");
                style.textContent = css;
                document.head.appendChild(style);
              }

              // Unmount the previous framework instance before clearing the DOM,
              // so runtime state and delegated listeners cannot survive a preview update.
              if (window.__currentApp__) {
                await window.__currentApp__.unmount();
                window.__currentApp__ = null;
              }
              const app = document.getElementById("app");
              if (app) app.innerHTML = "";

              // Remove old dynamically-added scripts
              document.querySelectorAll("script[data-preview]").forEach((el) => el.remove());

              // Load exactly the selected framework runtime. Import-map entries
              // are present in the srcdoc before this classic script starts.
              if (frameworkId === "svelte") {
                if (!window.SvelteInternalClient) {
                  await import("svelte/internal/disclose-version");
                }
                // Side-effect flags must run before the next component mount.
                // Keep this explicit allowlist: preview messages are external input.
                // This remains outside the client-runtime cache guard so changing a
                // warm preview from runes to legacy (or enabling another flag) works.
                if (svelteRuntimeFlags.includes("legacy")) {
                  await import("svelte/internal/flags/legacy");
                }
                if (svelteRuntimeFlags.includes("async")) {
                  await import("svelte/internal/flags/async");
                }
                if (svelteRuntimeFlags.includes("tracing")) {
                  await import("svelte/internal/flags/tracing");
                }
                if (!window.SvelteInternalClient) {
                  window.SvelteInternalClient = await import("svelte/internal/client");
                }
              } else if (!window.Vue) {
                window.Vue = await import("vue");
              }

              // Evaluate scripts sequentially, each wrapped in an IIFE so const
              // declarations don't conflict between re-evaluations
              for (const script of scripts) {
                const scriptEl = document.createElement("script");
                scriptEl.setAttribute("data-preview", "");
                scriptEl.textContent = `;(function(){${script}})()`;
                document.body.appendChild(scriptEl);
              }

              parent.postMessage({ action: "ready" }, "*");
            } catch (e) {
              parent.postMessage(
                {
                  action: "error",
                  message: e.message,
                  stack: e.stack,
                },
                "*",
              );
            }
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
