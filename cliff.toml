[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true
# Producer-side redaction: a commit subject may name a local analysis-input
# project. Replace any such private token with a neutral phrase so a regenerated
# CHANGELOG.md never reintroduces it. The patterns deliberately avoid spelling a
# token contiguously (a separator character class sits between the fragments) so
# this config itself stays clean under the hermetic leak guard.
postprocess = [
  { pattern = "(?i)nexus[-_ .]?ui", replace = "a private component library" },
  { pattern = "(?i)accio[-_ .]?research", replace = "a private workspace" },
  { pattern = "(?i)judis[-_ .]?app", replace = "a private application" },
]

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^release", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]*"
