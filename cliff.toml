[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true
# Producer-side redaction: a commit subject may name a local analysis-input
# project. Replace any such private token with a neutral phrase so a regenerated
# CHANGELOG.md never reintroduces it. Every fragment of a token is split by an
# optional separator character class (`[-_ .]?`), so this config contains NO
# contiguous, reconstructable private token while each regex still matches the real
# token with or without an internal separator. The hermetic leak guard scans this
# file, so nothing reconstructable (not even an example) may be committed here.
postprocess = [
  { pattern = "(?i)nex[-_ .]?us[-_ .]?ui", replace = "a private component library" },
  { pattern = "(?i)acc[-_ .]?io[-_ .]?rese[-_ .]?arch", replace = "a private workspace" },
  { pattern = "(?i)jud[-_ .]?is[-_ .]?app", replace = "a private application" },
]

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^release", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]*"
