[alias]
xtask = "run --package xtask --"

[target.wasm32-unknown-unknown]
# getrandom 0.3.4+ accepts the `getrandom_backend="wasm_js"` cfg form
# for selecting the wasm32-unknown-unknown random backend. The
# previous `getrandom_wasm_js` cfg was specific to a much older
# getrandom 0.3 release. Lightningcss → ahash → getrandom 0.3
# requires this for wasm builds.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# ts-rs writes audit record TS bindings here (relative to this config
# file's location, i.e. the workspace root). All `#[ts(export_to = "...")]`
# attributes on verter_session audit types resolve under this base path.
# Plan §1.4.
[env]
TS_RS_EXPORT_DIR = { value = "packages/types", relative = true }
