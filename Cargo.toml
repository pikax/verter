[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1-beta.1"
edition = "2021"
# Phase 6b sub-plan §6b.D2b — `Arc<dyn WorkspaceAccess>` →
# `Arc<dyn WorkspaceRead>` trait upcasting was stabilised in Rust 1.86
# (March 2025). The `WorkspaceAccess: WorkspaceRead` split (closing the
# `host.workspace().<mutator>()` bypass) requires this MSRV. Authorised
# in §6b.5 entry conditions.
rust-version = "1.86"
license = "MIT"
authors = ["pikax"]
repository = "https://github.com/pikax/verter"
homepage = "https://verterjs.dev/"

[workspace.dependencies]
oxc_allocator = "0.117.0"
oxc_ast = "0.117.0"
oxc_parser = "0.117.0"
oxc_span = "0.117.0"
rayon = "1.8"
rustc-hash = "2.1"
self_cell = "1.2.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
lightningcss = { version = "1.0.0-alpha.71", features = ["visitor"] }
verter_type_expr = { path = "crates/verter_type_expr" }
verter_type_expr_oxc = { path = "crates/verter_type_expr_oxc" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Debuggable release profile. Same optimisation level as release but
# with line-table debug info so LLDB can resolve frames in attached
# stacks. Use via:
#   cargo build --profile=release-dbg --example audit_real_component_meta -p verter_bench
# Output lands in target/release-dbg/. Used by the `tools/debug/`
# helpers when the bench needs to be inspected with a debugger
# attaching to a running process. Keeps the regular `release` profile
# small and frame-pointer-omitted for production benchmarks.
[profile.release-dbg]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev]
opt-level = 0
