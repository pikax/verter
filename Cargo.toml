[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.0.1-beta.3"
edition = "2021"
# Consumer-facing MSRV floor, set by transitive deps in
# `[workspace.dependencies]`: `oxc_*` 0.126 requires rustc 1.92.
#
# DELIBERATELY looser than `rust-toolchain.toml`, and a separate claim. That
# file pins the DEVELOPMENT toolchain this repo is built and tested with; this
# is the oldest rustc a downstream can compile the published library code on.
# The pin is driven by the trybuild `.stderr` fixtures, which are dev-only and
# never compiled by a consumer, so it does not drag this floor up with it.
# Bumping the pin does NOT imply bumping this value.
rust-version = "1.92"
license = "MIT"
authors = ["pikax"]
repository = "https://github.com/pikax/verter"
homepage = "https://verterjs.dev/"

[workspace.dependencies]
blake3 = "1.5"
oxc_allocator = "0.126.0"
oxc_ast = "0.126.0"
oxc_ast_visit = "0.126.0"
oxc_parser = "0.126.0"
oxc_semantic = "0.126.0"
oxc_span = "0.126.0"
oxc_syntax = "0.126.0"
rayon = "1.12"
rustc-hash = "2.1.2"
self_cell = "1.2.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
serial_test = "3"
sha2 = "0.11"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
lightningcss = { version = "1.0.0-alpha.71", features = ["visitor"] }
verter_css_syntax = { path = "crates/verter_css_syntax" }
verter_debug_assert = { path = "crates/verter_debug_assert" }
verter_macro_dto = { path = "crates/verter_macro_dto" }
verter_ecma = { path = "crates/verter_ecma" }
verter_identity = { path = "crates/verter_identity" }
verter_no_typeexpr = { path = "crates/verter_no_typeexpr" }
verter_no_typeexpr_derive = { path = "crates/verter_no_typeexpr_derive" }
verter_no_storedspan = { path = "crates/verter_no_storedspan" }
verter_no_storedspan_derive = { path = "crates/verter_no_storedspan_derive" }
verter_session_query = { path = "crates/verter_session_query" }
verter_type_expr = { path = "crates/verter_type_expr" }
verter_type_expr_oxc = { path = "crates/verter_type_expr_oxc" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Debuggable release profile. Same optimisation level as release but
# with line-table debug info so LLDB can resolve frames in attached
# stacks. Use via:
#   cargo build --profile=release-dbg --example audit_real_component_meta -p verter_bench
# Output lands in target/release-dbg/. Used by the `tools/debug/`
# helpers when the bench needs to be inspected with a debugger
# attaching to a running process. Keeps the regular `release` profile
# small and frame-pointer-omitted for production benchmarks.
[profile.release-dbg]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev]
opt-level = 0
# Dev/test builds emit minimal debug info. `line-tables-only` keeps
# panic/backtrace file:line (test failures stay debuggable) while dropping
# the variable/type debug info that can dominate compile + link time.
# Measured: large win on Windows/MSVC (recompiling the verter_session rlib
# ~76s -> ~5s; rlib 433MB -> 72MB; test-binary relink ~4s -> ~2s — MSVC PDB
# generation is the bottleneck there) and ~neutral on Linux (DWARF is
# cheaper). Kept because it is free on Linux/macOS and keeps backtraces.
# For an interactive debugger that needs locals, override per run with
# `CARGO_PROFILE_DEV_DEBUG=2 cargo ...`.
debug = "line-tables-only"

# Strip debug info from non-workspace dependencies entirely. Our own crates
# keep `line-tables-only` (above) for backtraces; third-party deps do not need
# even line tables, which shrinks dependency rlibs and cuts link input size.
[profile.dev.package."*"]
debug = false

# Test profile that reproduces the CONDITIONAL-COMPILATION and runtime-check
# state of a shipped build — `debug_assertions` off, `overflow-checks` off —
# while keeping dev codegen (opt-level 0, no LTO, many codegen units) so it
# compiles at debug speed.
#
# Why it exists: `debug_assert!` does not evaluate its argument when
# `debug_assertions` is off, and `#[cfg(debug_assertions)]` items disappear.
# Every shipped artifact (LSP binary, napi, wasm) is built that way, so a side
# effect written inside a `debug_assert!` argument, or a cross-crate item whose
# availability depends on the profile, behaves differently there than in the
# debug test run — and no debug-profile test can observe the difference.
# `cargo check --workspace --release` does not observe it either: it compiles,
# it does not run tests.
#
# `cfg(debug_assertions)` and `-C overflow-checks` are exactly what this
# profile changes relative to `dev`, and they are the only inputs the class
# depends on, so this profile is a faithful stand-in for `release` FOR THAT
# CLASS. It is NOT a substitute for `release` in general: it shares none of
# release's opt-level 3 / fat-LTO / single-codegen-unit code generation, so it
# cannot surface optimisation- or LTO-dependent behaviour.
#
# `scripts/gate.mjs` builds and runs its shipped-cfg surface under this
# profile.
[profile.no-debug-assertions]
inherits = "dev"
debug-assertions = false
overflow-checks = false

[profile.no-debug-assertions.package."*"]
debug = false

# Host developer artifact profile — what `pnpm build` compiles NAPI and the
# LSP under (see docs/arch/refactor/rev11/rulings/
# MAINTAINER-DIRECTIVE-BUILD-LANE-SEPARATION.md). Plain `dev` (opt-level 0)
# is fast to compile but often too slow at runtime for interactive NAPI/LSP
# testing; `release` (opt-level 3, fat LTO, one codegen unit) is far too slow
# to compile for routine iteration. `artifact-dev` opts in to real
# optimisation (opt-level 2) while keeping dev-speed codegen (no LTO, the
# default many codegen units), giving both host artifacts ONE coherent
# profile instead of NAPI-release + LSP-dev.
[profile.artifact-dev]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"

[profile.artifact-dev.package."*"]
debug = false

# Internal release-testing profile — thin LTO + many codegen units instead of
# `release`'s fat LTO + one codegen unit, to measure whether fat LTO earns
# its build-time cost (see the same maintainer directive). NOT used by
# `pnpm dist`: `release` stays authoritative until `release-fast` is measured
# to be equal or better on runtime performance and size.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
